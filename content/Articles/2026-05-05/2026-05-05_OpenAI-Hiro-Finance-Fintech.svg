      <text x="14" y="24" font-size="13" font-weight="700" fill="#1A1D24">🏦 Anthropicとの比較</text>
      <text x="14" y="46" font-size="11" fill="#4A5568">AnthropicはB2B（金融機関向けAPI）</text>
      <text x="14" y="62" font-size="11" fill="#4A5568">OpenAIはB2C（ChatGPT消費者向け）</text>
      <text x="14" y="78" font-size="11" fill="#4A5568">という棲み分けが現状成立中。</text>
      <text x="14" y="94" font-size="11" fill="#4A5568">この境界線が崩れる日が焦点。</text>
      <text x="14" y="118" font-size="10" fill="#888">金融AI市場の最終形は1社独占か競存か</text>
