      <text x="14" y="78" font-size="11" fill="#4A5568">コード解析・科学論文等に分散。</text>
      <text x="14" y="94" font-size="11" fill="#4A5568">ChatGPT = App Storeのプラグイン戦略。</text>
      <text x="14" y="118" font-size="10" fill="#888">Google/Meta/Anthropicへの差別化軸</text>
