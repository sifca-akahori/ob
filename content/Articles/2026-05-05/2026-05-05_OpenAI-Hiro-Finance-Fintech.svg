      <text x="14" y="24" font-size="13" font-weight="700" fill="#1A1D24">🔍 訓練データ問題</text>
      <text x="14" y="46" font-size="11" fill="#4A5568">Hiro廃止でユーザーの財務データが</text>
      <text x="14" y="62" font-size="11" fill="#4A5568">OpenAIに移管される可能性。</text>
      <text x="14" y="78" font-size="11" fill="#4A5568">「財務データを訓練に使うか」は</text>
      <text x="14" y="94" font-size="11" fill="#4A5568">明示されておらず、プライバシー問題化。</text>
      <text x="14" y="118" font-size="10" fill="#888">CCPA・NY SHIELD法との整合性が問題</text>
