<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#FBF8F1"/>
      <circle cx="30" cy="40" r="0.4" fill="#C4B389" opacity="0.28"/>
      <circle cx="75" cy="65" r="0.45" fill="#C4B389" opacity="0.22"/>
    </pattern>
    <filter id="stickyShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <line x1="112" y1="20" x2="112" y2="1030" stroke="#D88A8A" stroke-width="1.2" opacity="0.4"/>
  <g fill="#E0D5B8" opacity="0.6">
    <circle cx="52" cy="90" r="12"/><circle cx="52" cy="310" r="12"/>
    <circle cx="52" cy="530" r="12"/><circle cx="52" cy="750" r="12"/><circle cx="52" cy="970" r="12"/>
  </g>
  <g fill="#FBF8F1">
    <circle cx="52" cy="90" r="8.5"/><circle cx="52" cy="310" r="8.5"/>
    <circle cx="52" cy="530" r="8.5"/><circle cx="52" cy="750" r="8.5"/><circle cx="52" cy="970" r="8.5"/>
  </g>

  <g transform="rotate(-3,1260,48)">
    <rect x="1155" y="28" width="190" height="42" fill="#5B8DEF" rx="3"/>
    <text x="1250" y="55" font-size="15" font-weight="700" fill="white" text-anchor="middle">#研究</text>
  </g>
  <rect x="130" y="22" width="160" height="36" fill="#2F3842" rx="4"/>
  <text x="210" y="45" font-size="14" fill="white" text-anchor="middle" font-weight="600">2026-05-08</text>
  <text x="1300" y="100" font-size="22" text-anchor="end">⭐⭐</text>

  <text x="140" y="115" font-size="40" font-weight="900" fill="#1A1D24">📊 Stanford AI Index 2026</text>
  <text x="140" y="158" font-size="36" font-weight="900" fill="#1A1D24">専門家 vs 一般公衆：楽観度ギャップが最大50ptに</text>
  <text x="140" y="188" font-size="14" fill="#5B8DEF" font-weight="700">Stanford HAI · 2026年版 · #AIIndex #世論 #格差 #規制 #労働</text>
  <line x1="130" y1="203" x2="1350" y2="203" stroke="#1A1D24" stroke-width="2.5"/>

  <!-- KEY NUMBERS -->
  <rect x="130" y="216" width="228" height="108" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <text x="244" y="258" font-size="46" font-weight="900" fill="#5B8DEF" text-anchor="middle">48pt</text>
  <text x="244" y="280" font-size="12" fill="#555" text-anchor="middle">経済への好影響ギャップ</text>
  <text x="244" y="298" font-size="11" fill="#888" text-anchor="middle">専門家 69% vs 一般 21%</text>
  <text x="244" y="314" font-size="11" fill="#888" text-anchor="middle">過去最大水準</text>

  <rect x="375" y="216" width="228" height="108" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <text x="489" y="258" font-size="46" font-weight="900" fill="#5B8DEF" text-anchor="middle">40pt</text>
  <text x="489" y="280" font-size="12" fill="#555" text-anchor="middle">医療AIへのギャップ</text>
  <text x="489" y="298" font-size="11" fill="#888" text-anchor="middle">専門家 84% vs 一般 44%</text>
  <text x="489" y="314" font-size="11" fill="#888" text-anchor="middle">医療AIへの期待の乖離</text>

  <rect x="620" y="216" width="228" height="108" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <text x="734" y="258" font-size="38" font-weight="900" fill="#E05C5C" text-anchor="middle">31%</text>
  <text x="734" y="280" font-size="12" fill="#555" text-anchor="middle">米国政府規制への信頼</text>
  <text x="734" y="298" font-size="11" fill="#888" text-anchor="middle">調査対象国で最低水準</text>
  <text x="734" y="314" font-size="11" fill="#888" text-anchor="middle">FDA型EO草案の背景に</text>

  <rect x="865" y="216" width="228" height="108" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <text x="979" y="258" font-size="38" font-weight="900" fill="#E05C5C" text-anchor="middle">+30pt</text>
  <text x="979" y="280" font-size="12" fill="#555" text-anchor="middle">HLE スコアの1年改善幅</text>
  <text x="979" y="298" font-size="11" fill="#888" text-anchor="middle">Humanity's Last Exam</text>
  <text x="979" y="314" font-size="11" fill="#888" text-anchor="middle">技術は加速、信頼は停滞</text>

  <rect x="1110" y="216" width="240" height="108" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <text x="1230" y="258" font-size="38" font-weight="900" fill="#E05C5C" text-anchor="middle">22%→31%</text>
  <text x="1230" y="280" font-size="12" fill="#555" text-anchor="middle">Gen Z「怒り」の割合</text>
  <text x="1230" y="298" font-size="11" fill="#888" text-anchor="middle">2025→2026年の変化</text>
  <text x="1230" y="314" font-size="11" fill="#888" text-anchor="middle">「興奮」は 36%→22% に急落</text>

  <!-- MAIN VISUAL: Divergence bar chart -->
  <rect x="130" y="340" width="720" height="300" fill="white" stroke="#1A1D24" stroke-width="2" rx="8" filter="url(#softShadow)"/>
  <text x="490" y="367" font-size="15" font-weight="800" fill="#1A1D24" text-anchor="middle">専門家 vs 一般公衆：領域別楽観度（%）</text>
  <line x1="145" y1="377" x2="835" y2="377" stroke="#1A1D24" stroke-width="1.5"/>

  <!-- Legend -->
  <rect x="560" y="382" width="14" height="14" fill="#5B8DEF"/>
  <text x="580" y="394" font-size="12" fill="#333">専門家</text>
  <rect x="650" y="382" width="14" height="14" fill="#E89AA9"/>
  <text x="670" y="394" font-size="12" fill="#333">一般公衆</text>

  <!-- Bars -->
  <g font-size="12">
    <!-- Medical care -->
    <text x="160" y="432" fill="#333">医療への好影響</text>
    <rect x="295" y="416" width="252" height="22" fill="#5B8DEF" stroke="#1A1D24" stroke-width="1"/>
    <text x="553" y="432" fill="#1A1D24" font-size="11" font-weight="700">84%</text>
    <rect x="295" y="416" width="130" height="22" fill="none"/>
    <rect x="295" y="440" width="130" height="18" fill="#E89AA9" stroke="#1A1D24" stroke-width="1"/>
    <text x="431" y="454" fill="#1A1D24" font-size="11">44%  (△40pt)</text>

    <!-- Economy -->
    <text x="160" y="492" fill="#333">経済への好影響</text>
    <rect x="295" y="474" width="207" height="22" fill="#5B8DEF" stroke="#1A1D24" stroke-width="1"/>
    <text x="508" y="490" fill="#1A1D24" font-size="11" font-weight="700">69%</text>
    <rect x="295" y="498" width="63" height="18" fill="#E89AA9" stroke="#1A1D24" stroke-width="1"/>
    <text x="364" y="512" fill="#1A1D24" font-size="11">21%  (△48pt)</text>

    <!-- Jobs -->
    <text x="160" y="552" fill="#333">仕事のやり方</text>
    <rect x="295" y="534" width="219" height="22" fill="#5B8DEF" stroke="#1A1D24" stroke-width="1"/>
    <text x="520" y="550" fill="#1A1D24" font-size="11" font-weight="700">73%</text>
    <rect x="295" y="558" width="69" height="18" fill="#E89AA9" stroke="#1A1D24" stroke-width="1"/>
    <text x="370" y="572" fill="#1A1D24" font-size="11">23%  (△50pt)</text>

    <!-- Overall optimism -->
    <text x="160" y="612" fill="#333">全体的楽観（増加）</text>
    <rect x="295" y="594" width="177" height="22" fill="#5B8DEF" stroke="#1A1D24" stroke-width="1"/>
    <text x="478" y="610" fill="#1A1D24" font-size="11" font-weight="700">59%</text>
    <text x="295" y="628" fill="#555" font-size="11">一般公衆 52%→59% (+7pt) — 唯一の改善領域</text>

    <text x="145" y="630" fill="#999" font-size="10">※ Stanford HAI 2026 AI Index Report より</text>
  </g>

  <!-- Side: Gen Z sentiment shift -->
  <rect x="870" y="340" width="480" height="300" fill="white" stroke="#1A1D24" stroke-width="2" rx="8" filter="url(#softShadow)"/>
  <text x="1110" y="367" font-size="15" font-weight="800" fill="#1A1D24" text-anchor="middle">Gen Z の感情変化 (2025→2026)</text>
  <line x1="885" y1="377" x2="1340" y2="377" stroke="#1A1D24" stroke-width="1.5"/>

  <!-- Gen Z chart -->
  <g font-size="13">
    <text x="895" y="415" fill="#333" font-weight="700">😄 興奮</text>
    <rect x="975" y="400" width="108" height="24" fill="#5B8DEF" stroke="#1A1D24" stroke-width="1.5" rx="2"/>
    <text x="1089" y="417" fill="#555">36% (2025)</text>
    <rect x="975" y="427" width="66" height="24" fill="#E89AA9" stroke="#1A1D24" stroke-width="1.5" rx="2"/>
    <text x="1047" y="444" fill="#E05C5C" font-weight="700">22% (2026) ↓14pt</text>

    <text x="895" y="490" fill="#333" font-weight="700">😤 怒り</text>
    <rect x="975" y="475" width="66" height="24" fill="#C8E6C9" stroke="#1A1D24" stroke-width="1.5" rx="2"/>
    <text x="1047" y="492" fill="#555">22% (2025)</text>
    <rect x="975" y="502" width="93" height="24" fill="#E05C5C" stroke="#1A1D24" stroke-width="1.5" rx="2"/>
    <text x="1074" y="519" fill="white" font-weight="700">31% (2026) ↑9pt</text>

    <text x="895" y="560" fill="#333" font-weight="700">😰 不安</text>
    <rect x="975" y="548" width="150" height="24" fill="#FFF9C4" stroke="#1A1D24" stroke-width="1.5" rx="2"/>
    <text x="1131" y="565" fill="#555">50% (安定)</text>

    <rect x="885" y="590" width="450" height="42" fill="#FFF5F5" rx="4"/>
    <text x="895" y="608" font-size="12" fill="#E05C5C" font-weight="700">⚠️ AIネイティブ世代が「怒り」に転じた理由</text>
    <text x="895" y="626" font-size="11" fill="#555">労働市場でのAI代替を実体験（インターン・エントリー職消滅）</text>
  </g>

  <!-- CARDS -->
  <rect x="130" y="655" width="290" height="125" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <rect x="130" y="655" width="290" height="28" fill="#5B8DEF" rx="6"/>
  <rect x="130" y="670" width="290" height="13" fill="#5B8DEF"/>
  <text x="275" y="674" font-size="13" font-weight="700" fill="white" text-anchor="middle">信頼ギャップの根本</text>
  <text x="145" y="703" font-size="12" fill="#333">専門家: AIの恩恵を直接受ける</text>
  <text x="145" y="721" font-size="12" fill="#333">一般市民: コスト（失業・プライバシー）を負担</text>
  <text x="145" y="739" font-size="12" fill="#333">「AI」ではなく「格差」が問題</text>
  <text x="145" y="757" font-size="11" fill="#888">非対称な利得構造が根本原因</text>

  <rect x="440" y="655" width="290" height="125" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <rect x="440" y="655" width="290" height="28" fill="#5B8DEF" rx="6"/>
  <rect x="440" y="670" width="290" height="13" fill="#5B8DEF"/>
  <text x="585" y="674" font-size="13" font-weight="700" fill="white" text-anchor="middle">技術 vs 信頼の乖離</text>
  <text x="455" y="703" font-size="12" fill="#333">HLE: 1年で30pt向上（驚異的）</text>
  <text x="455" y="721" font-size="12" fill="#333">安全評価フレームワーク: 追いつけず</text>
  <text x="455" y="739" font-size="12" fill="#333">MATH-500・GPQA で人間超え</text>
  <text x="455" y="757" font-size="11" fill="#888">→ 能力増加 ≠ 信頼増加</text>

  <rect x="750" y="655" width="290" height="125" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <rect x="750" y="655" width="290" height="28" fill="#5B8DEF" rx="6"/>
  <rect x="750" y="670" width="290" height="13" fill="#5B8DEF"/>
  <text x="895" y="674" font-size="13" font-weight="700" fill="white" text-anchor="middle">「31%信頼」の意味</text>
  <text x="765" y="703" font-size="12" fill="#333">米国 AI 規制能力への信頼が最低</text>
  <text x="765" y="721" font-size="12" fill="#333">FDA型EO: 政治的動機での改善試み</text>
  <text x="765" y="739" font-size="12" fill="#333">義務化だけでは信頼は回復しない</text>
  <text x="765" y="757" font-size="11" fill="#888">「実効性への信頼」が本当の課題</text>

  <rect x="1060" y="655" width="290" height="125" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <rect x="1060" y="655" width="290" height="28" fill="#5B8DEF" rx="6"/>
  <rect x="1060" y="670" width="290" height="13" fill="#5B8DEF"/>
  <text x="1205" y="674" font-size="13" font-weight="700" fill="white" text-anchor="middle">ギャップ縮小の条件</text>
  <text x="1075" y="703" font-size="12" fill="#333">医療診断AI・教育AIへの公平アクセス</text>
  <text x="1075" y="721" font-size="12" fill="#333">「具体的な利益の民主化」が必要</text>
  <text x="1075" y="739" font-size="12" fill="#333">説明できる数字がなければ信頼なし</text>
  <text x="1075" y="757" font-size="11" fill="#888">2026〜27年の政策最重要課題</text>

  <!-- STICKIES -->
  <g transform="rotate(-1.5,200,838)" filter="url(#stickyShadow)">
    <rect x="130" y="815" width="210" height="90" fill="#FFF9C4" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="235" y="836" font-size="12" font-weight="700" fill="#1A1D24" text-anchor="middle">🔎 注目数字</text>
    <text x="145" y="856" font-size="11" fill="#333">仕事: 73% vs 23% (50pt差)</text>
    <text x="145" y="873" font-size="11" fill="#333">2030年AI活用時間予測</text>
    <text x="145" y="890" font-size="11" fill="#555">専門家18% vs 一般10%</text>
    <text x="145" y="904" font-size="10" fill="#888">ここでも2倍近いギャップ</text>
  </g>
  <g transform="rotate(1.2,382,838)" filter="url(#stickyShadow)">
    <rect x="368" y="815" width="210" height="90" fill="#C8E6C9" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="473" y="836" font-size="12" font-weight="700" fill="#1A1D24" text-anchor="middle">📈 唯一の好材料</text>
    <text x="383" y="856" font-size="11" fill="#333">全体楽観度: 52%→59%</text>
    <text x="383" y="873" font-size="11" fill="#333">グローバルで微増</text>
    <text x="383" y="890" font-size="11" fill="#555">ただし内訳に大きな差</text>
    <text x="383" y="904" font-size="10" fill="#888">先進国より途上国で高い</text>
  </g>
  <g transform="rotate(-0.8,605,838)" filter="url(#stickyShadow)">
    <rect x="595" y="815" width="210" height="90" fill="#BBDEFB" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="700" y="836" font-size="12" font-weight="700" fill="#1A1D24" text-anchor="middle">⚡ Oxford との連動</text>
    <text x="610" y="856" font-size="11" fill="#333">「温かいAI = 危険なAI」発見</text>
    <text x="610" y="873" font-size="11" fill="#333">専門家の楽観論を覆す証拠</text>
    <text x="610" y="890" font-size="11" fill="#555">ギャップ縮小の逆方向に作用</text>
    <text x="610" y="904" font-size="10" fill="#888">同週の衝撃的タイミング</text>
  </g>
  <g transform="rotate(1.0,832,838)" filter="url(#stickyShadow)">
    <rect x="822" y="815" width="210" height="90" fill="#F8BBD0" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="927" y="836" font-size="12" font-weight="700" fill="#1A1D24" text-anchor="middle">🔮 2027年予測</text>
    <text x="837" y="856" font-size="11" fill="#333">ギャップはさらに拡大へ</text>
    <text x="837" y="873" font-size="11" fill="#333">モデル能力: 加速続く</text>
    <text x="837" y="890" font-size="11" fill="#E05C5C">一般体験: 改善されない</text>
    <text x="837" y="904" font-size="10" fill="#888">民主化なしに信頼なし</text>
  </g>

  <line x1="130" y1="920" x2="1350" y2="920" stroke="#1A1D24" stroke-width="1"/>
  <text x="740" y="943" font-size="12" fill="#888" text-anchor="middle" font-style="italic">AI News · 2026-05-08 · Stanford AI Index 2026: Expert-Public Optimism Gap Reaches 50 Points</text>
  <text x="740" y="963" font-size="11" fill="#AAA" text-anchor="middle">Source: Stanford HAI AI Index 2026 Report</text>
</svg>
