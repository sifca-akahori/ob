<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#FBF8F1"/>
      <circle cx="25" cy="35" r="0.4" fill="#C4B389" opacity="0.28"/>
      <circle cx="70" cy="60" r="0.5" fill="#C4B389" opacity="0.22"/>
      <circle cx="50" cy="85" r="0.35" fill="#C4B389" opacity="0.28"/>
    </pattern>
    <filter id="stickyShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <g opacity="0.07" stroke="#8B7A5A" stroke-width="0.7">
    <line x1="80" y1="200" x2="1330" y2="200"/>
    <line x1="80" y1="240" x2="1330" y2="240"/>
  </g>
  <line x1="112" y1="20" x2="112" y2="1030" stroke="#D88A8A" stroke-width="1.2" opacity="0.4"/>
  <g fill="#E0D5B8" opacity="0.6">
    <circle cx="52" cy="90" r="12"/><circle cx="52" cy="310" r="12"/>
    <circle cx="52" cy="530" r="12"/><circle cx="52" cy="750" r="12"/><circle cx="52" cy="970" r="12"/>
  </g>
  <g fill="#FBF8F1">
    <circle cx="52" cy="90" r="8.5"/><circle cx="52" cy="310" r="8.5"/>
    <circle cx="52" cy="530" r="8.5"/><circle cx="52" cy="750" r="8.5"/><circle cx="52" cy="970" r="8.5"/>
  </g>

  <!-- Category tape -->
  <g transform="rotate(-3,1260,48)">
    <rect x="1155" y="28" width="190" height="42" fill="#5CA46E" rx="3"/>
    <text x="1250" y="55" font-size="15" font-weight="700" fill="white" text-anchor="middle">#ビジネス</text>
  </g>
  <rect x="130" y="22" width="160" height="36" fill="#2F3842" rx="4"/>
  <text x="210" y="45" font-size="14" fill="white" text-anchor="middle" font-weight="600">2026-05-08</text>
  <text x="1300" y="100" font-size="22" text-anchor="end">⭐⭐⭐</text>

  <!-- HEADER -->
  <text x="140" y="115" font-size="40" font-weight="900" fill="#1A1D24">🚀 Anthropic × SpaceX Colossus One：300MW・22万GPU</text>
  <text x="140" y="155" font-size="20" font-weight="900" fill="#1A1D24">——そして「軌道上AI計算」への伏線</text>
  <text x="140" y="182" font-size="16" fill="#5CA46E" font-weight="700">Times of India / NeuralBuddies · 2026-05-07〜08</text>
  <line x1="130" y1="198" x2="1350" y2="198" stroke="#1A1D24" stroke-width="2.5"/>

  <!-- KEY NUMBERS -->
  <rect x="130" y="210" width="260" height="108" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <text x="260" y="252" font-size="44" font-weight="900" fill="#5CA46E" text-anchor="middle">300MW</text>
  <text x="260" y="276" font-size="12" fill="#555" text-anchor="middle">超の新規計算容量</text>
  <text x="260" y="295" font-size="11" fill="#888" text-anchor="middle">Colossus One パートナーシップ</text>
  <text x="260" y="310" font-size="11" fill="#888" text-anchor="middle">GPU 約22万基相当</text>

  <rect x="408" y="210" width="260" height="108" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <text x="538" y="252" font-size="44" font-weight="900" fill="#5CA46E" text-anchor="middle">2×</text>
  <text x="538" y="276" font-size="12" fill="#555" text-anchor="middle">Claude Code レート制限倍増</text>
  <text x="538" y="295" font-size="11" fill="#888" text-anchor="middle">Pro / Max ピーク制限撤廃</text>
  <text x="538" y="310" font-size="11" fill="#888" text-anchor="middle">Opus API も大幅引き上げ</text>

  <rect x="686" y="210" width="260" height="108" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <text x="816" y="252" font-size="38" font-weight="900" fill="#E8A87C" text-anchor="middle">数GW</text>
  <text x="816" y="276" font-size="12" fill="#555" text-anchor="middle">将来の軌道上AI計算目標</text>
  <text x="816" y="295" font-size="11" fill="#888" text-anchor="middle">低軌道コンステレーション</text>
  <text x="816" y="310" font-size="11" fill="#888" text-anchor="middle">「発表文末」に埋め込まれた伏線</text>

  <rect x="964" y="210" width="386" height="108" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <text x="1157" y="252" font-size="38" font-weight="900" fill="#5CA46E" text-anchor="middle">2028年〜</text>
  <text x="1157" y="276" font-size="12" fill="#555" text-anchor="middle">軌道上コンピュート商業稼働予測</text>
  <text x="1157" y="295" font-size="11" fill="#888" text-anchor="middle">現実的タイムライン</text>
  <text x="1157" y="310" font-size="11" fill="#888" text-anchor="middle">2026〜27は地上DC拡張が主軸</text>

  <!-- MAIN VISUAL: Compute capacity comparison bar chart -->
  <rect x="130" y="335" width="680" height="300" fill="white" stroke="#1A1D24" stroke-width="2" rx="8" filter="url(#softShadow)"/>
  <text x="470" y="363" font-size="15" font-weight="800" fill="#1A1D24" text-anchor="middle">AIラボ計算インフラ戦略比較</text>
  <line x1="145" y1="373" x2="795" y2="373" stroke="#1A1D24" stroke-width="1.5"/>

  <!-- Bar chart: compute strategies -->
  <g font-size="12">
    <!-- Labels -->
    <text x="160" y="405" fill="#333" font-weight="600">Anthropic</text>
    <text x="160" y="440" fill="#333" font-weight="600">OpenAI</text>
    <text x="160" y="475" fill="#333" font-weight="600">Meta</text>
    <text x="160" y="510" fill="#333" font-weight="600">Google</text>
    <!-- Bars -->
    <rect x="260" y="388" width="350" height="26" fill="#5CA46E" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="618" y="406" fill="#333" font-size="11">他社DC利用+SpaceX提携 ★新戦略</text>
    <rect x="260" y="423" width="480" height="26" fill="#5B8DEF" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="748" y="441" fill="#333" font-size="11">Stargate $5000億自社DC建設</text>
    <rect x="260" y="458" width="410" height="26" fill="#8B7DB8" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="678" y="476" fill="#333" font-size="11">Louisiana/Texas等 自社DC展開</text>
    <rect x="260" y="493" width="520" height="26" fill="#F5B483" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="788" y="511" fill="#333" font-size="11">Anthropic $2000億 5年TPUコミット</text>

    <line x1="260" y1="530" x2="260" y2="560" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="160" y="555" fill="#333" font-weight="600">xAI</text>
    <rect x="260" y="538" width="440" height="26" fill="#E89AA9" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="708" y="556" fill="#333" font-size="11">Colossus One（Anthropicに貸出）</text>

    <text x="160" y="600" fill="#999" font-size="10">Anthropicは「自社DC非保有」唯一の戦略 → 計算主権の外部依存リスク内包</text>
  </g>

  <!-- Side: Orbital challenges -->
  <rect x="830" y="335" width="520" height="300" fill="white" stroke="#1A1D24" stroke-width="2" rx="8" filter="url(#softShadow)"/>
  <text x="1090" y="363" font-size="15" font-weight="800" fill="#1A1D24" text-anchor="middle">🛰️ 軌道上コンピュートの現実的課題</text>
  <line x1="845" y1="373" x2="1340" y2="373" stroke="#1A1D24" stroke-width="1.5"/>

  <!-- Challenge items -->
  <rect x="845" y="382" width="495" height="65" fill="#FFF3E0" rx="4"/>
  <text x="855" y="400" font-size="13" font-weight="700" fill="#E65100">① レイテンシ問題</text>
  <text x="855" y="418" font-size="12" fill="#555">低軌道衛星との往復: 20〜40ms</text>
  <text x="855" y="436" font-size="12" fill="#555">大規模学習には許容不能 / リアルタイム推論は限定的OK</text>

  <rect x="845" y="457" width="495" height="65" fill="#F3E5F5" rx="4"/>
  <text x="855" y="475" font-size="13" font-weight="700" fill="#6A1B9A">② 熱管理問題</text>
  <text x="855" y="493" font-size="12" fill="#555">太陽光直射〜影の温度差: ±120℃以上</text>
  <text x="855" y="511" font-size="12" fill="#555">GPU冷却設計コスト: 地上の数倍以上</text>

  <rect x="845" y="532" width="495" height="65" fill="#E8F5E9" rx="4"/>
  <text x="855" y="550" font-size="13" font-weight="700" fill="#1B5E20">③ デブリ・放射線リスク</text>
  <text x="855" y="568" font-size="12" fill="#555">単一宇宙線イベントでビットフリップ → 重み汚染</text>
  <text x="855" y="586" font-size="12" fill="#555">冗長設計必須 / デ-オービット計画が必要</text>

  <text x="845" y="620" font-size="11" fill="#999">「複数ギガワット軌道上計算」= 現時点ではロードマップ概念段階</text>

  <!-- FEATURE CARDS -->
  <rect x="130" y="650" width="283" height="130" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <rect x="130" y="650" width="283" height="28" fill="#5CA46E" rx="6"/>
  <rect x="130" y="665" width="283" height="13" fill="#5CA46E"/>
  <text x="271" y="669" font-size="13" font-weight="700" fill="white" text-anchor="middle">なぜSpaceXを選んだか</text>
  <text x="145" y="700" font-size="12" fill="#333">• Colossus Oneの既存規模（xAI向け超大型DC）</text>
  <text x="145" y="718" font-size="12" fill="#333">• AWS/Google/Azure空き容量が限界超え</text>
  <text x="145" y="736" font-size="12" fill="#333">• Claude Code ユーザー急増でGPU需要爆発</text>
  <text x="145" y="754" font-size="12" fill="#555">→ 競合(xAI)への資金流入という皮肉</text>

  <rect x="433" y="650" width="283" height="130" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <rect x="433" y="650" width="283" height="28" fill="#5CA46E" rx="6"/>
  <rect x="433" y="665" width="283" height="13" fill="#5CA46E"/>
  <text x="574" y="669" font-size="13" font-weight="700" fill="white" text-anchor="middle">Claude Code グロース戦略</text>
  <text x="448" y="700" font-size="12" fill="#333">• レート制限がDAUの天井に（HN・X での指摘多数）</text>
  <text x="448" y="718" font-size="12" fill="#333">• 制限撤廃 = GitHub Copilot シェア奪還の攻勢</text>
  <text x="448" y="736" font-size="12" fill="#333">• VS Code / Cursor / JetBrains連携が加速</text>
  <text x="448" y="754" font-size="12" fill="#555">月間アクティブ開発者数: 急増中（非公開）</text>

  <rect x="736" y="650" width="283" height="130" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <rect x="736" y="650" width="283" height="28" fill="#5CA46E" rx="6"/>
  <rect x="736" y="665" width="283" height="13" fill="#5CA46E"/>
  <text x="877" y="669" font-size="13" font-weight="700" fill="white" text-anchor="middle">政府・DoD シナリオ</text>
  <text x="751" y="700" font-size="12" fill="#333">• SpaceX × Anthropic の組み合わせ</text>
  <text x="751" y="718" font-size="12" fill="#333">• NASA AI活用・DoD衛星とのシナジー</text>
  <text x="751" y="736" font-size="12" fill="#333">• Pentagon調達への影響力が高まる可能性</text>
  <text x="751" y="754" font-size="12" fill="#555">Reflection AI（元DeepMind）との競合構図も</text>

  <rect x="1039" y="650" width="311" height="130" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <rect x="1039" y="650" width="311" height="28" fill="#5CA46E" rx="6"/>
  <rect x="1039" y="665" width="311" height="13" fill="#5CA46E"/>
  <text x="1194" y="669" font-size="13" font-weight="700" fill="white" text-anchor="middle">計算主権リスク</text>
  <text x="1054" y="700" font-size="12" fill="#333">• Anthropicは唯一「自社DC非保有」戦略</text>
  <text x="1054" y="718" font-size="12" fill="#333">• Google ($200B) + SpaceX への二重依存</text>
  <text x="1054" y="736" font-size="12" fill="#333">• インフラ主権を外部に預けるリスク</text>
  <text x="1054" y="754" font-size="12" fill="#555">OpenAI Stargate自社建設との対比が鮮明</text>

  <!-- STICKY NOTES -->
  <g transform="rotate(-1.5,200,830)" filter="url(#stickyShadow)">
    <rect x="130" y="808" width="220" height="95" fill="#FFF9C4" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="240" y="830" font-size="12" font-weight="700" fill="#1A1D24" text-anchor="middle">🚀 軌道DC</text>
    <text x="145" y="850" font-size="11" fill="#333">太陽光: 冷却に有利</text>
    <text x="145" y="867" font-size="11" fill="#333">真空: 自然冷却OK?</text>
    <text x="145" y="884" font-size="11" fill="#555">でもデブリ・放射線が...</text>
    <text x="145" y="898" font-size="10" fill="#888">2028年以降の話</text>
  </g>

  <g transform="rotate(1.2,390,830)" filter="url(#stickyShadow)">
    <rect x="375" y="808" width="220" height="95" fill="#C8E6C9" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="485" y="830" font-size="12" font-weight="700" fill="#1A1D24" text-anchor="middle">💡 Novaの指摘</text>
    <text x="390" y="850" font-size="11" fill="#333">「軌道GW = press release」</text>
    <text x="390" y="867" font-size="11" fill="#333">3つを聞け：レイテンシ・</text>
    <text x="390" y="884" font-size="11" fill="#333">デ-オービット・ビットフリップ</text>
    <text x="390" y="898" font-size="10" fill="#888">答えられなければ概念段階</text>
  </g>

  <g transform="rotate(-0.8,635,830)" filter="url(#stickyShadow)">
    <rect x="625" y="808" width="220" height="95" fill="#BBDEFB" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="735" y="830" font-size="12" font-weight="700" fill="#1A1D24" text-anchor="middle">🔢 容量感覚</text>
    <text x="640" y="850" font-size="11" fill="#333">300MW = 中規模DC 10棟分</text>
    <text x="640" y="867" font-size="11" fill="#333">Stargate 目標: 1GW超</text>
    <text x="640" y="884" font-size="11" fill="#333">Google Colossus: 複数GW</text>
    <text x="640" y="898" font-size="10" fill="#888">Anthropicは追いかける側</text>
  </g>

  <g transform="rotate(1.0,880,830)" filter="url(#stickyShadow)">
    <rect x="870" y="808" width="220" height="95" fill="#F8BBD0" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="980" y="830" font-size="12" font-weight="700" fill="#1A1D24" text-anchor="middle">📅 タイムライン</text>
    <text x="885" y="850" font-size="11" fill="#333">今: Colossus One 地上DC</text>
    <text x="885" y="867" font-size="11" fill="#333">2027〜: 追加地上DC拡張</text>
    <text x="885" y="884" font-size="11" fill="#333">2028〜: 軌道DC検討開始?</text>
    <text x="885" y="898" font-size="10" fill="#888">現実的予測</text>
  </g>

  <!-- Footer -->
  <line x1="130" y1="922" x2="1350" y2="922" stroke="#1A1D24" stroke-width="1"/>
  <text x="740" y="945" font-size="12" fill="#888" text-anchor="middle" font-style="italic">AI News · 2026-05-08 · Anthropic Doubles Claude Code Limits via SpaceX Colossus One Partnership</text>
  <text x="740" y="965" font-size="11" fill="#AAA" text-anchor="middle">Source: Times of India · NeuralBuddies · 2026-05-08</text>
