    <circle cx="555" cy="448" r="14" fill="#8B8B8B"/>
    <text x="555" y="453" font-size="12" fill="white" text-anchor="middle" font-weight="700">1</text>
    <text x="580" y="453" fill="#666">自主的に参加（任意）</text>
    <circle cx="555" cy="488" r="14" fill="#8B8B8B"/>
    <text x="555" y="493" font-size="12" fill="white" text-anchor="middle" font-weight="700">2</text>
    <text x="580" y="493" fill="#666">ラボ側スケジュールで実施</text>
    <circle cx="555" cy="528" r="14" fill="#E89AA9"/>
    <text x="555" y="533" font-size="12" fill="white" text-anchor="middle" font-weight="700">✗</text>
    <text x="580" y="533" fill="#E05C5C">法的強制力なし</text>
    <circle cx="555" cy="568" r="14" fill="#E89AA9"/>
    <text x="555" y="573" font-size="12" fill="white" text-anchor="middle" font-weight="700">✗</text>
    <text x="580" y="573" fill="#E05C5C">拒否しても制裁なし</text>
    <circle cx="555" cy="608" r="14" fill="#E89AA9"/>
    <text x="555" y="613" font-size="12" fill="white" text-anchor="middle" font-weight="700">✗</text>
    <text x="580" y="613" fill="#E05C5C">非公開でリリース可能</text>
  </g>

  <!-- Side: Scenario boxes -->
