    <circle cx="165" cy="528" r="14" fill="#5CA46E"/>
    <text x="165" y="533" font-size="12" fill="white" text-anchor="middle" font-weight="700">3</text>
    <text x="190" y="533" fill="#333">サイバー/バイオ/化学リスク審査</text>
    <circle cx="165" cy="568" r="14" fill="#5CA46E"/>
    <text x="165" y="573" font-size="12" fill="white" text-anchor="middle" font-weight="700">4</text>
    <text x="190" y="573" fill="#333">承認後に一般公開（義務）</text>
    <circle cx="165" cy="608" r="14" fill="#5CA46E"/>
    <text x="165" y="613" font-size="12" fill="white" text-anchor="middle" font-weight="700">5</text>
    <text x="190" y="613" fill="#333">継続的モニタリング義務</text>
