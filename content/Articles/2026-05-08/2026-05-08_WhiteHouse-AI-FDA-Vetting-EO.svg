  <text x="265" y="248" font-size="46" font-weight="900" fill="#5CA46E" text-anchor="middle">40+</text>
  <text x="265" y="272" font-size="13" fill="#555" text-anchor="middle">回の事前評価実績</text>
  <text x="265" y="290" font-size="11" fill="#888" text-anchor="middle">CAISI 任意テスト（既存）</text>
  <text x="265" y="308" font-size="11" fill="#888" text-anchor="middle">→ 義務化へ転換</text>
