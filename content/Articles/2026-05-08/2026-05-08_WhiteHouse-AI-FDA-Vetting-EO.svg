  <rect x="955" y="522" width="380" height="60" fill="#FFF8E1" rx="4"/>
  <text x="965" y="542" font-size="12" font-weight="700" fill="#F5A623">📊 最も現実的</text>
  <text x="965" y="560" font-size="11" fill="#555">高リスクカテゴリ限定の事前強化評価</text>
  <text x="965" y="576" font-size="11" fill="#555">→ 最良シナリオに近い形で収束</text>

  <text x="965" y="618" font-size="11" fill="#999">※ 実施細則策定にさらに6ヶ月を要する見通し</text>

  <!-- FEATURE CARDS -->
  <rect x="130" y="650" width="295" height="130" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <rect x="130" y="650" width="295" height="28" fill="#5CA46E" rx="6"/>
  <rect x="130" y="665" width="295" height="13" fill="#5CA46E"/>
  <text x="277" y="669" font-size="13" font-weight="700" fill="white" text-anchor="middle">Mythos が開けたパンドラ</text>
  <text x="145" y="700" font-size="12" fill="#333">• 一般非公開モデルが業界横断で脆弱性修復</text>
  <text x="145" y="718" font-size="12" fill="#333">• AI が「インフラを守る主体」へ役割転換</text>
  <text x="145" y="736" font-size="12" fill="#333">• 政府が能力を持つモデルを「統制」へ</text>
  <text x="145" y="754" font-size="12" fill="#333">• Project Glasswing が制度設計の起爆剤</text>

  <rect x="445" y="650" width="295" height="130" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <rect x="445" y="650" width="295" height="28" fill="#5CA46E" rx="6"/>
  <rect x="445" y="665" width="295" height="13" fill="#5CA46E"/>
  <text x="592" y="669" font-size="13" font-weight="700" fill="white" text-anchor="middle">EU vs US 規制地政学</text>
  <text x="460" y="700" font-size="12" fill="#333">• EU AI法: 高リスク義務を2027年12月に延期</text>
  <text x="460" y="718" font-size="12" fill="#333">• US: FDA型事前評価を2026年内に義務化へ</text>
  <text x="460" y="736" font-size="12" fill="#333">• 「EU先行・US遅延」の従来構図が逆転</text>
  <text x="460" y="754" font-size="12" fill="#333">• WTO・貿易協定との整合が争点に</text>

  <rect x="760" y="650" width="295" height="130" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <rect x="760" y="650" width="295" height="28" fill="#5CA46E" rx="6"/>
  <rect x="760" y="665" width="295" height="13" fill="#5CA46E"/>
  <text x="907" y="669" font-size="13" font-weight="700" fill="white" text-anchor="middle">FDA比較の限界</text>
  <text x="775" y="700" font-size="12" fill="#333">• FDA承認: 数年・数億ドル</text>
  <text x="775" y="718" font-size="12" fill="#333">• AI更新サイクル: 数週間〜数ヶ月</text>
  <text x="775" y="736" font-size="12" fill="#333">• 文字通り適用 → 頻繁更新が事実上停止</text>
  <text x="775" y="754" font-size="12" fill="#333">• 結局「高リスク限定」に収束する見込み</text>

  <rect x="1075" y="650" width="275" height="130" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <rect x="1075" y="650" width="275" height="28" fill="#5CA46E" rx="6"/>
  <rect x="1075" y="665" width="275" height="13" fill="#5CA46E"/>
  <text x="1212" y="669" font-size="13" font-weight="700" fill="white" text-anchor="middle">議会並走リスク</text>
  <text x="1090" y="700" font-size="12" fill="#333">• 超党派 AI Accountability Act 草案複数</text>
  <text x="1090" y="718" font-size="12" fill="#333">• 大統領令 ＋ 立法が並走する混乱期へ</text>
  <text x="1090" y="736" font-size="12" fill="#333">• 言論の自由条項との兼ね合いも争点</text>
  <text x="1090" y="754" font-size="12" fill="#333">• 実施細則策定: さらに +6ヶ月以上</text>

