  <text x="965" y="420" font-size="11" fill="#555">義務審査 6〜12ヶ月 → 米国ラボ遅延</text>
  <text x="965" y="436" font-size="11" fill="#555">→ 中国OSSが構造的優位を獲得</text>

  <rect x="955" y="452" width="380" height="60" fill="#F0FFF4" rx="4"/>
