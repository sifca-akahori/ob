  <text x="245" y="401" font-size="13" font-weight="700" fill="white" text-anchor="middle">FDA型（草案目標）</text>
  <rect x="555" y="382" width="200" height="28" fill="#8B8B8B" rx="3"/>
  <text x="655" y="401" font-size="13" font-weight="700" fill="white" text-anchor="middle">現行（CAISI任意）</text>

