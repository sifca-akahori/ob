  <rect x="420" y="208" width="270" height="110" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <text x="555" y="248" font-size="46" font-weight="900" fill="#5CA46E" text-anchor="middle">5社</text>
  <text x="555" y="272" font-size="13" fill="#555" text-anchor="middle">主要フロンティアラボ対象</text>
  <text x="555" y="290" font-size="11" fill="#888" text-anchor="middle">Google / Microsoft / xAI</text>
  <text x="555" y="308" font-size="11" fill="#888" text-anchor="middle">OpenAI / Anthropic</text>
  <!-- Box 3 -->
  <rect x="710" y="208" width="270" height="110" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <text x="845" y="248" font-size="38" font-weight="900" fill="#E05C5C" text-anchor="middle">数万件</text>
  <text x="845" y="272" font-size="13" fill="#555" text-anchor="middle">Mythosが発見した脆弱性</text>
  <text x="845" y="290" font-size="11" fill="#888" text-anchor="middle">Project Glasswing経由</text>
  <text x="845" y="308" font-size="11" fill="#888" text-anchor="middle">EO草案の直接引き金</text>
  <!-- Box 4 -->
  <rect x="1000" y="208" width="340" height="110" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <text x="1170" y="248" font-size="38" font-weight="900" fill="#5CA46E" text-anchor="middle">2027年</text>
  <text x="1170" y="272" font-size="13" fill="#555" text-anchor="middle">EU AI法高リスク義務</text>
  <text x="1170" y="290" font-size="11" fill="#888" text-anchor="middle">EU延期 vs US先行</text>
  <text x="1170" y="308" font-size="11" fill="#888" text-anchor="middle">規制地政学の逆転</text>

