  <!-- HEADER -->
  <text x="140" y="115" font-size="42" font-weight="900" fill="#1A1D24">🏛️ ホワイトハウス AI「FDA型審査」大統領令草案</text>
  <text x="140" y="155" font-size="18" fill="#5CA46E" font-weight="700">Mythos が引き金を引いた歴史的ガバナンス転換 · Insurance Journal / CNBC · 2026-05-08</text>
  <text x="140" y="180" font-size="14" fill="#666">#AI #規制 #FDA #EO #WhiteHouse #ガバナンス</text>

  <!-- Divider -->
