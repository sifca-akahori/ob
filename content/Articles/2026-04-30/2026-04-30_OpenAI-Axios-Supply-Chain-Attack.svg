  <line x1="110" y1="430" x2="1320" y2="430" stroke="#1A1D24" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Step 1 -->
  <rect x="110" y="445" width="170" height="130" rx="8" fill="#FFCDD2" stroke="#1A1D24" stroke-width="2.5"/>
  <text x="195" y="470" text-anchor="middle" fill="#1A1D24" font-size="12" font-weight="800">① 北朝鮮APT</text>
  <line x1="130" y1="477" x2="270" y2="477" stroke="#1A1D24" stroke-width="1"/>
