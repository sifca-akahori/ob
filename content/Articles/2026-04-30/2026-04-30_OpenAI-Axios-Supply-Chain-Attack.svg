  <text x="415" y="703" fill="#555" font-size="12">信頼できるアプリに見せかけた</text>
  <text x="415" y="721" fill="#5CA46E" font-size="12" font-weight="700">マルウェア配布ができる</text>
  <text x="415" y="747" fill="#888" font-size="11">Lazarusグループの典型手口</text>

  <rect x="710" y="630" width="295" height="130" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="730" y="658" fill="#1A1D24" font-size="14" font-weight="800">AI製品固有のリスク</text>
  <line x1="730" y1="665" x2="985" y2="665" stroke="#1A1D24" stroke-width="1.5"/>
  <text x="730" y="685" fill="#555" font-size="12">AI生成コードが自動で</text>
  <text x="730" y="703" fill="#555" font-size="12">CI/CDに組み込まれる流れが</text>
  <text x="730" y="721" fill="#E8A87C" font-size="12" font-weight="700">→ サプライチェーン攻撃の理想形</text>
  <text x="730" y="747" fill="#888" font-size="11">「AIが書いたから安全」は危険</text>

  <rect x="1025" y="630" width="295" height="130" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="1045" y="658" fill="#1A1D24" font-size="14" font-weight="800">企業への教訓</text>
  <line x1="1045" y1="665" x2="1300" y2="665" stroke="#1A1D24" stroke-width="1.5"/>
  <text x="1045" y="685" fill="#555" font-size="12">① 外部依存は hash-pinning で固定</text>
  <text x="1045" y="703" fill="#555" font-size="12">② 署名ワークフローを隔離</text>
  <text x="1045" y="721" fill="#5CA46E" font-size="12" font-weight="700">③ SBOM（ソフトウェア部品表）を整備</text>
  <text x="1045" y="747" fill="#888" font-size="11">CISA の推奨実践をチェック</text>

  <!-- Sticky notes -->
  <rect x="85" y="788" width="255" height="110" rx="5" fill="#FFCDD2" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(-1.5, 85, 788)"/>
  <text x="105" y="816" fill="#1A1D24" font-size="13" font-weight="800" transform="rotate(-1.5)">🚨 OpenAI 緊急通告</text>
  <text x="105" y="837" fill="#555" font-size="11" transform="rotate(-1.5)">「5/8以降、旧版アプリは</text>
  <text x="105" y="854" fill="#555" font-size="11" transform="rotate(-1.5)">アップデートを受け取れず</text>
  <text x="105" y="871" fill="#555" font-size="11" transform="rotate(-1.5)">機能しなくなる可能性がある」</text>
  <text x="105" y="888" fill="#888" font-size="10" transform="rotate(-1.5)">全ユーザーへの直接通知を実施</text>

  <rect x="363" y="800" width="255" height="100" rx="5" fill="#FFF9C4" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(1, 363, 800)"/>
  <text x="383" y="828" fill="#1A1D24" font-size="13" font-weight="800" transform="rotate(1)">⚠️ 「影響なし」の留保</text>
  <text x="383" y="849" fill="#555" font-size="11" transform="rotate(1)">「ユーザーデータ侵害は確認されず」</text>
  <text x="383" y="866" fill="#555" font-size="11" transform="rotate(1)">→ サードパーティ DFIR 企業の</text>
  <text x="383" y="883" fill="#555" font-size="11" transform="rotate(1)">独立検証は限定的</text>

  <rect x="641" y="788" width="255" height="110" rx="5" fill="#FFE0B2" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(-1, 641, 788)"/>
  <text x="661" y="816" fill="#1A1D24" font-size="13" font-weight="800" transform="rotate(-1)">🔮 今後の展開</text>
  <text x="661" y="837" fill="#555" font-size="11" transform="rotate(-1)">AI企業のCI/CDをターゲットにした</text>
  <text x="661" y="854" fill="#555" font-size="11" transform="rotate(-1)">北朝鮮APT攻撃が継続するとみられる</text>
  <text x="661" y="871" fill="#555" font-size="11" transform="rotate(-1)">NVIDIA・Anthropic・Googleも警戒を</text>
  <text x="661" y="888" fill="#555" font-size="11" transform="rotate(-1)">強化すべき段階</text>

  <rect x="919" y="800" width="255" height="100" rx="5" fill="#C8E6C9" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(1.5, 919, 800)"/>
  <text x="939" y="828" fill="#1A1D24" font-size="13" font-weight="800" transform="rotate(1.5)">💡 対策サマリー</text>
  <text x="939" y="849" fill="#555" font-size="11" transform="rotate(1.5)">npm の lock ファイル厳格管理</text>
  <text x="939" y="866" fill="#555" font-size="11" transform="rotate(1.5)">GitHub Actions のバージョン固定</text>
  <text x="939" y="883" fill="#555" font-size="11" transform="rotate(1.5)">署名環境の隔離が急務</text>

  <text x="700" y="1035" text-anchor="middle" fill="#999" font-size="13" font-style="italic">AI News · 2026-04-30 · OpenAI Axios Supply Chain Attack: North Korea RAT Compromises macOS Code-Signing</text>
