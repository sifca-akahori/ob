  <text x="535" y="298" text-anchor="middle" fill="#1A1D24" font-size="50" font-weight="900">数億回</text>
  <text x="535" y="333" text-anchor="middle" fill="#555" font-size="13">超広範囲に普及するnpmライブラリ</text>
