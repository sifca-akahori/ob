  <line x1="80" y1="167" x2="1350" y2="167" stroke="#1A1D24" stroke-width="3"/>
  <text x="80" y="190" fill="#666" font-size="14">The Hacker News / BleepingComputer / OpenAI  ·  2026-04-30  ·  #セキュリティ #サプライチェーン</text>

  <!-- Hero -->
  <g transform="translate(1245, 235)">
    <circle cx="0" cy="0" r="65" fill="#F5F0E8" stroke="#1A1D24" stroke-width="3"/>
