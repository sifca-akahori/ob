  <text x="195" y="516" text-anchor="middle" fill="#555" font-size="11">Axios v1.14.1</text>
  <text x="195" y="534" text-anchor="middle" fill="#555" font-size="11">（悪意あり）を</text>
  <text x="195" y="552" text-anchor="middle" fill="#555" font-size="11">公開</text>
  <text x="195" y="565" text-anchor="middle" fill="#888" font-size="10">3/31 UTC</text>

  <text x="300" y="520" text-anchor="middle" fill="#E8A87C" font-size="28">→</text>

  <!-- Step 2 -->
  <rect x="320" y="445" width="170" height="130" rx="8" fill="#FFE0B2" stroke="#1A1D24" stroke-width="2.5"/>
  <text x="405" y="470" text-anchor="middle" fill="#1A1D24" font-size="12" font-weight="800">② npm 取得</text>
  <line x1="340" y1="477" x2="480" y2="477" stroke="#1A1D24" stroke-width="1"/>
  <text x="405" y="498" text-anchor="middle" fill="#555" font-size="11">OpenAI の</text>
  <text x="405" y="516" text-anchor="middle" fill="#555" font-size="11">GitHub Actions が</text>
  <text x="405" y="534" text-anchor="middle" fill="#555" font-size="11">最新版を自動</text>
  <text x="405" y="552" text-anchor="middle" fill="#555" font-size="11">ダウンロード</text>

  <text x="510" y="520" text-anchor="middle" fill="#E8A87C" font-size="28">→</text>

  <!-- Step 3 -->
  <rect x="530" y="445" width="170" height="130" rx="8" fill="#FFCDD2" stroke="#1A1D24" stroke-width="2.5"/>
  <text x="615" y="470" text-anchor="middle" fill="#1A1D24" font-size="12" font-weight="800">③ RAT展開</text>
  <line x1="550" y1="477" x2="690" y2="477" stroke="#1A1D24" stroke-width="1"/>
  <text x="615" y="498" text-anchor="middle" fill="#555" font-size="11">plain-crypto-js</text>
  <text x="615" y="516" text-anchor="middle" fill="#555" font-size="11">（実態はRAT）が</text>
  <text x="615" y="534" text-anchor="middle" fill="#555" font-size="11">CI環境に</text>
  <text x="615" y="552" text-anchor="middle" fill="#555" font-size="11">展開</text>

  <text x="720" y="520" text-anchor="middle" fill="#E8A87C" font-size="28">→</text>

  <!-- Step 4 -->
  <rect x="740" y="445" width="200" height="130" rx="8" fill="#FFCDD2" stroke="#1A1D24" stroke-width="2.5"/>
  <text x="840" y="470" text-anchor="middle" fill="#1A1D24" font-size="12" font-weight="800">④ 署名鍵リスク</text>
  <line x1="760" y1="477" x2="930" y2="477" stroke="#1A1D24" stroke-width="1"/>
  <text x="840" y="498" text-anchor="middle" fill="#555" font-size="11">macOSアプリ署名用の</text>
  <text x="840" y="516" text-anchor="middle" fill="#555" font-size="11">証明書・公証材料が</text>
  <text x="840" y="534" text-anchor="middle" fill="#555" font-size="11">侵害ワークフローを</text>
