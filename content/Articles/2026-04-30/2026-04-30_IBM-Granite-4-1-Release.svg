  <text x="220" y="302" text-anchor="middle" fill="#1A1D24" font-size="60" font-weight="900">15T</text>
  <text x="220" y="333" text-anchor="middle" fill="#555" font-size="13">マルチフェーズ学習</text>
  <text x="220" y="355" text-anchor="middle" fill="#888" font-size="12">広範PT → 高品質アニーリング</text>

  <rect x="380" y="215" width="280" height="155" rx="10" fill="#F5F0E8" stroke="#1A1D24" stroke-width="3" filter="url(#softShadow)"/>
  <text x="520" y="248" text-anchor="middle" fill="#666" font-size="13" font-weight="600">HN スコア</text>
  <text x="520" y="302" text-anchor="middle" fill="#1A1D24" font-size="60" font-weight="900">195pt</text>
  <text x="520" y="333" text-anchor="middle" fill="#555" font-size="13">105 コメント</text>
  <text x="520" y="355" text-anchor="middle" fill="#888" font-size="12">「エンタープライズOSSの新標準」</text>

  <rect x="680" y="215" width="440" height="155" rx="10" fill="#F5F0E8" stroke="#1A1D24" stroke-width="3" filter="url(#softShadow)"/>
  <text x="900" y="248" text-anchor="middle" fill="#666" font-size="13" font-weight="600">Granite Vision 4.1 vs Claude Opus 4.6</text>
  <text x="900" y="295" text-anchor="middle" fill="#1A1D24" font-size="22" font-weight="800">表・グラフ認識ベンチで上回る</text>
  <text x="900" y="325" text-anchor="middle" fill="#555" font-size="13">4Bモデルで実現（Opus 4.6比較）</text>
  <text x="900" y="355" text-anchor="middle" fill="#888" font-size="12">※ 特化ベンチマーク、汎用VLMではない</text>

