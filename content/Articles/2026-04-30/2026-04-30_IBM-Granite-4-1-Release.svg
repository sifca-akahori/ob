  <text x="100" y="731" fill="#5B8DEF" font-size="12" font-weight="700">→ エンプレ展開・ファインチューン自由</text>
  <text x="100" y="757" fill="#888" font-size="11">オンプレ / クラウドどちらも可</text>

  <rect x="390" y="640" width="290" height="130" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="410" y="668" fill="#1A1D24" font-size="14" font-weight="800">競合対比</text>
  <line x1="410" y1="675" x2="660" y2="675" stroke="#1A1D24" stroke-width="1.5"/>
  <text x="410" y="695" fill="#555" font-size="12">Qwen 3.5・DeepSeek V4 Flash と並ぶ</text>
  <text x="410" y="713" fill="#555" font-size="12">「西側製・商用OK」の希少枠</text>
  <text x="410" y="731" fill="#1A1D24" font-size="12" font-weight="700">→ Llama 4 の代替として企業採用へ</text>
  <text x="410" y="757" fill="#888" font-size="11">規制準拠での中国製モデル排除圧力も</text>

  <rect x="700" y="640" width="290" height="130" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="720" y="668" fill="#1A1D24" font-size="14" font-weight="800">15Tトークン訓練の含意</text>
  <line x1="720" y1="675" x2="970" y2="675" stroke="#1A1D24" stroke-width="1.5"/>
  <text x="720" y="695" fill="#555" font-size="12">段階的品質向上アニーリングで</text>
  <text x="720" y="713" fill="#555" font-size="12">数学・科学・コーディングを強化</text>
  <text x="720" y="731" fill="#5B8DEF" font-size="12" font-weight="700">→ 小型モデルの「データ効率」が鍵に</text>
  <text x="720" y="757" fill="#888" font-size="11">MoE不要でDenseが追いつく時代</text>

  <rect x="1010" y="640" width="310" height="130" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="1030" y="668" fill="#1A1D24" font-size="14" font-weight="800">エッジAIへの展開</text>
  <line x1="1030" y1="675" x2="1300" y2="675" stroke="#1A1D24" stroke-width="1.5"/>
  <text x="1030" y="695" fill="#555" font-size="12">Speech 4.1はOLLAMA・TGI等で</text>
  <text x="1030" y="713" fill="#555" font-size="12">そのままエッジ展開可能</text>
  <text x="1030" y="731" fill="#5CA46E" font-size="12" font-weight="700">→ 病院・工場・車載での現地推論</text>
  <text x="1030" y="757" fill="#888" font-size="11">Whisperの企業向け置換候補</text>

