  <text x="80" y="158" fill="#1A1D24" font-size="26" font-weight="800">3B・8B・30B + Speech + Vision をApache 2.0で全公開</text>
  <line x1="80" y1="170" x2="1350" y2="170" stroke="#1A1D24" stroke-width="3"/>
  <text x="80" y="193" fill="#666" font-size="14">IBM Research Blog / HuggingFace  ·  2026-04-30  ·  #Granite #オープンモデル #Apache2.0</text>

