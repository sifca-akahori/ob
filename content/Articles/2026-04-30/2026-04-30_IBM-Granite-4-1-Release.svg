  <text x="1320" y="500" text-anchor="middle" fill="#1A1D24" font-size="10" font-weight="800">2.0</text>
  <text x="1320" y="518" text-anchor="middle" fill="#1A1D24" font-size="10" font-weight="800">全て</text>

