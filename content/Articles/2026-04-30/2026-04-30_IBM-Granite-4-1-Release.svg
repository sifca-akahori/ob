  <rect x="80" y="395" width="1260" height="220" rx="10" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="110" y="425" fill="#1A1D24" font-size="18" font-weight="800">📊 Granite 4.1 モデルファミリー</text>
  <line x1="110" y1="435" x2="1320" y2="435" stroke="#1A1D24" stroke-width="1.5" stroke-dasharray="4,3"/>

