  <text x="1150" y="500" text-anchor="middle" fill="#FBF8F1" font-size="11">4B（表・グラフ特化）</text>
  <text x="1150" y="547" text-anchor="middle" fill="#1A1D24" font-size="12">ドキュメントAI</text>

