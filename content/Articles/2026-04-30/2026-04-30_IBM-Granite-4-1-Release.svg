  <text x="895" y="500" text-anchor="middle" fill="#FBF8F1" font-size="11">2B×2（ASR・翻訳）</text>
  <text x="895" y="547" text-anchor="middle" fill="#1A1D24" font-size="12">エッジ多言語音声AI</text>

  <!-- Vision 4.1 -->
  <rect x="1045" y="455" width="210" height="65" rx="6" fill="#5CA46E" stroke="#1A1D24" stroke-width="2.5"/>
