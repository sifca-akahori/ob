  <text x="105" y="844" fill="#555" font-size="11" transform="rotate(-1.5)">「Claude Opus 4.6超え」は</text>
  <text x="105" y="861" fill="#555" font-size="11" transform="rotate(-1.5)">表・グラフ特化ベンチの話。</text>
  <text x="105" y="878" fill="#555" font-size="11" transform="rotate(-1.5)">汎用VLMとしての比較ではない</text>
  <text x="105" y="895" fill="#888" font-size="10" transform="rotate(-1.5)">ベンチの文脈を読む必要あり</text>

  <rect x="363" y="808" width="255" height="100" rx="5" fill="#C8E6C9" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(1, 363, 808)"/>
  <text x="383" y="836" fill="#1A1D24" font-size="13" font-weight="800" transform="rotate(1)">💡 HNの反応</text>
  <text x="383" y="857" fill="#555" font-size="11" transform="rotate(1)">「8B で MoE 32B を超えるなら</text>
  <text x="383" y="874" fill="#555" font-size="11" transform="rotate(1)">ファインチューンの主役が変わる」</text>
  <text x="383" y="891" fill="#555" font-size="11" transform="rotate(1)">195pt / 105コメント</text>

  <rect x="641" y="795" width="255" height="110" rx="5" fill="#FFE0B2" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(-1, 641, 795)"/>
  <text x="661" y="823" fill="#1A1D24" font-size="13" font-weight="800" transform="rotate(-1)">🔮 IBMの長期戦略</text>
  <text x="661" y="844" fill="#555" font-size="11" transform="rotate(-1)">IBM watsonx + Granite 4.1で</text>
  <text x="661" y="861" fill="#555" font-size="11" transform="rotate(-1)">エンタープライズAI基盤を狙う</text>
  <text x="661" y="878" fill="#555" font-size="11" transform="rotate(-1)">IBM Cloud + Red Hat + OSS連携</text>
  <text x="661" y="895" fill="#555" font-size="11" transform="rotate(-1)">が差別化軸</text>

  <rect x="919" y="808" width="255" height="100" rx="5" fill="#E1BEE7" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(1.5, 919, 808)"/>
  <text x="939" y="836" fill="#1A1D24" font-size="13" font-weight="800" transform="rotate(1.5)">📊 半年後の予測</text>
  <text x="939" y="857" fill="#555" font-size="11" transform="rotate(1.5)">Granite 4.1 8Bが企業内RAG・</text>
  <text x="939" y="874" fill="#555" font-size="11" transform="rotate(1.5)">ツール呼び出しの主力候補に。</text>
  <text x="939" y="891" fill="#555" font-size="11" transform="rotate(1.5)">コスト比較でGPT-4o miniと競合</text>

  <text x="700" y="1035" text-anchor="middle" fill="#999" font-size="13" font-style="italic">AI News · 2026-04-30 · IBM Granite 4.1: 8B Model Rivals MoE 32B, Apache 2.0 License</text>
