    <rect x="0" y="0" width="170" height="28" rx="3" fill="#7CC97E" stroke="#9FD4A0" stroke-width="1.5"/>
    <text x="85" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#0D4A10">⚖️ 政策・規制への波紋</text>
