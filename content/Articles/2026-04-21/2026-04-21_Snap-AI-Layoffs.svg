  <text x="510" y="296" text-anchor="middle" font-size="11" fill="#888">（Evan Spiegel CEO発表）</text>
  <text x="510" y="318" text-anchor="middle" font-size="12" fill="#777">出典: Snap社内書簡</text>

  <rect x="672" y="210" width="280" height="130" rx="6" fill="#FEF0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="812" y="255" text-anchor="middle" font-size="44" font-weight="900" fill="#E8A87C">$500M+</text>
  <text x="812" y="278" text-anchor="middle" font-size="14" fill="#444">年間コスト削減額（目標）</text>
  <text x="812" y="296" text-anchor="middle" font-size="11" fill="#888">（下半期の黒字転換を目指す）</text>
  <text x="812" y="318" text-anchor="middle" font-size="12" fill="#777">出典: Snap プレスリリース</text>

