  <text x="208" y="296" text-anchor="middle" font-size="11" fill="#888">（＋採用中300ポジション撤回）</text>
  <text x="208" y="318" text-anchor="middle" font-size="12" fill="#777">出典: Snap プレスリリース</text>

  <rect x="370" y="210" width="280" height="130" rx="6" fill="#FEF0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
