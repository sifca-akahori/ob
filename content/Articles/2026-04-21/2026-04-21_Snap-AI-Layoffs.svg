  <text x="96" y="118" font-size="38" font-weight="900" fill="#1A1D24">📉 Snapが1,000人削減——AI生成コードが全体の65%超</text>
  <text x="96" y="162" font-size="21" font-weight="400" fill="#555">AI主導レイオフとコスト5億ドル超削減 · TechCrunch / CNBC · 2026-04-15 · #レイオフ #労働市場</text>

