  <line x1="148" y1="712" x2="900" y2="712" stroke="#1A1D24" stroke-width="1.5"/>

  <line x1="180" y1="750" x2="880" y2="750" stroke="#C8C0B0" stroke-width="2"/>
  <g font-size="11" text-anchor="middle" fill="#2F3842">
    <circle cx="210" cy="750" r="7" fill="#8A8A8A" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="210" y="773">2019</text>
    <text x="210" y="787">独占契約開始</text>

    <circle cx="380" cy="750" r="7" fill="#8A8A8A" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="380" y="773">2024</text>
    <text x="380" y="787">$13B追加投資</text>

    <circle cx="550" cy="750" r="8" fill="#5CA46E" stroke="#1A1D24" stroke-width="2"/>
    <text x="550" y="773" font-weight="700">Apr 27, 2026</text>
    <text x="550" y="787" font-weight="700" fill="#5CA46E">非独占化・改定</text>

    <circle cx="720" cy="750" r="7" fill="#F5B700" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="720" y="773">後半 2026</text>
    <text x="720" y="787">IPO 計画</text>

    <circle cx="870" cy="750" r="7" fill="#C8C0B0" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="870" y="773">2032</text>
    <text x="870" y="787">ライセンス終了</text>
  </g>

  <!-- Footer -->
  <line x1="128" y1="840" x2="1340" y2="840" stroke="#C8C0B0" stroke-width="1"/>
  <text x="128" y="860" font-size="12" fill="#8A8A8A" font-style="italic">AI News · 2026-04-27 · Microsoft and OpenAI Restructure Exclusive Partnership for Multi-Cloud Era</text>
