  <rect x="148" y="390" width="14" height="12" fill="#5CA46E"/>
  <text x="168" y="401" font-size="11" fill="#2F3842">Claude Opus 4.7</text>
  <rect x="290" y="390" width="14" height="12" fill="#4285F4"/>
  <text x="310" y="401" font-size="11" fill="#2F3842">Gemini 3.1 Pro</text>
  <rect x="432" y="390" width="14" height="12" fill="#8A8A8A"/>
  <text x="452" y="401" font-size="11" fill="#2F3842">GPT-5.4</text>

