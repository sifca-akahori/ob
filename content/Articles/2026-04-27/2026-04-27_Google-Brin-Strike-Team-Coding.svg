  <text x="630" y="799" text-anchor="middle" font-size="11" fill="#5A5248">2B 行コードベース + RL 特化</text>

  <line x1="232" y1="755" x2="232" y2="760" stroke="#1A1D24" stroke-width="1.5"/>
  <line x1="430" y1="755" x2="430" y2="760" stroke="#1A1D24" stroke-width="1.5"/>
