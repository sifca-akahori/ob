<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#FBF8F1"/>
      <circle cx="18" cy="28" r="0.4" fill="#C4B389" opacity="0.3"/>
      <circle cx="63" cy="55" r="0.5" fill="#C4B389" opacity="0.3"/>
      <circle cx="42" cy="80" r="0.3" fill="#C4B389" opacity="0.3"/>
      <circle cx="82" cy="15" r="0.4" fill="#C4B389" opacity="0.3"/>
    </pattern>
    <filter id="stickyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="dangerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#F97F66"/>
    </linearGradient>
    <linearGradient id="googleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5CA46E"/>
      <stop offset="100%" stop-color="#7EC490"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#7BAAF7"/>
    </linearGradient>
    <linearGradient id="barGray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A8A8A"/>
      <stop offset="100%" stop-color="#AAAAAA"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <line x1="118" y1="30" x2="118" y2="1020" stroke="#D88A8A" stroke-width="1.2" opacity="0.4"/>

  <g fill="#E8E2D3" stroke="#C8C0B0" stroke-width="1">
    <circle cx="50" cy="105" r="12"/>
    <circle cx="50" cy="260" r="12"/>
    <circle cx="50" cy="440" r="12"/>
    <circle cx="50" cy="620" r="12"/>
    <circle cx="50" cy="800" r="12"/>
    <circle cx="50" cy="960" r="12"/>
  </g>

  <!-- Category tape: ビジネス -->
  <g transform="translate(1130, 25) rotate(-3)">
    <rect x="0" y="0" width="200" height="38" rx="3" fill="#5CA46E" stroke="#1A1D24" stroke-width="2" opacity="0.88"/>
