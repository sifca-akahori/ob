    <text x="450" y="310" font-size="12" fill="#5A5248">Brin 直接関与の緊急体制</text>
    <line x1="570" y1="258" x2="570" y2="320" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="690" y="272" font-size="26" font-weight="900" fill="#1A1D24">Claude Code</text>
    <text x="690" y="298" font-size="26" font-weight="900" fill="#E74C3C">首位奪取</text>
    <text x="690" y="315" font-size="11" fill="#5A5248">4月16日、Opus 4.7 Gemini 超え</text>
    <line x1="800" y1="258" x2="800" y2="320" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="870" y="285" font-size="38" font-weight="900" fill="#1A1D24">精鋭</text>
    <text x="870" y="310" font-size="12" fill="#5A5248">小チーム集中戦略</text>
  </g>

  <!-- Coding benchmark comparison bars -->
  <rect x="128" y="350" width="790" height="280" rx="6" fill="white" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="148" y="375" font-size="13" font-weight="700" fill="#1A1D24" letter-spacing="2">主要コーディングベンチ比較（2026年4月時点）</text>
  <line x1="148" y1="382" x2="900" y2="382" stroke="#1A1D24" stroke-width="1.5"/>

