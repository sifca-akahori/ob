  <text x="148" y="435" font-size="12" fill="#2F3842" font-weight="600">SWE-Bench Pro</text>
  <rect x="260" y="420" width="314" height="22" rx="3" fill="url(#barGreen)" stroke="#1A1D24" stroke-width="1.5"/>
  <text x="580" y="435" font-size="12" font-weight="700" fill="#2F3842">63.2%</text>
  <rect x="260" y="445" width="262" height="18" rx="3" fill="url(#barBlue)" stroke="#1A1D24" stroke-width="1"/>
