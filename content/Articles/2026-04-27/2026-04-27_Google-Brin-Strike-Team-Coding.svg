  <text x="148" y="510" font-size="12" fill="#2F3842" font-weight="600">HumanEval+</text>
  <rect x="260" y="495" width="355" height="22" rx="3" fill="url(#barGreen)" stroke="#1A1D24" stroke-width="1.5"/>
