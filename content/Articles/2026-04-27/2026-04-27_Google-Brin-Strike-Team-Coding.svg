    <text x="15" y="52" font-size="11" fill="#2F3842">「毎日コードを書く」宣言。</text>
    <text x="15" y="68" font-size="11" fill="#2F3842">Jobs 型の「創業者参加」で</text>
    <text x="15" y="84" font-size="11" fill="#2F3842">組織的優先度を最大化。</text>
    <text x="15" y="100" font-size="11" fill="#2F3842">「コーディング = AGI への</text>
    <text x="15" y="116" font-size="11" fill="#2F3842">鍵」と社内メモで宣言。</text>
  </g>

  <g transform="translate(938, 378) rotate(1.0)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="218" height="148" rx="4" fill="#F8BBD0" stroke="#E91E63" stroke-width="1.5"/>
    <text x="109" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">⚡ 2B行コードの罠</text>
    <line x1="15" y1="32" x2="203" y2="32" stroke="#E91E63" stroke-width="1"/>
    <text x="15" y="52" font-size="11" fill="#2F3842">Google内部コードはBazel・</text>
    <text x="15" y="68" font-size="11" fill="#2F3842">Borg等独自FWが主体。</text>
    <text x="15" y="84" font-size="11" fill="#2F3842">汎用ベンチは OSS 理解力</text>
    <text x="15" y="100" font-size="11" fill="#2F3842">が問われるため、内部データ</text>
    <text x="15" y="116" font-size="11" fill="#2F3842">の優位性は限定的かも。</text>
  </g>

  <g transform="translate(938, 545) rotate(-0.8)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="218" height="148" rx="4" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
    <text x="109" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">⚡ Anthropic の強みの本質</text>
    <line x1="15" y1="32" x2="203" y2="32" stroke="#4CAF50" stroke-width="1"/>
    <text x="15" y="52" font-size="11" fill="#2F3842">Constitutional AI + RL の</text>
    <text x="15" y="68" font-size="11" fill="#2F3842">精度がデータ量より重要。</text>
    <text x="15" y="84" font-size="11" fill="#2F3842">エラー自己訂正・ツール</text>
    <text x="15" y="100" font-size="11" fill="#2F3842">連携・長文コンテキストの</text>
    <text x="15" y="116" font-size="11" fill="#2F3842">細部は即座に再現不可。</text>
  </g>

  <g transform="translate(938, 712) rotate(1.3)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="218" height="148" rx="4" fill="#BBE1FA" stroke="#5B8DEF" stroke-width="1.5"/>
    <text x="109" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">⚡ Gemini 4 Code 予測</text>
    <line x1="15" y1="32" x2="203" y2="32" stroke="#5B8DEF" stroke-width="1"/>
    <text x="15" y="52" font-size="11" fill="#2F3842">成果は Q3〜Q4 に出現か。</text>
    <text x="15" y="68" font-size="11" fill="#2F3842">「Gemini 4 Code」として</text>
    <text x="15" y="84" font-size="11" fill="#2F3842">SWE-Bench 60%超を目標に</text>
    <text x="15" y="100" font-size="11" fill="#2F3842">すると予測。ただし Claude 5</text>
    <text x="15" y="116" font-size="11" fill="#2F3842">も同時期に登場予定で追撃継続。</text>
  </g>

