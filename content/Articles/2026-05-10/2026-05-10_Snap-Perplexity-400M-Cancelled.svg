  <rect x="55" y="178" width="860" height="110" rx="6" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <text x="95" y="214" font-size="13" fill="#5C6370">提携総額</text>
  <text x="95" y="258" font-size="46" font-weight="900" fill="#E05252">$4億</text>
  <text x="95" y="276" font-size="11" fill="#9AA0AB">現金+株式・12ヶ月で支払い予定</text>
  <line x1="300" y1="196" x2="300" y2="278" stroke="#E8E2D3" stroke-width="1"/>
  <text x="330" y="214" font-size="13" fill="#5C6370">提携期間</text>
  <text x="330" y="258" font-size="46" font-weight="900" fill="#1A1D24">6ヶ月</text>
  <text x="330" y="276" font-size="11" fill="#9AA0AB">2025年11月発表 → Q1 2026中に解消</text>
  <line x1="570" y1="196" x2="570" y2="278" stroke="#E8E2D3" stroke-width="1"/>
  <text x="600" y="214" font-size="13" fill="#5C6370">Snapchat MAU</text>
  <text x="600" y="258" font-size="46" font-weight="900" fill="#1A1D24">9億人</text>
  <text x="600" y="276" font-size="11" fill="#9AA0AB">Perplexityがアクセスを失った市場</text>

  <!-- Deal timeline -->
  <rect x="55" y="308" width="560" height="310" rx="6" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <text x="80" y="338" font-size="16" font-weight="700" fill="#1A1D24">提携の軌跡</text>
  <line x1="80" y1="344" x2="300" y2="344" stroke="#E05252" stroke-width="2"/>

  <!-- Timeline -->
  <line x1="120" y1="362" x2="120" y2="596" stroke="#E8E2D3" stroke-width="3"/>

  <circle cx="120" cy="378" r="12" fill="#5CA46E" stroke="#1A1D24" stroke-width="2"/>
  <text x="145" y="374" font-size="12" font-weight="700" fill="#5CA46E">2025年11月</text>
  <text x="145" y="391" font-size="12" fill="#1A1D24">Snap-Perplexity提携発表</text>
  <text x="145" y="407" font-size="11" fill="#5C6370">$400M / Snapchat Chat UI統合計画</text>

  <circle cx="120" cy="450" r="12" fill="#E8A87C" stroke="#1A1D24" stroke-width="2"/>
  <text x="145" y="446" font-size="12" font-weight="700" fill="#E8A87C">2026年Q1前半</text>
  <text x="145" y="463" font-size="12" fill="#1A1D24">「広範な展開への合意未達」公表</text>
  <text x="145" y="479" font-size="11" fill="#5C6370">Snapが早期の問題を示唆</text>

  <circle cx="120" cy="522" r="12" fill="#E05252" stroke="#1A1D24" stroke-width="2"/>
  <text x="145" y="518" font-size="12" font-weight="700" fill="#E05252">2026年Q1終了</text>
  <text x="145" y="535" font-size="12" fill="#1A1D24">提携解消（内密条件で決着）</text>
  <text x="145" y="551" font-size="11" fill="#5C6370">Snap決算でAmicably endedと発表</text>

  <circle cx="120" cy="580" r="12" fill="#9AA0AB" stroke="#1A1D24" stroke-width="2"/>
  <text x="145" y="576" font-size="12" font-weight="700" fill="#9AA0AB">2026年Q2以降</text>
  <text x="145" y="593" font-size="12" fill="#1A1D24">Perplexityからの売上ゼロを確認</text>
  <text x="145" y="609" font-size="11" fill="#5C6370">Snap株価急落・慎重ガイダンス</text>

  <!-- Why failed -->
  <rect x="635" y="308" width="710" height="310" rx="6" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <text x="660" y="338" font-size="16" font-weight="700" fill="#1A1D24">崩壊の構造的理由</text>
