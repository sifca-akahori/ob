  <!-- Reason 1 -->
  <rect x="660" y="356" width="660" height="56" rx="4" fill="#FFF0F0" stroke="#E05252" stroke-width="1.5"/>
  <text x="680" y="376" font-size="13" font-weight="700" fill="#E05252">① ブランド主権の争奪</text>
  <text x="680" y="396" font-size="12" fill="#1A1D24">SnapchatにPerplexityブランドのAIが入ることで「Snapchatが見え透く」</text>
  <text x="680" y="404" font-size="12" fill="#1A1D24">→ SnapはMyAI（自社AI）のブランド確立を優先した可能性</text>

  <!-- Reason 2 -->
  <rect x="660" y="424" width="660" height="56" rx="4" fill="#FFF0F0" stroke="#E05252" stroke-width="1.5"/>
  <text x="680" y="444" font-size="13" font-weight="700" fill="#E05252">② マネタイズモデルの不整合</text>
  <text x="680" y="464" font-size="12" fill="#1A1D24">Perplexityは検索広告を志向、SnapchatはAR広告・ストーリー広告が主軸</text>
  <text x="680" y="480" font-size="12" fill="#1A1D24">→ 検索型UXとソーシャル型UXの根本的な設計の違い</text>

  <!-- Reason 3 -->
  <rect x="660" y="492" width="660" height="56" rx="4" fill="#FFF0F0" stroke="#E05252" stroke-width="1.5"/>
  <text x="680" y="512" font-size="13" font-weight="700" fill="#E05252">③ 地政学リスクによる優先順位変更</text>
  <text x="680" y="532" font-size="12" fill="#1A1D24">中東ユーザー比率高いSnapが「地政学的不確実性」でコスト削減を優先</text>
  <text x="680" y="548" font-size="12" fill="#1A1D24">→ $400M規模の外部支払いより事業縮小を選択した可能性</text>

