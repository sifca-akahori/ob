    <text x="312" y="662" font-size="13" font-weight="700" fill="#1A1D24">💰 Perplexityは損？</text>
    <text x="312" y="682" font-size="12" fill="#1A1D24">未払い$400Mは失わず。</text>
    <text x="312" y="698" font-size="12" fill="#1A1D24">6ヶ月でSnapchat UX・</text>
    <text x="312" y="714" font-size="12" fill="#1A1D24">ユーザー行動の学習は</text>
    <text x="312" y="730" font-size="12" fill="#1A1D24">副産物として得た可能性</text>
  </g>

  <g transform="rotate(-0.8, 610, 680)" filter="url(#stickyShadow)">
    <rect x="530" y="638" width="222" height="118" rx="3" fill="#EDE0FF" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="550" y="662" font-size="13" font-weight="700" fill="#1A1D24">🎯 次の提携先は？</text>
    <text x="550" y="682" font-size="12" fill="#1A1D24">Apple Safari・Samsung</text>
    <text x="550" y="698" font-size="12" fill="#1A1D24">AI Search・Android標準</text>
    <text x="550" y="714" font-size="12" fill="#1A1D24">ウィジェットへの統合が</text>
    <text x="550" y="730" font-size="12" fill="#1A1D24">最重要戦略課題へ</text>
  </g>

  <g transform="rotate(1.3, 840, 680)" filter="url(#stickyShadow)">
    <rect x="768" y="638" width="222" height="118" rx="3" fill="#FFE0CC" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="788" y="662" font-size="13" font-weight="700" fill="#1A1D24">📉 Snap株への影響</text>
    <text x="788" y="682" font-size="12" fill="#1A1D24">Q2ガイダンス：$1.45B</text>
    <text x="788" y="698" font-size="12" fill="#1A1D24">〜$1.48B（Perplexity収</text>
    <text x="788" y="714" font-size="12" fill="#1A1D24">益ゼロ想定）。中東不安</text>
    <text x="788" y="730" font-size="12" fill="#1A1D24">も重なり株価急落</text>
  </g>

