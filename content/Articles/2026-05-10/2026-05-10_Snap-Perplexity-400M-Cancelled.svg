  <rect x="80" y="822" width="1250" height="30" rx="3" fill="#F5F5F5" stroke="#D0D0D0" stroke-width="1"/>
  <text x="100" y="842" font-size="12" font-weight="700" fill="#1A1D24">AIサーチ</text>
  <text x="280" y="842" font-size="12" font-weight="700" fill="#1A1D24">主要プラットフォーム統合</text>
  <text x="580" y="842" font-size="12" font-weight="700" fill="#1A1D24">MAUアクセス</text>
  <text x="780" y="842" font-size="12" font-weight="700" fill="#1A1D24">ビジネスモデル</text>
  <text x="1060" y="842" font-size="12" font-weight="700" fill="#1A1D24">統合の質</text>

  <rect x="80" y="852" width="1250" height="36" rx="0" fill="#F0F8FF" stroke="#E0E0E0" stroke-width="0.5"/>
