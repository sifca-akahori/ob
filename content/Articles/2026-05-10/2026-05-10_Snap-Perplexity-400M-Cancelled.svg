  <text x="280" y="875" font-size="12" fill="#1A1D24">Windows・Office・Edge（同一企業MS）</text>
  <text x="580" y="875" font-size="12" fill="#5CA46E">10億+</text>
  <text x="780" y="875" font-size="12" fill="#1A1D24">Microsoft傘下・深統合</text>
  <text x="1060" y="875" font-size="12" fill="#5CA46E">✅ 強固</text>

  <rect x="80" y="888" width="1250" height="36" rx="0" fill="white" stroke="#E0E0E0" stroke-width="0.5"/>
  <text x="100" y="911" font-size="12" fill="#1A1D24">Google AI Overviews</text>
  <text x="280" y="911" font-size="12" fill="#1A1D24">Search・Chrome・Android（同一企業）</text>
  <text x="580" y="911" font-size="12" fill="#5CA46E">40億+</text>
  <text x="780" y="911" font-size="12" fill="#1A1D24">Google傘下・最深統合</text>
  <text x="1060" y="911" font-size="12" fill="#5CA46E">✅ 最強</text>

  <rect x="80" y="924" width="1250" height="36" rx="0" fill="white" stroke="#E0E0E0" stroke-width="0.5"/>
  <text x="100" y="947" font-size="12" fill="#1A1D24">ChatGPT Search</text>
  <text x="280" y="947" font-size="12" fill="#1A1D24">ChatGPT app（OpenAI独自）</text>
  <text x="580" y="947" font-size="12" fill="#E8A87C">7億MAU</text>
  <text x="780" y="947" font-size="12" fill="#1A1D24">独自プラットフォーム内</text>
  <text x="1060" y="947" font-size="12" fill="#E8A87C">🟡 中</text>

  <rect x="80" y="960" width="1250" height="36" rx="0" fill="#FFF0F0" stroke="#E0E0E0" stroke-width="0.5"/>
  <text x="100" y="983" font-size="12" font-weight="700" fill="#E05252">Perplexity</text>
  <text x="280" y="983" font-size="12" fill="#E05252">Snap破談 → 次の提携先を模索中</text>
  <text x="580" y="983" font-size="12" fill="#E05252">独自（ARR $100M+）</text>
  <text x="780" y="983" font-size="12" fill="#1A1D24">サブスク + 広告</text>
  <text x="1060" y="983" font-size="12" fill="#E05252">❌ 未確定</text>

  <!-- Footer -->
  <line x1="55" y1="1032" x2="1345" y2="1032" stroke="#E8E2D3" stroke-width="1"/>
  <text x="700" y="1046" text-anchor="middle" font-size="12" fill="#9AA0AB" font-style="italic">AI News · 2026-05-10 · Snap's $400M Perplexity AI Search Deal Collapses After 6 Months — "Amicably Ended"</text>
