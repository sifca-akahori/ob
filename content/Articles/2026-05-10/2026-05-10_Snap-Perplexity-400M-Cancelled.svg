    <text x="75" y="682" font-size="12" fill="#1A1D24">Google + YouTube、Bing</text>
    <text x="75" y="698" font-size="12" fill="#1A1D24">+ LinkedIn は同一企業。</text>
    <text x="75" y="714" font-size="12" fill="#1A1D24">独立系AIとSNSの統合</text>
    <text x="75" y="730" font-size="12" fill="#1A1D24">には構造的限界がある</text>
  </g>

  <g transform="rotate(1.0, 390, 680)" filter="url(#stickyShadow)">
