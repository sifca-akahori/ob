    <text x="788" y="681" font-size="13" font-weight="700" fill="#1A1D24">🔮 6ヶ月後の予測</text>
    <text x="788" y="703" font-size="12" fill="#1A1D24">Googleが認定拒否→法的</text>
    <text x="788" y="719" font-size="12" fill="#1A1D24">手続き→数ヶ月の審理。</text>
    <text x="788" y="735" font-size="12" fill="#1A1D24">その間にEU AI Act施行と</text>
    <text x="788" y="751" font-size="12" fill="#1A1D24">重なり政治化が加速</text>
  </g>

  <!-- Context banner -->
