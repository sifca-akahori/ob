    <text x="310" y="681" font-size="13" font-weight="700" fill="#1A1D24">🌍 波及リスク</text>
    <text x="310" y="703" font-size="12" fill="#1A1D24">OpenAI・Anthropic・Meta</text>
    <text x="310" y="719" font-size="12" fill="#1A1D24">の欧州拠点への類似動き</text>
    <text x="310" y="735" font-size="12" fill="#1A1D24">が予想される。AI企業の</text>
    <text x="310" y="751" font-size="12" fill="#1A1D24">欧州進出コストが上昇</text>
