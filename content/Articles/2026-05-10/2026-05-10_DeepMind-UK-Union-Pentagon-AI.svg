  <text x="138" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="white">2026-05-10</text>

  <!-- Impact stars -->
  <text x="260" y="42" font-size="20" fill="#F5A623">⭐⭐⭐</text>

  <!-- Header -->
  <text x="55" y="90" font-size="36" font-weight="900" fill="#1A1D24">✊ DeepMind UK、98%賛成でCWU組合結成票決</text>
  <text x="55" y="126" font-size="20" fill="#E05252" font-weight="700">Pentagon AI契約が引き金——フロンティアラボ初の組合誕生へ</text>
  <text x="55" y="152" font-size="15" fill="#5C6370">Fortune / The Next Web｜2026-05-10｜#ビジネス #DeepMind #軍事AI #組合</text>
  <line x1="55" y1="164" x2="1350" y2="164" stroke="#1A1D24" stroke-width="2"/>

