  <text x="95" y="214" font-size="13" fill="#5C6370">組合結成賛成率</text>
  <text x="95" y="258" font-size="46" font-weight="900" fill="#E05252">98%</text>
  <text x="95" y="278" font-size="11" fill="#9AA0AB">CWUメンバー投票結果</text>
