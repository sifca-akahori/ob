    <text x="550" y="719" font-size="12" fill="#1A1D24">「組合なし」のOpenAI等</text>
    <text x="550" y="735" font-size="12" fill="#1A1D24">に対してGoogleが不利に</text>
    <text x="550" y="751" font-size="12" fill="#1A1D24">なる可能性がある</text>
  </g>

  <g transform="rotate(1.2, 840, 690)" filter="url(#stickyShadow)">
