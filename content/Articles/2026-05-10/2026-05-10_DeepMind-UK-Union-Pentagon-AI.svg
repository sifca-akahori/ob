  <text x="705" y="504" font-size="13" font-weight="700" fill="#E05252">③ 倫理審査への参加権</text>
  <text x="705" y="524" font-size="12" fill="#1A1D24">軍事・監視用途の新契約に対し、従業員代表が事前に審査・拒否権を行使できる仕組みの設置</text>

  <!-- Impact context -->
