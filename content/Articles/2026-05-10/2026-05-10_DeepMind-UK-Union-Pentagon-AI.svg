  <text x="705" y="376" font-size="13" font-weight="700" fill="#E05252">① 組合の法的認定</text>
  <text x="705" y="396" font-size="12" fill="#1A1D24">CWU + Unite the Unionを代表組合として認定。10営業日以内に回答なければ法的手続きへ</text>

  <!-- Demand 2 -->
  <rect x="685" y="420" width="630" height="52" rx="4" fill="#FFF0F0" stroke="#E05252" stroke-width="1.5"/>
