  <!-- Timeline line -->
  <line x1="120" y1="380" x2="120" y2="615" stroke="#E8E2D3" stroke-width="3"/>

  <!-- Event 1: 2018 Project Maven -->
  <circle cx="120" cy="395" r="12" fill="#9AA0AB" stroke="#1A1D24" stroke-width="2"/>
  <text x="145" y="390" font-size="12" font-weight="700" fill="#9AA0AB">2018年4月</text>
  <text x="145" y="407" font-size="12" fill="#1A1D24">Project Maven：従業員3,000人請願</text>
  <text x="145" y="422" font-size="11" fill="#5C6370">→ Google、契約更新を断念</text>

  <!-- Event 2: 2018 non-weapons pledge -->
  <circle cx="120" cy="455" r="12" fill="#5CA46E" stroke="#1A1D24" stroke-width="2"/>
  <text x="145" y="450" font-size="12" font-weight="700" fill="#5CA46E">2018年6月</text>
  <text x="145" y="467" font-size="12" fill="#1A1D24">Google AI非軍事利用コミットメント公表</text>
  <text x="145" y="482" font-size="11" fill="#5C6370">「兵器・監視へのAI使用はしない」</text>

  <!-- Event 3: 2025 Feb removal -->
  <circle cx="120" cy="520" r="12" fill="#E8A87C" stroke="#1A1D24" stroke-width="2"/>
  <text x="145" y="515" font-size="12" font-weight="700" fill="#E8A87C">2025年2月</text>
  <text x="145" y="532" font-size="12" fill="#1A1D24">コミットメントをウェブから静かに削除</text>
  <text x="145" y="547" font-size="11" fill="#5C6370">従業員・外部に告知なし</text>

  <!-- Event 4: 2026 May Pentagon -->
  <circle cx="120" cy="580" r="12" fill="#E05252" stroke="#1A1D24" stroke-width="2"/>
  <text x="145" y="575" font-size="12" font-weight="700" fill="#E05252">2026年5月</text>
  <text x="145" y="592" font-size="12" fill="#1A1D24">Pentagon契約：Geminiを機密軍事ネット展開</text>
  <text x="145" y="607" font-size="11" fill="#E05252">→ 98%組合票決——業界初の波紋</text>

