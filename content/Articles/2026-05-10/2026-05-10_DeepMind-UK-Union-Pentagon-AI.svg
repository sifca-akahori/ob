  <text x="705" y="592" font-size="12" fill="#1A1D24">AI倫理委員会・安全チームは経営陣が解散できるが、労働組合の交渉権は</text>
  <text x="705" y="610" font-size="12" fill="#1A1D24">雇用法で保護。業界標準を下から変える可能性がある初の事例。</text>

