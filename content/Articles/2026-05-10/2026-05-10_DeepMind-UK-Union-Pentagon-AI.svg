    <text x="75" y="719" font-size="12" fill="#1A1D24">2026: 白紙委任的な軍事</text>
    <text x="75" y="735" font-size="12" fill="#1A1D24">AI展開への構造的拒否。</text>
    <text x="75" y="751" font-size="12" fill="#1A1D24">不信の深さが桁違い</text>
