  <text x="100" y="960" font-size="12" fill="#1A1D24">Anthropic</text>
  <text x="260" y="960" font-size="12" fill="#9AA0AB">なし</text>
  <text x="520" y="960" font-size="12" fill="#5CA46E">Constitutional AI・RSP公開</text>
  <text x="780" y="960" font-size="12" fill="#1A1D24">Pentagon契約から除外</text>
  <text x="1060" y="960" font-size="12" fill="#5CA46E">🟢 低</text>

  <!-- Row 4: Meta -->
  <rect x="80" y="972" width="1250" height="34" rx="0" fill="white" stroke="#E8D0D0" stroke-width="0.5"/>
  <text x="100" y="994" font-size="12" fill="#1A1D24">Meta AI</text>
  <text x="260" y="994" font-size="12" fill="#9AA0AB">なし</text>
