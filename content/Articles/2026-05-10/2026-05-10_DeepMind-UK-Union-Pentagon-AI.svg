  <rect x="55" y="308" width="590" height="330" rx="6" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <text x="80" y="338" font-size="16" font-weight="700" fill="#1A1D24">GoogleのAI軍事問題：Project Maven → Pentagon 2026</text>
