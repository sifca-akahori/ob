  <text x="930" y="896" text-anchor="middle" font-size="11" fill="#E8A87C">Dreaming・Mem0等</text>

  <circle cx="1180" cy="860" r="12" fill="#8B7DB8" stroke="#1A1D24" stroke-width="2"/>
  <text x="1180" y="836" text-anchor="middle" font-size="12" font-weight="700" fill="#8B7DB8">2026〜</text>
  <text x="1180" y="880" text-anchor="middle" font-size="12" font-weight="700" fill="#8B7DB8">RLM・自律コンテキスト管理</text>
  <text x="1180" y="896" text-anchor="middle" font-size="12" fill="#8B7DB8">「コンテキストは環境」</text>

