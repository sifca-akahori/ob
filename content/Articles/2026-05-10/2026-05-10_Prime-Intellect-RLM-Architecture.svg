  <text x="700" y="944" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1D24">RLMが問いかけるパラダイム転換</text>
  <text x="700" y="966" text-anchor="middle" font-size="13" fill="#5C6370">"Context length is NOT the bottleneck — Context MANAGEMENT is." — Prime Intellect</text>
  <text x="700" y="984" text-anchor="middle" font-size="12" fill="#8B7DB8">GPT-4o 128K → Gemini 2.0 2M → RLM ∞（管理能力次第）</text>

