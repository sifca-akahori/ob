    <text x="550" y="664" font-size="13" font-weight="700" fill="#1A1D24">💼 実用候補</text>
    <text x="550" y="684" font-size="12" fill="#1A1D24">①大規模コード移行</text>
    <text x="550" y="700" font-size="12" fill="#1A1D24">②インシリコ創薬</text>
    <text x="550" y="716" font-size="12" fill="#1A1D24">③データセット品質</text>
    <text x="550" y="732" font-size="12" fill="#1A1D24">管理が初期適用先</text>
  </g>

  <g transform="rotate(1.3, 840, 680)" filter="url(#stickyShadow)">
    <rect x="768" y="640" width="222" height="118" rx="3" fill="#FFE0CC" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="788" y="664" font-size="13" font-weight="700" fill="#1A1D24">⚡ ミドルウェアへの脅威</text>
    <text x="788" y="684" font-size="12" fill="#1A1D24">LangChain / LlamaIndex</text>
    <text x="788" y="700" font-size="12" fill="#1A1D24">等のオーケスト層が</text>
    <text x="788" y="716" font-size="12" fill="#1A1D24">モデル内部に統合さ</text>
    <text x="788" y="732" font-size="12" fill="#1A1D24">れる可能性を示唆</text>
  </g>

