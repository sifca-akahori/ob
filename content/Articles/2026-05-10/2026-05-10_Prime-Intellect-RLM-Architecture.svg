  <text x="180" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#9AA0AB">【従来LLM】</text>
  <rect x="80" y="378" width="200" height="52" rx="4" fill="#F5F5F5" stroke="#9AA0AB" stroke-width="2"/>
