  <text x="490" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#8B7DB8">【RLM】</text>
  <rect x="380" y="378" width="255" height="52" rx="4" fill="#EDE0FF" stroke="#8B7DB8" stroke-width="2"/>
  <text x="507" y="400" text-anchor="middle" font-size="12" fill="#1A1D24">Python REPL環境</text>
  <text x="507" y="418" text-anchor="middle" font-size="11" fill="#5C6370">(入力を「環境」として管理)</text>
  <text x="507" y="448" text-anchor="middle" font-size="24">⬇️</text>
  <rect x="380" y="458" width="120" height="52" rx="4" fill="#8B7DB8" stroke="#1A1D24" stroke-width="1.5"/>
  <text x="440" y="480" text-anchor="middle" font-size="11" font-weight="700" fill="white">Root LLM</text>
  <text x="440" y="498" text-anchor="middle" font-size="10" fill="#EDE0FF">コンテキスト制御</text>

  <!-- Sub-LLMs -->
  <rect x="520" y="458" width="110" height="52" rx="4" fill="#8B7DB8" stroke="#1A1D24" stroke-width="1.5" opacity="0.7"/>
  <text x="575" y="480" text-anchor="middle" font-size="11" fill="white">Sub LLM</text>
  <text x="575" y="498" text-anchor="middle" font-size="10" fill="#EDE0FF">再帰呼び出し</text>
  <line x1="500" y1="484" x2="520" y2="484" stroke="#1A1D24" stroke-width="1.5" stroke-dasharray="4,2"/>

  <text x="507" y="528" text-anchor="middle" font-size="11" fill="#5CA46E">✓ 必要な部分のみ読み込み</text>
  <text x="507" y="545" text-anchor="middle" font-size="11" fill="#5CA46E">✓ 情報損失なし・コスト最適</text>

