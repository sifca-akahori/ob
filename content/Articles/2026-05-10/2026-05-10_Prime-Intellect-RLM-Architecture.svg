  <text x="430" y="896" text-anchor="middle" font-size="11" fill="#5B8DEF">100K〜1Mトークン</text>

  <circle cx="680" cy="860" r="10" fill="#5CA46E" stroke="#1A1D24" stroke-width="2"/>
  <text x="680" y="840" text-anchor="middle" font-size="11" fill="#5CA46E">2024〜2025</text>
  <text x="680" y="880" text-anchor="middle" font-size="11" fill="#5CA46E">RAG・外部ストア</text>
