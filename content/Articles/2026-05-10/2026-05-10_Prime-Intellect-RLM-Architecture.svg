  <text x="180" y="418" text-anchor="middle" font-size="11" fill="#9AA0AB">(100万トークン直接投入)</text>
  <text x="180" y="448" text-anchor="middle" font-size="24">⬇️</text>
  <rect x="80" y="458" width="200" height="52" rx="4" fill="#F5F5F5" stroke="#9AA0AB" stroke-width="2"/>
  <text x="180" y="480" text-anchor="middle" font-size="12" fill="#9AA0AB">Neural Network</text>
  <text x="180" y="498" text-anchor="middle" font-size="11" fill="#9AA0AB">(全トークン処理 = 高コスト)</text>
  <text x="180" y="530" text-anchor="middle" font-size="11" fill="#E05252">問題: 文脈窓の限界・コスト爆発</text>

