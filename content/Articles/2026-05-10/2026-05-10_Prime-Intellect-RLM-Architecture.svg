  <text x="95" y="214" font-size="13" fill="#5C6370">コンテキスト処理能力向上</text>
  <text x="95" y="256" font-size="42" font-weight="900" fill="#8B7DB8">100倍超</text>
  <text x="95" y="276" font-size="11" fill="#9AA0AB">コンテキスト長の物理的上限を超えて処理</text>
  <line x1="360" y1="196" x2="360" y2="278" stroke="#E8E2D3" stroke-width="1"/>
  <text x="390" y="214" font-size="13" fill="#5C6370">vs 従来スキャフォールド（品質）</text>
  <text x="390" y="256" font-size="42" font-weight="900" fill="#1A1D24">大幅超過</text>
  <text x="390" y="276" font-size="11" fill="#9AA0AB">4種の長コンテキストタスクで一貫した優位</text>
  <line x1="660" y1="196" x2="660" y2="278" stroke="#E8E2D3" stroke-width="1"/>
  <text x="690" y="214" font-size="13" fill="#5C6370">コスト</text>
  <text x="690" y="256" font-size="42" font-weight="900" fill="#1A1D24">同等</text>
  <text x="690" y="276" font-size="11" fill="#9AA0AB">長コンテキスト処理より安価なケースも</text>

