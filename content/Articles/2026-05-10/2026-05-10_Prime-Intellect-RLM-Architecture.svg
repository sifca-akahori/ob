  <!-- Header -->
  <text x="55" y="90" font-size="36" font-weight="900" fill="#1A1D24">🔁 RLM（再帰言語モデル）：コンテキスト管理が次の戦場</text>
  <text x="55" y="126" font-size="19" fill="#8B7DB8" font-weight="700">Prime Intellect「2026年のパラダイム」——コンテキスト長でなく管理能力で差がつく</text>
  <text x="55" y="152" font-size="15" fill="#5C6370">Prime Intellect Blog / arXiv｜2026-05-10｜#論文 #RLM #アーキテクチャ #コンテキスト管理</text>
  <line x1="55" y1="164" x2="1350" y2="164" stroke="#1A1D24" stroke-width="2"/>

  <!-- Hero element -->
