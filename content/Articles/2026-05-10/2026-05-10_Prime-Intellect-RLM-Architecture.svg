    <circle cx="0" cy="0" r="68" fill="#8B7DB8" opacity="0.12" stroke="#8B7DB8" stroke-width="2"/>
    <text x="0" y="16" text-anchor="middle" font-size="70">🔁</text>
  </g>

  <!-- Key numbers -->
