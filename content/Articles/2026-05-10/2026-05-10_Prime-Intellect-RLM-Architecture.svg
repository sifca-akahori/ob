  <circle cx="180" cy="860" r="10" fill="#9AA0AB" stroke="#1A1D24" stroke-width="2"/>
  <text x="180" y="840" text-anchor="middle" font-size="11" fill="#9AA0AB">2020〜2022</text>
  <text x="180" y="880" text-anchor="middle" font-size="11" fill="#9AA0AB">固定コンテキスト</text>
  <text x="180" y="896" text-anchor="middle" font-size="11" fill="#9AA0AB">4K〜8Kトークン</text>

  <circle cx="430" cy="860" r="10" fill="#5B8DEF" stroke="#1A1D24" stroke-width="2"/>
