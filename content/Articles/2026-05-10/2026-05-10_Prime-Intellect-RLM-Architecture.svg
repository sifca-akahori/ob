  <text x="1044" y="490" font-size="11" font-weight="700" fill="#8B7DB8">76% ✦</text>

  <!-- Task 3 -->
  <text x="730" y="518" font-size="12" fill="#1A1D24">科学論文群サマリー</text>
  <text x="730" y="539" font-size="11" fill="#9AA0AB">標準LLM</text>
  <rect x="840" y="528" width="105" height="18" rx="3" fill="url(#barGray)"/>
  <text x="953" y="541" font-size="11" fill="#9AA0AB">41%</text>
  <text x="730" y="560" font-size="11" fill="#8B7DB8">RLM</text>
  <rect x="840" y="549" width="214" height="18" rx="3" fill="url(#barPurple)"/>
  <text x="1062" y="562" font-size="11" font-weight="700" fill="#8B7DB8">83% ✦</text>

