    <text x="75" y="700" font-size="12" fill="#1A1D24">コンテキスト管理を</text>
    <text x="75" y="716" font-size="12" fill="#1A1D24">訓練で学習させる。</text>
    <text x="75" y="732" font-size="12" fill="#1A1D24">汎用化の正しい方向</text>
