  <text x="735" y="541" text-anchor="middle" fill="#FBF8F1" font-size="13">PhD水準科学問題</text>
  <text x="735" y="578" text-anchor="middle" fill="#1A1D24" font-size="12">GPQA/人間比較</text>
  <!-- Clock bar - low -->
  <rect x="860" y="523" width="160" height="42" rx="5" fill="#E05050" stroke="#1A1D24" stroke-width="2.5"/>
  <text x="940" y="549" text-anchor="middle" fill="#FBF8F1" font-size="22" font-weight="900">50.1%</text>
  <text x="940" y="578" text-anchor="middle" fill="#1A1D24" font-size="12">アナログ時計の読み取り</text>
