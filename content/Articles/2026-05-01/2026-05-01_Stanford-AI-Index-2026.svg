  <text x="510" y="536" text-anchor="middle" fill="#FBF8F1" font-size="13">SWE-bench Verified</text>
  <text x="510" y="578" text-anchor="middle" fill="#1A1D24" font-size="12">コーディング 人間基準超え</text>
