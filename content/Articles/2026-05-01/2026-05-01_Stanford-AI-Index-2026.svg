  <text x="210" y="330" text-anchor="middle" fill="#555" font-size="13">1年前: 60% → 今年</text>
  <text x="210" y="352" text-anchor="middle" fill="#888" font-size="12">コーディング能力 人間超え</text>

  <rect x="360" y="215" width="260" height="155" rx="10" fill="#EEF4FD" stroke="#1A1D24" stroke-width="3" filter="url(#softShadow)"/>
  <text x="490" y="248" text-anchor="middle" fill="#5B8DEF" font-size="13" font-weight="700">🏢 組織AI採用率</text>
  <text x="490" y="300" text-anchor="middle" fill="#1A1D24" font-size="46" font-weight="900">88%</text>
  <text x="490" y="330" text-anchor="middle" fill="#555" font-size="13">生成AI採用（企業調査）</text>
  <text x="490" y="352" text-anchor="middle" fill="#888" font-size="12">大学生利用率 80%</text>

  <rect x="640" y="215" width="260" height="155" rx="10" fill="#FFF0F0" stroke="#1A1D24" stroke-width="3" filter="url(#softShadow)"/>
