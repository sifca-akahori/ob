  <text x="110" y="420" fill="#1A1D24" font-size="17" font-weight="800">🎭「ギザギザのフロンティア」——同一モデルの得意・不得意の衝撃的な乖離</text>
  <line x1="110" y1="430" x2="1330" y2="430" stroke="#1A1D24" stroke-width="1.5" stroke-dasharray="4,3"/>
