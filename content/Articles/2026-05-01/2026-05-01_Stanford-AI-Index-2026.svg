  <text x="1200" y="540" fill="#1A1D24" font-size="14" font-weight="700">IMO金メダル級で</text>
  <text x="1200" y="560" fill="#E05050" font-size="14" font-weight="700">時計は50%しか読めない</text>

  <!-- 5 cards -->
  <rect x="80" y="632" width="235" height="130" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
