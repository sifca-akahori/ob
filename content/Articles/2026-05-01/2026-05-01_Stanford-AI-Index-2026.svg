  <text x="452" y="690" text-anchor="middle" fill="#1A1D24" font-size="22" font-weight="900">$285.9B</text>
  <text x="452" y="714" text-anchor="middle" fill="#555" font-size="12">中国の23倍（2025年）</text>
  <text x="452" y="736" text-anchor="middle" fill="#555" font-size="12">消費者余剰$172B/年</text>
  <text x="452" y="754" text-anchor="middle" fill="#888" font-size="11">民間投資比較</text>

  <rect x="590" y="632" width="235" height="130" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="707" y="662" text-anchor="middle" fill="#5B8DEF" font-size="13" font-weight="800">👤 人口普及速度</text>
  <text x="707" y="690" text-anchor="middle" fill="#1A1D24" font-size="22" font-weight="900">3年で53%</text>
  <text x="707" y="714" text-anchor="middle" fill="#555" font-size="12">PC・Internetより高速</text>
  <text x="707" y="736" text-anchor="middle" fill="#555" font-size="12">楽観派59%（昨年52%）</text>
  <text x="707" y="754" text-anchor="middle" fill="#888" font-size="11">グローバル調査</text>

  <rect x="845" y="632" width="235" height="130" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="962" y="662" text-anchor="middle" fill="#E05050" font-size="13" font-weight="800">📉 透明性スコア推移</text>
  <text x="962" y="690" text-anchor="middle" fill="#E05050" font-size="22" font-weight="900">58 → 40点</text>
  <text x="962" y="714" text-anchor="middle" fill="#555" font-size="12">Foundation Model</text>
  <text x="962" y="736" text-anchor="middle" fill="#555" font-size="12">Transparency Index 低下</text>
  <text x="962" y="754" text-anchor="middle" fill="#888" font-size="11">競争激化で非開示化が加速</text>

  <rect x="1100" y="632" width="240" height="130" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="1220" y="662" text-anchor="middle" fill="#5B8DEF" font-size="13" font-weight="800">🇨🇳 米中比較</text>
  <text x="1220" y="690" text-anchor="middle" fill="#1A1D24" font-size="22" font-weight="900">論文・特許はCN</text>
  <text x="1220" y="714" text-anchor="middle" fill="#555" font-size="12">モデル開発はUS優位</text>
  <text x="1220" y="736" text-anchor="middle" fill="#555" font-size="12">ロボットはCNリード</text>
  <text x="1220" y="754" text-anchor="middle" fill="#888" font-size="11">非対称な競争構造</text>

  <!-- Sticky notes -->
  <rect x="80" y="785" width="260" height="115" rx="4" fill="#FFF9C4" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(-1.3, 80, 785)"/>
  <text x="95" y="815" fill="#1A1D24" font-size="13" font-weight="700">🧩 ギザギザ前線とは</text>
  <text x="95" y="837" fill="#333" font-size="12">IMO金 vs 時計50%は</text>
  <text x="95" y="855" fill="#333" font-size="12">「モデルの知能は人間と</text>
  <text x="95" y="873" fill="#333" font-size="12">構造的に異なる」証拠。</text>
  <text x="95" y="893" fill="#666" font-size="11">Stanford HAI 2026</text>

  <rect x="370" y="790" width="260" height="115" rx="4" fill="#C8F7C5" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(0.8, 370, 790)"/>
  <text x="385" y="820" fill="#1A1D24" font-size="13" font-weight="700">⚠️ 規制の盲点</text>
  <text x="385" y="842" fill="#333" font-size="12">EU AI Act施行直前に</text>
  <text x="385" y="860" fill="#333" font-size="12">開示スコアが低下。</text>
  <text x="385" y="878" fill="#333" font-size="12">法規制が機能するには</text>
  <text x="385" y="896" fill="#333" font-size="12">開示前提が崩れている。</text>

  <rect x="660" y="783" width="260" height="115" rx="4" fill="#FFD9B3" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(-0.7, 660, 783)"/>
  <text x="675" y="813" fill="#1A1D24" font-size="13" font-weight="700">🌊 水・電力問題</text>
  <text x="675" y="835" fill="#333" font-size="12">GPT-4o年間水使用量が</text>
  <text x="675" y="853" fill="#333" font-size="12">120万人分の飲料水超。</text>
  <text x="675" y="871" fill="#333" font-size="12">環境規制の次の焦点に</text>
  <text x="675" y="889" fill="#333" font-size="12">なる可能性が高い。</text>

  <rect x="950" y="788" width="260" height="115" rx="4" fill="#E8D5F5" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(1.2, 950, 788)"/>
  <text x="965" y="818" fill="#1A1D24" font-size="13" font-weight="700">💼 88% vs 33%のギャップ</text>
  <text x="965" y="840" fill="#333" font-size="12">採用率88%に対し</text>
  <text x="965" y="858" fill="#333" font-size="12">ROI達成率は33%のみ。</text>
  <text x="965" y="876" fill="#333" font-size="12">問題は技術ではなく</text>
  <text x="965" y="894" fill="#333" font-size="12">組織・データ・人材。</text>

  <!-- Footer -->
  <text x="700" y="1032" text-anchor="middle" fill="#999" font-size="13" font-style="italic">AI News · 2026-05-01 · Stanford AI Index 2026: Jagged Frontier, SWE-bench ~100%, Transparency Drops 58→40</text>
</svg>
