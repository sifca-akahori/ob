  <text x="80" y="158" fill="#1A1D24" font-size="24" font-weight="700">「ギザギザのフロンティア」——IMO金メダルと時計読み取り50.1%が同一モデルの謎</text>
  <line x1="80" y1="172" x2="1340" y2="172" stroke="#1A1D24" stroke-width="3"/>
  <text x="80" y="193" fill="#666" font-size="13">Stanford HAI  ·  2026-04-21  ·  #Stanford #AIIndex #透明性 #スケーリング</text>
  <!-- Hero -->
