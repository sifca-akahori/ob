  <text x="855" y="758" text-anchor="middle" fill="#888" font-size="11">post-money evaluation</text>

  <rect x="1025" y="638" width="295" height="130" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
