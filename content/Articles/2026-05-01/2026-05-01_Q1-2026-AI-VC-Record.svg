  <text x="80" y="158" fill="#1A1D24" font-size="24" font-weight="700">史上最大VC案件ランキング Top5 のうち4本をQ1が独占、基盤AI投資が前年2倍</text>
  <line x1="80" y1="172" x2="1340" y2="172" stroke="#1A1D24" stroke-width="3"/>
