  <text x="1172" y="694" text-anchor="middle" fill="#1A1D24" font-size="20" font-weight="900">+467%</text>
  <text x="1172" y="718" text-anchor="middle" fill="#555" font-size="12">2024年全年 $31.4B との比較</text>
  <text x="1172" y="738" text-anchor="middle" fill="#555" font-size="12">2年で15倍超の膨張</text>
  <text x="1172" y="758" text-anchor="middle" fill="#888" font-size="11">vs 2024 total</text>

