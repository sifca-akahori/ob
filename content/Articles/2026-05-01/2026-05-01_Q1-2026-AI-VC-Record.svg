  <text x="95" y="842" fill="#333" font-size="12">24件に$178Bが集中。</text>
  <text x="95" y="860" fill="#333" font-size="12">フロンティア4社以外への</text>
  <text x="95" y="878" fill="#333" font-size="12">投資は枯渇しつつある。</text>
  <text x="95" y="900" fill="#666" font-size="11">HN 340+ コメント</text>

  <rect x="370" y="795" width="260" height="120" rx="4" fill="#C8F7C5" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(1.0, 370, 795)"/>
  <text x="385" y="825" fill="#1A1D24" font-size="13" font-weight="700">💡 SoftBank の性質</text>
  <text x="385" y="847" fill="#333" font-size="12">$122Bの大半はStargate</text>
  <text x="385" y="865" fill="#333" font-size="12">経由のコンピュートクレジット</text>
  <text x="385" y="883" fill="#333" font-size="12">実質エクイティは別。</text>
  <text x="385" y="905" fill="#666" font-size="11">要精査</text>

  <rect x="660" y="788" width="260" height="120" rx="4" fill="#FFD9B3" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(-0.8, 660, 788)"/>
  <text x="675" y="818" fill="#1A1D24" font-size="13" font-weight="700">⚠️ 収益化の問い</text>
  <text x="675" y="840" fill="#333" font-size="12">Azure AI $37B ARRは証明済。</text>
  <text x="675" y="858" fill="#333" font-size="12">スタートアップ段階では</text>
  <text x="675" y="876" fill="#333" font-size="12">投資額と収益のギャップが</text>
  <text x="675" y="894" fill="#333" font-size="12">2026年末に可視化される。</text>

  <rect x="950" y="793" width="260" height="120" rx="4" fill="#E8D5F5" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(1.5, 950, 793)"/>
  <text x="965" y="823" fill="#1A1D24" font-size="13" font-weight="700">🔮 次の1年</text>
  <text x="965" y="845" fill="#333" font-size="12">2027年に「$100B超調達企業」</text>
  <text x="965" y="863" fill="#333" font-size="12">の年次収益が公開され、</text>
  <text x="965" y="881" fill="#333" font-size="12">投資規模vs実収益の</text>
  <text x="965" y="899" fill="#333" font-size="12">ギャップが試される。</text>

  <!-- Footer -->
  <text x="700" y="1032" text-anchor="middle" fill="#999" font-size="13" font-style="italic">AI News · 2026-05-01 · Q1 2026 AI VC Record Breaking: $242B, 80% of Global Venture Funding</text>
</svg>
