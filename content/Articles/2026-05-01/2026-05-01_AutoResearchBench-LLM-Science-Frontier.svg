  <text x="222" y="730" text-anchor="middle" fill="#888" font-size="11">RAGの根本的限界</text>

  <rect x="385" y="605" width="285" height="135" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
