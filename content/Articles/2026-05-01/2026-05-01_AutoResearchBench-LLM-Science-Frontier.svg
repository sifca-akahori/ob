  <text x="200" y="549" text-anchor="middle" fill="#1A1D24" font-size="13">AutoResearchBench（文献探索）</text>
  <rect x="420" y="536" width="52" height="22" rx="3" fill="#E05050" stroke="#1A1D24" stroke-width="1.5"/>
