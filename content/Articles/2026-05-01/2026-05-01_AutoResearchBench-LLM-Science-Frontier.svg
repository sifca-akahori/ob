  <line x1="110" y1="445" x2="1330" y2="445" stroke="#1A1D24" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Bars -->
  <text x="200" y="475" text-anchor="middle" fill="#555" font-size="13">タスク</text>
  <text x="700" y="475" text-anchor="middle" fill="#555" font-size="13">AIスコア</text>
  <text x="1100" y="475" text-anchor="middle" fill="#555" font-size="13">人間スコア</text>
  <!-- SWE-bench row -->
  <text x="200" y="510" text-anchor="middle" fill="#1A1D24" font-size="13">SWE-bench（コーディング）</text>
  <rect x="420" y="497" width="556" height="22" rx="3" fill="#5CA46E" stroke="#1A1D24" stroke-width="1.5"/>
