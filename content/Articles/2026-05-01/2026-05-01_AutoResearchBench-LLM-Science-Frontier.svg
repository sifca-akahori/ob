  <text x="1165" y="553" text-anchor="middle" fill="#555" font-size="12">~65〜70%（専門家）</text>
  <!-- GPQA row -->
  <text x="200" y="588" text-anchor="middle" fill="#1A1D24" font-size="13">GPQA（PhD水準科学問題）</text>
  <rect x="420" y="575" width="389" height="22" rx="3" fill="#5B8DEF" stroke="#1A1D24" stroke-width="1.5"/>
  <text x="615" y="592" text-anchor="middle" fill="#FBF8F1" font-size="12" font-weight="700">~70%</text>
  <rect x="980" y="575" width="270" height="22" rx="3" fill="#CCC" stroke="#1A1D24" stroke-width="1.5"/>
  <text x="1115" y="592" text-anchor="middle" fill="#555" font-size="12">~60〜65%（博士）</text>

  <!-- 4 cards -->
  <rect x="80" y="605" width="285" height="135" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="222" y="635" text-anchor="middle" fill="#8B7DB8" font-size="13" font-weight="800">🔍 9.39%の意味</text>
