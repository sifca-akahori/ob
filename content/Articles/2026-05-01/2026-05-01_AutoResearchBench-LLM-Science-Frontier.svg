  <text x="390" y="342" text-anchor="middle" fill="#888" font-size="13">既知問題の実装・修正</text>
  <text x="390" y="362" text-anchor="middle" fill="#8B7DB8" font-size="13" font-weight="700">正解が明確 → RL学習が効く</text>

  <rect x="730" y="215" width="620" height="170" rx="10" fill="#FFF0F0" stroke="#E05050" stroke-width="3" filter="url(#softShadow)"/>
  <text x="1040" y="248" text-anchor="middle" fill="#E05050" font-size="16" font-weight="800">🧱 AIが苦手なこと</text>
  <text x="1040" y="280" text-anchor="middle" fill="#E05050" font-size="62" font-weight="900">9.39%</text>
  <text x="1040" y="318" text-anchor="middle" fill="#555" font-size="15">AutoResearchBench（科学文献探索）</text>
  <text x="1040" y="342" text-anchor="middle" fill="#888" font-size="13">未知文献空間の自律的発見</text>
  <text x="1040" y="362" text-anchor="middle" fill="#E05050" font-size="13" font-weight="700">正解が主観的 → RL学習が効かない</text>

