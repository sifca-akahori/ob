  <text x="527" y="657" text-anchor="middle" fill="#1A1D24" font-size="13">「調査した」≠「最良発見」</text>
  <text x="527" y="679" text-anchor="middle" fill="#555" font-size="12">Perplexity/OpenAI Deep Research</text>
  <text x="527" y="699" text-anchor="middle" fill="#555" font-size="12">の実際の文献網羅性に疑問</text>
  <text x="527" y="730" text-anchor="middle" fill="#888" font-size="11">R&amp;D用途での信頼性再評価</text>

  <rect x="690" y="605" width="285" height="135" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="832" y="635" text-anchor="middle" fill="#5CA46E" font-size="13" font-weight="800">🛡️ データ汚染対策</text>
  <text x="832" y="657" text-anchor="middle" fill="#1A1D24" font-size="14">300万篇がリアルタイム更新</text>
  <text x="832" y="679" text-anchor="middle" fill="#555" font-size="12">「記憶済みの問題」リスク回避</text>
  <text x="832" y="699" text-anchor="middle" fill="#555" font-size="12">従来ベンチマークの弱点を解消</text>
  <text x="832" y="730" text-anchor="middle" fill="#888" font-size="11">arXiv毎日更新で常に新鮮</text>

  <rect x="995" y="605" width="285" height="135" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="1137" y="635" text-anchor="middle" fill="#E8A87C" font-size="13" font-weight="800">📋 なぜ差が生じるか</text>
  <text x="1137" y="657" text-anchor="middle" fill="#1A1D24" font-size="13">訓練データの正解性</text>
  <text x="1137" y="679" text-anchor="middle" fill="#555" font-size="12">コード: テスト通過が正解</text>
  <text x="1137" y="699" text-anchor="middle" fill="#555" font-size="12">文献: 専門家の主観が正解</text>
  <text x="1137" y="730" text-anchor="middle" fill="#888" font-size="11">RL学習の構造的限界</text>

  <!-- Sticky notes -->
  <rect x="80" y="762" width="265" height="118" rx="4" fill="#FFF9C4" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(-1.0, 80, 762)"/>
  <text x="95" y="792" fill="#1A1D24" font-size="13" font-weight="700">📌 研究者 vs AI</text>
  <text x="95" y="814" fill="#333" font-size="12">専門研究者は65〜70%の</text>
  <text x="95" y="832" fill="#333" font-size="12">正解率。AIの7倍以上。</text>
  <text x="95" y="850" fill="#333" font-size="12">「文献探索」領域では</text>
  <text x="95" y="868" fill="#333" font-size="12">人間がまだ圧勝。</text>

  <rect x="370" y="767" width="265" height="118" rx="4" fill="#C8F7C5" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(0.9, 370, 767)"/>
  <text x="385" y="797" fill="#1A1D24" font-size="13" font-weight="700">💡 Novo Nordisk提携との接点</text>
  <text x="385" y="819" fill="#333" font-size="12">製薬AIが創薬文献探索で</text>
  <text x="385" y="837" fill="#333" font-size="12">9.39%しか正解できないなら、</text>
  <text x="385" y="855" fill="#333" font-size="12">「AI創薬」のROIに</text>
  <text x="385" y="873" fill="#333" font-size="12">重大な疑問符がつく。</text>

  <rect x="655" y="760" width="265" height="118" rx="4" fill="#FFD9B3" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(-0.8, 655, 760)"/>
  <text x="670" y="790" fill="#1A1D24" font-size="13" font-weight="700">⚠️ 300万篇環境の価値</text>
  <text x="670" y="812" fill="#333" font-size="12">リアルタイム更新で</text>
  <text x="670" y="830" fill="#333" font-size="12">データ汚染を防ぐ設計。</text>
  <text x="670" y="848" fill="#333" font-size="12">今後のLLM評価設計の</text>
  <text x="670" y="866" fill="#333" font-size="12">新しい標準になりうる。</text>

  <rect x="940" y="765" width="265" height="118" rx="4" fill="#E8D5F5" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(1.1, 940, 765)"/>
  <text x="955" y="795" fill="#1A1D24" font-size="13" font-weight="700">🔮 解決の方向</text>
  <text x="955" y="817" fill="#333" font-size="12">「概念グラフ検索」</text>
  <text x="955" y="835" fill="#333" font-size="12">「自己反映型エージェント」</text>
  <text x="955" y="853" fill="#333" font-size="12">など新アーキが</text>
  <text x="955" y="871" fill="#333" font-size="12">9.39%超えの鍵になる。</text>

  <text x="700" y="1032" text-anchor="middle" fill="#999" font-size="13" font-style="italic">AI News · 2026-05-01 · AutoResearchBench: Frontier LLMs Achieve Only 9.39% on Autonomous Scientific Literature Discovery</text>
</svg>
