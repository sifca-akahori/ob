  <rect x="1185" y="-10" width="145" height="46" rx="4" fill="#8B7DB8" stroke="#1A1D24" stroke-width="2" transform="rotate(-3, 1185, -10)" filter="url(#stickyShadow)"/>
  <text x="1256" y="22" text-anchor="middle" fill="#FBF8F1" font-size="15" font-weight="700" transform="rotate(-3, 1256, 22)">#論文</text>
  <rect x="80" y="30" width="200" height="42" rx="6" fill="#2F3842" stroke="#1A1D24" stroke-width="2"/>
  <text x="180" y="57" text-anchor="middle" fill="#FBF8F1" font-size="16" font-weight="700">2026-05-01</text>
  <text x="1340" y="92" text-anchor="middle" font-size="26">⭐⭐</text>
  <text x="80" y="118" fill="#1A1D24" font-size="36" font-weight="900">🔬 AutoResearchBench：LLMの自律科学文献発見は9.39%の壁</text>
  <text x="80" y="158" fill="#1A1D24" font-size="24" font-weight="700">300万篇arXiv環境で、コーディング~100%のAIが科学探索では9.39%止まりの理由</text>
  <line x1="80" y1="172" x2="1340" y2="172" stroke="#1A1D24" stroke-width="3"/>
  <text x="80" y="193" fill="#666" font-size="13">arXiv 2604.25256  ·  2026-05-01  ·  #AutoResearchBench #評価 #科学探索 #RAG限界</text>
  <g transform="translate(1265, 258)">
    <circle cx="0" cy="0" r="68" fill="#F3EFFE" stroke="#1A1D24" stroke-width="3"/>
    <text x="0" y="18" text-anchor="middle" font-size="58">📚</text>
  </g>

  <!-- Key contrast -->
  <rect x="80" y="215" width="620" height="170" rx="10" fill="#F3EFFE" stroke="#1A1D24" stroke-width="3" filter="url(#softShadow)"/>
  <text x="390" y="248" text-anchor="middle" fill="#8B7DB8" font-size="16" font-weight="800">🏆 AIが得意なこと</text>
  <text x="390" y="280" text-anchor="middle" fill="#1A1D24" font-size="62" font-weight="900">~100%</text>
