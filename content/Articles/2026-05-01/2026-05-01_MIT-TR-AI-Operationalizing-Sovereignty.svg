  <text x="962" y="619" text-anchor="middle" fill="#E8A87C" font-size="13" font-weight="800">⚡ Federated Learning</text>
  <text x="962" y="641" text-anchor="middle" fill="#1A1D24" font-size="13">データ非共有で学習</text>
  <text x="962" y="663" text-anchor="middle" fill="#555" font-size="12">患者データ活用の鍵</text>
  <text x="962" y="683" text-anchor="middle" fill="#555" font-size="12">金融・医療・政府で注目</text>
  <text x="962" y="715" text-anchor="middle" fill="#888" font-size="11">真の主権AIへの道</text>

  <rect x="1100" y="590" width="240" height="135" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
