  <text x="390" y="859" fill="#333" font-size="12">新チャネルになる。</text>

  <rect x="660" y="746" width="265" height="118" rx="4" fill="#FFD9B3" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(-0.7, 660, 746)"/>
  <text x="675" y="776" fill="#1A1D24" font-size="13" font-weight="700">⚠️ ソブリン認定の疑問</text>
  <text x="675" y="798" fill="#333" font-size="12">「認定DC」でも実際に</text>
  <text x="675" y="816" fill="#333" font-size="12">国境を越えているか</text>
  <text x="675" y="834" fill="#333" font-size="12">監査が困難。規制当局の</text>
  <text x="675" y="852" fill="#333" font-size="12">監視強化が不可避。</text>

  <rect x="950" y="751" width="265" height="118" rx="4" fill="#E8D5F5" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(1.2, 950, 751)"/>
