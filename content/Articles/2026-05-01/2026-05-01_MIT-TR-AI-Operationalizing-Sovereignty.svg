  <rect x="375" y="753" width="265" height="118" rx="4" fill="#C8F7C5" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)" transform="rotate(0.8, 375, 753)"/>
  <text x="390" y="783" fill="#1A1D24" font-size="13" font-weight="700">🇯🇵 日本への示唆</text>
