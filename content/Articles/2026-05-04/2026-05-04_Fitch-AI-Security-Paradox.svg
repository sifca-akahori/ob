    <text x="143" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#8A3000">📌 AIコーディングの逆説</text>
    <text x="15" y="46" font-size="11" fill="#6A3000">Cursor/Claude Codeで開発速度</text>
    <text x="15" y="62" font-size="11" fill="#6A3000">+26%→本番デプロイ高速化→</text>
    <text x="15" y="78" font-size="11" fill="#6A3000">セキュリティレビュー省略。</text>
    <text x="15" y="94" font-size="11" fill="#6A3000">AIコードの安全通過率55%で</text>
    <text x="15" y="108" font-size="11" fill="#AA5010">2023年から改善なし</text>
  </g>

  <g transform="translate(692, 672) rotate(-0.5)" filter="url(#stickyShadow)">
