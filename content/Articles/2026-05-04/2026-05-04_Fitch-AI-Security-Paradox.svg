  <rect x="0" y="1010" width="1400" height="40" fill="#E8E0D0"/>
  <text x="700" y="1032" text-anchor="middle" font-size="13" fill="#7A7060" font-style="italic">AI News · 2026-05-04 · Fitch: AI Use in Cybersecurity Could Show Holes in Short Term — The Paradoxical Risk of AI-Powered Defense</text>
