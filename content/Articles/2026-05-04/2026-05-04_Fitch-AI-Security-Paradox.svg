    <text x="143" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#5A1A6A">📌 「技術的負債のAI版」</text>
    <text x="15" y="46" font-size="11" fill="#4A1A5A">Fitchが表現したのは「技術的</text>
    <text x="15" y="62" font-size="11" fill="#4A1A5A">負債のAI加速版」。スタートアップ・</text>
    <text x="15" y="78" font-size="11" fill="#4A1A5A">中小企業ほどAIコードの速度</text>
    <text x="15" y="94" font-size="11" fill="#4A1A5A">優先度が高く、セキュリティ</text>
    <text x="15" y="108" font-size="11" fill="#7A30A0">負債の蓄積リスクが最も高い</text>
