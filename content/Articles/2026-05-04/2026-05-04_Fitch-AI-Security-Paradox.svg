  <text x="310" y="512" text-anchor="middle" font-size="11" fill="#6A4010">Automation Bias——ヒューマンチェック減少</text>

  <text x="310" y="532" text-anchor="middle" font-size="20" fill="#C04020">↓</text>

  <rect x="110" y="538" width="400" height="54" rx="6" fill="#FFE8E0" stroke="#E06040" stroke-width="2"/>
  <text x="310" y="558" text-anchor="middle" font-size="13" font-weight="700" fill="#C03010">🚨 3つのリスクが同時発生</text>
  <text x="120" y="576" font-size="11" fill="#8A3010">① AI自体への攻撃（Prompt Injection等）</text>
  <text x="120" y="590" font-size="11" fill="#8A3010">② 開発速度↑→セキュリティレビュー省略</text>

  <text x="310" y="610" text-anchor="middle" font-size="20" fill="#C04020">↓</text>

  <rect x="110" y="616" width="400" height="34" rx="6" fill="#FFD0C0" stroke="#C04020" stroke-width="2"/>
  <text x="310" y="637" text-anchor="middle" font-size="13" font-weight="700" fill="#A02000">❌ 実際の脆弱性が増大</text>

