  <text x="670" y="588" font-size="11" fill="#6A4010">2025年AIガイドライン改訂が必要。「AI自体がリスク源」という視点の欠落。</text>

  <rect x="650" y="614" width="510" height="36" rx="6" fill="#FFE0B2" stroke="#E08040" stroke-width="1.5"/>
