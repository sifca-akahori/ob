    <text x="143" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1A5A30">📌 THN/[un]prompted同日</text>
    <text x="15" y="48" font-size="11" fill="#2A4A30">THN年次攻撃報告・[un]prompted</text>
    <text x="15" y="64" font-size="11" fill="#2A4A30">2026・Fitchレポートが同じ</text>
    <text x="15" y="80" font-size="11" fill="#2A4A30">5月4日に公表。「AI≠安全」が</text>
    <text x="15" y="96" font-size="11" fill="#2A4A30">業界コンセンサスとして固まり</text>
    <text x="15" y="108" font-size="11" fill="#3A7040">つつある歴史的1日</text>
