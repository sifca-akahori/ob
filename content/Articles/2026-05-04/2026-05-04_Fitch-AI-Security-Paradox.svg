  <text x="820" y="310" text-anchor="middle" font-size="24" font-weight="900" fill="#1A1D24">Fitch 同日</text>
  <text x="820" y="325" text-anchor="middle" font-size="12" fill="#7A8090">コンセンサス化の兆し</text>
