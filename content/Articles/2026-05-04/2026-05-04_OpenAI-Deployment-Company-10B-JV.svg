    <text x="150" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#1A5A30">📌 Anthropic JVとの差異</text>
    <text x="15" y="48" font-size="11" fill="#2A4A30">Anthropic「質・深い実装」vs</text>
