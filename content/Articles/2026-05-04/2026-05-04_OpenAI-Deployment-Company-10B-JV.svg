    <text x="150" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#8A3000">📌 IPO前の収益固め</text>
    <text x="15" y="48" font-size="11" fill="#6A3000">OpenAI IPO（$2,000億超）前に</text>
    <text x="15" y="64" font-size="11" fill="#6A3000">「構造的収益」を確保。Bloomberg</text>
