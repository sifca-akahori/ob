<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#FBF8F1"/>
      <circle cx="20" cy="18" r="0.4" fill="#C4B389" opacity="0.3"/>
      <circle cx="72" cy="62" r="0.5" fill="#C4B389" opacity="0.3"/>
      <circle cx="38" cy="85" r="0.3" fill="#C4B389" opacity="0.3"/>
    </pattern>
    <filter id="stickyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <line x1="110" y1="30" x2="110" y2="1020" stroke="#D88A8A" stroke-width="1.2" opacity="0.4"/>
  <g fill="#E8E2D3" opacity="0.7"><circle cx="50" cy="100" r="11"/><circle cx="50" cy="300" r="11"/><circle cx="50" cy="500" r="11"/><circle cx="50" cy="700" r="11"/><circle cx="50" cy="900" r="11"/><circle cx="50" cy="980" r="11"/></g>
  <g fill="none" stroke="#C8C0B0" stroke-width="1.5"><circle cx="50" cy="100" r="11"/><circle cx="50" cy="300" r="11"/><circle cx="50" cy="500" r="11"/><circle cx="50" cy="700" r="11"/><circle cx="50" cy="900" r="11"/><circle cx="50" cy="980" r="11"/></g>

  <g transform="translate(1210, 26) rotate(-3)">
    <rect x="0" y="0" width="155" height="36" rx="4" fill="#5B8DEF" opacity="0.9"/>
    <text x="78" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="white">#研究</text>
  </g>

  <rect x="125" y="28" width="185" height="36" rx="6" fill="#2F3842"/>
  <text x="218" y="51" text-anchor="middle" font-size="15" font-weight="700" fill="white">2026-04-29</text>
  <text x="328" y="53" font-size="20" fill="#F5A623">⭐⭐</text>

  <text x="130" y="105" font-size="33" font-weight="900" fill="#1A1D24">🌍 ワールドモデル元年——NatureとLeCun・Fei-Fei Liが「LLM超え」を説く</text>
  <text x="130" y="143" font-size="20" font-weight="600" fill="#444">——Genie 3・GR00T・Aceが示す物理世界理解AIの台頭</text>
  <text x="130" y="175" font-size="13" fill="#888">Nature / MIT Technology Review  ·  2026-04-29  ·  #研究 #ワールドモデル #LeCun #FeiFeili</text>
  <line x1="130" y1="190" x2="1340" y2="190" stroke="#1A1D24" stroke-width="2"/>

  <!-- Hero -->
  <g transform="translate(130, 208)">
    <rect x="0" y="0" width="195" height="165" rx="12" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="97" y="62" text-anchor="middle" font-size="46">🌍</text>
    <text x="97" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#5B8DEF">World Models</text>
    <text x="97" y="106" text-anchor="middle" font-size="11" fill="#555">Nature Commentary</text>
    <text x="97" y="124" text-anchor="middle" font-size="11" fill="#555">LeCun × Fei-Fei Li</text>
    <text x="97" y="148" text-anchor="middle" font-size="11" fill="#888">"AI's latest sensation"</text>
  </g>

  <!-- Key claims -->
  <g transform="translate(345, 208)" filter="url(#softShadow)">
    <rect x="0" y="0" width="995" height="165" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <rect x="0" y="0" width="995" height="42" rx="8" fill="#2F3842"/>
    <rect x="0" y="34" width="995" height="8" fill="#2F3842"/>
    <text x="498" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="white">🗣️ 主要論者の主張</text>

    <rect x="15" y="52" width="300" height="104" rx="6" fill="#E3F2FD" stroke="#5B8DEF" stroke-width="1.5"/>
    <text x="165" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#5B8DEF">Yann LeCun（Meta AI）</text>
    <text x="25" y="92" font-size="11" fill="#1A1D24">「LLMはAGIへの道ではない。</text>
    <text x="25" y="108" font-size="11" fill="#1A1D24">物理世界を因果的に理解できない。</text>
    <text x="25" y="124" font-size="11" fill="#1A1D24">JEPA（予測アーキテクチャ）が</text>
    <text x="25" y="140" font-size="11" fill="#1A1D24">次世代の基盤になる」</text>
    <text x="165" y="152" text-anchor="middle" font-size="10" fill="#888">Meta AI Chief Scientist</text>

    <rect x="335" y="52" width="300" height="104" rx="6" fill="#E8F5E9" stroke="#5CA46E" stroke-width="1.5"/>
    <text x="485" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#5CA46E">Fei-Fei Li（AMI Labs）</text>
    <text x="345" y="92" font-size="11" fill="#1A1D24">「LLMはパターンマッチングの達人。</text>
    <text x="345" y="108" font-size="11" fill="#1A1D24">空間インテリジェンス（物理理解）が</text>
    <text x="345" y="124" font-size="11" fill="#1A1D24">欠けている。産業AIの</text>
    <text x="345" y="140" font-size="11" fill="#1A1D24">核心はここになる」</text>
    <text x="485" y="152" text-anchor="middle" font-size="10" fill="#888">Stanford Prof / AMI Labs創業者</text>

    <rect x="655" y="52" width="328" height="104" rx="6" fill="#FFF3E0" stroke="#E8A87C" stroke-width="1.5"/>
    <text x="820" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#E8A87C">Nature 論評の結論</text>
    <text x="665" y="92" font-size="11" fill="#1A1D24">「物理環境の内部モデルを持つAIが</text>
    <text x="665" y="108" font-size="11" fill="#1A1D24">2026年の主役として急浮上。</text>
    <text x="665" y="124" font-size="11" fill="#1A1D24">LLMとワールドモデルは</text>
    <text x="665" y="140" font-size="11" fill="#1A1D24">対立でなく補完の関係」</text>
    <text x="820" y="152" text-anchor="middle" font-size="10" fill="#888">d41586-026-00820-5</text>
  </g>

  <!-- 2026 World Model implementations -->
  <g transform="translate(130, 395)">
    <rect x="0" y="0" width="580" height="265" rx="8" fill="white" stroke="#1A1D24" stroke-width="2"/>
    <text x="290" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">🛠️ 2026年登場のワールドモデル実装</text>

    <rect x="20" y="40" width="250" height="100" rx="6" fill="#E3F2FD" stroke="#5B8DEF" stroke-width="2"/>
    <text x="145" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#5B8DEF">Google Genie 3</text>
    <text x="30" y="78" font-size="11" fill="#1A1D24">テキスト・画像→物理世界を生成</text>
    <text x="30" y="94" font-size="11" fill="#555">リアルタイム・インタラクティブ</text>
    <text x="30" y="110" font-size="11" fill="#555">歩行・飛行・運転を数秒で体験可能</text>
    <text x="145" y="130" text-anchor="middle" font-size="10" fill="#888">2026年1月公開 / Ultra向け</text>

    <rect x="310" y="40" width="250" height="100" rx="6" fill="#F3E5F5" stroke="#8B7DB8" stroke-width="2"/>
    <text x="435" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#8B7DB8">NVIDIA Cosmos</text>
    <text x="320" y="78" font-size="11" fill="#1A1D24">物理シミュレーション特化基盤モデル</text>
    <text x="320" y="94" font-size="11" fill="#555">Cosmos-Reason2-2B で</text>
    <text x="320" y="110" font-size="11" fill="#555">リアル物理を内部推論</text>
    <text x="435" y="130" text-anchor="middle" font-size="10" fill="#888">GR00T N1.7のバックボーン</text>

    <rect x="20" y="155" width="250" height="100" rx="6" fill="#E8F5E9" stroke="#5CA46E" stroke-width="2"/>
    <text x="145" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#5CA46E">Sony Ace</text>
    <text x="30" y="193" font-size="11" fill="#1A1D24">卓球ボールの軌道予測</text>
    <text x="30" y="209" font-size="11" fill="#555">= 短期ワールドモデル機能</text>
    <text x="30" y="225" font-size="11" fill="#555">物理AIの実世界実証</text>
    <text x="145" y="244" text-anchor="middle" font-size="10" fill="#888">Nature Cover 2026-04-23</text>

    <rect x="310" y="155" width="250" height="100" rx="6" fill="#FFEBEE" stroke="#E05555" stroke-width="2"/>
    <text x="435" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#E05555">Claude Mythos</text>
    <text x="320" y="193" font-size="11" fill="#1A1D24">OSWorld 79.6% 首位</text>
    <text x="320" y="209" font-size="11" fill="#555">コンピュータ操作＝</text>
    <text x="320" y="225" font-size="11" fill="#555">デジタル世界の内部モデル</text>
    <text x="435" y="244" text-anchor="middle" font-size="10" fill="#888">Project Glasswing 限定公開</text>
  </g>

  <!-- LLM vs World Model comparison -->
  <g transform="translate(730, 395)">
    <rect x="0" y="0" width="610" height="265" rx="8" fill="white" stroke="#1A1D24" stroke-width="2"/>
    <text x="305" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">⚔️ LLM vs ワールドモデル：対立か補完か</text>

    <!-- LLM strengths -->
    <rect x="20" y="40" width="275" height="110" rx="6" fill="#FFF9C4" stroke="#E8D84A" stroke-width="2"/>
    <text x="158" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">LLMの強み</text>
    <text x="30" y="78" font-size="11" fill="#1A1D24">✓ 言語理解・生成</text>
    <text x="30" y="94" font-size="11" fill="#1A1D24">✓ 抽象的推論・計画</text>
    <text x="30" y="110" font-size="11" fill="#1A1D24">✓ 膨大な知識の記憶</text>
    <text x="30" y="126" font-size="11" fill="#E05555">✗ 物理世界への因果介入は苦手</text>
    <text x="158" y="143" text-anchor="middle" font-size="10" fill="#888">GPT-5.5・Claude Opus 4.7等</text>

    <!-- World Model strengths -->
    <rect x="315" y="40" width="275" height="110" rx="6" fill="#E3F2FD" stroke="#5B8DEF" stroke-width="2"/>
    <text x="452" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">ワールドモデルの強み</text>
    <text x="325" y="78" font-size="11" fill="#1A1D24">✓ 物理インターフェース</text>
    <text x="325" y="94" font-size="11" fill="#1A1D24">✓ 因果的介入・操作</text>
    <text x="325" y="110" font-size="11" fill="#1A1D24">✓ リアルタイム適応</text>
    <text x="325" y="126" font-size="11" fill="#E05555">✗ 言語・抽象知識は弱い</text>
    <text x="452" y="143" text-anchor="middle" font-size="10" fill="#888">Genie3・GR00T・Cosmos等</text>

    <!-- Hybrid architecture -->
    <rect x="20" y="165" width="570" height="88" rx="6" fill="#F3E5F5" stroke="#8B7DB8" stroke-width="2"/>
    <text x="305" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#8B7DB8">→ ハイブリッドが現実解</text>
    <text x="30" y="206" font-size="11" fill="#1A1D24">LLMが言語・推論・計画 ＋ ワールドモデルが物理インターフェースの分業</text>
    <text x="30" y="222" font-size="11" fill="#555">Genie 3 = Gemini（言語理解）+ ワールドモデル（物理生成）の組み合わせが典型</text>
    <text x="30" y="240" font-size="10" fill="#888">「LLM vs World Models」は偽の二分法——補完と統合が2026〜2027年の主流アーキテクチャ</text>
  </g>

  <!-- Sticky notes -->
  <g transform="translate(130, 680)" filter="url(#stickyShadow)">
    <g transform="rotate(-1.3)">
      <rect x="0" y="0" width="280" height="95" rx="4" fill="#FFF9C4" stroke="#E8D84A" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">💡 LLMが「正しい」証明</text>
      <text x="14" y="42" font-size="11" fill="#333">実は "Transformers are Inherently</text>
      <text x="14" y="58" font-size="11" fill="#333">Succinct"（ICLR Outstanding Paper）が</text>
      <text x="14" y="74" font-size="11" fill="#333">Transformerの優位を情報理論的に証明。</text>
      <text x="14" y="89" font-size="10" fill="#888">LLM廃止ではなく補完が現実路線。</text>
    </g>
    <g transform="translate(300, 5) rotate(1.0)">
      <rect x="0" y="0" width="280" height="95" rx="4" fill="#C8E6C9" stroke="#81C784" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">🏭 産業化の動き</text>
      <text x="14" y="42" font-size="11" fill="#333">Fei-Fei LiのAMI Labsが空間知能を</text>
      <text x="14" y="58" font-size="11" fill="#333">製造業・倉庫・外科向けAPIに。</text>
      <text x="14" y="74" font-size="11" fill="#333">学術から産業への橋渡しが加速。</text>
      <text x="14" y="89" font-size="10" fill="#888">「Spatial Intelligence」市場が誕生。</text>
    </g>
    <g transform="translate(600, -2) rotate(0.8)">
      <rect x="0" y="0" width="280" height="95" rx="4" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">📊 ベンチマーク転換の予兆</text>
      <text x="14" y="42" font-size="11" fill="#333">MMLU・SWE-bench は言語/コード中心。</text>
      <text x="14" y="58" font-size="11" fill="#333">ARC-Physical・PhysicsIQ等の</text>
      <text x="14" y="74" font-size="11" fill="#333">物理評価指標が台頭する見込み。</text>
      <text x="14" y="89" font-size="10" fill="#888">ランキングがリセットされる可能性。</text>
    </g>
    <g transform="translate(900, 3) rotate(-1.2)">
      <rect x="0" y="0" width="280" height="95" rx="4" fill="#FFE0B2" stroke="#FFB74D" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">🔮 NVIDIAの戦略的位置</text>
      <text x="14" y="42" font-size="11" fill="#333">Cosmos・Omniverse・Jetsonで</text>
      <text x="14" y="58" font-size="11" fill="#333">ワールドモデル学習〜デプロイを独占。</text>
      <text x="14" y="74" font-size="11" fill="#333">物理AIのインフラ覇権を狙う。</text>
      <text x="14" y="89" font-size="10" fill="#888">LLMのOpenAIに対しPhysicalAIのNVIDIA。</text>
    </g>
  </g>

  <line x1="130" y1="1018" x2="1340" y2="1018" stroke="#1A1D24" stroke-width="1"/>
  <text x="735" y="1036" text-anchor="middle" font-size="12" fill="#888" font-style="italic">AI News · 2026-04-29 · World Models: Nature Commentary — LeCun &amp; Fei-Fei Li Call for Physics-Aware AI Beyond LLMs</text>
</svg>
