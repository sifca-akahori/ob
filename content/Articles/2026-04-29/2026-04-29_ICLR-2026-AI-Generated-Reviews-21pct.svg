    <rect x="0" y="0" width="995" height="160" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <rect x="0" y="0" width="995" height="42" rx="8" fill="#2F3842"/>
    <rect x="0" y="34" width="995" height="8" fill="#2F3842"/>
    <text x="498" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="white">📊 Pangram Labs 分析：主要数値</text>
    <!-- 21% AI generated -->
    <text x="110" y="84" text-anchor="middle" font-size="42" font-weight="900" fill="#E05555">21%</text>
    <text x="110" y="104" text-anchor="middle" font-size="12" fill="#555">査読が完全AI生成</text>
    <text x="110" y="122" text-anchor="middle" font-size="11" fill="#888">= 約15,900件（70,000件中）</text>
    <line x1="230" y1="52" x2="230" y2="152" stroke="#E8E2D3" stroke-width="1.5"/>
    <!-- 50%+ AI involvement -->
    <text x="360" y="84" text-anchor="middle" font-size="42" font-weight="900" fill="#E8A87C">50%+</text>
    <text x="360" y="104" text-anchor="middle" font-size="12" fill="#555">にAI介入（補助・編集含む）</text>
    <text x="360" y="122" text-anchor="middle" font-size="11" fill="#888">完全AI生成21%を超える問題の広がり</text>
    <line x1="480" y1="52" x2="480" y2="152" stroke="#E8E2D3" stroke-width="1.5"/>
    <!-- Submissions growth -->
    <text x="600" y="78" text-anchor="middle" font-size="28" font-weight="900" fill="#5B8DEF">19,814</text>
    <text x="600" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#5B8DEF">+70% YoY</text>
    <text x="600" y="114" text-anchor="middle" font-size="12" fill="#555">2026年提出論文数</text>
    <text x="600" y="130" text-anchor="middle" font-size="11" fill="#888">2024年7,304件から2.7倍</text>
    <line x1="720" y1="52" x2="720" y2="152" stroke="#E8E2D3" stroke-width="1.5"/>
    <!-- Hallucinated citations -->
    <text x="857" y="84" text-anchor="middle" font-size="42" font-weight="900" fill="#8B7DB8">50+</text>
    <text x="857" y="104" text-anchor="middle" font-size="12" fill="#555">採択論文に幻覚引用</text>
    <text x="857" y="122" text-anchor="middle" font-size="11" fill="#888">存在しない論文への参照が見過ごされた</text>
    <text x="498" y="152" text-anchor="middle" font-size="10" fill="#999">出典: Pangram Labs ICLR 2026 Analysis (2026-04-29)</text>
  </g>

  <!-- Submissions growth chart -->
  <g transform="translate(130, 390)">
    <rect x="0" y="0" width="565" height="250" rx="8" fill="white" stroke="#1A1D24" stroke-width="2"/>
    <text x="283" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">📈 ICLR 提出論文数の爆発的増加</text>
    <line x1="50" y1="220" x2="545" y2="220" stroke="#1A1D24" stroke-width="1.5"/>
    <line x1="50" y1="45" x2="50" y2="220" stroke="#1A1D24" stroke-width="1.5"/>

    <!-- 2024 -->
    <rect x="70" y="185" width="80" height="35" fill="#C8E6C9" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="110" y="179" text-anchor="middle" font-size="11" font-weight="700" fill="#1A1D24">7,304</text>
    <text x="110" y="234" text-anchor="middle" font-size="11" fill="#555">2024</text>

    <!-- 2025 -->
    <rect x="230" y="140" width="80" height="80" fill="#A5D6A7" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="270" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#1A1D24">11,672</text>
    <text x="270" y="234" text-anchor="middle" font-size="11" fill="#555">2025</text>

    <!-- 2026 -->
    <rect x="390" y="55" width="80" height="165" fill="#E05555" stroke="#1A1D24" stroke-width="2.5" rx="3"/>
    <text x="430" y="49" text-anchor="middle" font-size="11" font-weight="700" fill="#1A1D24">19,814</text>
    <text x="430" y="234" text-anchor="middle" font-size="11" fill="#1A1D24" font-weight="700">2026</text>
    <rect x="382" y="62" width="95" height="22" rx="4" fill="#E05555"/>
    <text x="430" y="77" text-anchor="middle" font-size="11" font-weight="700" fill="white">+70% YoY</text>
    <rect x="382" y="88" width="95" height="22" rx="4" fill="#8B7DB8"/>
    <text x="430" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="white">2.7× since 2024</text>
  </g>

  <!-- Review composition donut chart alternative (bar) -->
  <g transform="translate(715, 390)">
    <rect x="0" y="0" width="625" height="250" rx="8" fill="white" stroke="#1A1D24" stroke-width="2"/>
    <text x="313" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">📊 70,000件のレビュー構成（Pangram Labs推定）</text>

    <!-- Stacked bar -->
    <rect x="100" y="55" width="430" height="60" rx="4" fill="#C8E6C9" stroke="#1A1D24" stroke-width="1.5"/>
    <rect x="100" y="55" width="143" height="60" rx="4" fill="#FFB3B3" stroke="#1A1D24" stroke-width="1.5"/>
    <rect x="243" y="55" width="147" height="60" fill="#FFE0B2" stroke="#1A1D24" stroke-width="0"/>
    <line x1="243" y1="55" x2="243" y2="115" stroke="#1A1D24" stroke-width="1.5"/>
    <line x1="390" y1="55" x2="390" y2="115" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="172" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="white">21% AI生成</text>
    <text x="317" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#555">30% AI補助</text>
    <text x="470" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">49% 人間</text>

    <!-- Red flags -->
    <text x="313" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#E05555">⚠️ AI査読の4つのレッドフラグ</text>

    <rect x="20" y="158" width="280" height="40" rx="4" fill="#FFEBEE" stroke="#E05555" stroke-width="1.5"/>
    <text x="160" y="175" text-anchor="middle" font-size="11" fill="#1A1D24">① 幻覚引用（存在しない論文への参照）</text>
    <text x="160" y="191" text-anchor="middle" font-size="10" fill="#888">example.comへの引用が採択を通過した例あり</text>

    <rect x="325" y="158" width="280" height="40" rx="4" fill="#FFF3E0" stroke="#E8A87C" stroke-width="1.5"/>
    <text x="465" y="175" text-anchor="middle" font-size="11" fill="#1A1D24">② 過度に長い箇条書き形式の査読</text>
    <text x="465" y="191" text-anchor="middle" font-size="10" fill="#888">人間らしい批判的洞察が欠けている</text>

    <rect x="20" y="205" width="280" height="40" rx="4" fill="#E3F2FD" stroke="#5B8DEF" stroke-width="1.5"/>
    <text x="160" y="222" text-anchor="middle" font-size="11" fill="#1A1D24">③ 論文の核心的貢献の誤解</text>
    <text x="160" y="238" text-anchor="middle" font-size="10" fill="#888">内容を読まず要約だけに反応した痕跡</text>

    <rect x="325" y="205" width="280" height="40" rx="4" fill="#F3E5F5" stroke="#8B7DB8" stroke-width="1.5"/>
    <text x="465" y="222" text-anchor="middle" font-size="11" fill="#1A1D24">④ 非標準的な分析要求</text>
    <text x="465" y="238" text-anchor="middle" font-size="10" fill="#888">AIの習慣的な出力パターンが露呈</text>
  </g>

  <!-- Sticky notes -->
  <g transform="translate(130, 660)" filter="url(#stickyShadow)">
    <g transform="rotate(-1.5)">
      <rect x="0" y="0" width="280" height="95" rx="4" fill="#FFF9C4" stroke="#E8D84A" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">📐 なぜ3年で2.7倍に？</text>
      <text x="14" y="42" font-size="11" fill="#333">LLMによって「論文を書くコスト」が</text>
      <text x="14" y="58" font-size="11" fill="#333">大幅低下。レビュアープールは</text>
      <text x="14" y="74" font-size="11" fill="#333">研究者数依存で増えない。</text>
      <text x="14" y="89" font-size="10" fill="#888">非対称な成長が査読崩壊を招く。</text>
    </g>
    <g transform="translate(300, 5) rotate(1.0)">
      <rect x="0" y="0" width="280" height="95" rx="4" fill="#C8E6C9" stroke="#81C784" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">🔍 対策候補</text>
      <text x="14" y="42" font-size="11" fill="#333">① 真正性宣言の義務化</text>
      <text x="14" y="58" font-size="11" fill="#333">② Pangram等のAI検出ツール導入</text>
      <text x="14" y="74" font-size="11" fill="#333">③ 提出数上限・ポスター枠拡大</text>
      <text x="14" y="89" font-size="10" fill="#888">根本解決はプレプリント文化への移行か？</text>
    </g>
    <g transform="translate(600, -3) rotate(0.8)">
      <rect x="0" y="0" width="280" height="95" rx="4" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">🎓 「ICLR採択歴」の価値変化</text>
      <text x="14" y="42" font-size="11" fill="#333">CV・採用評価の主要指標が揺らぐ。</text>
      <text x="14" y="58" font-size="11" fill="#333">「採択された＝専門家に評価された」</text>
      <text x="14" y="74" font-size="11" fill="#333">という等号が崩壊しつつある。</text>
      <text x="14" y="89" font-size="10" fill="#888">NeurIPS・ACLへの波及も懸念される。</text>
    </g>
    <g transform="translate(900, 2) rotate(-1.2)">
      <rect x="0" y="0" width="280" height="95" rx="4" fill="#FFE0B2" stroke="#FFB74D" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">🔄 逆張り：共進化説</text>
      <text x="14" y="42" font-size="11" fill="#333">「著者もAI、査読者もAIなら</text>
      <text x="14" y="58" font-size="11" fill="#333">一貫性は保たれる」という意見も。</text>
      <text x="14" y="74" font-size="11" fill="#333">人間査読の再現性も50〜60%と低い。</text>
      <text x="14" y="89" font-size="10" fill="#888">問題は品質保証メカニズムの欠如。</text>
    </g>
  </g>

  <line x1="130" y1="1018" x2="1340" y2="1018" stroke="#1A1D24" stroke-width="1"/>
  <text x="735" y="1036" text-anchor="middle" font-size="12" fill="#888" font-style="italic">AI News · 2026-04-29 · ICLR 2026: 21% of Peer Reviews AI-Generated — Pangram Labs Exposes Peer Review Crisis</text>
</svg>
