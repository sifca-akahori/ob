    <rect x="0" y="0" width="580" height="260" rx="8" fill="white" stroke="#1A1D24" stroke-width="2"/>
    <text x="290" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1D24">📈 売上高推移（2024 Q1 → 2026 Q1）</text>
    <line x1="60" y1="220" x2="560" y2="220" stroke="#1A1D24" stroke-width="1.5"/>
    <line x1="60" y1="50" x2="60" y2="220" stroke="#1A1D24" stroke-width="1.5"/>
    <!-- Bars -->
    <rect x="80" y="150" width="60" height="70" fill="#C8E6C9" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="110" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#1A1D24">$36.5B</text>
    <text x="110" y="236" text-anchor="middle" font-size="10" fill="#555">2024 Q1</text>

    <rect x="170" y="120" width="60" height="100" fill="#A5D6A7" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="200" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#1A1D24">$40.6B</text>
    <text x="200" y="236" text-anchor="middle" font-size="10" fill="#555">2024 Q2</text>

    <rect x="260" y="95" width="60" height="125" fill="#81C784" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="290" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#1A1D24">$40.6B</text>
    <text x="290" y="236" text-anchor="middle" font-size="10" fill="#555">2024 Q3</text>

    <rect x="350" y="75" width="60" height="145" fill="#66BB6A" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="380" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#1A1D24">$48.4B</text>
    <text x="380" y="236" text-anchor="middle" font-size="10" fill="#555">2024 Q4</text>

    <rect x="440" y="48" width="60" height="172" fill="#5CA46E" stroke="#1A1D24" stroke-width="2.5" rx="3"/>
    <text x="470" y="43" text-anchor="middle" font-size="12" font-weight="900" fill="#1A1D24">$56.3B</text>
    <text x="470" y="236" text-anchor="middle" font-size="10" fill="#1A1D24" font-weight="700">2026 Q1</text>
    <!-- +33% label -->
    <rect x="430" y="55" width="80" height="22" rx="4" fill="#5CA46E"/>
    <text x="470" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="white">+33% YoY</text>
  </g>

  <!-- Ads breakdown -->
  <g transform="translate(730, 390)">
    <rect x="0" y="0" width="610" height="260" rx="8" fill="white" stroke="#1A1D24" stroke-width="2"/>
    <text x="305" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1D24">🤖 AI広告エンジンの成果指標</text>
    <!-- Impressions -->
    <rect x="30" y="50" width="260" height="90" rx="6" fill="#E8F5E9" stroke="#5CA46E" stroke-width="2"/>
    <text x="160" y="78" text-anchor="middle" font-size="28" font-weight="900" fill="#5CA46E">+19%</text>
    <text x="160" y="100" text-anchor="middle" font-size="13" fill="#1A1D24">広告インプレッション数（YoY）</text>
    <text x="160" y="118" text-anchor="middle" font-size="11" fill="#555">AI Ranking モデル大規模アップグレードの効果</text>
    <!-- Price per ad -->
    <rect x="320" y="50" width="260" height="90" rx="6" fill="#E3F2FD" stroke="#5B8DEF" stroke-width="2"/>
    <text x="450" y="78" text-anchor="middle" font-size="28" font-weight="900" fill="#5B8DEF">+12%</text>
    <text x="450" y="100" text-anchor="middle" font-size="13" fill="#1A1D24">広告単価（YoY）</text>
    <text x="450" y="118" text-anchor="middle" font-size="11" fill="#555">ユーザー意図把握精度の向上が主因</text>
    <!-- Q2 guide -->
    <rect x="30" y="158" width="260" height="80" rx="6" fill="#FFF3E0" stroke="#E8A87C" stroke-width="2"/>
    <text x="160" y="185" text-anchor="middle" font-size="22" font-weight="900" fill="#E8A87C">$58〜61B</text>
    <text x="160" y="203" text-anchor="middle" font-size="12" fill="#1A1D24">Q2 2026 収益ガイダンス</text>
    <text x="160" y="220" text-anchor="middle" font-size="11" fill="#555">市場予測を上回る水準</text>
    <!-- Capex raised -->
    <rect x="320" y="158" width="260" height="80" rx="6" fill="#FFEBEE" stroke="#E05555" stroke-width="2"/>
    <text x="450" y="182" text-anchor="middle" font-size="18" font-weight="900" fill="#E05555">$125〜145B</text>
    <text x="450" y="200" text-anchor="middle" font-size="12" fill="#1A1D24">設備投資ガイダンス（引き上げ）</text>
    <text x="450" y="218" text-anchor="middle" font-size="11" fill="#555">前回$115〜135Bから+$10B増</text>
  </g>

  <!-- Capex comparison -->
  <g transform="translate(130, 670)">
    <rect x="0" y="0" width="580" height="220" rx="8" fill="white" stroke="#1A1D24" stroke-width="2"/>
    <text x="290" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">💸 AI設備投資 主要4社比較（2026年見込み）</text>
    <line x1="40" y1="180" x2="560" y2="180" stroke="#1A1D24" stroke-width="1.5"/>
    <rect x="55" y="80" width="90" height="100" fill="#FFEBEE" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="100" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#E05555">$145B</text>
    <text x="100" y="192" text-anchor="middle" font-size="11" fill="#1A1D24" font-weight="600">Meta</text>

    <rect x="175" y="110" width="90" height="70" fill="#E8F5E9" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="220" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#5CA46E">$105B</text>
    <text x="220" y="192" text-anchor="middle" font-size="11" fill="#1A1D24" font-weight="600">Amazon</text>

    <rect x="295" y="120" width="90" height="60" fill="#E3F2FD" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="340" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#5B8DEF">$80B</text>
    <text x="340" y="192" text-anchor="middle" font-size="11" fill="#1A1D24" font-weight="600">Microsoft</text>

    <rect x="415" y="128" width="90" height="52" fill="#F3E5F5" stroke="#1A1D24" stroke-width="1.5" rx="3"/>
    <text x="460" y="123" text-anchor="middle" font-size="12" font-weight="700" fill="#8B7DB8">$75B</text>
    <text x="460" y="192" text-anchor="middle" font-size="11" fill="#1A1D24" font-weight="600">Google</text>
  </g>

  <!-- Sticky notes -->
  <g transform="translate(730, 670)" filter="url(#stickyShadow)">
    <g transform="rotate(-1.2)">
      <rect x="0" y="0" width="280" height="100" rx="4" fill="#FFF9C4" stroke="#E8D84A" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">🎯 AI→広告 因果の証明</text>
      <text x="14" y="42" font-size="11" fill="#333">Imp+19% × 単価+12% の両輪回転は</text>
      <text x="14" y="58" font-size="11" fill="#333">LLMファインチューンによる広告RankAI</text>
      <text x="14" y="74" font-size="11" fill="#333">の大規模アップグレードが直接の要因。</text>
      <text x="14" y="90" font-size="11" fill="#555">広告コア事業のAI強化モデルが最初に結果。</text>
    </g>
    <g transform="translate(300, 0) rotate(1.0)">
      <rect x="0" y="0" width="280" height="100" rx="4" fill="#C8E6C9" stroke="#81C784" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">⚠️ EU AI Act 8月リスク</text>
      <text x="14" y="42" font-size="11" fill="#333">EU AI Act 高リスク施行まで100日切り。</text>
      <text x="14" y="58" font-size="11" fill="#333">広告ターゲティングの「自動化意思決定」が</text>
      <text x="14" y="74" font-size="11" fill="#333">規制対象になれば欧州収益に影響。</text>
      <text x="14" y="90" font-size="11" fill="#555">Q3〜Q4の欧州売上が注目指標に。</text>
    </g>
    <g transform="translate(0, 118) rotate(0.8)">
      <rect x="0" y="0" width="280" height="100" rx="4" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">💡 Muse Spark 収益化が鍵</text>
      <text x="14" y="42" font-size="11" fill="#333">$145B投資に対し「AIの新収益」が</text>
      <text x="14" y="58" font-size="11" fill="#333">まだ広告以外に出ていない。</text>
      <text x="14" y="74" font-size="11" fill="#333">Muse Sparkの生成AI広告フォーマットが</text>
      <text x="14" y="90" font-size="11" fill="#555">Q3〜Q4に初計上されるか。</text>
    </g>
    <g transform="translate(300, 118) rotate(-1.5)">
      <rect x="0" y="0" width="280" height="100" rx="4" fill="#FFE0B2" stroke="#FFB74D" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">📊 時間外 +4〜6% 反応</text>
      <text x="14" y="42" font-size="11" fill="#333">Q2ガイダンス $58〜61Bが市場予測超え。</text>
      <text x="14" y="58" font-size="11" fill="#333">純利益+61%と決算スコア完璧な中、</text>
      <text x="14" y="74" font-size="11" fill="#333">唯一の懸念は capex 膨張の</text>
      <text x="14" y="90" font-size="11" fill="#555">ROI説明責任。Zuckerberg 次の主張に注目。</text>
    </g>
  </g>

  <line x1="130" y1="1018" x2="1340" y2="1018" stroke="#1A1D24" stroke-width="1"/>
  <text x="735" y="1036" text-anchor="middle" font-size="12" fill="#888" font-style="italic">AI News · 2026-04-29 · Meta Q1 2026 Earnings Beat: Revenue +33%, Net Income +61%, Capex Raised to $145B</text>
</svg>
