<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#FBF8F1"/>
      <circle cx="20" cy="18" r="0.4" fill="#C4B389" opacity="0.3"/>
      <circle cx="72" cy="62" r="0.5" fill="#C4B389" opacity="0.3"/>
      <circle cx="38" cy="85" r="0.3" fill="#C4B389" opacity="0.3"/>
      <circle cx="55" cy="35" r="0.4" fill="#C4B389" opacity="0.2"/>
      <circle cx="88" cy="15" r="0.3" fill="#C4B389" opacity="0.25"/>
    </pattern>
    <filter id="stickyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <line x1="110" y1="30" x2="110" y2="1020" stroke="#D88A8A" stroke-width="1.2" opacity="0.4"/>
  <g fill="#E8E2D3" opacity="0.7"><circle cx="50" cy="100" r="11"/><circle cx="50" cy="300" r="11"/><circle cx="50" cy="500" r="11"/><circle cx="50" cy="700" r="11"/><circle cx="50" cy="900" r="11"/><circle cx="50" cy="980" r="11"/></g>
  <g fill="none" stroke="#C8C0B0" stroke-width="1.5"><circle cx="50" cy="100" r="11"/><circle cx="50" cy="300" r="11"/><circle cx="50" cy="500" r="11"/><circle cx="50" cy="700" r="11"/><circle cx="50" cy="900" r="11"/><circle cx="50" cy="980" r="11"/></g>

  <!-- Category tape: ビジネス = green -->
  <g transform="translate(1185, 26) rotate(-3)">
    <rect x="0" y="0" width="180" height="36" rx="4" fill="#5CA46E" opacity="0.85"/>
    <text x="90" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="white">#ビジネス</text>
  </g>

  <rect x="125" y="28" width="185" height="36" rx="6" fill="#2F3842"/>
  <text x="218" y="51" text-anchor="middle" font-size="15" font-weight="700" fill="white">2026-04-29</text>
  <text x="328" y="53" font-size="20" fill="#F5A623">⭐⭐⭐</text>

  <text x="130" y="105" font-size="36" font-weight="900" fill="#1A1D24">💰 Meta Q1 2026 決算：売上+33% · 純利益+61%</text>
  <text x="130" y="143" font-size="21" font-weight="600" fill="#444">——AI広告論証が完成、設備投資上限を$145Bへ再引き上げ</text>
  <text x="130" y="176" font-size="13" fill="#888">CNBC / Meta Investor Relations  ·  2026-04-29  ·  #ビジネス #Meta #決算</text>
  <line x1="130" y1="190" x2="1340" y2="190" stroke="#1A1D24" stroke-width="2"/>

  <!-- Hero: Meta logo & money icon -->
  <g transform="translate(130, 208)">
    <rect x="0" y="0" width="200" height="160" rx="12" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="100" y="55" text-anchor="middle" font-size="48">💰</text>
    <text x="100" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#5CA46E">META</text>
    <text x="100" y="112" text-anchor="middle" font-size="12" fill="#555">Q1 2026 Earnings</text>
    <text x="100" y="130" text-anchor="middle" font-size="11" fill="#888">April 29, 2026</text>
    <text x="100" y="150" text-anchor="middle" font-size="10" fill="#5CA46E" font-weight="600">✅ BEAT ALL ESTIMATES</text>
  </g>

  <!-- Key numbers block -->
  <g transform="translate(350, 208)" filter="url(#softShadow)">
    <rect x="0" y="0" width="990" height="160" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <rect x="0" y="0" width="990" height="42" rx="8" fill="#2F3842"/>
    <rect x="0" y="34" width="990" height="8" fill="#2F3842"/>
    <text x="495" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="white">📊 Q1 2026 主要数値</text>
    <!-- Revenue -->
    <text x="110" y="86" text-anchor="middle" font-size="36" font-weight="900" fill="#5CA46E">$56.3B</text>
    <text x="110" y="106" text-anchor="middle" font-size="13" fill="#555">売上高（+33% YoY）</text>
    <text x="110" y="124" text-anchor="middle" font-size="11" fill="#888">予測$55.6B を超過</text>
    <line x1="225" y1="55" x2="225" y2="152" stroke="#E8E2D3" stroke-width="1.5"/>
    <!-- Net Income -->
    <text x="345" y="80" text-anchor="middle" font-size="30" font-weight="900" fill="#5CA46E">$26.77B</text>
    <text x="345" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#5CA46E">+61% YoY</text>
    <text x="345" y="118" text-anchor="middle" font-size="12" fill="#555">純利益</text>
    <line x1="468" y1="55" x2="468" y2="152" stroke="#E8E2D3" stroke-width="1.5"/>
    <!-- EPS -->
    <text x="568" y="86" text-anchor="middle" font-size="36" font-weight="900" fill="#1A1D24">$10.44</text>
    <text x="568" y="106" text-anchor="middle" font-size="13" fill="#555">1株利益（EPS）</text>
    <text x="568" y="124" text-anchor="middle" font-size="11" fill="#888">前年比+62%</text>
    <line x1="688" y1="55" x2="688" y2="152" stroke="#E8E2D3" stroke-width="1.5"/>
    <!-- DAU -->
    <text x="800" y="86" text-anchor="middle" font-size="36" font-weight="900" fill="#5B8DEF">3.56B</text>
    <text x="800" y="106" text-anchor="middle" font-size="13" fill="#555">日間アクティブ人数</text>
    <text x="800" y="124" text-anchor="middle" font-size="11" fill="#888">全アプリ合計（+4% YoY）</text>
    <line x1="918" y1="55" x2="918" y2="152" stroke="#E8E2D3" stroke-width="1.5"/>
    <!-- Capex -->
    <text x="960" y="82" text-anchor="middle" font-size="28" font-weight="900" fill="#E05555">$145B</text>
    <text x="960" y="100" text-anchor="middle" font-size="12" fill="#E05555">capex上限（↑$10B）</text>
    <text x="960" y="118" text-anchor="middle" font-size="11" fill="#888">設備投資ガイダンス</text>
    <text x="495" y="150" text-anchor="middle" font-size="10" fill="#999">出典: Meta Q1 2026 Earnings Release (April 29, 2026)</text>
