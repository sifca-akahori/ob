  <g transform="translate(345, 208)" filter="url(#softShadow)">
    <rect x="0" y="0" width="995" height="165" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <rect x="0" y="0" width="995" height="42" rx="8" fill="#2F3842"/>
    <rect x="0" y="34" width="995" height="8" fill="#2F3842"/>
    <text x="498" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="white">📊 GR00T N1.7 主要スペック</text>
    <text x="110" y="86" text-anchor="middle" font-size="42" font-weight="900" fill="#5B8DEF">3B</text>
    <text x="110" y="106" text-anchor="middle" font-size="12" fill="#555">パラメータ（オープン公開）</text>
    <text x="110" y="124" text-anchor="middle" font-size="11" fill="#888">VLA = Vision-Language-Action</text>
    <line x1="230" y1="52" x2="230" y2="157" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="360" y="80" text-anchor="middle" font-size="32" font-weight="900" fill="#5B8DEF">20,000</text>
    <text x="360" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#5B8DEF">時間</text>
    <text x="360" y="116" text-anchor="middle" font-size="12" fill="#555">EgoScale 学習データ</text>
    <text x="360" y="134" text-anchor="middle" font-size="11" fill="#888">人間一人称動画（料理・作業等）</text>
    <line x1="480" y1="52" x2="480" y2="157" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="600" y="82" text-anchor="middle" font-size="22" font-weight="900" fill="#5CA46E">Cosmos-Reason2</text>
    <text x="600" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#5CA46E">-2B</text>
    <text x="600" y="118" text-anchor="middle" font-size="12" fill="#555">バックボーン（物理推論特化）</text>
    <text x="600" y="136" text-anchor="middle" font-size="11" fill="#888">リアル物理シミュレーション対応</text>
    <line x1="720" y1="52" x2="720" y2="157" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="857" y="82" text-anchor="middle" font-size="18" font-weight="900" fill="#1A1D24">Isaac Sim</text>
    <text x="857" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">+ Isaac Lab</text>
    <text x="857" y="114" text-anchor="middle" font-size="12" fill="#555">シームレス統合</text>
    <text x="857" y="132" text-anchor="middle" font-size="11" fill="#888">無償Early Access公開</text>
    <text x="498" y="157" text-anchor="middle" font-size="10" fill="#999">出典: NVIDIA Blog - National Robotics Week 2026 (April 2026)</text>
  </g>

  <!-- EgoScale flow diagram -->
  <g transform="translate(130, 395)">
    <rect x="0" y="0" width="580" height="265" rx="8" fill="white" stroke="#1A1D24" stroke-width="2"/>
    <text x="290" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">🔄 EgoScale：人間動画→ロボット能力の転写</text>

    <!-- Step 1 -->
    <rect x="20" y="42" width="130" height="100" rx="6" fill="#E3F2FD" stroke="#5B8DEF" stroke-width="2"/>
    <text x="85" y="66" text-anchor="middle" font-size="22">📹</text>
    <text x="85" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#5B8DEF">収集</text>
    <text x="85" y="102" text-anchor="middle" font-size="10" fill="#1A1D24">YouTube等の</text>
    <text x="85" y="116" text-anchor="middle" font-size="10" fill="#1A1D24">一人称作業動画</text>
    <text x="85" y="130" text-anchor="middle" font-size="10" fill="#555">20,000時間+</text>
    <text x="157" y="96" font-size="18" fill="#5B8DEF">→</text>

    <!-- Step 2 -->
    <rect x="170" y="42" width="130" height="100" rx="6" fill="#F3E5F5" stroke="#8B7DB8" stroke-width="2"/>
    <text x="235" y="66" text-anchor="middle" font-size="22">🔍</text>
    <text x="235" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#8B7DB8">抽出</text>
    <text x="235" y="102" text-anchor="middle" font-size="10" fill="#1A1D24">手の動き・グリップ</text>
    <text x="235" y="116" text-anchor="middle" font-size="10" fill="#1A1D24">力加減・軌道</text>
    <text x="235" y="130" text-anchor="middle" font-size="10" fill="#555">疑似ロボットデモ化</text>
    <text x="307" y="96" font-size="18" fill="#8B7DB8">→</text>

    <!-- Step 3 -->
    <rect x="320" y="42" width="130" height="100" rx="6" fill="#E8F5E9" stroke="#5CA46E" stroke-width="2"/>
    <text x="385" y="66" text-anchor="middle" font-size="22">🧠</text>
    <text x="385" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#5CA46E">学習</text>
    <text x="385" y="102" text-anchor="middle" font-size="10" fill="#1A1D24">3B VLA モデルの</text>
    <text x="385" y="116" text-anchor="middle" font-size="10" fill="#1A1D24">事前学習</text>
    <text x="385" y="130" text-anchor="middle" font-size="10" fill="#555">ロボット専用データ不要</text>
    <text x="457" y="96" font-size="18" fill="#5CA46E">→</text>

    <!-- Step 4 -->
    <rect x="470" y="42" width="90" height="100" rx="6" fill="#FFF9C4" stroke="#E8D84A" stroke-width="2"/>
    <text x="515" y="66" text-anchor="middle" font-size="22">🤖</text>
    <text x="515" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#E8A87C">展開</text>
    <text x="515" y="102" text-anchor="middle" font-size="10" fill="#1A1D24">汎用ロボット</text>
    <text x="515" y="116" text-anchor="middle" font-size="10" fill="#1A1D24">ゼロショット</text>
    <text x="515" y="130" text-anchor="middle" font-size="10" fill="#555">動作</text>

    <!-- Key insight -->
    <rect x="20" y="158" width="540" height="90" rx="6" fill="#FFEBEE" stroke="#E05555" stroke-width="1.5"/>
    <text x="290" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#E05555">💡 スケーリング則の発見</text>
    <text x="30" y="198" font-size="11" fill="#1A1D24">EgoScaleデータ量 と ロボットタスク成功率 の間に</text>
    <text x="30" y="214" font-size="11" fill="#1A1D24">対数線形の関係を実証——「人間動画を増やすほどロボットが器用になる」</text>
    <text x="30" y="232" font-size="10" fill="#555">従来：高コストなテレオペレーションデータに依存 → 新手法：大量公開動画を活用</text>
  </g>

