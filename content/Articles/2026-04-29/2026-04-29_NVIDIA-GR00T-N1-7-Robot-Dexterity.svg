  <line x1="130" y1="1018" x2="1340" y2="1018" stroke="#1A1D24" stroke-width="1"/>
  <text x="735" y="1036" text-anchor="middle" font-size="12" fill="#888" font-style="italic">AI News · 2026-04-29 · NVIDIA GR00T N1.7: New Scaling Law for Robot Dexterity via 20,000-Hour Human Egocentric Video</text>
