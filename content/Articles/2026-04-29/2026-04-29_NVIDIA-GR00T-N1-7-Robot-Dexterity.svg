      <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">⚠️ 著作権リスクの萌芽</text>
      <text x="14" y="42" font-size="11" fill="#333">YouTube動画でのロボット学習が</text>
      <text x="14" y="58" font-size="11" fill="#333">普及すれば、LLMのテキスト著作権</text>
      <text x="14" y="74" font-size="11" fill="#333">問題と同様の訴訟リスクが出現。</text>
      <text x="14" y="89" font-size="10" fill="#888">2026〜2027年の新論点になる可能性。</text>
    </g>
    <g transform="translate(300, 5) rotate(1.2)">
      <rect x="0" y="0" width="280" height="95" rx="4" fill="#C8E6C9" stroke="#81C784" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">🏭 製造業への転用可能性</text>
      <text x="14" y="42" font-size="11" fill="#333">卓球（Sony Ace）と同様、GR00Tの</text>
      <text x="14" y="58" font-size="11" fill="#333">高速器用さ技術は精密組み立て・</text>
      <text x="14" y="74" font-size="11" fill="#333">外科ロボット・倉庫自動化に直結。</text>
      <text x="14" y="89" font-size="10" fill="#888">研究→産業転用サイクルが2年単位に。</text>
    </g>
    <g transform="translate(600, -3) rotate(0.7)">
      <rect x="0" y="0" width="280" height="95" rx="4" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">💡 NVIDIAの収益化戦略</text>
      <text x="14" y="42" font-size="11" fill="#333">モデルをオープン無償公開して</text>
      <text x="14" y="58" font-size="11" fill="#333">エコシステムを拡大→GPU・Jetson・</text>
      <text x="14" y="74" font-size="11" fill="#333">Omniverse課金で収益化。</text>
      <text x="14" y="89" font-size="10" fill="#888">OpenAIとは正反対のモデルデータ戦略。</text>
    </g>
    <g transform="translate(900, 3) rotate(-1.0)">
      <rect x="0" y="0" width="280" height="95" rx="4" fill="#FFE0B2" stroke="#FFB74D" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1D24">📊 1年後の予測</text>
      <text x="14" y="42" font-size="11" fill="#333">EgoScaleが主流化→ロボット基盤</text>
      <text x="14" y="58" font-size="11" fill="#333">モデルのコモディティ化が進む。</text>
      <text x="14" y="74" font-size="11" fill="#333">競合優位はハードウェア（アクチュエータ）</text>
      <text x="14" y="89" font-size="10" fill="#888">に移行していく見込み。</text>
