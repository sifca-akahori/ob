    <text x="30" y="80" font-size="11" fill="#1A1D24">• 3B オープン公開（無償）</text>
    <text x="30" y="96" font-size="11" fill="#1A1D24">• EgoScaleで20K時間学習</text>
    <text x="30" y="112" font-size="11" fill="#1A1D24">• Isaac Sim統合・縦断的エコシステム</text>
    <text x="30" y="128" font-size="10" fill="#555">差別化：GPU・Sim・Chip の垂直統合</text>

    <rect x="320" y="42" width="270" height="100" rx="6" fill="#E8F5E9" stroke="#5CA46E" stroke-width="2"/>
    <text x="455" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#5CA46E">Google DeepMind RT-X</text>
    <text x="330" y="80" font-size="11" fill="#1A1D24">• Gemini Robotics 統合</text>
    <text x="330" y="96" font-size="11" fill="#1A1D24">• 多様なロボットプラットフォーム</text>
    <text x="330" y="112" font-size="11" fill="#1A1D24">• OXE データセット（ クロスロボット）</text>
    <text x="330" y="128" font-size="10" fill="#555">差別化：マルチロボット汎化</text>

    <rect x="20" y="155" width="270" height="95" rx="6" fill="#F3E5F5" stroke="#8B7DB8" stroke-width="2"/>
    <text x="155" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#8B7DB8">Physical Intelligence (pi zero)</text>
    <text x="30" y="193" font-size="11" fill="#1A1D24">• 汎用物理AI専門スタートアップ</text>
    <text x="30" y="209" font-size="11" fill="#1A1D24">• 多種ロボット対応の単一ポリシー</text>
    <text x="30" y="228" font-size="10" fill="#555">差別化：純粋汎用ロボット学習</text>

    <rect x="320" y="155" width="270" height="95" rx="6" fill="#FFF3E0" stroke="#E8A87C" stroke-width="2"/>
    <text x="455" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#E8A87C">Figure / 1X / Agility</text>
    <text x="330" y="193" font-size="11" fill="#1A1D24">• ヒューマノイドロボット特化</text>
    <text x="330" y="209" font-size="11" fill="#1A1D24">• GR00T/Gemini等基盤モデル採用</text>
    <text x="330" y="228" font-size="10" fill="#555">差別化：ハードウェア+AI統合</text>
  </g>

  <!-- Sticky notes -->
