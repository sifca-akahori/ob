<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#FBF8F1"/>
      <circle cx="20" cy="18" r="0.4" fill="#C4B389" opacity="0.3"/>
      <circle cx="72" cy="62" r="0.5" fill="#C4B389" opacity="0.3"/>
      <circle cx="38" cy="85" r="0.3" fill="#C4B389" opacity="0.3"/>
    </pattern>
    <filter id="stickyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <line x1="110" y1="30" x2="110" y2="1020" stroke="#D88A8A" stroke-width="1.2" opacity="0.4"/>
  <g fill="#E8E2D3" opacity="0.7"><circle cx="50" cy="100" r="11"/><circle cx="50" cy="300" r="11"/><circle cx="50" cy="500" r="11"/><circle cx="50" cy="700" r="11"/><circle cx="50" cy="900" r="11"/><circle cx="50" cy="980" r="11"/></g>
  <g fill="none" stroke="#C8C0B0" stroke-width="1.5"><circle cx="50" cy="100" r="11"/><circle cx="50" cy="300" r="11"/><circle cx="50" cy="500" r="11"/><circle cx="50" cy="700" r="11"/><circle cx="50" cy="900" r="11"/><circle cx="50" cy="980" r="11"/></g>

  <!-- Category tape: 研究 = blue -->
  <g transform="translate(1210, 26) rotate(-3)">
    <rect x="0" y="0" width="155" height="36" rx="4" fill="#5B8DEF" opacity="0.9"/>
    <text x="78" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="white">#研究</text>
  </g>

  <rect x="125" y="28" width="185" height="36" rx="6" fill="#2F3842"/>
  <text x="218" y="51" text-anchor="middle" font-size="15" font-weight="700" fill="white">2026-04-29</text>
  <text x="328" y="53" font-size="20" fill="#F5A623">⭐⭐</text>

  <text x="130" y="105" font-size="33" font-weight="900" fill="#1A1D24">🤖 NVIDIA GR00T N1.7：ロボット器用さの新スケーリング則</text>
  <text x="130" y="143" font-size="20" font-weight="600" fill="#444">——20,000時間の人間一人称動画で学ぶ3Bオープン物理AIモデル</text>
  <text x="130" y="175" font-size="13" fill="#888">NVIDIA Blog / National Robotics Week 2026  ·  2026-04-29  ·  #研究 #ロボティクス #PhysicalAI</text>
  <line x1="130" y1="190" x2="1340" y2="190" stroke="#1A1D24" stroke-width="2"/>

  <!-- Hero -->
  <g transform="translate(130, 208)">
    <rect x="0" y="0" width="195" height="165" rx="12" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="97" y="58" text-anchor="middle" font-size="46">🦾</text>
    <text x="97" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#5B8DEF">GR00T N1.7</text>
    <text x="97" y="104" text-anchor="middle" font-size="11" fill="#555">NVIDIA Early Access</text>
    <text x="97" y="122" text-anchor="middle" font-size="11" fill="#555">3B Parameters · Open</text>
    <text x="97" y="143" text-anchor="middle" font-size="11" fill="#888">National Robotics Week</text>
    <text x="97" y="158" text-anchor="middle" font-size="10" fill="#5B8DEF" font-weight="600">EgoScale Pretrained</text>
  </g>

