    <circle cx="50" cy="600" r="12"/><circle cx="50" cy="840" r="12"/>
    <circle cx="50" cy="200" r="8"/><circle cx="50" cy="480" r="8"/>
  </g>
  <!-- Category tape top-right -->
  <g transform="translate(1160, -8) rotate(-3)">
