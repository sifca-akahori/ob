  <text x="130" y="158" font-size="28" font-weight="700" fill="#1A1D24">DRAM不要SRAMチップで推論コスト1/10を狙う秘密交渉</text>
  <line x1="130" y1="170" x2="1300" y2="170" stroke="#5CA46E" stroke-width="3"/>
  <text x="130" y="192" font-size="14" fill="#6B7280">Tom's Hardware · 2026-05-03 · #ビジネス · #Anthropic · #チップ · #SRAM</text>

