  <text x="1100" y="255" text-anchor="middle" font-size="42" font-weight="900" fill="#5CA46E">2027+</text>
  <text x="1100" y="285" text-anchor="middle" font-size="13" fill="#6B7280">チップ商用化予定</text>
  <text x="1100" y="318" text-anchor="middle" font-size="11" fill="#9CA3AF">交渉は初期段階</text>

