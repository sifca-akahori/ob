  <rect x="435" y="425" width="200" height="120" rx="4" fill="white" stroke="#5CA46E" stroke-width="2"/>
  <text x="535" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#5CA46E">演算 + SRAM 同一ダイ</text>
  <text x="535" y="480" text-anchor="middle" font-size="11" fill="#374151">↑ データ移動ゼロ</text>
  <text x="535" y="500" text-anchor="middle" font-size="11" fill="#374151">↑ 電力消費激減</text>
