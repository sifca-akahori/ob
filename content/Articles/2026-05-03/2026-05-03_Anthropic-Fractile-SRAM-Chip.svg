  <!-- Footer -->
  <text x="700" y="1035" text-anchor="middle" font-size="13" font-style="italic" fill="#9CA3AF">AI News · 2026-05-03 · Anthropic in Talks with UK Startup Fractile for SRAM Inference Chips</text>
