  <g transform="translate(750,620) rotate(-0.8)" filter="url(#stickyShadow)">
    <rect width="280" height="130" rx="4" fill="#DBEAFE" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="140" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">🇬🇧 英国半導体エコシステム</text>
    <text x="14" y="52" font-size="11" fill="#374151">ARM設計基盤が強み</text>
