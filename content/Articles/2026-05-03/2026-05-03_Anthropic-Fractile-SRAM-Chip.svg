    <text x="14" y="52" font-size="11" fill="#374151">NVIDIA株への潜在ヘッジ</text>
    <text x="14" y="70" font-size="11" fill="#374151">チップ遅延リスクあり</text>
    <text x="14" y="88" font-size="11" fill="#374151">初期交渉段階 → 未確定</text>
