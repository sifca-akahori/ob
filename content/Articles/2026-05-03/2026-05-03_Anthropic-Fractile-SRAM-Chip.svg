  <text x="540" y="260" text-anchor="middle" font-size="52" font-weight="900" fill="#5CA46E">1/10</text>
  <text x="540" y="285" text-anchor="middle" font-size="13" fill="#6B7280">コスト削減（理論値）</text>
  <text x="540" y="318" text-anchor="middle" font-size="11" fill="#9CA3AF">DRAM不要設計による</text>

  <rect x="690" y="210" width="260" height="120" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="820" y="260" text-anchor="middle" font-size="52" font-weight="900" fill="#5CA46E">$30B</text>
  <text x="820" y="285" text-anchor="middle" font-size="13" fill="#6B7280">Anthropic ARR</text>
  <text x="820" y="318" text-anchor="middle" font-size="11" fill="#9CA3AF">2026年3月時点</text>

