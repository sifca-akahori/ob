<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#FBF8F1"/>
      <circle cx="20" cy="30" r="0.4" fill="#C4B389" opacity="0.3"/>
      <circle cx="70" cy="60" r="0.5" fill="#C4B389" opacity="0.3"/>
    </pattern>
    <filter id="stickyShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3"/><feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2"/><feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <line x1="110" y1="30" x2="110" y2="1020" stroke="#D88A8A" stroke-width="1.2" opacity="0.4"/>
  <g fill="#D4C494" opacity="0.5">
    <circle cx="50" cy="120" r="12"/><circle cx="50" cy="360" r="12"/>
    <circle cx="50" cy="600" r="12"/><circle cx="50" cy="840" r="12"/>
  </g>
  <g transform="translate(1120, -8) rotate(-3)">
    <rect x="0" y="0" width="250" height="36" fill="#5CA46E" opacity="0.85" rx="2"/>
    <text x="125" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="white">#ビジネス</text>
  </g>
  <rect x="120" y="22" width="180" height="36" rx="4" fill="#2F3842" filter="url(#softShadow)"/>
  <text x="210" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="white">2026-05-03</text>
  <text x="1270" y="55" text-anchor="middle" font-size="22" fill="#F5B731">⭐⭐</text>

  <!-- Header -->
  <text x="130" y="110" font-size="36" font-weight="900" fill="#1A1D24">🔌 MCP 97M突破・Linux Foundation AAIF設立</text>
  <text x="130" y="155" font-size="24" font-weight="700" fill="#1A1D24">AIの「USB-C標準」がKubernetes・PyTorch路線へ · 16ヶ月で史上最速採用曲線</text>
  <line x1="130" y1="167" x2="1300" y2="167" stroke="#5CA46E" stroke-width="3"/>
  <text x="130" y="190" font-size="14" fill="#6B7280">Anthropic · Linux Foundation · 2025年12月寄贈/2026年3月97M達成 · #ビジネス · #MCP · #オープンソース</text>

  <!-- Key numbers -->
  <rect x="130" y="205" width="260" height="110" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="260" y="252" text-anchor="middle" font-size="44" font-weight="900" fill="#5CA46E">97M</text>
  <text x="260" y="278" text-anchor="middle" font-size="13" fill="#6B7280">月次SDK インストール数</text>
  <text x="260" y="305" text-anchor="middle" font-size="11" fill="#9CA3AF">2026年3月時点</text>

  <rect x="408" y="205" width="260" height="110" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="538" y="252" text-anchor="middle" font-size="36" font-weight="900" fill="#5CA46E">16ヶ月</text>
  <text x="538" y="278" text-anchor="middle" font-size="13" fill="#6B7280">2Mから97Mに成長</text>
  <text x="538" y="305" text-anchor="middle" font-size="11" fill="#5CA46E">OSS史上最速採用曲線の一つ</text>

  <rect x="686" y="205" width="260" height="110" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="816" y="248" text-anchor="middle" font-size="28" font-weight="900" fill="#5CA46E">全主要AI社</text>
  <text x="816" y="278" text-anchor="middle" font-size="13" fill="#6B7280">MCP互換ツール出荷済み</text>
  <text x="816" y="305" text-anchor="middle" font-size="11" fill="#9CA3AF">OpenAI・Google・Microsoft等</text>

  <rect x="964" y="205" width="310" height="110" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="1119" y="248" text-anchor="middle" font-size="28" font-weight="900" fill="#5CA46E">AAIF</text>
  <text x="1119" y="278" text-anchor="middle" font-size="13" fill="#6B7280">Agentic AI Foundation設立</text>
  <text x="1119" y="305" text-anchor="middle" font-size="11" fill="#9CA3AF">Linux Foundation傘下</text>

  <!-- Governance structure -->
  <text x="130" y="360" font-size="18" font-weight="700" fill="#1A1D24">🏛️ AAIF ガバナンス構造</text>
  <line x1="130" y1="367" x2="1300" y2="367" stroke="#5CA46E" stroke-width="2"/>

  <g transform="translate(130, 378)">
    <!-- Co-founders -->
    <text x="0" y="18" font-size="13" font-weight="700" fill="#374151">共同創設者（3社）</text>
    <rect x="0" y="25" width="180" height="55" rx="6" fill="#ECFDF5" stroke="#5CA46E" stroke-width="2"/>
    <text x="90" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">Anthropic</text>
    <text x="90" y="71" text-anchor="middle" font-size="11" fill="#374151">MCPを寄贈・設立</text>

    <rect x="195" y="25" width="180" height="55" rx="6" fill="#ECFDF5" stroke="#5CA46E" stroke-width="2"/>
    <text x="285" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">Block</text>
    <text x="285" y="71" text-anchor="middle" font-size="11" fill="#374151">決済×エージェント</text>

    <rect x="390" y="25" width="180" height="55" rx="6" fill="#ECFDF5" stroke="#5CA46E" stroke-width="2"/>
    <text x="480" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">OpenAI</text>
    <text x="480" y="71" text-anchor="middle" font-size="11" fill="#374151">競合→共同創設者</text>

    <!-- Platinum members -->
    <text x="630" y="18" font-size="13" font-weight="700" fill="#374151">プラチナメンバー（5社）</text>
    <g font-size="12">
      <rect x="630" y="25" width="120" height="55" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="690" y="52" text-anchor="middle" font-weight="700" fill="#1E40AF">AWS</text>
      <text x="690" y="69" text-anchor="middle" fill="#374151">インフラ</text>

      <rect x="765" y="25" width="120" height="55" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="825" y="52" text-anchor="middle" font-weight="700" fill="#1E40AF">Google</text>
      <text x="825" y="69" text-anchor="middle" fill="#374151">クラウド</text>

      <rect x="900" y="25" width="120" height="55" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="960" y="52" text-anchor="middle" font-weight="700" fill="#1E40AF">Microsoft</text>
      <text x="960" y="69" text-anchor="middle" fill="#374151">Azure</text>

      <rect x="1035" y="25" width="130" height="55" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="1100" y="52" text-anchor="middle" font-weight="700" fill="#1E40AF">Cloudflare</text>
      <text x="1100" y="69" text-anchor="middle" fill="#374151">エッジ</text>

      <rect x="1180" y="25" width="130" height="55" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="1245" y="52" text-anchor="middle" font-weight="700" fill="#1E40AF">Bloomberg</text>
      <text x="1245" y="69" text-anchor="middle" fill="#374151">金融</text>
    </g>
  </g>

  <!-- Roadmap -->
  <text x="130" y="510" font-size="18" font-weight="700" fill="#1A1D24">🗺️ 2026 MCPロードマップの核心</text>
  <line x1="130" y1="517" x2="1300" y2="517" stroke="#5CA46E" stroke-width="2"/>

  <g transform="translate(130, 528)" font-size="13">
    <rect x="0" y="0" width="350" height="80" rx="6" fill="#F0FDF4" stroke="#5CA46E" stroke-width="2"/>
    <text x="175" y="28" text-anchor="middle" font-weight="700" fill="#065F46">① SEP（標準進化提案）制度</text>
    <text x="14" y="52" fill="#374151">Kubernetes KEP のAI版として機能</text>
    <text x="14" y="70" fill="#374151">コミュニティ主導でMCP仕様を更新</text>

    <rect x="370" y="0" width="350" height="80" rx="6" fill="#F0FDF4" stroke="#5CA46E" stroke-width="2"/>
    <text x="545" y="28" text-anchor="middle" font-weight="700" fill="#065F46">② マルチエージェントMCP</text>
    <text x="384" y="52" fill="#374151">AIエージェント同士がツールとして相互呼び出し</text>
    <text x="384" y="70" fill="#374151">A2A（Google）との競合・補完が焦点</text>

    <rect x="740" y="0" width="350" height="80" rx="6" fill="#F0FDF4" stroke="#5CA46E" stroke-width="2"/>
    <text x="915" y="28" text-anchor="middle" font-weight="700" fill="#065F46">③ セキュリティ強化レイヤー</text>
    <text x="754" y="52" fill="#374151">認証・認可・監査ログの標準化</text>
    <text x="754" y="70" fill="#374151">CVE-2026-33626のような攻撃への対策</text>
  </g>

  <!-- Sticky notes -->
  <g transform="translate(130,670) rotate(-1.2)" filter="url(#stickyShadow)">
    <rect width="290" height="135" rx="4" fill="#FEF9C3" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="145" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">💡 Kubernetes化戦略の含意</text>
    <text x="14" y="52" font-size="11" fill="#374151">Google 2016年 Kubernetes→CNCF と同じ手法</text>
    <text x="14" y="70" font-size="11" fill="#374151">「我々が作ったが業界標準にする」</text>
    <text x="14" y="88" font-size="11" fill="#374151">単一ベンダーロックイン懸念を払拭</text>
    <text x="14" y="106" font-size="11" fill="#374151">エンタープライズ採用が加速</text>
    <text x="14" y="124" font-size="11" fill="#9CA3AF">Anthropicは「MCPの親」ブランドを保持</text>
  </g>

  <g transform="translate(445,665) rotate(1.0)" filter="url(#stickyShadow)">
    <rect width="290" height="135" rx="4" fill="#FCE7F3" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="145" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">🔌 97Mの地政学的意味</text>
    <text x="14" y="52" font-size="11" fill="#374151">全主要AIが互換ツールを出荷</text>
    <text x="14" y="70" font-size="11" fill="#374151">「AIインフラの中心」にAnthropicが位置</text>
    <text x="14" y="88" font-size="11" fill="#374151">モデル競争1位でなくとも強い立場</text>
    <text x="14" y="106" font-size="11" fill="#374151">Stripe・Twilio的ポジションに近い</text>
    <text x="14" y="124" font-size="11" fill="#9CA3AF">→ AI接続標準を握った者が勝つ</text>
  </g>

  <g transform="translate(760,668) rotate(-0.8)" filter="url(#stickyShadow)">
    <rect width="290" height="135" rx="4" fill="#D1FAE5" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="145" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">🇯🇵 日本企業へのインパクト</text>
    <text x="14" y="52" font-size="11" fill="#374151">富士通・NTT・NECがMCP対応表明</text>
    <text x="14" y="70" font-size="11" fill="#374151">業務系SaaS（ServiceNow・SAP）統合へ</text>
    <text x="14" y="88" font-size="11" fill="#374151">LF参加→「オープン標準」認定で調達容易</text>
    <text x="14" y="106" font-size="11" fill="#374151">セキュリティ審査通過が簡易化</text>
    <text x="14" y="124" font-size="11" fill="#9CA3AF">2026後半に本格統合が始まる予測</text>
  </g>

  <g transform="translate(1075,670) rotate(1.3)" filter="url(#stickyShadow)">
    <rect width="265" height="135" rx="4" fill="#DBEAFE" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="132" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">⚡ A2A vs MCPの競合</text>
    <text x="14" y="52" font-size="11" fill="#374151">GoogleのA2A（Agent-to-Agent）SDK</text>
    <text x="14" y="70" font-size="11" fill="#374151">Google I/O 2026で正式発表予定</text>
    <text x="14" y="88" font-size="11" fill="#374151">マルチエージェント通信標準の争い</text>
    <text x="14" y="106" font-size="11" fill="#374151">MCP（97M先行）vs A2A（Googleエコシステム）</text>
    <text x="14" y="124" font-size="11" fill="#9CA3AF">どちらが「AI間通信の標準」になるか</text>
  </g>

  <text x="700" y="1035" text-anchor="middle" font-size="13" font-style="italic" fill="#9CA3AF">AI News · 2026-05-03 · MCP Hits 97M Installs, Linux Foundation Establishes Agentic AI Foundation</text>
</svg>
