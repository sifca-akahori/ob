  <rect x="360" y="696" width="250" height="112" rx="6" fill="#DFE6FF" stroke="#1A1D24" stroke-width="2" transform="rotate(0.8, 360, 696)" filter="url(#stickyShadow)"/>
  <text x="375" y="723" fill="#1A1D24" font-size="13" font-weight="700">💡 IPO への影響</text>
