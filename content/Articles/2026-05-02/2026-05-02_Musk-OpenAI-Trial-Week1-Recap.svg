  <rect x="916" y="696" width="250" height="112" rx="6" fill="#FFDDF4" stroke="#1A1D24" stroke-width="2" transform="rotate(1.3, 916, 696)" filter="url(#stickyShadow)"/>
  <text x="931" y="723" fill="#1A1D24" font-size="13" font-weight="700">🔮 半年後の予測</text>
  <text x="931" y="743" fill="#333" font-size="12">「非営利→営利」転換の</text>
