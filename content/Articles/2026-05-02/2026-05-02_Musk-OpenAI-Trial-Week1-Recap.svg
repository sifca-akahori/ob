  <text x="375" y="795" fill="#666" font-size="11">判決 5月中旬見込み</text>

  <rect x="638" y="696" width="250" height="112" rx="6" fill="#D5F5E3" stroke="#1A1D24" stroke-width="2" transform="rotate(-0.9, 638, 696)" filter="url(#stickyShadow)"/>
  <text x="653" y="723" fill="#1A1D24" font-size="13" font-weight="700">📰 WaPo 報道角度</text>
  <text x="653" y="743" fill="#333" font-size="12">「裁判は Musk 自身の</text>
  <text x="653" y="759" fill="#333" font-size="12">物語になっている」</text>
  <text x="653" y="775" fill="#333" font-size="12">自己矛盾が露呈と評価</text>
