  <rect x="280" y="545" width="350" height="24" rx="4" fill="#8BC34A" stroke="#1A1D24" stroke-width="1.5"/>
  <text x="640" y="563" fill="#1A1D24" font-size="12">低〜中リスク — 役割は変化</text>

  <text x="120" y="554" fill="#555" font-size="13"> </text>
