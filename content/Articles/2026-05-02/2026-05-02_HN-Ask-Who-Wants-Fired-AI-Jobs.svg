  <rect x="638" y="718" width="250" height="108" rx="6" fill="#D5F5E3" stroke="#1A1D24" stroke-width="2" transform="rotate(-0.9, 638, 718)" filter="url(#stickyShadow)"/>
  <text x="653" y="745" fill="#1A1D24" font-size="13" font-weight="700">🔒 コードセキュリティ</text>
  <text x="653" y="765" fill="#333" font-size="12">AI コード 41% になっても</text>
  <text x="653" y="781" fill="#333" font-size="12">セキュリティ通過率 55%</text>
  <text x="653" y="797" fill="#333" font-size="12">2023 年から改善ゼロ</text>
  <text x="653" y="814" fill="#666" font-size="11">速度↑ × 品質？ のジレンマ</text>

  <rect x="916" y="718" width="250" height="108" rx="6" fill="#FFDDF4" stroke="#1A1D24" stroke-width="2" transform="rotate(1.3, 916, 718)" filter="url(#stickyShadow)"/>
  <text x="931" y="745" fill="#1A1D24" font-size="13" font-weight="700">🔮 1年後予測</text>
  <text x="931" y="765" fill="#333" font-size="12">エントリー SWE の採用</text>
