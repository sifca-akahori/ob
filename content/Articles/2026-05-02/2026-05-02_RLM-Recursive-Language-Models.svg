<svg viewBox="0 0 1400 1050" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="4" fill="#FBF8F1"/>
      <circle cx="1" cy="1" r="0.4" fill="#E8E2D3" opacity="0.5"/>
      <circle cx="3" cy="3" r="0.3" fill="#E8E2D3" opacity="0.3"/>
    </pattern>
    <filter id="softShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#1A1D24" flood-opacity="0.15"/>
    </filter>
    <filter id="stickyShadow">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#1A1D24" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <line x1="40" y1="80" x2="40" y2="980" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="40" cy="150" r="14" fill="#FBF8F1" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="40" cy="280" r="14" fill="#FBF8F1" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="40" cy="410" r="14" fill="#FBF8F1" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="40" cy="540" r="14" fill="#FBF8F1" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="40" cy="670" r="14" fill="#FBF8F1" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="40" cy="800" r="14" fill="#FBF8F1" stroke="#E8E2D3" stroke-width="2"/>
  <!-- Category tape - 研究 blue -->
  <rect x="1190" y="-10" width="150" height="46" rx="4" fill="#5B8DEF" stroke="#1A1D24" stroke-width="2" transform="rotate(-3, 1190, -10)" filter="url(#stickyShadow)"/>
  <text x="1265" y="22" text-anchor="middle" fill="#FBF8F1" font-size="15" font-weight="700" transform="rotate(-3, 1265, 22)">#研究</text>
  <rect x="80" y="30" width="200" height="42" rx="6" fill="#2F3842" stroke="#1A1D24" stroke-width="2"/>
  <text x="180" y="57" text-anchor="middle" fill="#FBF8F1" font-size="16" font-weight="700">2026-05-02</text>
  <text x="1340" y="92" text-anchor="middle" font-size="24">⭐⭐</text>
  <text x="80" y="118" fill="#1A1D24" font-size="36" font-weight="900">🔄 Recursive Language Models（RLM）</text>
  <text x="80" y="158" fill="#1A1D24" font-size="22" font-weight="700">コンテキストウィンドウを「外部変数」として管理——無限長タスクへの新パラダイム</text>
  <line x1="80" y1="172" x2="1340" y2="172" stroke="#1A1D24" stroke-width="3"/>
  <text x="80" y="193" fill="#666" font-size="13">Prime Intellect / arXiv (Alex Zhang)  ·  2026-05-02  ·  #RLM #LLM #エージェント #パラダイム転換</text>

  <g transform="translate(1270, 255)">
    <circle cx="0" cy="0" r="68" fill="#F5F0E8" stroke="#1A1D24" stroke-width="3"/>
    <text x="0" y="18" text-anchor="middle" font-size="60">🔄</text>
  </g>

  <!-- Architecture diagram -->
  <rect x="80" y="215" width="1150" height="185" rx="10" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="110" y="244" fill="#1A1D24" font-size="16" font-weight="800">🏗️ RLM vs 従来 LLM——アーキテクチャ比較</text>
  <line x1="110" y1="253" x2="1200" y2="253" stroke="#1A1D24" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Traditional LLM -->
  <rect x="110" y="263" width="490" height="125" rx="8" fill="#AAA" stroke="#1A1D24" stroke-width="2.5"/>
  <text x="355" y="288" text-anchor="middle" fill="#FBF8F1" font-size="15" font-weight="900">❌ 従来型 LLM</text>
  <text x="355" y="310" text-anchor="middle" fill="#FBF8F1" font-size="12">プロンプト → [コンテキストウィンドウ] → 出力</text>
  <text x="355" y="330" text-anchor="middle" fill="#FBF8F1" font-size="12">問題：コンテキスト上限で情報損失</text>
  <text x="355" y="350" text-anchor="middle" fill="#FBF8F1" font-size="12">要約（圧縮） → 情報ロス → 精度劣化</text>
  <text x="355" y="372" text-anchor="middle" fill="#FBF8F1" font-size="12">長期タスク（週〜月単位）は実質不可能</text>

  <!-- Arrow -->
  <text x="630" y="340" text-anchor="middle" fill="#1A1D24" font-size="28" font-weight="900">→</text>
  <text x="630" y="360" text-anchor="middle" fill="#5B8DEF" font-size="13" font-weight="700">RLM</text>

  <!-- RLM -->
  <rect x="670" y="263" width="490" height="125" rx="8" fill="#5B8DEF" stroke="#1A1D24" stroke-width="2.5"/>
  <text x="915" y="288" text-anchor="middle" fill="#FBF8F1" font-size="15" font-weight="900">✅ Recursive LM（RLM）</text>
  <text x="915" y="310" text-anchor="middle" fill="#FBF8F1" font-size="12">プロンプト ＝ Python 変数として外部配置</text>
  <text x="915" y="330" text-anchor="middle" fill="#FBF8F1" font-size="12">モデルがコードで「一部参照 → 分解 → 再帰呼び出し」</text>
  <text x="915" y="350" text-anchor="middle" fill="#FBF8F1" font-size="12">サブ LLM に委譲 → 情報損失ゼロ</text>
  <text x="915" y="372" text-anchor="middle" fill="#FBF8F1" font-size="12">理論上 無制限のコンテキスト管理</text>

  <!-- Flow diagram -->
  <rect x="80" y="420" width="1270" height="145" rx="10" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="110" y="448" fill="#1A1D24" font-size="15" font-weight="800">⚙️ RLM 処理フロー</text>
  <line x1="110" y1="457" x2="1320" y2="457" stroke="#1A1D24" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Flow steps -->
  <rect x="110" y="466" width="190" height="84" rx="6" fill="#2F3842" stroke="#1A1D24" stroke-width="2"/>
  <text x="205" y="490" text-anchor="middle" fill="#FBF8F1" font-size="13" font-weight="700">① 入力受取</text>
  <text x="205" y="510" text-anchor="middle" fill="#AAA" font-size="11">プロンプトを Python</text>
  <text x="205" y="527" text-anchor="middle" fill="#AAA" font-size="11">変数として格納</text>
  <text x="205" y="544" text-anchor="middle" fill="#5B8DEF" font-size="11">REPL 環境起動</text>

  <text x="325" y="515" text-anchor="middle" fill="#1A1D24" font-size="22">→</text>

  <rect x="340" y="466" width="190" height="84" rx="6" fill="#5B8DEF" stroke="#1A1D24" stroke-width="2"/>
  <text x="435" y="490" text-anchor="middle" fill="#FBF8F1" font-size="13" font-weight="700">② コード生成</text>
  <text x="435" y="510" text-anchor="middle" fill="#FBF8F1" font-size="11">LLM が Python で</text>
  <text x="435" y="527" text-anchor="middle" fill="#FBF8F1" font-size="11">「一部参照・分解」</text>
  <text x="435" y="544" text-anchor="middle" fill="#FBF8F1" font-size="11">コードを実行</text>

  <text x="555" y="515" text-anchor="middle" fill="#1A1D24" font-size="22">→</text>

  <rect x="570" y="466" width="190" height="84" rx="6" fill="#8B7DB8" stroke="#1A1D24" stroke-width="2"/>
  <text x="665" y="490" text-anchor="middle" fill="#FBF8F1" font-size="13" font-weight="700">③ 再帰呼び出し</text>
  <text x="665" y="510" text-anchor="middle" fill="#FBF8F1" font-size="11">自分自身 or</text>
  <text x="665" y="527" text-anchor="middle" fill="#FBF8F1" font-size="11">サブ LLM へ委譲</text>
  <text x="665" y="544" text-anchor="middle" fill="#FBF8F1" font-size="11">↺ ループ可能</text>

  <text x="785" y="515" text-anchor="middle" fill="#1A1D24" font-size="22">→</text>

  <rect x="800" y="466" width="190" height="84" rx="6" fill="#5CA46E" stroke="#1A1D24" stroke-width="2"/>
  <text x="895" y="490" text-anchor="middle" fill="#FBF8F1" font-size="13" font-weight="700">④ 結果統合</text>
  <text x="895" y="510" text-anchor="middle" fill="#FBF8F1" font-size="11">answer 変数に</text>
  <text x="895" y="527" text-anchor="middle" fill="#FBF8F1" font-size="11">最終出力を書込み</text>
  <text x="895" y="544" text-anchor="middle" fill="#FBF8F1" font-size="11">情報損失なし</text>

  <text x="1015" y="515" text-anchor="middle" fill="#1A1D24" font-size="22">→</text>

  <rect x="1030" y="466" width="295" height="84" rx="6" fill="#E8A87C" stroke="#1A1D24" stroke-width="2"/>
  <text x="1177" y="490" text-anchor="middle" fill="#1A1D24" font-size="13" font-weight="700">⑤ RL で訓練</text>
  <text x="1177" y="510" text-anchor="middle" fill="#1A1D24" font-size="11">スカフォールディングごと</text>
  <text x="1177" y="527" text-anchor="middle" fill="#1A1D24" font-size="11">強化学習（Bitter Lesson 準拠）</text>
  <text x="1177" y="544" text-anchor="middle" fill="#1A1D24" font-size="11">learned context folding 習得</text>

  <!-- Comparison to alternatives -->
  <rect x="80" y="582" width="640" height="110" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="110" y="608" fill="#1A1D24" font-size="15" font-weight="800">🆚 競合アーキテクチャとの棲み分け</text>
  <text x="110" y="632" fill="#555" font-size="12">RAG: 外部検索→情報損失あり / Mamba・RWKV: アーキ変更で解決</text>
  <text x="110" y="652" fill="#555" font-size="12">TTT: Test-Time Training で状態保持 / RLM: 推論パラダイムで解決</text>
  <text x="110" y="672" fill="#5B8DEF" font-size="12">→ 「Mamba + RLM」の組合せも理論上可能——相互補完の余地あり</text>

  <rect x="740" y="582" width="610" height="110" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="770" y="608" fill="#1A1D24" font-size="15" font-weight="800">🏢 エンタープライズAIへの接続</text>
  <text x="770" y="632" fill="#555" font-size="12">CRM・ERP をまたがる週単位エージェントワークフロー</text>
  <text x="770" y="652" fill="#555" font-size="12">LOCOMO ベンチマーク（4/27）：全主要 LLM が長期記憶で失敗</text>
  <text x="770" y="672" fill="#5B8DEF" font-size="12">RLM の成熟 = 「永続エージェント」として先に市場投入</text>

  <!-- Sticky notes -->
  <rect x="82" y="714" width="250" height="112" rx="6" fill="#FFEAA7" stroke="#1A1D24" stroke-width="2" transform="rotate(-1.2, 82, 714)" filter="url(#stickyShadow)"/>
  <text x="97" y="741" fill="#1A1D24" font-size="13" font-weight="700">🎓 Bitter Lesson 準拠</text>
  <text x="97" y="761" fill="#333" font-size="12">Rich Sutton の教え：</text>
  <text x="97" y="777" fill="#333" font-size="12">スケールと計算が勝つ</text>
  <text x="97" y="793" fill="#333" font-size="12">手作りより汎用学習</text>
  <text x="97" y="813" fill="#666" font-size="11">訓練組込みが差別化点</text>

  <rect x="360" y="714" width="250" height="112" rx="6" fill="#DFE6FF" stroke="#1A1D24" stroke-width="2" transform="rotate(0.8, 360, 714)" filter="url(#stickyShadow)"/>
  <text x="375" y="741" fill="#1A1D24" font-size="13" font-weight="700">⚠️ 課題：実測不足</text>
  <text x="375" y="761" fill="#333" font-size="12">長期実タスクの</text>
  <text x="375" y="777" fill="#333" font-size="12">独立ベンチマークが少ない</text>
  <text x="375" y="793" fill="#333" font-size="12">「夢物語」防止に実証必要</text>
  <text x="375" y="813" fill="#666" font-size="11">2026年後半が検証山場</text>

  <rect x="638" y="714" width="250" height="112" rx="6" fill="#D5F5E3" stroke="#1A1D24" stroke-width="2" transform="rotate(-0.9, 638, 714)" filter="url(#stickyShadow)"/>
  <text x="653" y="741" fill="#1A1D24" font-size="13" font-weight="700">🔓 OSS 実装公開中</text>
  <text x="653" y="761" fill="#333" font-size="12">GitHub: alexzhang13/rlm</text>
  <text x="653" y="777" fill="#333" font-size="12">plug-and-play ライブラリ</text>
  <text x="653" y="793" fill="#333" font-size="12">各種サンドボックス対応</text>
  <text x="653" y="813" fill="#666" font-size="11">今すぐ試せる状態</text>

  <rect x="916" y="714" width="250" height="112" rx="6" fill="#FFDDF4" stroke="#1A1D24" stroke-width="2" transform="rotate(1.3, 916, 714)" filter="url(#stickyShadow)"/>
  <text x="931" y="741" fill="#1A1D24" font-size="13" font-weight="700">🔮 1年後の予測</text>
  <text x="931" y="761" fill="#333" font-size="12">月単位エージェントを</text>
  <text x="931" y="777" fill="#333" font-size="12">可能にする基盤として</text>
  <text x="931" y="793" fill="#333" font-size="12">フロンティアモデルが採用</text>
  <text x="931" y="813" fill="#666" font-size="11">主戦場はエンタープライズ</text>

  <text x="700" y="1035" text-anchor="middle" fill="#888" font-size="12" font-style="italic">AI News · 2026-05-02 · Recursive Language Models: The Paradigm of 2026</text>
</svg>
