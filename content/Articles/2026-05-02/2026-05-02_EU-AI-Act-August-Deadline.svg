  <text x="375" y="773" fill="#333" font-size="12">サービス提供は域外適用</text>
  <text x="375" y="789" fill="#333" font-size="12">対象の可能性あり</text>
  <text x="375" y="809" fill="#666" font-size="11">法的解釈は未確定</text>

  <rect x="638" y="710" width="250" height="112" rx="6" fill="#D5F5E3" stroke="#1A1D24" stroke-width="2" transform="rotate(-0.9, 638, 710)" filter="url(#stickyShadow)"/>
  <text x="653" y="737" fill="#1A1D24" font-size="13" font-weight="700">💡 先行準備が競争優位</text>
  <text x="653" y="757" fill="#333" font-size="12">GDPR 施行後 2〜3 年で</text>
  <text x="653" y="773" fill="#333" font-size="12">中堅に執行拡大の前例</text>
  <text x="653" y="789" fill="#333" font-size="12">今から整備＝3年後優位</text>
  <text x="653" y="809" fill="#666" font-size="11">コンプライアンスネイティブ</text>

  <rect x="916" y="710" width="250" height="112" rx="6" fill="#FFDDF4" stroke="#1A1D24" stroke-width="2" transform="rotate(1.3, 916, 710)" filter="url(#stickyShadow)"/>
  <text x="931" y="737" fill="#1A1D24" font-size="13" font-weight="700">📊 コンプライアンス費用</text>
  <text x="931" y="757" fill="#333" font-size="12">大企業で $1,000 万超</text>
  <text x="931" y="773" fill="#333" font-size="12">との試算あり</text>
  <text x="931" y="789" fill="#333" font-size="12">法務・技術・運用</text>
  <text x="931" y="809" fill="#666" font-size="11">三者一体の対応が必要</text>

  <text x="700" y="1035" text-anchor="middle" fill="#888" font-size="12" font-style="italic">AI News · 2026-05-02 · EU AI Act August 2026 Compliance Deadline</text>
</svg>
