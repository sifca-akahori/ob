<svg viewBox="0 0 1400 1050" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="4" fill="#FBF8F1"/>
      <circle cx="1" cy="1" r="0.4" fill="#E8E2D3" opacity="0.5"/>
      <circle cx="3" cy="3" r="0.3" fill="#E8E2D3" opacity="0.3"/>
    </pattern>
    <filter id="softShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#1A1D24" flood-opacity="0.15"/>
    </filter>
    <filter id="stickyShadow">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#1A1D24" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <line x1="40" y1="80" x2="40" y2="980" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="40" cy="150" r="14" fill="#FBF8F1" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="40" cy="280" r="14" fill="#FBF8F1" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="40" cy="410" r="14" fill="#FBF8F1" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="40" cy="540" r="14" fill="#FBF8F1" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="40" cy="670" r="14" fill="#FBF8F1" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="40" cy="800" r="14" fill="#FBF8F1" stroke="#E8E2D3" stroke-width="2"/>
  <rect x="1190" y="-10" width="160" height="46" rx="4" fill="#5CA46E" stroke="#1A1D24" stroke-width="2" transform="rotate(-3, 1190, -10)" filter="url(#stickyShadow)"/>
  <text x="1270" y="22" text-anchor="middle" fill="#FBF8F1" font-size="15" font-weight="700" transform="rotate(-3, 1270, 22)">#ビジネス</text>
  <rect x="80" y="30" width="200" height="42" rx="6" fill="#2F3842" stroke="#1A1D24" stroke-width="2"/>
  <text x="180" y="57" text-anchor="middle" fill="#FBF8F1" font-size="16" font-weight="700">2026-05-02</text>
  <text x="1340" y="92" text-anchor="middle" font-size="24">⭐⭐</text>
  <text x="80" y="118" fill="#1A1D24" font-size="36" font-weight="900">🏷️ EU AIコンテンツラベリング第2草案公開</text>
  <text x="80" y="158" fill="#1A1D24" font-size="22" font-weight="700">二重義務（機械可読＋可視ラベル）確定方向——8月施行前の最終合意へ</text>
  <line x1="80" y1="172" x2="1340" y2="172" stroke="#1A1D24" stroke-width="3"/>
  <text x="80" y="193" fill="#666" font-size="13">EU Digital Strategy  ·  2026-05-03  ·  #規制 #ラベリング #ディープフェイク #Article50</text>

  <g transform="translate(1270, 255)">
    <circle cx="0" cy="0" r="68" fill="#F5F0E8" stroke="#1A1D24" stroke-width="3"/>
    <text x="0" y="18" text-anchor="middle" font-size="60">🏷️</text>
  </g>

  <!-- Two-layer diagram -->
  <rect x="80" y="215" width="1150" height="165" rx="10" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="110" y="244" fill="#1A1D24" font-size="16" font-weight="800">📐 二層式マーキング構造（Article 50 第2草案の核心）</text>
  <line x1="110" y1="253" x2="1200" y2="253" stroke="#1A1D24" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Layer 1 -->
  <rect x="110" y="263" width="490" height="105" rx="8" fill="#5B8DEF" stroke="#1A1D24" stroke-width="2.5"/>
  <text x="355" y="289" text-anchor="middle" fill="#FBF8F1" font-size="15" font-weight="900">Layer 1（必須）：機械可読マーキング</text>
  <text x="355" y="311" text-anchor="middle" fill="#FBF8F1" font-size="12">🔒 セキュアメタデータ埋め込み（C2PA対応）</text>
  <text x="355" y="329" text-anchor="middle" fill="#FBF8F1" font-size="12">💧 デジタルウォーターマーク</text>
  <text x="355" y="347" text-anchor="middle" fill="#FBF8F1" font-size="12">🔍 オプション：指紋・ログ・検証プロトコル</text>

  <!-- Arrow -->
  <text x="630" y="330" text-anchor="middle" fill="#1A1D24" font-size="28" font-weight="900">＋</text>

  <!-- Layer 2 -->
  <rect x="670" y="263" width="490" height="105" rx="8" fill="#5CA46E" stroke="#1A1D24" stroke-width="2.5"/>
  <text x="915" y="289" text-anchor="middle" fill="#FBF8F1" font-size="15" font-weight="900">Layer 2（必須）：可視的ラベル</text>
  <text x="915" y="311" text-anchor="middle" fill="#FBF8F1" font-size="12">🏷️ アイコン・免責文・「AI生成」表示</text>
  <text x="915" y="329" text-anchor="middle" fill="#FBF8F1" font-size="12">📋 統一最低基準のデザイン・配置</text>
  <text x="915" y="347" text-anchor="middle" fill="#FBF8F1" font-size="12">⚠️ ディープフェイクには特に厳格要件</text>

  <!-- Target groups -->
  <rect x="80" y="398" width="590" height="130" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="110" y="424" fill="#1A1D24" font-size="15" font-weight="800">🏭 プロバイダー（AIシステム提供者）</text>
  <text x="110" y="448" fill="#555" font-size="12">・メタデータをコンテンツに埋め込む技術実装</text>
  <text x="110" y="466" fill="#555" font-size="12">・Layer 1 の機械可読マーキングが主義務</text>
  <text x="110" y="484" fill="#555" font-size="12">・対象：OpenAI・Anthropic・Google・Adobe 等</text>
  <text x="110" y="502" fill="#555" font-size="12">・C2PA 準拠が事実上の標準アプローチ</text>
  <text x="110" y="520" fill="#888" font-size="11">※ API経由配信の場合も義務の主体はプロバイダー</text>

  <rect x="690" y="398" width="660" height="130" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="720" y="424" fill="#1A1D24" font-size="15" font-weight="800">🖥️ デプロイヤー（実際に利用する企業）</text>
  <text x="720" y="448" fill="#555" font-size="12">・エンドユーザーへの可視的ラベル表示</text>
  <text x="720" y="466" fill="#555" font-size="12">・「公益事項テキスト」や選挙関連は追加義務</text>
  <text x="720" y="484" fill="#555" font-size="12">・ディープフェイク（顔・声合成）には特別規定</text>
  <text x="720" y="502" fill="#555" font-size="12">・対象：メディア・SaaSプラットフォーム・EC等</text>
  <text x="720" y="520" fill="#888" font-size="11">※ EU ユーザー向けサービスを持つ日本企業も含む可能性</text>

  <!-- Timeline -->
  <rect x="80" y="546" width="1270" height="80" rx="8" fill="#F5F0E8" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <line x1="130" y1="586" x2="1300" y2="586" stroke="#1A1D24" stroke-width="2.5"/>
  <circle cx="200" cy="586" r="8" fill="#8B7DB8" stroke="#1A1D24" stroke-width="2"/>
  <text x="200" y="566" text-anchor="middle" fill="#1A1D24" font-size="11" font-weight="700">2025年12月</text>
  <text x="200" y="604" text-anchor="middle" fill="#555" font-size="10">第1草案公開</text>
  <circle cx="430" cy="586" r="8" fill="#5B8DEF" stroke="#1A1D24" stroke-width="2"/>
  <text x="430" y="566" text-anchor="middle" fill="#1A1D24" font-size="11" font-weight="700">2026年3月</text>
  <text x="430" y="604" text-anchor="middle" fill="#555" font-size="10">第2草案（5/3公開）</text>
  <circle cx="700" cy="586" r="8" fill="#E8A87C" stroke="#1A1D24" stroke-width="2"/>
  <text x="700" y="566" text-anchor="middle" fill="#1A1D24" font-size="11" font-weight="700">2026年6月</text>
  <text x="700" y="604" text-anchor="middle" fill="#555" font-size="10">最終版目標</text>
  <circle cx="1050" cy="586" r="12" fill="#1A1D24" stroke="#1A1D24" stroke-width="2"/>
  <text x="1050" y="566" text-anchor="middle" fill="#1A1D24" font-size="11" font-weight="700">2026年8月2日</text>
  <text x="1050" y="604" text-anchor="middle" fill="#E8A87C" font-size="12" font-weight="700">⚡ 施行</text>

  <!-- Sticky notes -->
  <rect x="82" y="648" width="260" height="120" rx="6" fill="#FFEAA7" stroke="#1A1D24" stroke-width="2" transform="rotate(-1.2, 82, 648)" filter="url(#stickyShadow)"/>
  <text x="97" y="675" fill="#1A1D24" font-size="13" font-weight="700">🔗 C2PA との関係</text>
  <text x="97" y="695" fill="#333" font-size="12">Adobe・Midjourney・</text>
  <text x="97" y="711" fill="#333" font-size="12">Google Imagen は</text>
  <text x="97" y="727" fill="#333" font-size="12">すでに C2PA 準拠済み</text>
  <text x="97" y="755" fill="#666" font-size="11">EU 草案と親和性が高い</text>

  <rect x="370" y="648" width="260" height="120" rx="6" fill="#DFE6FF" stroke="#1A1D24" stroke-width="2" transform="rotate(0.8, 370, 648)" filter="url(#stickyShadow)"/>
  <text x="385" y="675" fill="#1A1D24" font-size="13" font-weight="700">⚠️ 実効性への疑問</text>
  <text x="385" y="695" fill="#333" font-size="12">TechPolicy.Press が指摘</text>
  <text x="385" y="711" fill="#333" font-size="12">ラベル削除・再処理で</text>
  <text x="385" y="727" fill="#333" font-size="12">技術的回避が可能</text>
  <text x="385" y="755" fill="#666" font-size="11">抑止力の実効性に疑問</text>

  <rect x="658" y="648" width="260" height="120" rx="6" fill="#D5F5E3" stroke="#1A1D24" stroke-width="2" transform="rotate(-0.9, 658, 648)" filter="url(#stickyShadow)"/>
  <text x="673" y="675" fill="#1A1D24" font-size="13" font-weight="700">🗳️ 選挙・政治広告</text>
  <text x="673" y="695" fill="#333" font-size="12">欧州議会圧力で</text>
  <text x="673" y="711" fill="#333" font-size="12">ディープフェイクへの</text>
  <text x="673" y="727" fill="#333" font-size="12">特別規定が厳格化</text>
  <text x="673" y="755" fill="#666" font-size="11">選挙年を意識した設計</text>

  <rect x="946" y="648" width="260" height="120" rx="6" fill="#FFDDF4" stroke="#1A1D24" stroke-width="2" transform="rotate(1.3, 946, 648)" filter="url(#stickyShadow)"/>
  <text x="961" y="675" fill="#1A1D24" font-size="13" font-weight="700">🌏 日本企業の対応</text>
  <text x="961" y="695" fill="#333" font-size="12">C2PA 準拠 か</text>
  <text x="961" y="711" fill="#333" font-size="12">EU 向け分離パイプライン</text>
  <text x="961" y="727" fill="#333" font-size="12">の選択を迫られる可能性</text>
  <text x="961" y="755" fill="#666" font-size="11">域外適用の解釈が焦点</text>

  <text x="700" y="1035" text-anchor="middle" fill="#888" font-size="12" font-style="italic">AI News · 2026-05-02 · EU AI Content Labeling Code of Practice Draft 2</text>
</svg>
