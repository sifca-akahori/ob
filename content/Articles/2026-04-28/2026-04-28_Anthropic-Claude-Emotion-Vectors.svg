  <!-- Bottom box: Research method summary -->
  <g transform="translate(130, 808)">
    <rect x="0" y="0" width="1210" height="115" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" opacity="0.95"/>
    <text x="30" y="28" font-size="14" font-weight="700" fill="#1A1D24">🔬 研究手法の概要</text>
    <line x1="15" y1="38" x2="1195" y2="38" stroke="#E8E2D3" stroke-width="1"/>
    <text x="30" y="60" font-size="12" fill="#333">① 171の感情概念語リストを作成（「幸せ」「恐れ」「敵意」「至福」など）→ Claudeに各感情を体験するキャラクターの短編を書かせる</text>
    <text x="30" y="80" font-size="12" fill="#333">② 生成された物語をClaudeに再入力し、各層の内部活性化パターン（ニューラルベクトル）を記録 → 感情ごとの「感情ベクトル」を抽出</text>
    <text x="30" y="100" font-size="12" fill="#333">③ 感情ベクトルを人為的に増幅・減衰させ、モデルの行動（意思決定・選好・ゆすり行動）がどう変化するか因果実験 → 因果関係を確認</text>
