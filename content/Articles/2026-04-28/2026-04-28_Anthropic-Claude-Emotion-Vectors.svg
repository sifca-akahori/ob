    <rect x="0" y="0" width="320" height="22" fill="#A5D6A7" opacity="0.8" rx="3"/>
    <text x="160" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">📌 EU AI Act説明可能性要件</text>
