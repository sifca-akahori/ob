    <text x="12" y="90" font-size="11" fill="#333">防御的研究の知見が攻撃的</text>
    <text x="12" y="105" font-size="11" fill="#333">Adversarial Injectionに</text>
    <text x="12" y="120" font-size="11" fill="#333">転用されるリスクが上昇。</text>
    <text x="12" y="138" font-size="10" fill="#999">💡 両刃の剣</text>
  </g>

  <g transform="translate(1000, 640) rotate(1.1)" filter="url(#stickyShadow)">
