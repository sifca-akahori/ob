    <rect x="0" y="0" width="265" height="22" fill="#FFAB91" opacity="0.8" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#BF360C">📌 「意識」ではなく「機能的構造」</text>
