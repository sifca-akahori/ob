    <rect x="0" y="0" width="265" height="22" fill="#FFE566" opacity="0.7" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#666">📌 出力監視→内部監視へ</text>
    <text x="12" y="45" font-size="11" fill="#333">従来の安全手法は「有害な</text>
    <text x="12" y="60" font-size="11" fill="#333">出力をフィルタリング」する</text>
