    <text x="12" y="75" font-size="11" fill="#333">しかし方法論的突破口として</text>
    <text x="12" y="90" font-size="11" fill="#333">「モデルが何を考えているか」</text>
    <text x="12" y="105" font-size="11" fill="#333">を内部から読み解く研究が</text>
    <text x="12" y="120" font-size="11" fill="#333">成熟しつつある証左。</text>
    <text x="12" y="138" font-size="10" fill="#999">💡 AI意識論争の再燃</text>
  </g>

  <g transform="translate(710, 642) rotate(-0.8)" filter="url(#stickyShadow)">
