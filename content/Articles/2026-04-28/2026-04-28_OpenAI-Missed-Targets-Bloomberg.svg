    <rect x="0" y="0" width="980" height="42" rx="8" fill="#2F3842"/>
    <rect x="0" y="34" width="980" height="8" fill="#2F3842"/>
    <text x="490" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="white">📊 OpenAI vs Anthropic — ARR競争</text>
    <text x="122" y="85" text-anchor="middle" font-size="40" font-weight="900" fill="#5B8DEF">$25B</text>
    <text x="122" y="107" text-anchor="middle" font-size="12" fill="#555">OpenAI ARR</text>
    <text x="122" y="123" text-anchor="middle" font-size="11" fill="#888">（月$2B超）</text>
    <line x1="245" y1="55" x2="245" y2="150" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="367" y="85" text-anchor="middle" font-size="40" font-weight="900" fill="#5CA46E">$30B</text>
    <text x="367" y="107" text-anchor="middle" font-size="12" fill="#555">Anthropic ARR</text>
    <text x="367" y="123" text-anchor="middle" font-size="11" fill="#5CA46E">（OpenAIを逆転！）</text>
    <line x1="490" y1="55" x2="490" y2="150" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="612" y="85" text-anchor="middle" font-size="36" font-weight="900" fill="#E05555">-0.6%</text>
    <text x="612" y="107" text-anchor="middle" font-size="12" fill="#555">S&amp;P 500先物下落</text>
    <text x="612" y="123" text-anchor="middle" font-size="11" fill="#888">（Bloomberg報道直後）</text>
    <line x1="735" y1="55" x2="735" y2="150" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="857" y="85" text-anchor="middle" font-size="36" font-weight="900" fill="#8B7DB8">$880B</text>
    <text x="857" y="107" text-anchor="middle" font-size="12" fill="#555">OpenAI 二次市場評価</text>
    <text x="857" y="123" text-anchor="middle" font-size="11" fill="#888">（Anthropicは$1T超）</text>
    <text x="490" y="148" text-anchor="middle" font-size="10" fill="#999">出典: Bloomberg / Anthropic 2026-04-28</text>
  </g>

  <!-- ARR comparison chart -->
