    <rect x="0" y="0" width="620" height="220" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="310" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">📈 ARR推移比較：OpenAI vs Anthropic（2025-2026）</text>
    <line x1="20" y1="35" x2="600" y2="35" stroke="#E8E2D3" stroke-width="1"/>
    <!-- Y axis -->
    <line x1="80" y1="50" x2="80" y2="195" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="75" y="55" text-anchor="end" font-size="9" fill="#666">$35B</text>
    <text x="75" y="90" text-anchor="end" font-size="9" fill="#666">$25B</text>
    <text x="75" y="130" text-anchor="end" font-size="9" fill="#666">$15B</text>
    <text x="75" y="170" text-anchor="end" font-size="9" fill="#666">$5B</text>
    <text x="75" y="198" text-anchor="end" font-size="9" fill="#666">$0</text>
