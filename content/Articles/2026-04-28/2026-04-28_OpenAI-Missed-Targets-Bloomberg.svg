    <line x1="90" y1="165" x2="115" y2="165" stroke="#5B8DEF" stroke-width="3"/>
    <text x="118" y="169" font-size="10" fill="#5B8DEF">OpenAI</text>
    <line x1="90" y1="180" x2="115" y2="180" stroke="#5CA46E" stroke-width="3"/>
    <text x="118" y="184" font-size="10" fill="#5CA46E">Anthropic</text>
    <!-- Crossover annotation -->
    <text x="390" y="65" font-size="11" font-weight="700" fill="#E05555">逆転!</text>
  </g>

  <!-- Impact cards -->
  <g transform="translate(780, 400)" filter="url(#softShadow)">
    <rect x="0" y="0" width="560" height="220" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="280" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">🔴 株式市場への影響（同日）</text>
    <line x1="20" y1="35" x2="540" y2="35" stroke="#E8E2D3" stroke-width="1"/>
    <!-- Company impacts -->
    <text x="30" y="60" font-size="13" font-weight="700" fill="#E05555">▼ 下落した株式</text>
    <rect x="30" y="68" width="200" height="24" rx="4" fill="#FFF0F0" stroke="#E05555" stroke-width="1.5"/>
    <text x="130" y="84" text-anchor="middle" font-size="12" fill="#E05555">Oracle (ORCL) ▼</text>
    <rect x="30" y="98" width="200" height="24" rx="4" fill="#FFF0F0" stroke="#E05555" stroke-width="1.5"/>
    <text x="130" y="114" text-anchor="middle" font-size="12" fill="#E05555">NVIDIA (NVDA) ▼</text>
    <rect x="30" y="128" width="200" height="24" rx="4" fill="#FFF0F0" stroke="#E05555" stroke-width="1.5"/>
    <text x="130" y="144" text-anchor="middle" font-size="12" fill="#E05555">S&amp;P 500 先物 -0.6%</text>
    <text x="30" y="178" font-size="11" fill="#555">OpenAI反論: 「We are firing</text>
    <text x="30" y="194" font-size="11" fill="#555">on all cylinders」（定量的反証なし）</text>
    <line x1="250" y1="50" x2="250" y2="210" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="270" y="60" font-size="12" font-weight="700" fill="#5CA46E">💡 次の焦点</text>
    <text x="270" y="82" font-size="11" fill="#333">• Meta Q1決算 (4/29)</text>
    <text x="270" y="100" font-size="11" fill="#333">• Microsoft Q3決算</text>
    <text x="270" y="118" font-size="11" fill="#333">• OpenAI IPO計画への影響</text>
    <text x="270" y="136" font-size="11" fill="#333">• 目標値の開示要求</text>
    <text x="270" y="154" font-size="11" fill="#555">裁判と同日の悪材料が</text>
    <text x="270" y="172" font-size="11" fill="#555">市場心理を増幅した可能性。</text>
    <text x="270" y="190" font-size="11" fill="#5B8DEF">Cramer: 「Hitjob」と擁護</text>
  </g>

  <!-- Sticky notes -->
  <g transform="translate(130, 645) rotate(-1.2)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="265" height="145" rx="3" fill="#FFF9C4" stroke="#E8D84A" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="22" fill="#FFE566" opacity="0.7" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#666">📌 目標未達の文脈</text>
    <text x="12" y="45" font-size="11" fill="#333">自己申告ARR $25B自体は</text>
    <text x="12" y="60" font-size="11" fill="#333">高成長だが、投資家向け</text>
    <text x="12" y="75" font-size="11" fill="#333">ロードマップとの乖離が問題。</text>
    <text x="12" y="90" font-size="11" fill="#333">2026年ARR $40B予測との</text>
    <text x="12" y="105" font-size="11" fill="#333">ギャップが市場に響いた。</text>
    <text x="12" y="128" font-size="10" fill="#999">💡 期待値管理の失敗</text>
  </g>

  <g transform="translate(420, 638) rotate(0.9)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="265" height="145" rx="3" fill="#FFCCBC" stroke="#FF7043" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="22" fill="#FFAB91" opacity="0.8" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#BF360C">📌 Anthropic逆転の意味</text>
    <text x="12" y="45" font-size="11" fill="#333">Anthropic ARR $30B が</text>
    <text x="12" y="60" font-size="11" fill="#333">OpenAI $25B を上回った。</text>
    <text x="12" y="75" font-size="11" fill="#333">ただし両社の「ARR」の定義・</text>
    <text x="12" y="90" font-size="11" fill="#333">計算方法が異なる可能性。</text>
    <text x="12" y="105" font-size="11" fill="#333">数字の比較は慎重に。</text>
    <text x="12" y="128" font-size="10" fill="#999">💡 自己申告の限界</text>
  </g>

  <g transform="translate(710, 642) rotate(-0.7)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="265" height="145" rx="3" fill="#E1BEE7" stroke="#AB47BC" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="22" fill="#CE93D8" opacity="0.8" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#4A148C">📌 IPO計画の不確実性</text>
    <text x="12" y="45" font-size="11" fill="#333">「目標未達」+「裁判開廷」が</text>
    <text x="12" y="60" font-size="11" fill="#333">同日に重なり、IPO引受</text>
    <text x="12" y="75" font-size="11" fill="#333">証券会社に「ダブルリスク」</text>
    <text x="12" y="90" font-size="11" fill="#333">を意識させた。評価額</text>
    <text x="12" y="105" font-size="11" fill="#333">$880Bへの下方圧力が増す</text>
    <text x="12" y="120" font-size="11" fill="#333">可能性がある。</text>
    <text x="12" y="138" font-size="10" fill="#999">💡 2026後半IPOへの影響</text>
  </g>

  <g transform="translate(1000, 640) rotate(1.0)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="320" height="145" rx="3" fill="#C8E6C9" stroke="#8BC34A" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="22" fill="#A5D6A7" opacity="0.8" rx="3"/>
    <text x="160" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">📌 「ROI立証問題」の再燃</text>
    <text x="12" y="45" font-size="11" fill="#333">AI投資の収益化見通しへの</text>
    <text x="12" y="60" font-size="11" fill="#333">疑念が市場全体に広がった。</text>
    <text x="12" y="75" font-size="11" fill="#333">Meta Q1 / Microsoft Q3での</text>
    <text x="12" y="90" font-size="11" fill="#333">「AIが収益にどう貢献したか」</text>
    <text x="12" y="105" font-size="11" fill="#333">の具体的な数値開示が</text>
    <text x="12" y="120" font-size="11" fill="#333">次の市場の焦点となる。</text>
    <text x="12" y="138" font-size="10" fill="#555">💡 決算シーズンが試金石</text>
  </g>

  <g transform="translate(130, 808)">
    <rect x="0" y="0" width="1210" height="115" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" opacity="0.95"/>
    <text x="30" y="28" font-size="14" font-weight="700" fill="#1A1D24">💬 OpenAI公式反論の全文（要旨）と市場の受け止め</text>
    <line x1="15" y1="38" x2="1195" y2="38" stroke="#E8E2D3" stroke-width="1"/>
    <text x="30" y="60" font-size="12" fill="#333">OpenAI声明: 「消費者・エンタープライズ事業はともに strong growth を見せており、企業顧客からの需要とAI広告事業の成長が続いている」（定量的数値は未提示）</text>
    <text x="30" y="80" font-size="12" fill="#333">市場反応: Jim Cramer (CNBC) は「これはヒットジョブ（偏った報道）だ」と擁護。一方でアナリストは「感情的な反論より数字で示すべき」と批判的。</text>
    <text x="30" y="100" font-size="12" fill="#333">Bloomberg報道の情報源: 「OpenAIの内部目標値を知る複数の人物」。OpenAIは目標値の開示を拒否しており、第三者による検証は不可能な状況。</text>
  </g>

  <text x="700" y="1038" text-anchor="middle" font-size="12" fill="#999" font-style="italic">AI News · 2026-04-28 · OpenAI Misses Internal Sales Targets — AI Stocks Drop</text>
</svg>
