    <polyline points="20,40 60,50 90,35 130,80 160,100 180,130" fill="none" stroke="#E05555" stroke-width="2.5" stroke-dasharray="6,3"/>
    <text x="20" y="25" font-size="10" fill="#5CA46E">■ 目標</text>
    <text x="80" y="25" font-size="10" fill="#E05555">▶ 実績</text>
    <text x="100" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#E05555">目標未達</text>
    <text x="100" y="165" text-anchor="middle" font-size="10" fill="#888">Bloomberg 2026-04-28</text>
  </g>

