  <text x="130" y="180" font-size="13" fill="#888">Bloomberg  ·  2026-04-28  ·  #ビジネス #OpenAI #株価 #ARR</text>
  <line x1="130" y1="194" x2="1340" y2="194" stroke="#1A1D24" stroke-width="2"/>

