    <line x1="80" y1="195" x2="590" y2="195" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="130" y="210" text-anchor="middle" font-size="9" fill="#666">2025 Q3</text>
    <text x="230" y="210" text-anchor="middle" font-size="9" fill="#666">2025 Q4</text>
    <text x="330" y="210" text-anchor="middle" font-size="9" fill="#666">2026 Q1</text>
    <text x="430" y="210" text-anchor="middle" font-size="9" fill="#666">2026 Q2</text>
    <!-- OpenAI line (blue) -->
    <polyline points="130,175 230,135 330,95 430,91" fill="none" stroke="#5B8DEF" stroke-width="3"/>
    <circle cx="130" cy="175" r="5" fill="#5B8DEF"/>
    <circle cx="230" cy="135" r="5" fill="#5B8DEF"/>
    <circle cx="330" cy="95" r="5" fill="#5B8DEF"/>
    <circle cx="430" cy="91" r="5" fill="#5B8DEF" stroke="#E05555" stroke-width="2"/>
    <!-- Anthropic line (green) -->
    <polyline points="130,185 230,168 330,100 430,75" fill="none" stroke="#5CA46E" stroke-width="3"/>
    <circle cx="130" cy="185" r="5" fill="#5CA46E"/>
    <circle cx="230" cy="168" r="5" fill="#5CA46E"/>
    <circle cx="330" cy="100" r="5" fill="#5CA46E"/>
    <circle cx="430" cy="75" r="5" fill="#5CA46E"/>
