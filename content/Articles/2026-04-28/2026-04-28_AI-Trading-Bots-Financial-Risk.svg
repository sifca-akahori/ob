<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#FBF8F1"/>
      <circle cx="20" cy="20" r="0.4" fill="#C4B389" opacity="0.3"/>
      <circle cx="65" cy="60" r="0.5" fill="#C4B389" opacity="0.3"/>
    </pattern>
    <filter id="stickyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <line x1="110" y1="30" x2="110" y2="1020" stroke="#D88A8A" stroke-width="1.2" opacity="0.4"/>
  <g fill="#E8E2D3" opacity="0.7"><circle cx="50" cy="100" r="11"/><circle cx="50" cy="300" r="11"/><circle cx="50" cy="500" r="11"/><circle cx="50" cy="700" r="11"/><circle cx="50" cy="900" r="11"/><circle cx="50" cy="980" r="11"/></g>
  <g fill="none" stroke="#C8C0B0" stroke-width="1.5"><circle cx="50" cy="100" r="11"/><circle cx="50" cy="300" r="11"/><circle cx="50" cy="500" r="11"/><circle cx="50" cy="700" r="11"/><circle cx="50" cy="900" r="11"/><circle cx="50" cy="980" r="11"/></g>

  <!-- Category tape - orange for SNS -->
  <g transform="translate(1200, 28) rotate(-3)">
    <rect x="0" y="0" width="160" height="36" rx="4" fill="#E8A87C" opacity="0.9"/>
    <text x="80" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="white">#SNS</text>
  </g>
  <rect x="125" y="28" width="180" height="36" rx="6" fill="#2F3842"/>
  <text x="215" y="51" text-anchor="middle" font-size="15" font-weight="700" fill="white">2026-04-28</text>
  <text x="320" y="53" font-size="20" fill="#F5A623">⭐</text>

  <text x="130" y="105" font-size="32" font-weight="900" fill="#1A1D24">💹 「AIで6日間でトレーディングプラットフォームを作った。恐ろしかった」</text>
  <text x="130" y="147" font-size="20" font-weight="600" fill="#444">——Bloombergコラムが「誰でも作れる危険な金融ツール」に警鐘、HNで470+コメント議論</text>
  <text x="130" y="180" font-size="13" fill="#888">Bloomberg Opinion  ·  2026-04-28  ·  #SNS #金融AI #リスク #規制</text>
  <line x1="130" y1="194" x2="1340" y2="194" stroke="#1A1D24" stroke-width="2"/>

  <!-- Hero: Trading chart with warning -->
  <g transform="translate(135, 215)">
    <rect x="0" y="0" width="190" height="170" rx="8" fill="white" stroke="#E05555" stroke-width="2.5"/>
    <!-- Chart going up then crashing -->
    <polyline points="20,140 40,110 65,80 90,55 110,40 130,70 150,110 170,145" fill="none" stroke="#E05555" stroke-width="2.5"/>
    <polygon points="145,95 170,145 195,100" fill="#E05555" opacity="0.3"/>
    <!-- Warning sign -->
    <polygon points="95,15 125,65 65,65" fill="#F5A623" stroke="#1A1D24" stroke-width="2"/>
    <text x="95" y="55" text-anchor="middle" font-size="20" font-weight="900" fill="#1A1D24">!</text>
    <text x="95" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#E05555">Flash Crash Risk？</text>
  </g>

  <!-- Key numbers -->
  <g transform="translate(370, 215)" filter="url(#softShadow)">
    <rect x="0" y="0" width="980" height="160" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <rect x="0" y="0" width="980" height="42" rx="8" fill="#2F3842"/>
    <rect x="0" y="34" width="980" height="8" fill="#2F3842"/>
    <text x="490" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="white">📊 Bloombergコラム「6日間トレーディングAI」の衝撃</text>
    <text x="122" y="85" text-anchor="middle" font-size="42" font-weight="900" fill="#E8A87C">6日</text>
    <text x="122" y="107" text-anchor="middle" font-size="12" fill="#555">プラットフォーム構築日数</text>
    <text x="122" y="123" text-anchor="middle" font-size="11" fill="#888">（GPT-5.5使用）</text>
    <line x1="245" y1="55" x2="245" y2="150" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="367" y="85" text-anchor="middle" font-size="42" font-weight="900" fill="#E05555">470+</text>
    <text x="367" y="107" text-anchor="middle" font-size="12" fill="#555">HNコメント数</text>
    <text x="367" y="123" text-anchor="middle" font-size="11" fill="#888">（大議論を喚起）</text>
    <line x1="490" y1="55" x2="490" y2="150" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="612" y="85" text-anchor="middle" font-size="42" font-weight="900" fill="#5CA46E">$0</text>
    <text x="612" y="107" text-anchor="middle" font-size="12" fill="#555">コーディング外注費</text>
    <text x="612" y="123" text-anchor="middle" font-size="11" fill="#888">（全てGPT-5.5が生成）</text>
    <line x1="735" y1="55" x2="735" y2="150" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="857" y="85" text-anchor="middle" font-size="42" font-weight="900" fill="#8B7DB8">SECは</text>
    <text x="857" y="107" text-anchor="middle" font-size="42" font-weight="900" fill="#8B7DB8">？</text>
    <text x="857" y="130" text-anchor="middle" font-size="11" fill="#888">規制未整備の空白地帯</text>
    <text x="490" y="148" text-anchor="middle" font-size="10" fill="#999">出典: Bloomberg Opinion 2026-04-28</text>
  </g>

  <!-- HN discussion summary -->
  <g transform="translate(130, 400)" filter="url(#softShadow)">
    <rect x="0" y="0" width="680" height="220" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="340" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">💬 Hacker Newsで飛び交った主要意見</text>
    <line x1="20" y1="35" x2="660" y2="35" stroke="#E8E2D3" stroke-width="1"/>
    <!-- Pro -->
    <text x="25" y="57" font-size="12" font-weight="700" fill="#5CA46E">✅ 「これは民主化だ」派</text>
    <text x="25" y="74" font-size="11" fill="#333">「ExcelマクロトレーダーのAI版。昔もみんな怖がった」</text>
    <text x="25" y="90" font-size="11" fill="#333">「個人投資家の力を強化。知識格差の解消」</text>
    <text x="25" y="106" font-size="11" fill="#333">「バックテストが必要なのは分かっている人だけが使う」</text>
    <line x1="15" y1="118" x2="665" y2="118" stroke="#E8E2D3" stroke-width="0.8" stroke-dasharray="3,3"/>
    <!-- Con -->
    <text x="25" y="138" font-size="12" font-weight="700" fill="#E05555">❌ 「フラッシュクラッシュ2.0」派</text>
    <text x="25" y="155" font-size="11" fill="#333">「数万人が同じGPT-5.5に同じシグナルを生成させたら？」</text>
    <text x="25" y="171" font-size="11" fill="#333">「2010年フラッシュクラッシュ: アルゴの集団行動が原因」</text>
    <text x="25" y="187" font-size="11" fill="#333">「知識なき参入は包丁を渡すだけ。使い方を教えていない」</text>
    <text x="340" y="212" text-anchor="middle" font-size="10" fill="#999">出典: HN discussion 2026-04-28 (470+コメント)</text>
  </g>

  <!-- Regulation gap chart -->
  <g transform="translate(840, 400)" filter="url(#softShadow)">
    <rect x="0" y="0" width="500" height="220" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="250" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">⚖️ SECルールと現実のギャップ</text>
    <line x1="20" y1="35" x2="480" y2="35" stroke="#E8E2D3" stroke-width="1"/>
    <text x="25" y="58" font-size="12" font-weight="700" fill="#2F3842">規制あり（個人には適用外）:</text>
    <text x="25" y="76" font-size="11" fill="#555">投資顧問業：登録・適格性証明が必要</text>
    <text x="25" y="92" font-size="11" fill="#555">HFT：特定取引所でのアルゴ登録義務</text>
    <line x1="15" y1="104" x2="485" y2="104" stroke="#E8E2D3" stroke-width="0.8" stroke-dasharray="3,3"/>
    <text x="25" y="124" font-size="12" font-weight="700" fill="#E05555">規制の空白（灰色地帯）:</text>
    <text x="25" y="142" font-size="11" fill="#E05555">個人資金のみを対象とする自動売買ツール</text>
    <text x="25" y="158" font-size="11" fill="#555">→ 登録不要のケースが多い</text>
    <text x="25" y="174" font-size="11" fill="#E05555">AI生成コードによる非登録アルゴトレード</text>
    <text x="25" y="190" font-size="11" fill="#555">→ SECが想定していない「新種の問題」</text>
    <text x="250" y="212" text-anchor="middle" font-size="10" fill="#888">出典: Bloomberg / FT / SEC現行規制 (2026)</text>
  </g>

  <!-- Sticky notes -->
  <g transform="translate(130, 645) rotate(-1.2)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="265" height="145" rx="3" fill="#FFF9C4" stroke="#E8D84A" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="22" fill="#FFE566" opacity="0.7" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#666">📌 フラッシュクラッシュ2.0の怖さ</text>
    <text x="12" y="45" font-size="11" fill="#333">同一LLMが生成したシグナルに</text>
    <text x="12" y="60" font-size="11" fill="#333">多数の非専門家が従うと、</text>
    <text x="12" y="75" font-size="11" fill="#333">集団行動が同期化され</text>
    <text x="12" y="90" font-size="11" fill="#333">短時間で巨大な注文が</text>
    <text x="12" y="105" font-size="11" fill="#333">同一方向に集中する。</text>
    <text x="12" y="120" font-size="11" fill="#333">2010年の1.0より広範な崩壊も。</text>
    <text x="12" y="138" font-size="10" fill="#999">💡 HNで最も支持された懸念</text>
  </g>

  <g transform="translate(420, 638) rotate(0.8)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="265" height="145" rx="3" fill="#FFCCBC" stroke="#FF7043" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="22" fill="#FFAB91" opacity="0.8" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#BF360C">📌 「民主化」の逆説</text>
    <text x="12" y="45" font-size="11" fill="#333">「技術的に動く危険なツール」を</text>
    <text x="12" y="60" font-size="11" fill="#333">誰でも作れるようになった。</text>
    <text x="12" y="75" font-size="11" fill="#333">バックテスト・スリッページ・</text>
    <text x="12" y="90" font-size="11" fill="#333">ポジションサイジングを</text>
    <text x="12" y="105" font-size="11" fill="#333">理解しない参入者が市場に</text>
    <text x="12" y="120" font-size="11" fill="#333">参加する「武器の民主化」。</text>
    <text x="12" y="138" font-size="10" fill="#999">💡 知識なき権限の危険性</text>
  </g>

  <g transform="translate(710, 642) rotate(-0.5)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="265" height="145" rx="3" fill="#E1BEE7" stroke="#AB47BC" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="22" fill="#CE93D8" opacity="0.8" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#4A148C">📌 国際的な規制格差</text>
    <text x="12" y="45" font-size="11" fill="#333">SEC・ESMA（EU）・FCA（英）・</text>
    <text x="12" y="60" font-size="11" fill="#333">FSA（日）全てでAI生成</text>
    <text x="12" y="75" font-size="11" fill="#333">アルゴトレードへの規制が</text>
    <text x="12" y="90" font-size="11" fill="#333">追いついていない。</text>
    <text x="12" y="105" font-size="11" fill="#333">グローバルな規制整合が</text>
    <text x="12" y="120" font-size="11" fill="#333">できる前に市場が適応。</text>
    <text x="12" y="138" font-size="10" fill="#999">💡 規制のタイムラグ問題</text>
  </g>

  <g transform="translate(1000, 640) rotate(1.1)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="320" height="145" rx="3" fill="#C8E6C9" stroke="#8BC34A" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="22" fill="#A5D6A7" opacity="0.8" rx="3"/>
    <text x="160" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">📌 歴史的文脈</text>
    <text x="12" y="45" font-size="11" fill="#333">2010年: Flash Crash（-9.2%→回復）</text>
    <text x="12" y="60" font-size="11" fill="#333">原因: アルゴの集団行動・流動性消滅</text>
    <text x="12" y="75" font-size="11" fill="#333">2026年: AIが参入コストをゼロに近くした</text>
    <text x="12" y="90" font-size="11" fill="#333">→ 参加者数×影響規模が格段に拡大。</text>
    <text x="12" y="105" font-size="11" fill="#333">次のフラッシュクラッシュは桁が</text>
    <text x="12" y="120" font-size="11" fill="#333">違う規模になりうる。</text>
    <text x="12" y="138" font-size="10" fill="#555">💡 歴史は繰り返すか？</text>
  </g>

  <g transform="translate(130, 808)">
    <rect x="0" y="0" width="1210" height="115" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" opacity="0.95"/>
    <text x="30" y="28" font-size="14" font-weight="700" fill="#1A1D24">📋 コラムの詳細：6日間で何を作ったか</text>
    <line x1="15" y1="38" x2="1195" y2="38" stroke="#E8E2D3" stroke-width="1"/>
    <text x="30" y="60" font-size="12" fill="#333">作者: Bloombergコラムニスト（コーディング経験あり、金融ライセンスなし）</text>
    <text x="30" y="80" font-size="12" fill="#333">構築物: リアルタイム株価データ取得→GPT-5.5によるシグナル生成→証券APIへの自動注文送信 の全自動パイプライン</text>
    <text x="30" y="100" font-size="12" fill="#333">省略したもの: 適切なバックテスト、スリッページ考慮、ポジションサイジングリスク管理、規制コンプライアンス確認 →「技術的に動く危険なツール」と自ら評した</text>
  </g>

  <text x="700" y="1038" text-anchor="middle" font-size="12" fill="#999" font-style="italic">AI News · 2026-04-28 · Bloomberg: "I Built an AI Trading Platform in 6 Days. That's Terrifying."</text>
</svg>
