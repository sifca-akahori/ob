    <rect x="0" y="0" width="680" height="220" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="340" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">🏢 4月の主要企業レイオフ一覧</text>
    <line x1="20" y1="35" x2="660" y2="35" stroke="#E8E2D3" stroke-width="1"/>
    <!-- Table header -->
    <rect x="20" y="42" width="640" height="26" fill="#2F3842" rx="4"/>
    <text x="100" y="59" text-anchor="middle" font-size="11" fill="white">企業</text>
    <text x="250" y="59" text-anchor="middle" font-size="11" fill="white">削減数</text>
    <text x="390" y="59" text-anchor="middle" font-size="11" fill="white">公式理由</text>
    <text x="570" y="59" text-anchor="middle" font-size="11" fill="white">コスト削減目標</text>
    <!-- Rows -->
    <rect x="20" y="68" width="640" height="26" fill="#FFF5F5"/>
    <text x="100" y="85" text-anchor="middle" font-size="12" fill="#E05555">Meta</text>
    <text x="250" y="85" text-anchor="middle" font-size="12" fill="#333">~8,000人</text>
    <text x="390" y="85" text-anchor="middle" font-size="11" fill="#333">AI投資優先</text>
    <text x="570" y="85" text-anchor="middle" font-size="11" fill="#333">未公開</text>
    <rect x="20" y="94" width="640" height="26" fill="#FFF5F5"/>
    <text x="100" y="111" text-anchor="middle" font-size="12" fill="#E05555">Microsoft</text>
    <text x="250" y="111" text-anchor="middle" font-size="12" fill="#333">~8,750人</text>
    <text x="390" y="111" text-anchor="middle" font-size="11" fill="#333">希望退職（AI移行）</text>
    <text x="570" y="111" text-anchor="middle" font-size="11" fill="#333">未公開</text>
    <rect x="20" y="120" width="640" height="26" fill="#FFF5F5"/>
    <text x="100" y="137" text-anchor="middle" font-size="12" fill="#E05555">Oracle</text>
    <text x="250" y="137" text-anchor="middle" font-size="12" fill="#333">10,000→30,000人</text>
    <text x="390" y="137" text-anchor="middle" font-size="11" fill="#333">AI自動化</text>
    <text x="570" y="137" text-anchor="middle" font-size="11" fill="#333">$3B+</text>
    <rect x="20" y="146" width="640" height="26" fill="#FFF5F5"/>
    <text x="100" y="163" text-anchor="middle" font-size="12" fill="#E05555">Snap</text>
    <text x="250" y="163" text-anchor="middle" font-size="12" fill="#333">1,000人+</text>
    <text x="390" y="163" text-anchor="middle" font-size="11" fill="#333">AI生成コード65%</text>
    <text x="570" y="163" text-anchor="middle" font-size="11" fill="#333">$5億/年</text>
    <text x="340" y="210" text-anchor="middle" font-size="10" fill="#999">出典: CNBC / Tom's Hardware / WSWS 2026-04</text>
  </g>

  <!-- Job market shift chart -->
  <g transform="translate(840, 400)" filter="url(#softShadow)">
    <rect x="0" y="0" width="500" height="220" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="250" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">💼 求人市場の二極化（2024→2026）</text>
    <line x1="20" y1="35" x2="480" y2="35" stroke="#E8E2D3" stroke-width="1"/>
    <!-- Increasing -->
    <text x="30" y="62" font-size="12" font-weight="700" fill="#5CA46E">↑ 増加する職種</text>
    <text x="30" y="80" font-size="11" fill="#333">AIエンジニア (+340%)</text>
    <text x="30" y="98" font-size="11" fill="#333">MLエンジニア (+280%)</text>
    <text x="30" y="116" font-size="11" fill="#333">AIセーフティ研究者 (+220%)</text>
    <text x="30" y="134" font-size="11" fill="#333">プロンプトエンジニア (+190%)</text>
    <text x="30" y="152" font-size="11" fill="#333">AIプロダクトマネージャー (+150%)</text>
    <line x1="250" y1="50" x2="250" y2="210" stroke="#E8E2D3" stroke-width="1.5"/>
    <!-- Decreasing -->
    <text x="265" y="62" font-size="12" font-weight="700" fill="#E05555">↓ 減少する職種</text>
    <text x="265" y="80" font-size="11" fill="#333">一般SWE (-15%)</text>
    <text x="265" y="98" font-size="11" fill="#333">データ入力・処理 (-45%)</text>
    <text x="265" y="116" font-size="11" fill="#333">定型テスト担当 (-38%)</text>
    <text x="265" y="134" font-size="11" fill="#333">初級コーダー (-28%)</text>
    <text x="265" y="152" font-size="11" fill="#333">IT汎用サポート (-22%)</text>
    <text x="250" y="200" text-anchor="middle" font-size="10" fill="#999">出典: LinkedIn 2026年データ</text>
  </g>

  <!-- Sticky notes -->
  <g transform="translate(130, 645) rotate(-1.1)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="265" height="145" rx="3" fill="#FFF9C4" stroke="#E8D84A" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="22" fill="#FFE566" opacity="0.7" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#666">📌 「AI起因」の自己申告バイアス</text>
    <text x="12" y="45" font-size="11" fill="#333">採用マネージャーの59%が</text>
    <text x="12" y="60" font-size="11" fill="#333">「実際は財務的制約が主因</text>
    <text x="12" y="75" font-size="11" fill="#333">でもAIを理由にした」と告白。</text>
    <text x="12" y="90" font-size="11" fill="#333">「AI起因48%」は過大評価の</text>
    <text x="12" y="105" font-size="11" fill="#333">可能性があり、パニック的</text>
    <text x="12" y="120" font-size="11" fill="#333">判断を避けるべき。</text>
    <text x="12" y="138" font-size="10" fill="#999">💡 Motion Recruitment 2026調査</text>
  </g>

  <g transform="translate(420, 638) rotate(0.9)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="265" height="145" rx="3" fill="#FFCCBC" stroke="#FF7043" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="22" fill="#FFAB91" opacity="0.8" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#BF360C">📌 スキルギャップ・スパイラル</text>
    <text x="12" y="45" font-size="11" fill="#333">コーディングブートキャンプ受講</text>
    <text x="12" y="60" font-size="11" fill="#333">+89%増。しかし企業が求める</text>
    <text x="12" y="75" font-size="11" fill="#333">「AIネイティブ」スキルは</text>
    <text x="12" y="90" font-size="11" fill="#333">6ヶ月ごとに変化しており</text>
    <text x="12" y="105" font-size="11" fill="#333">キャッチアップが追いつかない</text>
    <text x="12" y="120" font-size="11" fill="#333">悪循環が生じている。</text>
    <text x="12" y="138" font-size="10" fill="#999">💡 学習速度の限界</text>
  </g>

  <g transform="translate(710, 642) rotate(-0.8)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="265" height="145" rx="3" fill="#E1BEE7" stroke="#AB47BC" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="22" fill="#CE93D8" opacity="0.8" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#4A148C">📌 政治的反AI規制の土壌</text>
    <text x="12" y="45" font-size="11" fill="#333">米上院「AI雇用置換課税法案」</text>
    <text x="12" y="60" font-size="11" fill="#333">の審議が再開予定。</text>
    <text x="12" y="75" font-size="11" fill="#333">AI投資企業への失業支援</text>
    <text x="12" y="90" font-size="11" fill="#333">基金への拠出義務化。</text>
    <text x="12" y="105" font-size="11" fill="#333">企業のAI採用加速が</text>
    <text x="12" y="120" font-size="11" fill="#333">反AI規制を生む逆説。</text>
    <text x="12" y="138" font-size="10" fill="#999">💡 2026後半の選挙争点に</text>
  </g>

  <g transform="translate(1000, 640) rotate(1.2)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="320" height="145" rx="3" fill="#C8E6C9" stroke="#8BC34A" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="22" fill="#A5D6A7" opacity="0.8" rx="3"/>
    <text x="160" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">📌 Snap「AI生成コード65%」の衝撃</text>
    <text x="12" y="45" font-size="11" fill="#333">Snapの4/21発表：社内コードの</text>
    <text x="12" y="60" font-size="11" fill="#333">65%超がAI生成。</text>
    <text x="12" y="75" font-size="11" fill="#333">これが今回のメタ・MS削減</text>
    <text x="12" y="90" font-size="11" fill="#333">発表への受け止めを変えた。</text>
    <text x="12" y="105" font-size="11" fill="#333">「AI代替は理論でなく現実」</text>
    <text x="12" y="120" font-size="11" fill="#333">という空気を醸成した。</text>
    <text x="12" y="138" font-size="10" fill="#555">💡 先行事例の連鎖効果</text>
  </g>

  <g transform="translate(130, 808)">
    <rect x="0" y="0" width="1210" height="115" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" opacity="0.95"/>
    <text x="30" y="28" font-size="14" font-weight="700" fill="#1A1D24">📊 2026年テックレイオフ累計の内訳（推計）</text>
    <line x1="15" y1="38" x2="1195" y2="38" stroke="#E8E2D3" stroke-width="1"/>
    <text x="30" y="60" font-size="12" fill="#333">・総数: 92,000人超 ／ Q1: 78,557人（Tom's Hardware集計）／ Q2 4月時点: 92,000人超突破</text>
    <text x="30" y="80" font-size="12" fill="#333">・地域: 76%が米国 ／ 欧州15% ／ アジア太平洋9%（Layoffs.fyi集計ベース）</text>
    <text x="30" y="100" font-size="12" fill="#333">・原因（企業申告）: AI自動化48% ／ 事業縮小27% ／ 組織再編18% ／ その他7%（ただし実態と乖離の可能性が高い）</text>
  </g>

  <text x="700" y="1038" text-anchor="middle" font-size="12" fill="#999" font-style="italic">AI News · 2026-04-28 · Tech Layoffs Hit 92,000 in 2026 — 48% Attributed to AI Automation</text>
</svg>
