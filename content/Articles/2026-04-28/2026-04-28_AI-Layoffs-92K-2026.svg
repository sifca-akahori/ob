<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#FBF8F1"/>
      <circle cx="18" cy="22" r="0.4" fill="#C4B389" opacity="0.3"/>
      <circle cx="70" cy="58" r="0.5" fill="#C4B389" opacity="0.3"/>
    </pattern>
    <filter id="stickyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <line x1="110" y1="30" x2="110" y2="1020" stroke="#D88A8A" stroke-width="1.2" opacity="0.4"/>
  <g fill="#E8E2D3" opacity="0.7"><circle cx="50" cy="100" r="11"/><circle cx="50" cy="300" r="11"/><circle cx="50" cy="500" r="11"/><circle cx="50" cy="700" r="11"/><circle cx="50" cy="900" r="11"/><circle cx="50" cy="980" r="11"/></g>
  <g fill="none" stroke="#C8C0B0" stroke-width="1.5"><circle cx="50" cy="100" r="11"/><circle cx="50" cy="300" r="11"/><circle cx="50" cy="500" r="11"/><circle cx="50" cy="700" r="11"/><circle cx="50" cy="900" r="11"/><circle cx="50" cy="980" r="11"/></g>

  <!-- Category tape - orange for SNS -->
  <g transform="translate(1200, 28) rotate(-3)">
    <rect x="0" y="0" width="160" height="36" rx="4" fill="#E8A87C" opacity="0.9"/>
    <text x="80" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="white">#SNS</text>
  </g>
  <rect x="125" y="28" width="180" height="36" rx="6" fill="#2F3842"/>
  <text x="215" y="51" text-anchor="middle" font-size="15" font-weight="700" fill="white">2026-04-28</text>
  <text x="320" y="53" font-size="20" fill="#F5A623">⭐⭐</text>

  <text x="130" y="105" font-size="32" font-weight="900" fill="#1A1D24">🏭 2026年テックレイオフ <tspan fill="#E05555">9.2万人</tspan> 突破</text>
  <text x="130" y="147" font-size="21" font-weight="600" fill="#444">——48%が「AI起因」、LinkedInのAI求人は+340%・従来型エンジニア求人-15%</text>
  <text x="130" y="180" font-size="13" fill="#888">CNBC / Tom's Hardware / WSWS  ·  2026-04-28  ·  #SNS #レイオフ #労働市場</text>
  <line x1="130" y1="194" x2="1340" y2="194" stroke="#1A1D24" stroke-width="2"/>

  <!-- Hero: Person icon with downward arrow -->
  <g transform="translate(135, 215)">
    <circle cx="95" cy="50" r="28" fill="#FFE0E0" stroke="#E05555" stroke-width="2.5"/>
    <text x="95" y="58" text-anchor="middle" font-size="22">👤</text>
    <!-- Downward arrow -->
    <line x1="95" y1="80" x2="95" y2="140" stroke="#E05555" stroke-width="3"/>
    <polygon points="80,125 95,155 110,125" fill="#E05555"/>
    <text x="95" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#E05555">92,000+</text>
    <text x="95" y="195" text-anchor="middle" font-size="11" fill="#888">2026年レイオフ</text>
  </g>

  <!-- Key numbers -->
  <g transform="translate(370, 215)" filter="url(#softShadow)">
    <rect x="0" y="0" width="980" height="160" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <rect x="0" y="0" width="980" height="42" rx="8" fill="#2F3842"/>
    <rect x="0" y="34" width="980" height="8" fill="#2F3842"/>
    <text x="490" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="white">📊 2026年テックレイオフ データ</text>
    <text x="122" y="80" text-anchor="middle" font-size="38" font-weight="900" fill="#E05555">92,000+</text>
    <text x="122" y="102" text-anchor="middle" font-size="12" fill="#555">2026年レイオフ累計</text>
    <text x="122" y="118" text-anchor="middle" font-size="11" fill="#888">（うち76%が米国）</text>
    <line x1="245" y1="55" x2="245" y2="150" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="367" y="80" text-anchor="middle" font-size="38" font-weight="900" fill="#E8A87C">48%</text>
    <text x="367" y="102" text-anchor="middle" font-size="12" fill="#555">「AI起因」と申告された割合</text>
    <text x="367" y="118" text-anchor="middle" font-size="11" fill="#888">（59%が「実態より誇張」と証言）</text>
    <line x1="490" y1="55" x2="490" y2="150" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="612" y="80" text-anchor="middle" font-size="38" font-weight="900" fill="#5CA46E">+340%</text>
    <text x="612" y="102" text-anchor="middle" font-size="12" fill="#555">AI関連求人増加率</text>
    <text x="612" y="118" text-anchor="middle" font-size="11" fill="#5CA46E">（LinkedIn 2026年調査）</text>
    <line x1="735" y1="55" x2="735" y2="150" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="857" y="80" text-anchor="middle" font-size="38" font-weight="900" fill="#5B8DEF">-15%</text>
    <text x="857" y="102" text-anchor="middle" font-size="12" fill="#555">従来型エンジニア求人</text>
    <text x="857" y="118" text-anchor="middle" font-size="11" fill="#888">（LinkedIn 2026年調査）</text>
    <text x="490" y="148" text-anchor="middle" font-size="10" fill="#999">出典: Tom's Hardware / CNBC / LinkedIn 2026</text>
  </g>

