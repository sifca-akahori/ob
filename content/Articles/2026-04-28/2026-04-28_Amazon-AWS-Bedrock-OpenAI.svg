    <line x1="15" y1="105" x2="405" y2="105" stroke="#E8E2D3" stroke-width="0.8" stroke-dasharray="3,3"/>
    <text x="20" y="125" font-size="12" font-weight="700" fill="#5B8DEF">主要機能</text>
    <text x="20" y="143" font-size="11" fill="#333">• GUIベースのエージェント定義</text>
    <text x="20" y="159" font-size="11" fill="#333">• IAM統合・VPC対応・CloudWatch</text>
    <text x="20" y="175" font-size="11" fill="#333">• コスト管理・承認ワークフロー</text>
    <text x="20" y="191" font-size="11" fill="#333">• 監査ログ・アクセス制御</text>
    <text x="210" y="212" text-anchor="middle" font-size="10" fill="#888">「最後の1マイル」問題を解消</text>
  </g>

