    <text x="210" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">🆕 Bedrock Managed Agents とは</text>
    <line x1="20" y1="35" x2="400" y2="35" stroke="#E8E2D3" stroke-width="1"/>
