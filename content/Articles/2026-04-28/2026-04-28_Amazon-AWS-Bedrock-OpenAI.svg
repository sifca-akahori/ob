    <rect x="0" y="0" width="265" height="22" fill="#A5D6A7" opacity="0.8" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">📌 Azureへの打撃</text>
    <text x="12" y="45" font-size="11" fill="#333">Azure独占が最大のOpenAI</text>
    <text x="12" y="60" font-size="11" fill="#333">差別化要因だったが消滅。</text>
    <text x="12" y="75" font-size="11" fill="#333">Azure ID・コンプライアンス</text>
    <text x="12" y="90" font-size="11" fill="#333">機能のエコシステムで</text>
    <text x="12" y="105" font-size="11" fill="#333">差別化するしかなくなった。</text>
    <text x="12" y="128" font-size="10" fill="#999">💡 Microsoftの誤算</text>
  </g>

  <g transform="translate(710, 642) rotate(-0.5)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="265" height="145" rx="3" fill="#E1BEE7" stroke="#AB47BC" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="22" fill="#CE93D8" opacity="0.8" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#4A148C">📌 OpenAIの収益多様化</text>
    <text x="12" y="45" font-size="11" fill="#333">Bedrock経由でAWSが</text>
    <text x="12" y="60" font-size="11" fill="#333">利用料の一部をOpenAIに</text>
    <text x="12" y="75" font-size="11" fill="#333">支払う仕組みに。</text>
    <text x="12" y="90" font-size="11" fill="#333">Azure以外からの直接</text>
    <text x="12" y="105" font-size="11" fill="#333">収益がARR成長を加速させる。</text>
    <text x="12" y="128" font-size="10" fill="#999">💡 目標達成への布石</text>
  </g>

  <g transform="translate(1000, 640) rotate(1.2)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="320" height="145" rx="3" fill="#FFCCBC" stroke="#FF7043" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="22" fill="#FFAB91" opacity="0.8" rx="3"/>
    <text x="160" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#BF360C">📌 Bedrock vs Vertex AI競争</text>
    <text x="12" y="45" font-size="11" fill="#333">Bedrock：OpenAI+Claude+Meta</text>
    <text x="12" y="60" font-size="11" fill="#333">を擁する「最大カタログ」に。</text>
    <text x="12" y="75" font-size="11" fill="#333">Vertex AI：Gemini中心だが</text>
    <text x="12" y="90" font-size="11" fill="#333">A2Aプロトコル150社本番稼働</text>
    <text x="12" y="105" font-size="11" fill="#333">という実績がある。</text>
    <text x="12" y="120" font-size="11" fill="#333">→ 価格・SLA・コンプラで差別化。</text>
    <text x="12" y="138" font-size="10" fill="#555">💡 AI AppStore戦争の本番</text>
