  <g transform="translate(130, 808)">
    <rect x="0" y="0" width="1210" height="115" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" opacity="0.95"/>
    <text x="30" y="28" font-size="14" font-weight="700" fill="#1A1D24">🏗️ Bedrock Managed Agentsの技術的意味</text>
    <line x1="15" y1="38" x2="1195" y2="38" stroke="#E8E2D3" stroke-width="1"/>
    <text x="30" y="60" font-size="12" fill="#333">従来: エンタープライズでOpenAIエージェントを使うには、プロンプトエンジニアリング知識・自社インフラ整備・セキュリティ設計が必要。「最後の1マイル」が障壁。</text>
    <text x="30" y="80" font-size="12" fill="#333">今後: AWS IAM・VPC・CloudWatchと統合されたGUIワークフロー定義でエージェント展開可能。IT部門が知識なしで承認・ログ・コスト管理できる「AI民主化」の実現。</text>
    <text x="30" y="100" font-size="12" fill="#333">リスク: 「簡単に作れる」ことで設計の甘いエージェントが本番環境に大量展開されるリスクも。LMDeploy CVE-2026-33626（13時間で悪用）の教訓を忘れてはならない。</text>
  </g>

  <text x="700" y="1038" text-anchor="middle" font-size="12" fill="#999" font-style="italic">AI News · 2026-04-28 · Amazon AWS Bedrock Integrates OpenAI Within 24h of Exclusivity End</text>
