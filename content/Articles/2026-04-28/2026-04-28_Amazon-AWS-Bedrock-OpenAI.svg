    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#666">📌 AmazonのAI中立戦略</text>
    <text x="12" y="45" font-size="11" fill="#333">Anthropic $33B投資しながら</text>
    <text x="12" y="60" font-size="11" fill="#333">OpenAIも提供。まるで</text>
    <text x="12" y="75" font-size="11" fill="#333">「AIのAppStore」として</text>
    <text x="12" y="90" font-size="11" fill="#333">どのモデルが勝っても</text>
    <text x="12" y="105" font-size="11" fill="#333">手数料を取る戦略。</text>
    <text x="12" y="128" font-size="10" fill="#999">💡 インフラ制覇の論理</text>
