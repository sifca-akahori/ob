<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#FBF8F1"/>
      <circle cx="25" cy="15" r="0.4" fill="#C4B389" opacity="0.3"/>
      <circle cx="70" cy="55" r="0.5" fill="#C4B389" opacity="0.3"/>
      <circle cx="40" cy="80" r="0.3" fill="#C4B389" opacity="0.3"/>
    </pattern>
    <filter id="stickyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <line x1="110" y1="30" x2="110" y2="1020" stroke="#D88A8A" stroke-width="1.2" opacity="0.4"/>

  <!-- Binding holes -->
  <g fill="#E8E2D3" opacity="0.7"><circle cx="50" cy="100" r="11"/><circle cx="50" cy="300" r="11"/><circle cx="50" cy="500" r="11"/><circle cx="50" cy="700" r="11"/><circle cx="50" cy="900" r="11"/><circle cx="50" cy="980" r="11"/></g>
  <g fill="none" stroke="#C8C0B0" stroke-width="1.5"><circle cx="50" cy="100" r="11"/><circle cx="50" cy="300" r="11"/><circle cx="50" cy="500" r="11"/><circle cx="50" cy="700" r="11"/><circle cx="50" cy="900" r="11"/><circle cx="50" cy="980" r="11"/></g>

  <!-- Category tape -->
  <g transform="translate(1180, 28) rotate(-3)">
    <rect x="0" y="0" width="180" height="36" rx="4" fill="#5CA46E" opacity="0.85"/>
    <text x="90" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="white">#ビジネス</text>
  </g>

  <!-- Date badge -->
  <rect x="125" y="28" width="180" height="36" rx="6" fill="#2F3842"/>
  <text x="215" y="51" text-anchor="middle" font-size="15" font-weight="700" fill="white">2026-04-28</text>

  <!-- Impact -->
  <text x="320" y="53" font-size="20" fill="#F5A623">⭐⭐⭐</text>

  <!-- Title -->
  <text x="130" y="105" font-size="34" font-weight="900" fill="#1A1D24">⚖️ マスク対OpenAI裁判、開廷</text>
  <text x="130" y="148" font-size="22" font-weight="600" fill="#444">——「彼らは慈善団体を盗んだ」vs「マスクは思い通りにならなかっただけ」</text>
  <text x="130" y="180" font-size="13" fill="#888">CNN Business · NPR · CNBC  ·  2026-04-28  ·  #ビジネス #OpenAI #ElonMusk #裁判</text>
  <line x1="130" y1="194" x2="1340" y2="194" stroke="#1A1D24" stroke-width="2"/>

  <!-- Hero: Courtroom gavel -->
  <g transform="translate(130, 215)">
    <!-- Gavel head -->
    <rect x="30" y="55" width="110" height="45" rx="8" fill="#8B6914" stroke="#1A1D24" stroke-width="3"/>
    <rect x="45" y="65" width="80" height="25" rx="4" fill="#A87D20"/>
    <!-- Handle -->
    <line x1="140" y1="80" x2="200" y2="120" stroke="#6B4F12" stroke-width="12" stroke-linecap="round"/>
    <!-- Sound block -->
    <rect x="10" y="110" width="130" height="30" rx="4" fill="#C4A870" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="85" y="150" text-anchor="middle" font-size="12" fill="#666" font-style="italic">Oakland Federal Court</text>
  </g>

  <!-- Key facts -->
  <g transform="translate(380, 215)" filter="url(#softShadow)">
    <rect x="0" y="0" width="970" height="155" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <rect x="0" y="0" width="970" height="42" rx="8" fill="#2F3842"/>
    <rect x="0" y="34" width="970" height="8" fill="#2F3842"/>
    <text x="485" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="white">📋 裁判の主要データポイント</text>
    <!-- 4 columns -->
    <text x="120" y="72" text-anchor="middle" font-size="32" font-weight="900" fill="#E05555">3</text>
    <text x="120" y="92" text-anchor="middle" font-size="12" fill="#555">週間の審理予定</text>
    <line x1="242" y1="55" x2="242" y2="150" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="365" y="72" text-anchor="middle" font-size="32" font-weight="900" fill="#5CA46E">5+</text>
    <text x="365" y="92" text-anchor="middle" font-size="12" fill="#555">証言予定者（マスク・アルトマン・</text>
    <text x="365" y="108" text-anchor="middle" font-size="11" fill="#555">ナデラ・ブロックマン他）</text>
    <line x1="485" y1="55" x2="485" y2="150" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="610" y="72" text-anchor="middle" font-size="32" font-weight="900" fill="#8B7DB8">2015</text>
    <text x="610" y="92" text-anchor="middle" font-size="12" fill="#555">OpenAI設立年</text>
    <text x="610" y="108" text-anchor="middle" font-size="11" fill="#555">（非営利として）</text>
    <line x1="730" y1="55" x2="730" y2="150" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="850" y="72" text-anchor="middle" font-size="28" font-weight="900" fill="#E8A87C">$880B</text>
    <text x="850" y="92" text-anchor="middle" font-size="12" fill="#555">OpenAI二次市場評価</text>
    <text x="850" y="108" text-anchor="middle" font-size="11" fill="#555">（裁判前 ※Anthropicが$1T超）</text>
    <text x="485" y="145" text-anchor="middle" font-size="10" fill="#999">出典: CNN Business / CNBC 2026-04-28</text>
  </g>

  <!-- Main: Two sides argument -->
  <g transform="translate(130, 395)" filter="url(#softShadow)">
    <rect x="0" y="0" width="615" height="220" rx="8" fill="#FFF3F3" stroke="#E05555" stroke-width="2.5"/>
    <rect x="0" y="0" width="615" height="42" rx="8" fill="#E05555"/>
    <rect x="0" y="34" width="615" height="8" fill="#E05555"/>
    <text x="307" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="white">⚔️ マスク弁護団の主張</text>
    <text x="20" y="68" font-size="13" font-weight="700" fill="#E05555">「慈善団体を盗んだ」</text>
    <text x="20" y="90" font-size="12" fill="#333">• 非営利→営利転換は設立誓約の違反</text>
    <text x="20" y="110" font-size="12" fill="#333">• 初期資金・人材・アイデアを提供したマスクを</text>
    <text x="20" y="126" font-size="12" fill="#333">　裏切って自己利益を優先した</text>
    <text x="20" y="146" font-size="12" fill="#333">• マスク証言: 「アイデア・名前・メンバー・資金</text>
    <text x="20" y="162" font-size="12" fill="#333">　全て私がやった。非営利前提での参加だった」</text>
    <text x="20" y="182" font-size="12" fill="#333">• 請求: AGI研究成果の公共還元 / アルトマン解任</text>
    <text x="307" y="210" text-anchor="middle" font-size="11" fill="#888">弁護士: スティーブ・モロ氏</text>
  </g>

  <g transform="translate(775, 395)" filter="url(#softShadow)">
    <rect x="0" y="0" width="565" height="220" rx="8" fill="#F0FFF0" stroke="#5CA46E" stroke-width="2.5"/>
    <rect x="0" y="0" width="565" height="42" rx="8" fill="#5CA46E"/>
    <rect x="0" y="34" width="565" height="8" fill="#5CA46E"/>
    <text x="282" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="white">🛡️ OpenAI側の反論</text>
    <text x="20" y="68" font-size="13" font-weight="700" fill="#2E7D32">「思い通りにならなかっただけ」</text>
    <text x="20" y="90" font-size="12" fill="#333">• マスクはOpenAIを去った後にxAIを設立</text>
    <text x="20" y="110" font-size="12" fill="#333">　→ 「理念守護」ではなく「競合封じ」の訴訟</text>
    <text x="20" y="130" font-size="12" fill="#333">• ミッション継続に必要な転換として営利化</text>
    <text x="20" y="150" font-size="12" fill="#333">• ARR $25B・ChatGPT 9億ユーザーは</text>
    <text x="20" y="166" font-size="12" fill="#333">　人類へのAI提供という使命を体現している</text>
    <text x="20" y="186" font-size="12" fill="#333">• 利益相反：原告自身が直接競合のxAI経営</text>
    <text x="282" y="210" text-anchor="middle" font-size="11" fill="#888">弁護士: ウィリアム・サビット氏</text>
  </g>

  <!-- Sticky notes -->
  <g transform="translate(130, 640) rotate(-1.2)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="265" height="145" rx="3" fill="#FFF9C4" stroke="#E8D84A" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="22" fill="#FFE566" opacity="0.7" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#666">📌 IPOへの法的リスク</text>
    <text x="12" y="45" font-size="11" fill="#333">「法的リスク未解消」として</text>
    <text x="12" y="60" font-size="11" fill="#333">IPO引受証券会社が上場延期</text>
    <text x="12" y="75" font-size="11" fill="#333">を要求する可能性がある。</text>
    <text x="12" y="90" font-size="11" fill="#333">裁判結果は2026後半のIPO</text>
    <text x="12" y="105" font-size="11" fill="#333">計画に直接影響。評価額</text>
    <text x="12" y="120" font-size="11" fill="#333">$880Bへのリスクプレミアム。</text>
    <text x="12" y="138" font-size="10" fill="#999">💡 IPO最大の不確実性</text>
  </g>

  <g transform="translate(420, 635) rotate(0.8)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="265" height="145" rx="3" fill="#FFCCBC" stroke="#FF7043" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="22" fill="#FFAB91" opacity="0.8" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#BF360C">📌 陪審の感情的バイアス</text>
    <text x="12" y="45" font-size="11" fill="#333">陪審候補調査でマスクへの</text>
    <text x="12" y="60" font-size="11" fill="#333">否定的感情が多数派と判明。</text>
    <text x="12" y="75" font-size="11" fill="#333">技術系裁判で感情バイアスが</text>
    <text x="12" y="90" font-size="11" fill="#333">判決に影響するリスクを</text>
    <text x="12" y="105" font-size="11" fill="#333">両弁護団が警戒している。</text>
    <text x="12" y="120" font-size="11" fill="#333">（People don't like him）</text>
    <text x="12" y="138" font-size="10" fill="#999">💡 NBCNews報道</text>
  </g>

  <g transform="translate(710, 638) rotate(-0.5)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="265" height="145" rx="3" fill="#E1BEE7" stroke="#AB47BC" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="22" fill="#CE93D8" opacity="0.8" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#4A148C">📌 ガバナンス文書が武器に</text>
    <text x="12" y="45" font-size="11" fill="#333">判決が「設立誓約違反」を</text>
    <text x="12" y="60" font-size="11" fill="#333">認めた場合、AI企業の安全性</text>
    <text x="12" y="75" font-size="11" fill="#333">コミットメントが将来の法的</text>
    <text x="12" y="90" font-size="11" fill="#333">拘束力を持つリスクが生まれる。</text>
    <text x="12" y="105" font-size="11" fill="#333">創業者の「About」ページや</text>
    <text x="12" y="120" font-size="11" fill="#333">システムカードが証拠に。</text>
    <text x="12" y="138" font-size="10" fill="#999">💡 全AI企業への影響</text>
  </g>

  <g transform="translate(1000, 636) rotate(1.3)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="320" height="145" rx="3" fill="#C8E6C9" stroke="#8BC34A" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="22" fill="#A5D6A7" opacity="0.8" rx="3"/>
    <text x="160" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">📌 証言予定者と見どころ</text>
    <text x="12" y="45" font-size="11" fill="#333">• マスク本人：初日証言開始</text>
    <text x="12" y="60" font-size="11" fill="#333">• サム・アルトマン：営利転換の判断</text>
    <text x="12" y="75" font-size="11" fill="#333">• グレッグ・ブロックマン：設立時のやりとり</text>
    <text x="12" y="90" font-size="11" fill="#333">• サティア・ナデラ：Microsoft投資の目的</text>
    <text x="12" y="105" font-size="11" fill="#333">• 各研究者：初期の約束と実態</text>
    <text x="12" y="120" font-size="11" fill="#333">→ マイクロソフトCEOの証言が最大の焦点</text>
    <text x="12" y="138" font-size="10" fill="#555">💡 ナデラ発言が株価を動かす可能性</text>
  </g>

  <!-- Timeline bottom -->
  <g transform="translate(130, 805)">
    <rect x="0" y="0" width="1210" height="115" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" opacity="0.95"/>
    <text x="30" y="28" font-size="14" font-weight="700" fill="#1A1D24">📅 裁判のタイムライン（予定）</text>
    <line x1="15" y1="38" x2="1195" y2="38" stroke="#E8E2D3" stroke-width="1"/>
    <!-- Timeline -->
    <line x1="40" y1="72" x2="1180" y2="72" stroke="#2F3842" stroke-width="2"/>
    <circle cx="100" cy="72" r="8" fill="#E05555"/>
    <text x="100" y="58" text-anchor="middle" font-size="10" fill="#E05555">4/28</text>
    <text x="100" y="90" text-anchor="middle" font-size="10" fill="#333">開廷・冒頭陳述</text>
    <text x="100" y="103" text-anchor="middle" font-size="10" fill="#333">マスク初証言</text>
    <circle cx="340" cy="72" r="8" fill="#8B7DB8"/>
    <text x="340" y="58" text-anchor="middle" font-size="10" fill="#8B7DB8">5月上旬</text>
    <text x="340" y="90" text-anchor="middle" font-size="10" fill="#333">アルトマン証言</text>
    <circle cx="580" cy="72" r="8" fill="#5B8DEF"/>
    <text x="580" y="58" text-anchor="middle" font-size="10" fill="#5B8DEF">5月中旬</text>
    <text x="580" y="90" text-anchor="middle" font-size="10" fill="#333">ナデラ・研究者証言</text>
    <circle cx="820" cy="72" r="8" fill="#5CA46E"/>
    <text x="820" y="58" text-anchor="middle" font-size="10" fill="#5CA46E">5月下旬</text>
    <text x="820" y="90" text-anchor="middle" font-size="10" fill="#333">最終弁論</text>
    <circle cx="1060" cy="72" r="8" fill="#E8A87C"/>
    <text x="1060" y="58" text-anchor="middle" font-size="10" fill="#E8A87C">6月以降</text>
    <text x="1060" y="90" text-anchor="middle" font-size="10" fill="#333">陪審評決</text>
  </g>

  <text x="700" y="1038" text-anchor="middle" font-size="12" fill="#999" font-style="italic">AI News · 2026-04-28 · Musk vs OpenAI Trial Day 1 — Opening Statements in Oakland</text>
</svg>
