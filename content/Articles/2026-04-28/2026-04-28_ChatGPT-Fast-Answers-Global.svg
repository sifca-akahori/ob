<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#FBF8F1"/>
      <circle cx="22" cy="19" r="0.4" fill="#C4B389" opacity="0.3"/>
      <circle cx="68" cy="58" r="0.5" fill="#C4B389" opacity="0.3"/>
    </pattern>
    <filter id="stickyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <line x1="110" y1="30" x2="110" y2="1020" stroke="#D88A8A" stroke-width="1.2" opacity="0.4"/>
  <g fill="#E8E2D3" opacity="0.7"><circle cx="50" cy="100" r="11"/><circle cx="50" cy="300" r="11"/><circle cx="50" cy="500" r="11"/><circle cx="50" cy="700" r="11"/><circle cx="50" cy="900" r="11"/><circle cx="50" cy="980" r="11"/></g>
  <g fill="none" stroke="#C8C0B0" stroke-width="1.5"><circle cx="50" cy="100" r="11"/><circle cx="50" cy="300" r="11"/><circle cx="50" cy="500" r="11"/><circle cx="50" cy="700" r="11"/><circle cx="50" cy="900" r="11"/><circle cx="50" cy="980" r="11"/></g>

  <g transform="translate(1180, 28) rotate(-3)">
    <rect x="0" y="0" width="180" height="36" rx="4" fill="#5CA46E" opacity="0.85"/>
    <text x="90" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="white">#ビジネス</text>
  </g>
  <rect x="125" y="28" width="180" height="36" rx="6" fill="#2F3842"/>
  <text x="215" y="51" text-anchor="middle" font-size="15" font-weight="700" fill="white">2026-04-28</text>
  <text x="320" y="53" font-size="20" fill="#F5A623">⭐⭐</text>

  <text x="130" y="105" font-size="33" font-weight="900" fill="#1A1D24">⚡ ChatGPT「Fast Answers」グローバル展開</text>
  <text x="130" y="147" font-size="21" font-weight="600" fill="#444">——記憶・コンテキストをスキップした爆速モード、全プランで提供開始</text>
  <text x="130" y="180" font-size="13" fill="#888">OpenAI / Releasebot  ·  2026-04-28  ·  #ビジネス #ChatGPT #UX #レイテンシ</text>
  <line x1="130" y1="194" x2="1340" y2="194" stroke="#1A1D24" stroke-width="2"/>

  <!-- Hero: Lightning bolt -->
  <g transform="translate(135, 215)">
    <circle cx="95" cy="88" r="72" fill="#FFFDE8" stroke="#F5A623" stroke-width="2.5"/>
    <text x="95" y="110" text-anchor="middle" font-size="72" fill="#F5A623">⚡</text>
    <text x="95" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#888">Fast Answers</text>
    <text x="95" y="192" text-anchor="middle" font-size="11" fill="#888">GPT-5.5ベース</text>
  </g>

  <!-- Key numbers -->
  <g transform="translate(370, 215)" filter="url(#softShadow)">
    <rect x="0" y="0" width="980" height="160" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <rect x="0" y="0" width="980" height="42" rx="8" fill="#2F3842"/>
    <rect x="0" y="34" width="980" height="8" fill="#2F3842"/>
    <text x="490" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="white">📊 Fast Answers の主要スペック</text>
    <text x="122" y="85" text-anchor="middle" font-size="38" font-weight="900" fill="#5B8DEF">全プラン</text>
    <text x="122" y="107" text-anchor="middle" font-size="12" fill="#555">対象（無料・有料・企業）</text>
    <text x="122" y="123" text-anchor="middle" font-size="11" fill="#888">ログイン不要も含む</text>
    <line x1="245" y1="55" x2="245" y2="150" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="367" y="85" text-anchor="middle" font-size="38" font-weight="900" fill="#5CA46E">0</text>
    <text x="367" y="107" text-anchor="middle" font-size="12" fill="#555">メモリ参照回数</text>
    <text x="367" y="123" text-anchor="middle" font-size="11" fill="#888">（意図的にスキップ）</text>
    <line x1="490" y1="55" x2="490" y2="150" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="612" y="85" text-anchor="middle" font-size="38" font-weight="900" fill="#F5A623">3</text>
    <text x="612" y="107" text-anchor="middle" font-size="12" fill="#555">対応プラットフォーム数</text>
    <text x="612" y="123" text-anchor="middle" font-size="11" fill="#888">（Web・iOS・Android）</text>
    <line x1="735" y1="55" x2="735" y2="150" stroke="#E8E2D3" stroke-width="1.5"/>
    <text x="857" y="85" text-anchor="middle" font-size="38" font-weight="900" fill="#8B7DB8">OFF可</text>
    <text x="857" y="107" text-anchor="middle" font-size="12" fill="#555">パーソナライズ設定でオフに</text>
    <text x="857" y="123" text-anchor="middle" font-size="11" fill="#888">（Personalization Settings）</text>
    <text x="490" y="148" text-anchor="middle" font-size="10" fill="#999">出典: OpenAI / Releasebot 2026-04-28</text>
  </g>

  <!-- How it works diagram -->
  <g transform="translate(130, 400)" filter="url(#softShadow)">
    <rect x="0" y="0" width="760" height="220" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="380" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">🔄 Fast Answers の動作フロー</text>
    <line x1="20" y1="35" x2="740" y2="35" stroke="#E8E2D3" stroke-width="1"/>
    <!-- User input -->
    <rect x="25" y="55" width="130" height="60" rx="6" fill="#E8F4FD" stroke="#5B8DEF" stroke-width="2"/>
    <text x="90" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#2F3842">ユーザー質問</text>
    <text x="90" y="100" text-anchor="middle" font-size="10" fill="#5B8DEF">「七不思議は？」</text>
    <!-- Arrow -->
    <polygon points="155,85 175,75 175,95" fill="#5B8DEF"/>
    <line x1="155" y1="85" x2="175" y2="85" stroke="#5B8DEF" stroke-width="2"/>
    <!-- Judge -->
    <rect x="175" y="55" width="140" height="60" rx="6" fill="#FFF9E8" stroke="#F5A623" stroke-width="2"/>
    <text x="245" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#2F3842">🤔 判定エンジン</text>
    <text x="245" y="100" text-anchor="middle" font-size="10" fill="#F5A623">パーソナライズ必要？</text>
    <!-- Two paths -->
    <line x1="315" y1="85" x2="345" y2="55" stroke="#5CA46E" stroke-width="2"/>
    <line x1="315" y1="85" x2="345" y2="135" stroke="#E05555" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="342" y="48" font-size="10" fill="#5CA46E" font-weight="700">不要</text>
    <text x="342" y="145" font-size="10" fill="#E05555" font-weight="700">必要</text>
    <!-- Fast path -->
    <rect x="345" y="30" width="160" height="50" rx="6" fill="#E8FFE8" stroke="#5CA46E" stroke-width="2.5"/>
    <text x="425" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#2E7D32">⚡ Fast Path</text>
    <text x="425" y="68" text-anchor="middle" font-size="10" fill="#5CA46E">メモリスキップ・高速</text>
    <!-- Normal path -->
    <rect x="345" y="118" width="160" height="50" rx="6" fill="#FFF0F0" stroke="#E05555" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="425" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#E05555">📚 Normal Path</text>
    <text x="425" y="156" text-anchor="middle" font-size="10" fill="#E05555">メモリ参照・個人化</text>
    <!-- Arrows to output -->
    <line x1="505" y1="55" x2="535" y2="85" stroke="#5CA46E" stroke-width="2"/>
    <line x1="505" y1="143" x2="535" y2="113" stroke="#E05555" stroke-width="2" stroke-dasharray="4,2"/>
    <!-- Output -->
    <rect x="535" y="55" width="170" height="80" rx="6" fill="#F0F0FF" stroke="#8B7DB8" stroke-width="2"/>
    <text x="620" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#2F3842">💬 回答</text>
    <text x="620" y="100" text-anchor="middle" font-size="10" fill="#8B7DB8">「七不思議のリスト...」</text>
    <text x="620" y="116" text-anchor="middle" font-size="10" fill="#8B7DB8">（深く・正確・高速）</text>
    <!-- Note -->
    <text x="380" y="195" text-anchor="middle" font-size="11" fill="#888">🔑 判定条件: 「高確信度の回答がある」かつ「パーソナライズ不要」の質問</text>
    <text x="380" y="212" text-anchor="middle" font-size="10" fill="#999">出典: OpenAI Release Notes / TheBizAIHub 2026-04-28</text>
  </g>

  <!-- Comparison cards -->
  <g transform="translate(920, 400)" filter="url(#softShadow)">
    <rect x="0" y="0" width="420" height="220" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="210" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">🔍 Fast vs Normal の使い分け</text>
    <line x1="20" y1="35" x2="400" y2="35" stroke="#E8E2D3" stroke-width="1"/>
    <text x="20" y="58" font-size="12" font-weight="700" fill="#5CA46E">⚡ Fast Answersが効果的</text>
    <text x="20" y="76" font-size="11" fill="#333">• 七不思議・世界記録・定義</text>
    <text x="20" y="92" font-size="11" fill="#333">• 数学・変換計算・単位換算</text>
    <text x="20" y="108" font-size="11" fill="#333">• スポーツ成績・歴史的事実</text>
    <line x1="15" y1="120" x2="405" y2="120" stroke="#E8E2D3" stroke-width="0.8" stroke-dasharray="3,3"/>
    <text x="20" y="140" font-size="12" font-weight="700" fill="#E05555">🔴 Normal Pathが必要</text>
    <text x="20" y="158" font-size="11" fill="#333">• 「私の食制限に合う食事は？」</text>
    <text x="20" y="174" font-size="11" fill="#333">• 過去のプロジェクトを踏まえた提案</text>
    <text x="20" y="190" font-size="11" fill="#333">• 継続的なタスク・長期記憶依存</text>
    <text x="210" y="212" text-anchor="middle" font-size="10" fill="#888">判定ミスがUX低下の最大リスク</text>
  </g>

  <!-- Sticky notes -->
  <g transform="translate(130, 645) rotate(-1.0)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="265" height="145" rx="3" fill="#FFF9C4" stroke="#E8D84A" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="22" fill="#FFE566" opacity="0.7" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#666">📌 推論コスト削減の本音</text>
    <text x="12" y="45" font-size="11" fill="#333">GPT-5.5を全ユーザーに提供</text>
    <text x="12" y="60" font-size="11" fill="#333">しながら利益を出すには</text>
    <text x="12" y="75" font-size="11" fill="#333">コスト削減が必須。</text>
    <text x="12" y="90" font-size="11" fill="#333">Fast Answersは「メモリ＋</text>
    <text x="12" y="105" font-size="11" fill="#333">長文コンテキスト省略」で</text>
    <text x="12" y="120" font-size="11" fill="#333">計算コストを大幅削減。</text>
    <text x="12" y="138" font-size="10" fill="#999">💡 UX向上の裏にある財務論</text>
  </g>

  <g transform="translate(420, 638) rotate(0.7)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="265" height="145" rx="3" fill="#C8E6C9" stroke="#8BC34A" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="22" fill="#A5D6A7" opacity="0.8" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">📌 検索エンジン代替の布石</text>
    <text x="12" y="45" font-size="11" fill="#333">ログアウトユーザーにも展開。</text>
    <text x="12" y="60" font-size="11" fill="#333">→ Googleとの検索代替競争</text>
    <text x="12" y="75" font-size="11" fill="#333">で「最初のタッチポイント」</text>
    <text x="12" y="90" font-size="11" fill="#333">になる戦略的一手。</text>
    <text x="12" y="105" font-size="11" fill="#333">ゼロクリック検索を超える</text>
    <text x="12" y="120" font-size="11" fill="#333">「即時・深い回答」を提示。</text>
    <text x="12" y="138" font-size="10" fill="#999">💡 Google対抗の最前線</text>
  </g>

  <g transform="translate(710, 642) rotate(-0.6)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="265" height="145" rx="3" fill="#E1BEE7" stroke="#AB47BC" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="22" fill="#CE93D8" opacity="0.8" rx="3"/>
    <text x="132" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#4A148C">📌 プライバシー懸念層への訴求</text>
    <text x="12" y="45" font-size="11" fill="#333">「AIが記憶を持つこと」に</text>
    <text x="12" y="60" font-size="11" fill="#333">プライバシー懸念を持つ</text>
    <text x="12" y="75" font-size="11" fill="#333">ユーザー層にとって、</text>
    <text x="12" y="90" font-size="11" fill="#333">「記憶なし・速い」は</text>
    <text x="12" y="105" font-size="11" fill="#333">むしろ歓迎される可能性。</text>
    <text x="12" y="120" font-size="11" fill="#333">Anthropic・Geminiへの差別化。</text>
    <text x="12" y="138" font-size="10" fill="#999">💡 プライバシー重視層を獲得</text>
  </g>

  <g transform="translate(1000, 640) rotate(1.0)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="320" height="145" rx="3" fill="#FFCCBC" stroke="#FF7043" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="22" fill="#FFAB91" opacity="0.8" rx="3"/>
    <text x="160" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#BF360C">📌 判定ミスのリスク</text>
    <text x="12" y="45" font-size="11" fill="#333">「健康的な食事を教えて」</text>
    <text x="12" y="60" font-size="11" fill="#333">→ アレルギー履歴があるのに</text>
    <text x="12" y="75" font-size="11" fill="#333">Fast Pathで汎用回答。</text>
    <text x="12" y="90" font-size="11" fill="#333">ユーザーには「なぜ個人化</text>
    <text x="12" y="105" font-size="11" fill="#333">されていないか」が見えない。</text>
    <text x="12" y="120" font-size="11" fill="#333">透明性の欠如がUX問題に。</text>
    <text x="12" y="138" font-size="10" fill="#555">💡 判定精度が信頼の分岐点</text>
  </g>

  <g transform="translate(130, 808)">
    <rect x="0" y="0" width="1210" height="115" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" opacity="0.95"/>
    <text x="30" y="28" font-size="14" font-weight="700" fill="#1A1D24">🌐 AIネイティブ検索への影響：「Speed Mode」の標準化</text>
    <line x1="15" y1="38" x2="1195" y2="38" stroke="#E8E2D3" stroke-width="1"/>
    <text x="30" y="60" font-size="12" fill="#333">今後6〜12ヶ月: Perplexity・Kagi・Brave SearchなどもFast Answersに類する「Speed Mode」を追加してくるとみられる。</text>
    <text x="30" y="80" font-size="12" fill="#333">ユーザーへの示唆: 「速さ＝記憶なし」「個人化＝記憶あり」という明確なトレードオフが一般に認識されるようになる。</text>
    <text x="30" y="100" font-size="12" fill="#333">企業ユーザーへの注意: Fast Answersはデフォルトでオンのため、個人化が重要な企業利用では明示的にオフ設定が必要。IT管理者の設定ポリシーの見直しを推奨。</text>
  </g>

  <text x="700" y="1038" text-anchor="middle" font-size="12" fill="#999" font-style="italic">AI News · 2026-04-28 · ChatGPT Fast Answers Global Rollout — Memory Skip Mode for All Plans</text>
</svg>
