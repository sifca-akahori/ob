<svg viewBox="0 0 1400 1050" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#FBF8F1"/>
      <circle cx="1" cy="1" r="0.4" fill="#E8E2D3" opacity="0.5"/>
      <circle cx="3" cy="3" r="0.3" fill="#E8E2D3" opacity="0.4"/>
    </pattern>
    <filter id="softShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#1A1D24" flood-opacity="0.15"/>
    </filter>
    <filter id="stickyShadow">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#1A1D24" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <rect width="1400" height="1050" fill="#FBF8F1" opacity="0.3"/>

  <!-- Binding holes -->
  <g fill="#E8E2D3" stroke="#C8C0B0" stroke-width="1.5">
    <circle cx="30" cy="140" r="12"/><circle cx="30" cy="280" r="12"/>
    <circle cx="30" cy="420" r="12"/><circle cx="30" cy="560" r="12"/>
    <circle cx="30" cy="700" r="12"/><circle cx="30" cy="840" r="12"/>
  </g>
  <line x1="60" y1="0" x2="60" y2="1050" stroke="#E8E2D3" stroke-width="2"/>

  <!-- Category tape -->
  <g transform="translate(1270, 28) rotate(-3)">
    <rect x="0" y="0" width="150" height="38" fill="#5CA46E" rx="4" filter="url(#softShadow)"/>
    <text x="75" y="25" text-anchor="middle" fill="white" font-size="17" font-weight="700">#ビジネス</text>
  </g>

  <!-- Date badge -->
  <rect x="80" y="18" width="170" height="36" fill="#2F3842" rx="6" filter="url(#softShadow)"/>
  <text x="165" y="42" text-anchor="middle" fill="#F0EDE8" font-size="15" font-weight="600">2026-05-07</text>
  <text x="280" y="46" fill="#F5A623" font-size="20">⭐⭐⭐</text>

  <!-- Header -->
  <rect x="80" y="72" width="1240" height="3" fill="#5CA46E"/>
  <text x="80" y="118" fill="#1A1D24" font-size="36" font-weight="900">🧠 Ineffable Intelligence：AlphaZero生みの親が$11億調達</text>
  <text x="80" y="158" fill="#2F3842" font-size="22" font-weight="500">欧州史上最大シードラウンド・「人間データゼロ」で超知性を目指すRL専門ラボ</text>

  <!-- Hero: brain/infinity icon -->
  <g transform="translate(1240, 80)">
    <rect x="0" y="0" width="110" height="90" fill="#E8F5EC" rx="12" stroke="#5CA46E" stroke-width="2.5"/>
    <text x="55" y="50" text-anchor="middle" font-size="42">♾️</text>
    <text x="55" y="76" text-anchor="middle" fill="#5CA46E" font-size="11" font-weight="700">Ineffable</text>
  </g>

  <!-- Key numbers -->
  <g filter="url(#softShadow)">
    <rect x="80" y="178" width="260" height="120" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="210" y="218" text-anchor="middle" fill="#5CA46E" font-size="52" font-weight="900">$1.1B</text>
    <text x="210" y="248" text-anchor="middle" fill="#2F3842" font-size="14" font-weight="600">シードラウンド調達額</text>
    <text x="210" y="290" text-anchor="middle" fill="#888" font-size="11">欧州史上最大のシード</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="360" y="178" width="260" height="120" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="490" y="218" text-anchor="middle" fill="#5CA46E" font-size="52" font-weight="900">$5.1B</text>
    <text x="490" y="248" text-anchor="middle" fill="#2F3842" font-size="14" font-weight="600">企業評価額（バリュエーション）</text>
    <text x="490" y="290" text-anchor="middle" fill="#888" font-size="11">設立数ヶ月での評価額</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="640" y="178" width="260" height="120" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="770" y="210" text-anchor="middle" fill="#2F3842" font-size="22" font-weight="900">AlphaZero</text>
    <text x="770" y="240" text-anchor="middle" fill="#5CA46E" font-size="20" font-weight="900">AlphaGo</text>
    <text x="770" y="265" text-anchor="middle" fill="#2F3842" font-size="14" font-weight="600">David Silver主要貢献</text>
    <text x="770" y="290" text-anchor="middle" fill="#888" font-size="11">UCL教授・元DeepMind RL責任者</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="920" y="178" width="300" height="120" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="1070" y="215" text-anchor="middle" fill="#E85757" font-size="28" font-weight="900">人間データ0</text>
    <text x="1070" y="248" text-anchor="middle" fill="#2F3842" font-size="14" font-weight="600">自己対戦RLのみで学習</text>
    <text x="1070" y="290" text-anchor="middle" fill="#888" font-size="11">LLMとは根本的に異なるアプローチ</text>
  </g>

  <!-- Main visual: timeline/investor flow -->
  <rect x="80" y="318" width="760" height="280" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="460" y="348" text-anchor="middle" fill="#1A1D24" font-size="17" font-weight="800" text-decoration="underline">AlphaZero → Ineffable Intelligence への進化</text>

  <!-- Timeline -->
  <line x1="130" y1="430" x2="810" y2="430" stroke="#C8C0B0" stroke-width="3"/>

  <!-- Timeline points -->
  <circle cx="160" cy="430" r="10" fill="#5CA46E" stroke="#1A1D24" stroke-width="2"/>
  <text x="160" y="390" text-anchor="middle" fill="#1A1D24" font-size="12" font-weight="700">2015</text>
  <text x="160" y="408" text-anchor="middle" fill="#444" font-size="11">AlphaGo</text>
  <text x="160" y="462" text-anchor="middle" fill="#555" font-size="11">人間棋士を</text>
  <text x="160" y="476" text-anchor="middle" fill="#555" font-size="11">初めて撃破</text>

  <circle cx="330" cy="430" r="10" fill="#5CA46E" stroke="#1A1D24" stroke-width="2"/>
  <text x="330" y="390" text-anchor="middle" fill="#1A1D24" font-size="12" font-weight="700">2017</text>
  <text x="330" y="408" text-anchor="middle" fill="#444" font-size="11">AlphaZero</text>
  <text x="330" y="462" text-anchor="middle" fill="#555" font-size="11">人間知識ゼロ</text>
  <text x="330" y="476" text-anchor="middle" fill="#555" font-size="11">自己対戦のみ</text>

  <circle cx="530" cy="430" r="10" fill="#5CA46E" stroke="#1A1D24" stroke-width="2"/>
  <text x="530" y="390" text-anchor="middle" fill="#1A1D24" font-size="12" font-weight="700">2022</text>
  <text x="530" y="408" text-anchor="middle" fill="#444" font-size="11">AlphaDev</text>
  <text x="530" y="462" text-anchor="middle" fill="#555" font-size="11">アルゴリズム</text>
  <text x="530" y="476" text-anchor="middle" fill="#555" font-size="11">自動発見</text>

  <circle cx="730" cy="430" r="14" fill="#1A1D24" stroke="#5CA46E" stroke-width="3"/>
  <text x="730" y="390" text-anchor="middle" fill="#1A1D24" font-size="12" font-weight="700">2026</text>
  <text x="730" y="408" text-anchor="middle" fill="#5CA46E" font-size="11" font-weight="700">Ineffable</text>
  <text x="730" y="462" text-anchor="middle" fill="#5CA46E" font-size="12" font-weight="700">全領域へ</text>
  <text x="730" y="478" text-anchor="middle" fill="#5CA46E" font-size="12" font-weight="700">$1.1B調達</text>

  <!-- Mission statement -->
  <rect x="120" y="498" width="700" height="52" fill="#F0F6FF" rx="8" stroke="#5CA46E" stroke-width="2"/>
  <text x="470" y="522" text-anchor="middle" fill="#1A1D24" font-size="14" font-weight="800">ミッション：「スーパーラーナー」の構築</text>
  <text x="470" y="542" text-anchor="middle" fill="#444" font-size="13">まず数学・形式証明から開始 → 試行錯誤のみで知識・スキルを獲得するAI</text>

  <!-- Right side cards -->
  <g filter="url(#softShadow)">
    <rect x="860" y="318" width="360" height="130" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <rect x="860" y="318" width="8" height="130" fill="#5CA46E" rx="4 0 0 4"/>
    <text x="882" y="348" fill="#1A1D24" font-size="15" font-weight="800">投資家リスト</text>
    <text x="882" y="371" fill="#444" font-size="13">• Sequoia・Lightspeed（共同リード）</text>
    <text x="882" y="391" fill="#444" font-size="13">• NVIDIA・Google・DST Global</text>
    <text x="882" y="411" fill="#444" font-size="13">• Index Ventures</text>
    <text x="882" y="431" fill="#444" font-size="13">• 英国ソブリンAIファンド</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="860" y="460" width="360" height="138" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <rect x="860" y="460" width="8" height="138" fill="#E85757" rx="4 0 0 4"/>
    <text x="882" y="490" fill="#1A1D24" font-size="15" font-weight="800">RL vs LLM の根本的違い</text>
    <text x="882" y="513" fill="#444" font-size="13">LLM：人間データの圧縮・上限超えず</text>
    <text x="882" y="533" fill="#444" font-size="13">RL自己対戦：理論上上限を超えうる</text>
    <text x="882" y="553" fill="#E85757" font-size="13">実証：囲碁・チェスで人類最強超え</text>
    <text x="882" y="573" fill="#444" font-size="12">課題：汎用タスクでの報酬設計が難関</text>
    <text x="882" y="592" fill="#888" font-size="11">「問い自体を設定する能力」が未解決</text>
  </g>

  <!-- Sticky notes -->
  <g transform="translate(80, 622) rotate(-1.5)" filter="url(#stickyShadow)">
    <rect width="195" height="105" fill="#FFF9C4" rx="4" stroke="#E8D84C" stroke-width="1.5"/>
    <text x="97" y="22" text-anchor="middle" fill="#5A5A00" font-size="13" font-weight="700">Silver利益寄付宣言</text>
    <text x="10" y="44" fill="#555" font-size="11">「個人利益を全て</text>
    <text x="10" y="62" fill="#555" font-size="11">高インパクト慈善に」</text>
    <text x="10" y="80" fill="#555" font-size="11">EA的姿勢に賛否両論</text>
    <text x="10" y="98" fill="#888" font-size="10">OpenAI非営利変質を想起の声も</text>
  </g>
  <g transform="translate(298, 632) rotate(1.2)" filter="url(#stickyShadow)">
    <rect width="200" height="105" fill="#FFE0CC" rx="4" stroke="#E8906C" stroke-width="1.5"/>
    <text x="100" y="22" text-anchor="middle" fill="#7A2A00" font-size="13" font-weight="700">欧州AI独立の象徴</text>
    <text x="10" y="44" fill="#555" font-size="11">Mistral・Inflection系に続く</text>
    <text x="10" y="62" fill="#555" font-size="11">欧州ラボとして注目</text>
    <text x="10" y="80" fill="#555" font-size="11">$1.1Bは2〜3年分のみ</text>
    <text x="10" y="98" fill="#888" font-size="10">政策的支援継続が必須</text>
  </g>
  <g transform="translate(520, 622) rotate(-0.8)" filter="url(#stickyShadow)">
    <rect width="195" height="105" fill="#E8F5EC" rx="4" stroke="#5CA46E" stroke-width="1.5"/>
    <text x="97" y="22" text-anchor="middle" fill="#1A5A30" font-size="13" font-weight="700">UCL二強の台頭</text>
    <text x="10" y="44" fill="#555" font-size="11">Silver（Ineffable）と</text>
    <text x="10" y="62" fill="#555" font-size="11">Rocktäschel（別ラボ）が</text>
    <text x="10" y="80" fill="#555" font-size="11">同週に大型調達を達成</text>
    <text x="10" y="98" fill="#888" font-size="10">UCL発AI二強として注目</text>
  </g>
  <g transform="translate(740, 628) rotate(1.8)" filter="url(#stickyShadow)">
    <rect width="195" height="105" fill="#EDE0FF" rx="4" stroke="#8B7DB8" stroke-width="1.5"/>
    <text x="97" y="22" text-anchor="middle" fill="#3A1A7A" font-size="13" font-weight="700">NVIDIAとGoogleが共同出資</text>
    <text x="10" y="44" fill="#555" font-size="11">競合クラウドが同ラウンドに</text>
    <text x="10" y="62" fill="#555" font-size="11">NVIDIA：LLM以外の需要源</text>
    <text x="10" y="80" fill="#555" font-size="11">Google：DeepMind外部補完</text>
    <text x="10" y="98" fill="#888" font-size="10">英国ソブリン：AI人材囲い込み</text>
  </g>

  <!-- Bottom summary -->
  <g filter="url(#softShadow)">
    <rect x="80" y="750" width="1240" height="80" fill="white" rx="8" stroke="#1A1D24" stroke-width="2"/>
    <text x="100" y="776" fill="#1A1D24" font-size="14" font-weight="800">🔮 「スーパーラーナー」はいつ現れるか</text>
    <text x="100" y="798" fill="#444" font-size="13">Silverは「数学・形式証明から始める」と述べた。Lean 4型の検証可能な成果が出るのが最初のマイルストーン。</text>
    <text x="100" y="820" fill="#5CA46E" font-size="13" font-weight="700">→ 汎用タスクでの報酬設計問題が解決されない限り、Aletheiaのような「分野特化」超人が連続して登場するフェーズが続く。</text>
  </g>

  <!-- Footer -->
  <rect x="80" y="858" width="1240" height="2" fill="#E8E2D3"/>
  <text x="730" y="884" text-anchor="middle" fill="#999" font-size="13" font-style="italic">AI News · 2026-05-07 · Ineffable Intelligence $1.1B Seed Round — David Silver</text>
</svg>
