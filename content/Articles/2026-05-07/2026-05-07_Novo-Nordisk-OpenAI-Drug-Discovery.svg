    <text x="97" y="22" text-anchor="middle" fill="#1A5A30" font-size="13" font-weight="700">GLP-1競争の文脈</text>
    <text x="10" y="44" fill="#555" font-size="11">Wegovy先行→Eli Lillyに</text>
    <text x="10" y="62" fill="#555" font-size="11">製造・販売力で追い越される</text>
