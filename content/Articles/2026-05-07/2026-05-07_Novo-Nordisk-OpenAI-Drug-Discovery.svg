    <text x="97" y="22" text-anchor="middle" fill="#3A1A7A" font-size="13" font-weight="700">EU AI法との兼ね合い</text>
    <text x="10" y="44" fill="#555" font-size="11">医療機器AI＝高リスク分類</text>
    <text x="10" y="62" fill="#555" font-size="11">Annex III延期（2027-12）で</text>
    <text x="10" y="80" fill="#555" font-size="11">全社展開の猶予期間と重なる</text>
    <text x="10" y="96" fill="#888" font-size="10">偶然？意図的タイミング？</text>
