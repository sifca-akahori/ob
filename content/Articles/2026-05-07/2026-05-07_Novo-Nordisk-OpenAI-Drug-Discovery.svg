    <text x="882" y="541" fill="#444" font-size="13">• Hiro Finance（金融）acqui-hire</text>
    <text x="882" y="561" fill="#444" font-size="13">• AstraZeneca（製薬）パイロット</text>
    <text x="882" y="581" fill="#444" font-size="13">• Novo Nordisk（製薬大型提携）</text>
