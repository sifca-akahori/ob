    <text x="10" y="62" fill="#555" font-size="11">トレーニング省略」が</text>
    <text x="10" y="80" fill="#555" font-size="11">失敗の典型パターン</text>
    <text x="10" y="96" fill="#888" font-size="10">契約明示は過去の教訓</text>
  </g>
