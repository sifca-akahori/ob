<svg viewBox="0 0 1400 1050" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#FBF8F1"/>
      <circle cx="1" cy="1" r="0.4" fill="#E8E2D3" opacity="0.5"/>
      <circle cx="3" cy="3" r="0.3" fill="#E8E2D3" opacity="0.4"/>
    </pattern>
    <filter id="softShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#1A1D24" flood-opacity="0.15"/>
    </filter>
    <filter id="stickyShadow">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#1A1D24" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <rect width="1400" height="1050" fill="#FBF8F1" opacity="0.3"/>

  <g fill="#E8E2D3" stroke="#C8C0B0" stroke-width="1.5">
    <circle cx="30" cy="140" r="12"/><circle cx="30" cy="280" r="12"/>
    <circle cx="30" cy="420" r="12"/><circle cx="30" cy="560" r="12"/>
    <circle cx="30" cy="700" r="12"/><circle cx="30" cy="840" r="12"/>
  </g>
  <line x1="60" y1="0" x2="60" y2="1050" stroke="#E8E2D3" stroke-width="2"/>

  <!-- Category tape (SNS = orange) -->
  <g transform="translate(1270, 28) rotate(-3)">
    <rect x="0" y="0" width="150" height="38" fill="#E8A87C" rx="4" filter="url(#softShadow)"/>
    <text x="75" y="25" text-anchor="middle" fill="white" font-size="17" font-weight="700">#SNS</text>
  </g>

  <rect x="80" y="18" width="170" height="36" fill="#2F3842" rx="6" filter="url(#softShadow)"/>
  <text x="165" y="42" text-anchor="middle" fill="#F0EDE8" font-size="15" font-weight="600">2026-05-07</text>
  <text x="280" y="46" fill="#F5A623" font-size="20">⭐⭐</text>

  <rect x="80" y="72" width="1240" height="3" fill="#E8A87C"/>
  <text x="80" y="118" fill="#1A1D24" font-size="36" font-weight="900">🏭 Sanders/AOC「AIデータセンター一時停止法」提案</text>
  <text x="80" y="158" fill="#2F3842" font-size="22" font-weight="500">国家基準制定まで新規大規模データセンター建設を凍結・X/HNで2,000コメント超の大炎上</text>

  <!-- Hero -->
  <g transform="translate(1240, 80)">
    <rect x="0" y="0" width="110" height="90" fill="#FFF0E0" rx="12" stroke="#E8A87C" stroke-width="2.5"/>
    <text x="55" y="50" text-anchor="middle" font-size="42">⚡</text>
    <text x="55" y="75" text-anchor="middle" fill="#E8A87C" font-size="11" font-weight="700">エネルギー論争</text>
  </g>

  <!-- Key numbers -->
  <g filter="url(#softShadow)">
    <rect x="80" y="178" width="260" height="120" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="210" y="215" text-anchor="middle" fill="#E87C3E" font-size="50" font-weight="900">3〜4%</text>
    <text x="210" y="248" text-anchor="middle" fill="#2F3842" font-size="14" font-weight="600">世界電力消費に占める</text>
    <text x="210" y="268" text-anchor="middle" fill="#444" font-size="12">データセンター比率（2025年）</text>
    <text x="210" y="290" text-anchor="middle" fill="#888" font-size="11">AIワークロードがその40%超</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="360" y="178" width="260" height="120" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="490" y="215" text-anchor="middle" fill="#E85757" font-size="42" font-weight="900">2×</text>
    <text x="490" y="248" text-anchor="middle" fill="#2F3842" font-size="14" font-weight="600">米国データセンター電力増</text>
    <text x="490" y="268" text-anchor="middle" fill="#444" font-size="12">2030年までの予測（IEA）</text>
    <text x="490" y="290" text-anchor="middle" fill="#888" font-size="11">ペンシルバニア州全体相当</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="640" y="178" width="260" height="120" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="770" y="215" text-anchor="middle" fill="#2F3842" font-size="32" font-weight="900">$1兆超</text>
    <text x="770" y="248" text-anchor="middle" fill="#2F3842" font-size="14" font-weight="600">ビッグテックDC投資額</text>
    <text x="770" y="268" text-anchor="middle" fill="#444" font-size="12">2025〜2026年宣言ベース</text>
    <text x="770" y="290" text-anchor="middle" fill="#888" font-size="11">Meta・MS・Google・Amazon合計</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="920" y="178" width="300" height="120" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="1070" y="215" text-anchor="middle" fill="#5B8DEF" font-size="32" font-weight="900">2,000+</text>
    <text x="1070" y="248" text-anchor="middle" fill="#2F3842" font-size="14" font-weight="600">HN/Xコメント数</text>
    <text x="1070" y="268" text-anchor="middle" fill="#444" font-size="12">2026年最も議論された</text>
    <text x="1070" y="290" text-anchor="middle" fill="#888" font-size="11">AI政策提案のひとつ</text>
  </g>

  <!-- Main visual: Energy vs AI chart + political debate -->
  <rect x="80" y="318" width="760" height="280" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="460" y="348" text-anchor="middle" fill="#1A1D24" font-size="17" font-weight="800" text-decoration="underline">「AI Data Center Moratorium Act」主要論点</text>

  <!-- Pro / Con split -->
  <rect x="100" y="362" width="340" height="220" fill="#FFF0E8" rx="8" stroke="#E87C3E" stroke-width="2"/>
  <text x="270" y="390" text-anchor="middle" fill="#E87C3E" font-size="15" font-weight="800">🌱 法案支持の論拠</text>
  <text x="120" y="414" fill="#555" font-size="13">✓ ネットゼロ目標との矛盾解消</text>
  <text x="120" y="434" fill="#555" font-size="13">✓ 地域電力網・地下水への影響</text>
  <text x="120" y="454" fill="#555" font-size="13">✓ 労働者保護（DC建設・冷却）</text>
  <text x="120" y="474" fill="#555" font-size="13">✓ 水使用・冷却への環境負荷</text>
  <text x="120" y="494" fill="#555" font-size="13">✓ 天然ガス/原子力依存の拡大</text>
  <text x="120" y="520" fill="#E87C3E" font-size="12" font-weight="700">「気候コミットvsDC計画の矛盾」</text>
  <text x="120" y="538" fill="#888" font-size="11">Sanders・AOC・気候NGOが支持</text>
  <text x="120" y="556" fill="#888" font-size="11">X左派コミュニティが称賛</text>

  <rect x="460" y="362" width="340" height="220" fill="#E8F0FD" rx="8" stroke="#5B8DEF" stroke-width="2"/>
  <text x="630" y="390" text-anchor="middle" fill="#5B8DEF" font-size="15" font-weight="800">⚡ 法案反対の論拠</text>
  <text x="480" y="414" fill="#555" font-size="13">✗ 中国AIへの競争力低下</text>
  <text x="480" y="434" fill="#555" font-size="13">✗ イノベーション抑制・雇用喪失</text>
  <text x="480" y="454" fill="#555" font-size="13">✗ 再生可能エネルギー移行中</text>
  <text x="480" y="474" fill="#555" font-size="13">✗ 州法・市場競争で対応可能</text>
  <text x="480" y="494" fill="#555" font-size="13">✗ PPAで電力会社が対応できる</text>
  <text x="480" y="520" fill="#5B8DEF" font-size="12" font-weight="700">「中国に敗北するための法案」</text>
  <text x="480" y="538" fill="#888" font-size="11">NAIC（ビッグテックロビー）が猛反発</text>
  <text x="480" y="556" fill="#888" font-size="11">共和党・業界・HNの技術派</text>

  <!-- Right cards -->
  <g filter="url(#softShadow)">
    <rect x="860" y="318" width="360" height="130" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <rect x="860" y="318" width="8" height="130" fill="#E8A87C" rx="4 0 0 4"/>
    <text x="882" y="348" fill="#1A1D24" font-size="15" font-weight="800">法案の実態</text>
    <text x="882" y="371" fill="#444" font-size="13">提案者：Sanders上院+AOC下院</text>
    <text x="882" y="391" fill="#444" font-size="13">対象：年間100MW超のDC新設</text>
    <text x="882" y="411" fill="#444" font-size="13">条件：国家基準制定まで凍結</text>
    <text x="882" y="431" fill="#E85757" font-size="13">可決見込み：ほぼゼロ（共和党多数）</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="860" y="460" width="360" height="138" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <rect x="860" y="460" width="8" height="138" fill="#5CA46E" rx="4 0 0 4"/>
    <text x="882" y="490" fill="#1A1D24" font-size="15" font-weight="800">真の影響ルート</text>
    <text x="882" y="513" fill="#444" font-size="13">法案不成立でも...</text>
    <text x="882" y="533" fill="#5CA46E" font-size="13">① ESG投資家への圧力強化</text>
    <text x="882" y="553" fill="#5CA46E" font-size="13">② 地方自治体の立地拒否運動</text>
    <text x="882" y="573" fill="#5CA46E" font-size="13">③ 州法への波及（VA・TX・ID）</text>
    <text x="882" y="592" fill="#888" font-size="11">「象徴立法」でも世論形成に効果</text>
  </g>

  <!-- Sticky notes -->
  <g transform="translate(80, 632) rotate(-1.5)" filter="url(#stickyShadow)">
    <rect width="195" height="100" fill="#FFF9C4" rx="4" stroke="#E8D84C" stroke-width="1.5"/>
    <text x="97" y="22" text-anchor="middle" fill="#5A5A00" font-size="13" font-weight="700">HN技術派の見方</text>
    <text x="10" y="44" fill="#555" font-size="11">「コロケーションPPAで</text>
    <text x="10" y="62" fill="#555" font-size="11">電力会社が対応できる</text>
    <text x="10" y="80" fill="#555" font-size="11">範囲を超えている」</text>
    <text x="10" y="96" fill="#888" font-size="10">冷静な技術的分析が多数</text>
  </g>
  <g transform="translate(298, 642) rotate(1.2)" filter="url(#stickyShadow)">
    <rect width="200" height="100" fill="#FFE0CC" rx="4" stroke="#E8906C" stroke-width="1.5"/>
    <text x="100" y="22" text-anchor="middle" fill="#7A2A00" font-size="13" font-weight="700">日本GXへの波及</text>
    <text x="10" y="44" fill="#555" font-size="11">日本DC新設が急増中</text>
    <text x="10" y="62" fill="#555" font-size="11">国土交通省・環境省が</text>
    <text x="10" y="80" fill="#555" font-size="11">影響評価義務化を検討</text>
    <text x="10" y="96" fill="#888" font-size="10">再生可能エネルギー比率目標</text>
  </g>
  <g transform="translate(520, 632) rotate(-0.8)" filter="url(#stickyShadow)">
    <rect width="195" height="100" fill="#E8F5EC" rx="4" stroke="#5CA46E" stroke-width="1.5"/>
    <text x="97" y="22" text-anchor="middle" fill="#1A5A30" font-size="13" font-weight="700">SMR・原子力の台頭</text>
    <text x="10" y="44" fill="#555" font-size="11">Microsoft・Google・Amazon</text>
    <text x="10" y="62" fill="#555" font-size="11">がSMR（小型原子炉）に</text>
    <text x="10" y="80" fill="#555" font-size="11">相次いで投資・契約</text>
    <text x="10" y="96" fill="#888" font-size="10">脱炭素と電力増を両立する試み</text>
  </g>
  <g transform="translate(740, 638) rotate(1.8)" filter="url(#stickyShadow)">
    <rect width="195" height="100" fill="#EDE0FF" rx="4" stroke="#8B7DB8" stroke-width="1.5"/>
    <text x="97" y="22" text-anchor="middle" fill="#3A1A7A" font-size="13" font-weight="700">ビッグテックの対抗策</text>
    <text x="10" y="44" fill="#555" font-size="11">NAIC通じて</text>
    <text x="10" y="62" fill="#555" font-size="11">「推進型国家基準」の</text>
    <text x="10" y="80" fill="#555" font-size="11">対案を共和党経由で推進</text>
    <text x="10" y="96" fill="#888" font-size="10">EU AI法延期後の政治資本集中</text>
  </g>

  <!-- Bottom summary -->
  <g filter="url(#softShadow)">
    <rect x="80" y="760" width="1240" height="78" fill="white" rx="8" stroke="#1A1D24" stroke-width="2"/>
    <text x="100" y="784" fill="#1A1D24" font-size="14" font-weight="800">📊 「象徴立法」の実力</text>
    <text x="100" y="806" fill="#444" font-size="13">可決可能性はほぼゼロでも、ESG投資家・地方自治体・州議会を動かす世論形成効果は実在する。2026年AIエネルギー論争の始まりに過ぎない。</text>
    <text x="100" y="828" fill="#E8A87C" font-size="13" font-weight="700">→ 「再生可能エネルギー移行スピード &lt; AI電力需要増加スピード」という現実が続く限り、この論争は激化し続ける。SMRが唯一の解か。</text>
  </g>

  <rect x="80" y="860" width="1240" height="2" fill="#E8E2D3"/>
  <text x="730" y="884" text-anchor="middle" fill="#999" font-size="13" font-style="italic">AI News · 2026-05-07 · AI Data Center Moratorium Act (Sanders / AOC)</text>
</svg>
