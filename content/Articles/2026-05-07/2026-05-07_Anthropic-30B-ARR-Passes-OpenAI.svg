  <text x="135" y="484" text-anchor="end" fill="#888" font-size="11">$10B</text>
  <text x="135" y="404" text-anchor="end" fill="#888" font-size="11">$20B</text>
  <text x="135" y="374" text-anchor="end" fill="#888" font-size="11">$25B</text>

