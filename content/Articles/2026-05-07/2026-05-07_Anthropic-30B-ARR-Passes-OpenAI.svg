  <g filter="url(#softShadow)">
    <rect x="860" y="328" width="360" height="118" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <rect x="860" y="328" width="8" height="118" fill="#5CA46E" rx="4 0 0 4"/>
    <text x="882" y="358" fill="#1A1D24" font-size="15" font-weight="800">成長の源泉：エンタープライズ集中</text>
    <text x="882" y="381" fill="#444" font-size="13">• $100万超契約 1,000社超</text>
    <text x="882" y="400" fill="#444" font-size="13">• エンタープライズ比率 80% (vs OpenAI ~50%)</text>
    <text x="882" y="419" fill="#444" font-size="13">• Salesforce の$10B ARRに要した年数：25年</text>
    <text x="882" y="438" fill="#444" font-size="13">• Anthropicの同達成：3年未満</text>
  </g>
  <g filter="url(#softShadow)">
