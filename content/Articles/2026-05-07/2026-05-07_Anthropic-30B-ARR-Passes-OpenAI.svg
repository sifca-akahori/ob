    <rect x="860" y="456" width="8" height="132" fill="#E85757" rx="4 0 0 4"/>
    <text x="882" y="486" fill="#1A1D24" font-size="15" font-weight="800">会計論争：$8Bの差</text>
    <text x="882" y="509" fill="#444" font-size="13">Anthropic: 粗利ベースARR $30B</text>
    <text x="882" y="528" fill="#444" font-size="13">OpenAI主張: 純収益ベースなら$22B</text>
    <text x="882" y="547" fill="#444" font-size="13">差異要因: 推論コスト・クラウドコストの</text>
    <text x="882" y="566" fill="#444" font-size="13">   売上控除方法の違い</text>
    <text x="882" y="582" fill="#888" font-size="11">出典: OpenAI CRO Denise Dresser 内部メモ</text>
  </g>

