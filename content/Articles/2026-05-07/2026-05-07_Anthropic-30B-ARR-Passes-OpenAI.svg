<svg viewBox="0 0 1400 1050" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#FBF8F1"/>
      <circle cx="1" cy="1" r="0.4" fill="#E8E2D3" opacity="0.5"/>
      <circle cx="3" cy="3" r="0.3" fill="#E8E2D3" opacity="0.4"/>
    </pattern>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#1A1D24" flood-opacity="0.15"/>
    </filter>
    <filter id="stickyShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#1A1D24" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <rect width="1400" height="1050" fill="#FBF8F1" opacity="0.3"/>

  <!-- Binding holes (left edge) -->
  <g fill="#E8E2D3" stroke="#C8C0B0" stroke-width="1.5">
    <circle cx="30" cy="140" r="12"/>
    <circle cx="30" cy="280" r="12"/>
    <circle cx="30" cy="420" r="12"/>
    <circle cx="30" cy="560" r="12"/>
    <circle cx="30" cy="700" r="12"/>
    <circle cx="30" cy="840" r="12"/>
  </g>
  <line x1="60" y1="0" x2="60" y2="1050" stroke="#E8E2D3" stroke-width="2"/>

  <!-- Category tape (top right, rotated) -->
  <g transform="translate(1260, 28) rotate(-3)">
    <rect x="0" y="0" width="160" height="38" fill="#5CA46E" rx="4" filter="url(#softShadow)"/>
    <text x="80" y="25" text-anchor="middle" fill="white" font-size="17" font-weight="700">#ビジネス</text>
  </g>

  <!-- Date badge (top left) -->
  <rect x="80" y="18" width="170" height="36" fill="#2F3842" rx="6" filter="url(#softShadow)"/>
  <text x="165" y="42" text-anchor="middle" fill="#F0EDE8" font-size="15" font-weight="600">2026-05-07</text>

  <!-- Impact stars -->
  <text x="280" y="46" fill="#F5A623" font-size="20">⭐⭐⭐</text>

  <!-- Header title -->
  <rect x="80" y="72" width="1240" height="3" fill="#5CA46E"/>
  <text x="80" y="118" fill="#1A1D24" font-size="36" font-weight="900">💹 AnthropicがOpenAIの収益を初めて上回る</text>
  <text x="80" y="158" fill="#2F3842" font-size="22" font-weight="500">ARR $30B達成・15ヶ月で30倍成長・企業顧客比率80%</text>

  <!-- Hero icon: chart arrow going up -->
  <g transform="translate(1230, 85)">
    <rect x="0" y="0" width="120" height="90" fill="#E8F5EC" rx="12" stroke="#5CA46E" stroke-width="2.5"/>
    <polyline points="15,65 35,45 55,50 80,25 105,15" stroke="#5CA46E" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="95,8 115,18 98,28" fill="#5CA46E"/>
    <text x="60" y="82" text-anchor="middle" fill="#5CA46E" font-size="11" font-weight="700">ARR成長</text>
  </g>

  <!-- KEY NUMBERS block -->
  <g filter="url(#softShadow)">
    <rect x="80" y="178" width="270" height="130" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="195" y="212" text-anchor="middle" fill="#5CA46E" font-size="58" font-weight="900">$30B</text>
    <text x="195" y="240" text-anchor="middle" fill="#2F3842" font-size="15" font-weight="600">Anthropic ARR (2026-04)</text>
    <text x="195" y="298" text-anchor="middle" fill="#888" font-size="12">出典: The AI Corner / SaaStr</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="370" y="178" width="270" height="130" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="505" y="212" text-anchor="middle" fill="#A0A0A0" font-size="58" font-weight="900">$24B</text>
    <text x="505" y="240" text-anchor="middle" fill="#2F3842" font-size="15" font-weight="600">OpenAI ARR (2026-04)</text>
    <text x="505" y="298" text-anchor="middle" fill="#888" font-size="12">OpenAI: 純収益$22B相当と主張</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="660" y="178" width="270" height="130" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="795" y="212" text-anchor="middle" fill="#1A1D24" font-size="58" font-weight="900">30×</text>
    <text x="795" y="240" text-anchor="middle" fill="#2F3842" font-size="15" font-weight="600">Anthropic 15ヶ月成長倍率</text>
    <text x="795" y="298" text-anchor="middle" fill="#888" font-size="12">$1B (2025-01) → $30B (2026-04)</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="950" y="178" width="270" height="130" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="1085" y="212" text-anchor="middle" fill="#5CA46E" font-size="58" font-weight="900">80%</text>
    <text x="1085" y="240" text-anchor="middle" fill="#2F3842" font-size="15" font-weight="600">エンタープライズ収益比率</text>
    <text x="1085" y="298" text-anchor="middle" fill="#888" font-size="12">$100万超契約：1,000社超</text>
  </g>

