  <rect x="80" y="328" width="760" height="260" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="460" y="358" text-anchor="middle" fill="#1A1D24" font-size="17" font-weight="800" text-decoration="underline">ARR推移比較（2024-2026）</text>

