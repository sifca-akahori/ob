  <rect x="165" y="547" width="55" height="13" fill="#5CA46E" rx="3"/>
  <rect x="325" y="520" width="55" height="40" fill="#5CA46E" rx="3"/>
  <rect x="485" y="480" width="55" height="80" fill="#5CA46E" rx="3"/>
  <rect x="645" y="370" width="55" height="190" fill="#5CA46E" rx="3"/>

  <!-- OpenAI bars (gray) -->
  <rect x="228" y="517" width="55" height="43" fill="#B0B0B0" rx="3"/>
  <rect x="388" y="490" width="55" height="70" fill="#B0B0B0" rx="3"/>
  <rect x="548" y="440" width="55" height="120" fill="#B0B0B0" rx="3"/>
  <rect x="708" y="396" width="55" height="164" fill="#B0B0B0" rx="3"/>

  <!-- X-axis labels -->
  <text x="193" y="580" text-anchor="middle" fill="#555" font-size="11">2024 Q4</text>
  <text x="353" y="580" text-anchor="middle" fill="#555" font-size="11">2025 Q2</text>
  <text x="513" y="580" text-anchor="middle" fill="#555" font-size="11">2025 Q4</text>
  <text x="673" y="580" text-anchor="middle" fill="#555" font-size="11">2026 Q2</text>

  <!-- Legend -->
  <rect x="650" y="340" width="16" height="16" fill="#5CA46E" rx="3"/>
