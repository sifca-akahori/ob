  <g transform="translate(80, 610) rotate(-1.5)" filter="url(#stickyShadow)">
    <rect width="200" height="110" fill="#FFF9C4" rx="4" stroke="#E8D84C" stroke-width="1.5"/>
    <text x="100" y="24" text-anchor="middle" fill="#5A5A00" font-size="13" font-weight="700">30倍成長の実態</text>
    <text x="10" y="46" fill="#555" font-size="11">$1B (2025-01)</text>
    <text x="10" y="64" fill="#555" font-size="11">↓ 15ヶ月</text>
    <text x="10" y="82" fill="#5CA46E" font-size="14" font-weight="800">$30B (2026-04)</text>
    <text x="10" y="100" fill="#888" font-size="10">「史上最速SaaS成長」</text>
  </g>
  <g transform="translate(300, 620) rotate(1.2)" filter="url(#stickyShadow)">
    <rect width="200" height="110" fill="#FFE0CC" rx="4" stroke="#E8906C" stroke-width="1.5"/>
    <text x="100" y="24" text-anchor="middle" fill="#7A2A00" font-size="13" font-weight="700">インフラコスト問題</text>
    <text x="10" y="46" fill="#555" font-size="11">Google Cloud年間$40B超</text>
    <text x="10" y="64" fill="#555" font-size="11">ARRの2倍超がインフラ費</text>
    <text x="10" y="82" fill="#E85757" font-size="12" font-weight="700">粗利ARRの信頼性に疑問</text>
    <text x="10" y="100" fill="#888" font-size="10">外部資本で穴埋めシナリオ</text>
  </g>
  <g transform="translate(520, 612) rotate(-0.8)" filter="url(#stickyShadow)">
    <rect width="200" height="110" fill="#E8F5EC" rx="4" stroke="#5CA46E" stroke-width="1.5"/>
    <text x="100" y="24" text-anchor="middle" fill="#1A5A30" font-size="13" font-weight="700">次の資金調達戦略</text>
    <text x="10" y="46" fill="#555" font-size="11">$400億規模の調達予定</text>
    <text x="10" y="64" fill="#555" font-size="11">「ARR超えた」物語で優位に</text>
    <text x="10" y="82" fill="#555" font-size="11">IPO前の評価額競争が激化</text>
    <text x="10" y="100" fill="#888" font-size="10">Anthropicは非上場継続予定</text>
  </g>
  <g transform="translate(740, 618) rotate(1.8)" filter="url(#stickyShadow)">
    <rect width="200" height="110" fill="#EDE0FF" rx="4" stroke="#8B7DB8" stroke-width="1.5"/>
    <text x="100" y="24" text-anchor="middle" fill="#3A1A7A" font-size="13" font-weight="700">競合の苦境</text>
    <text x="10" y="46" fill="#555" font-size="11">Mistral ARR: ~$4億で停滞</text>
    <text x="10" y="64" fill="#555" font-size="11">Cohere: $1億台を脱せず</text>
    <text x="10" y="82" fill="#555" font-size="11">中国OSS系が唯一の突破口</text>
    <text x="10" y="100" fill="#888" font-size="10">資本×営業の二強化が進む</text>
  </g>

  <!-- Additional info cards -->
  <g filter="url(#softShadow)">
    <rect x="80" y="748" width="540" height="90" fill="white" rx="8" stroke="#1A1D24" stroke-width="2"/>
    <text x="100" y="776" fill="#1A1D24" font-size="14" font-weight="800">📊 Anthropic vs OpenAI 構造比較</text>
    <text x="100" y="798" fill="#444" font-size="13">Anthropic: B2B中心・安全重視・非上場　｜　OpenAI: B2C重視・IPO前・ChatGPT依存</text>
    <text x="100" y="818" fill="#5CA46E" font-size="13" font-weight="700">→ ARR逆転でIPO評価額・追加調達・採用競争に影響</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="640" y="748" width="580" height="90" fill="white" rx="8" stroke="#1A1D24" stroke-width="2"/>
    <text x="660" y="776" fill="#1A1D24" font-size="14" font-weight="800">🔮 6ヶ月後の予測</text>
    <text x="660" y="798" fill="#444" font-size="13">OpenAI IPO評価倍率にARR比較が直接影響。会計開示の標準化圧力が高まる。</text>
    <text x="660" y="818" fill="#5CA46E" font-size="13" font-weight="700">API単価引き下げ競争が激化し、どちらが先に粗利を開示するかが注目点。</text>
  </g>

  <!-- Footer -->
  <rect x="80" y="858" width="1240" height="2" fill="#E8E2D3"/>
  <text x="730" y="884" text-anchor="middle" fill="#999" font-size="13" font-style="italic">AI News · 2026-05-07 · Anthropic Passes OpenAI in ARR Revenue</text>
</svg>
