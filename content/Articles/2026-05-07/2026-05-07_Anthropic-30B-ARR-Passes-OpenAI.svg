  <line x1="140" y1="560" x2="810" y2="560" stroke="#E8E2D3" stroke-width="1.5"/>
  <line x1="140" y1="520" x2="810" y2="520" stroke="#E8E2D3" stroke-width="1"/>
  <line x1="140" y1="480" x2="810" y2="480" stroke="#E8E2D3" stroke-width="1"/>
  <line x1="140" y1="440" x2="810" y2="440" stroke="#E8E2D3" stroke-width="1"/>
  <line x1="140" y1="400" x2="810" y2="400" stroke="#E8E2D3" stroke-width="1"/>
  <line x1="140" y1="370" x2="810" y2="370" stroke="#E8E2D3" stroke-width="1"/>

