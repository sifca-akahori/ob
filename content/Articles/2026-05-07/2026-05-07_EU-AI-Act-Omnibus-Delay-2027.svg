  <circle cx="420" cy="460" r="9" fill="#5CA46E" stroke="#1A1D24" stroke-width="2"/>
  <text x="420" y="425" text-anchor="middle" fill="#5CA46E" font-size="11" font-weight="700">2025-08</text>
  <text x="420" y="442" text-anchor="middle" fill="#5CA46E" font-size="10">適用中</text>
  <text x="420" y="484" text-anchor="middle" fill="#5CA46E" font-size="10">GPAI義務</text>

  <!-- 2026-08 (struck) -->
  <circle cx="570" cy="460" r="9" fill="#FFCDD2" stroke="#E85757" stroke-width="2"/>
  <text x="570" y="425" text-anchor="middle" fill="#E85757" font-size="11" font-weight="700">2026-08</text>
  <line x1="530" y1="438" x2="610" y2="430" stroke="#E85757" stroke-width="2"/>
  <text x="570" y="442" text-anchor="middle" fill="#E85757" font-size="10">旧期限</text>
  <text x="570" y="484" text-anchor="middle" fill="#E85757" font-size="10">⛔延期</text>

