    <rect x="860" y="460" width="8" height="158" fill="#5B8DEF" rx="4 0 0 4"/>
    <text x="882" y="490" fill="#1A1D24" font-size="15" font-weight="800">日本企業への影響</text>
    <text x="882" y="513" fill="#5CA46E" font-size="13">✅ 朗報：Annex III義務延期</text>
    <text x="882" y="533" fill="#444" font-size="13">2026年8月準備が1.4年猶予</text>
    <text x="882" y="553" fill="#E85757" font-size="13">⚠️ 注意：GPAI義務は継続中</text>
    <text x="882" y="573" fill="#444" font-size="13">Claude・GPT採用時の供給者</text>
    <text x="882" y="593" fill="#444" font-size="13">義務確認は引き続き必要</text>
    <text x="882" y="612" fill="#888" font-size="11">経団連・欧日商が共同解釈ガイド準備</text>
  </g>

