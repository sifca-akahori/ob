    <text x="807" y="210" text-anchor="middle" fill="#5B8DEF" font-size="26" font-weight="900">3ヶ月短縮</text>
    <text x="807" y="248" text-anchor="middle" fill="#2F3842" font-size="14" font-weight="600">透明性義務の猶予期間</text>
    <text x="807" y="268" text-anchor="middle" fill="#444" font-size="12">6ヶ月 → 3ヶ月に引き締め</text>
    <text x="807" y="290" text-anchor="middle" fill="#888" font-size="11">新期限: 2026-12-02</text>
  </g>
  <g filter="url(#softShadow)">
