    <text x="100" y="22" text-anchor="middle" fill="#7A2A00" font-size="13" font-weight="700">SMC抜け道の懸念</text>
    <text x="10" y="44" fill="#555" font-size="11">500人以下SMCへの拡大で</text>
    <text x="10" y="62" fill="#555" font-size="11">欧州法人分割の逆インセンティブ</text>
    <text x="10" y="80" fill="#555" font-size="11">多国籍企業が悪用可能</text>
    <text x="10" y="96" fill="#888" font-size="10">CCIAが「抜け道」と指摘</text>
  </g>
  <g transform="translate(520, 642) rotate(-0.8)" filter="url(#stickyShadow)">
    <rect width="195" height="100" fill="#E8F5EC" rx="4" stroke="#5CA46E" stroke-width="1.5"/>
    <text x="97" y="22" text-anchor="middle" fill="#1A5A30" font-size="13" font-weight="700">ヌードAI禁止の追加</text>
    <text x="10" y="44" fill="#555" font-size="11">「nudifier」アプリ禁止を</text>
    <text x="10" y="62" fill="#555" font-size="11">明示的に条文化</text>
    <text x="10" y="80" fill="#555" font-size="11">欧州議会の要求が通る</text>
    <text x="10" y="96" fill="#888" font-size="10">選挙前対策の政治的意図</text>
  </g>
  <g transform="translate(740, 648) rotate(1.5)" filter="url(#stickyShadow)">
    <rect width="195" height="100" fill="#EDE0FF" rx="4" stroke="#8B7DB8" stroke-width="1.5"/>
    <text x="97" y="22" text-anchor="middle" fill="#3A1A7A" font-size="13" font-weight="700">米国との規制格差</text>
    <text x="10" y="44" fill="#555" font-size="11">トランプ：イノベーション優先</text>
    <text x="10" y="62" fill="#555" font-size="11">EU延期で差がさらに拡大</text>
    <text x="10" y="80" fill="#555" font-size="11">ただし州法で実質収斂</text>
    <text x="10" y="96" fill="#888" font-size="10">Colorado・Texas AI法が施行</text>
  </g>

  <!-- Bottom summary -->
  <g filter="url(#softShadow)">
    <rect x="80" y="762" width="1240" height="76" fill="white" rx="8" stroke="#1A1D24" stroke-width="2"/>
    <text x="100" y="786" fill="#1A1D24" font-size="14" font-weight="800">🔑 実務上の優先対応事項</text>
    <text x="100" y="808" fill="#444" font-size="13">GPAI義務（Claude・GPT採用時の供給者確認）は継続。透明性義務の新期限2026-12-02は従来より短縮。雇用AI審査は2027-12まで猶予。</text>
    <text x="100" y="828" fill="#5CA46E" font-size="13" font-weight="700">→ 欧州進出日本企業：GPAI確認と透明性対応を優先。Annex III雇用AI監査の猶予を活用して内部体制整備の時間を確保。</text>
  </g>

  <!-- Footer -->
  <rect x="80" y="860" width="1240" height="2" fill="#E8E2D3"/>
  <text x="730" y="884" text-anchor="middle" fill="#999" font-size="13" font-style="italic">AI News · 2026-05-07 · EU AI Act Digital Omnibus Agreement — High-Risk Delay to Dec 2027</text>
</svg>
