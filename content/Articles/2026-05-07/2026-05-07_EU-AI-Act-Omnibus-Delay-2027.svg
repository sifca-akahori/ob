  <text x="130" y="425" text-anchor="middle" fill="#888" font-size="11" font-weight="700">2024-08</text>
  <text x="130" y="442" text-anchor="middle" fill="#888" font-size="10">発効</text>
  <text x="130" y="484" text-anchor="middle" fill="#888" font-size="10">施行</text>

  <!-- 2025-02 -->
  <circle cx="270" cy="460" r="9" fill="#B0B0B0" stroke="#1A1D24" stroke-width="2"/>
  <text x="270" y="425" text-anchor="middle" fill="#888" font-size="11" font-weight="700">2025-02</text>
  <text x="270" y="442" text-anchor="middle" fill="#555" font-size="10">禁止AI・</text>
  <text x="270" y="484" text-anchor="middle" fill="#555" font-size="10">AIリテラシー</text>

