    <text x="97" y="22" text-anchor="middle" fill="#5A5A00" font-size="13" font-weight="700">「延期 = 骨抜き」か？</text>
    <text x="10" y="44" fill="#555" font-size="11">産業競争力優先論 vs</text>
    <text x="10" y="62" fill="#555" font-size="11">市民社会・労働団体の批判</text>
    <text x="10" y="80" fill="#555" font-size="11">特に雇用AIの透明性遅れ</text>
    <text x="10" y="96" fill="#888" font-size="10">解釈が二分する政治問題に</text>
  </g>
  <g transform="translate(298, 654) rotate(1.0)" filter="url(#stickyShadow)">
