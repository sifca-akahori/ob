    <text x="1092" y="210" text-anchor="middle" fill="#E85757" font-size="22" font-weight="900">禁止追加</text>
    <text x="1092" y="240" text-anchor="middle" fill="#2F3842" font-size="14" font-weight="600">ヌードディープフェイク</text>
    <text x="1092" y="260" text-anchor="middle" fill="#444" font-size="12">「nudifier」アプリを明示禁止</text>
    <text x="1092" y="290" text-anchor="middle" fill="#888" font-size="11">欧州議会の主張が通る</text>
  </g>

