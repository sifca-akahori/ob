    <text x="217" y="235" text-anchor="middle" fill="#E85757" font-size="36" font-weight="900">2027-12</text>
    <text x="217" y="260" text-anchor="middle" fill="#2F3842" font-size="14" font-weight="600">高リスクAI義務（Annex III）</text>
    <text x="217" y="290" text-anchor="middle" fill="#888" font-size="11">旧: 2026-08-02 → 新: 2027-12-02</text>
  </g>
  <g filter="url(#softShadow)">
