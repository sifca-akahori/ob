  <text x="130" y="552" fill="#444" font-size="12">① Annex III高リスクAI義務：2026-08 → 2027-12（雇用AIを含む）</text>
  <text x="130" y="570" fill="#444" font-size="12">② SMC拡大：250人→500人以下の中堅企業が簡素化文書化対象へ</text>
  <text x="130" y="590" fill="#444" font-size="12">③ 透明性義務猶予：6ヶ月→3ヶ月に短縮（2026-12-02 新期限）</text>

