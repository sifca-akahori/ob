  <text x="80" y="118" fill="#1A1D24" font-size="36" font-weight="900">🇪🇺 EU AI法オムニバス合意（5月7日）</text>
  <text x="80" y="158" fill="#2F3842" font-size="22" font-weight="500">高リスクAI義務を2026年8月→2027年12月まで延期・SMC（500人以下）免除拡大</text>

