<svg viewBox="0 0 1400 1050" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#FBF8F1"/>
      <circle cx="1" cy="1" r="0.4" fill="#E8E2D3" opacity="0.5"/>
      <circle cx="3" cy="3" r="0.3" fill="#E8E2D3" opacity="0.4"/>
    </pattern>
    <filter id="softShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#1A1D24" flood-opacity="0.15"/>
    </filter>
    <filter id="stickyShadow">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#1A1D24" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <rect width="1400" height="1050" fill="#FBF8F1" opacity="0.3"/>

  <g fill="#E8E2D3" stroke="#C8C0B0" stroke-width="1.5">
    <circle cx="30" cy="140" r="12"/><circle cx="30" cy="280" r="12"/>
    <circle cx="30" cy="420" r="12"/><circle cx="30" cy="560" r="12"/>
    <circle cx="30" cy="700" r="12"/><circle cx="30" cy="840" r="12"/>
  </g>
  <line x1="60" y1="0" x2="60" y2="1050" stroke="#E8E2D3" stroke-width="2"/>

  <!-- Category tape (論文 = purple) -->
  <g transform="translate(1270, 28) rotate(-3)">
    <rect x="0" y="0" width="150" height="38" fill="#8B7DB8" rx="4" filter="url(#softShadow)"/>
    <text x="75" y="25" text-anchor="middle" fill="white" font-size="17" font-weight="700">#論文</text>
  </g>

  <rect x="80" y="18" width="170" height="36" fill="#2F3842" rx="6" filter="url(#softShadow)"/>
  <text x="165" y="42" text-anchor="middle" fill="#F0EDE8" font-size="15" font-weight="600">2026-05-07</text>
  <text x="280" y="46" fill="#F5A623" font-size="20">⭐</text>

  <rect x="80" y="72" width="1240" height="3" fill="#8B7DB8"/>
  <text x="80" y="118" fill="#1A1D24" font-size="36" font-weight="900">🔬 ARIS：LLM駆動の自律研究ハーネスが論文スコアを5.0→7.5に改善</text>
  <text x="80" y="158" fill="#2F3842" font-size="22" font-weight="500">敵対的マルチエージェント協調・上海交通大学・arXiv 2605.02335（2026-05-04）</text>

  <!-- Hero -->
  <g transform="translate(1240, 80)">
    <rect x="0" y="0" width="110" height="90" fill="#F0ECFF" rx="12" stroke="#8B7DB8" stroke-width="2.5"/>
    <text x="55" y="50" text-anchor="middle" font-size="42">📐</text>
    <text x="55" y="75" text-anchor="middle" fill="#8B7DB8" font-size="11" font-weight="700">ARIS</text>
  </g>

  <!-- Key numbers -->
  <g filter="url(#softShadow)">
    <rect x="80" y="178" width="260" height="120" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="210" y="215" text-anchor="middle" fill="#8B7DB8" font-size="52" font-weight="900">7.5/10</text>
    <text x="210" y="248" text-anchor="middle" fill="#2F3842" font-size="14" font-weight="600">ARIS論文スコア（内部評価）</text>
    <text x="210" y="290" text-anchor="middle" fill="#888" font-size="11">基線LLM単独：5.0/10</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="360" y="178" width="260" height="120" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="490" y="215" text-anchor="middle" fill="#8B7DB8" font-size="52" font-weight="900">+50%</text>
    <text x="490" y="248" text-anchor="middle" fill="#2F3842" font-size="14" font-weight="600">スコア改善率</text>
    <text x="490" y="290" text-anchor="middle" fill="#888" font-size="11">5.0 → 7.5（+2.5点）</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="640" y="178" width="260" height="120" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="770" y="210" text-anchor="middle" fill="#2F3842" font-size="22" font-weight="900">マルチエージェント</text>
    <text x="770" y="240" text-anchor="middle" fill="#8B7DB8" font-size="18" font-weight="700">敵対的協調</text>
    <text x="770" y="268" text-anchor="middle" fill="#444" font-size="12">提案エージェント vs 批判エージェント</text>
    <text x="770" y="290" text-anchor="middle" fill="#888" font-size="11">人間介入なし内部ループ</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="920" y="178" width="300" height="120" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <text x="1070" y="210" text-anchor="middle" fill="#E85757" font-size="20" font-weight="900">循環的信頼性問題</text>
    <text x="1070" y="248" text-anchor="middle" fill="#2F3842" font-size="14" font-weight="600">採点者もLLM</text>
    <text x="1070" y="268" text-anchor="middle" fill="#444" font-size="12">「AIがAIを評価する」構造</text>
    <text x="1070" y="290" text-anchor="middle" fill="#888" font-size="11">著者らも限界を認めている</text>
  </g>

  <!-- Main visual: ARIS architecture flow -->
  <rect x="80" y="318" width="760" height="300" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="460" y="348" text-anchor="middle" fill="#1A1D24" font-size="17" font-weight="800" text-decoration="underline">ARISアーキテクチャ：自律研究ループ</text>

  <!-- Step boxes -->
  <rect x="100" y="365" width="110" height="50" fill="#F0ECFF" rx="8" stroke="#8B7DB8" stroke-width="2"/>
  <text x="155" y="387" text-anchor="middle" fill="#1A1D24" font-size="12" font-weight="700">仮説生成</text>
  <text x="155" y="405" text-anchor="middle" fill="#8B7DB8" font-size="11">エージェントA</text>

  <text x="225" y="393" text-anchor="middle" fill="#1A1D24" font-size="18">→</text>

  <rect x="245" y="365" width="110" height="50" fill="#F0ECFF" rx="8" stroke="#8B7DB8" stroke-width="2"/>
  <text x="300" y="387" text-anchor="middle" fill="#1A1D24" font-size="12" font-weight="700">実験設計</text>
  <text x="300" y="405" text-anchor="middle" fill="#8B7DB8" font-size="11">エージェントB</text>

  <text x="370" y="393" text-anchor="middle" fill="#1A1D24" font-size="18">→</text>

  <rect x="390" y="365" width="110" height="50" fill="#F0ECFF" rx="8" stroke="#8B7DB8" stroke-width="2"/>
  <text x="445" y="387" text-anchor="middle" fill="#1A1D24" font-size="12" font-weight="700">コード実装</text>
  <text x="445" y="405" text-anchor="middle" fill="#8B7DB8" font-size="11">エージェントC</text>

  <text x="515" y="393" text-anchor="middle" fill="#1A1D24" font-size="18">→</text>

  <rect x="535" y="365" width="110" height="50" fill="#F0ECFF" rx="8" stroke="#8B7DB8" stroke-width="2"/>
  <text x="590" y="387" text-anchor="middle" fill="#1A1D24" font-size="12" font-weight="700">結果解釈</text>
  <text x="590" y="405" text-anchor="middle" fill="#8B7DB8" font-size="11">エージェントD</text>

  <text x="660" y="393" text-anchor="middle" fill="#1A1D24" font-size="18">→</text>

  <rect x="680" y="365" width="110" height="50" fill="#F0ECFF" rx="8" stroke="#8B7DB8" stroke-width="2"/>
  <text x="735" y="387" text-anchor="middle" fill="#1A1D24" font-size="12" font-weight="700">論文執筆</text>
  <text x="735" y="405" text-anchor="middle" fill="#8B7DB8" font-size="11">エージェントE</text>

  <!-- Adversarial review loop -->
  <path d="M155,420 Q155,480 445,480 Q735,480 735,420" stroke="#E85757" stroke-width="2.5" fill="none" stroke-dasharray="8,4"/>
  <text x="445" y="500" text-anchor="middle" fill="#E85757" font-size="13" font-weight="700">🔄 敵対的審査ループ（批判エージェントによる相互レビュー）</text>

  <!-- Score comparison visual -->
  <rect x="110" y="520" width="320" height="70" fill="#FFE0E0" rx="8" stroke="#E85757" stroke-width="2"/>
  <text x="270" y="545" text-anchor="middle" fill="#1A1D24" font-size="14" font-weight="700">基線 LLM単独</text>
  <text x="270" y="570" text-anchor="middle" fill="#E85757" font-size="24" font-weight="900">5.0 / 10</text>

  <text x="460" y="558" text-anchor="middle" fill="#1A1D24" font-size="24">→</text>

  <rect x="490" y="520" width="320" height="70" fill="#E8F0FD" rx="8" stroke="#8B7DB8" stroke-width="2.5"/>
  <text x="650" y="545" text-anchor="middle" fill="#1A1D24" font-size="14" font-weight="700">ARIS（敵対的協調）</text>
  <text x="650" y="570" text-anchor="middle" fill="#8B7DB8" font-size="24" font-weight="900">7.5 / 10</text>

  <!-- Right cards -->
  <g filter="url(#softShadow)">
    <rect x="860" y="318" width="360" height="138" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <rect x="860" y="318" width="8" height="138" fill="#8B7DB8" rx="4 0 0 4"/>
    <text x="882" y="348" fill="#1A1D24" font-size="15" font-weight="800">評価の限界</text>
    <text x="882" y="371" fill="#444" font-size="13">採点者 = LLM（循環評価）</text>
    <text x="882" y="391" fill="#444" font-size="13">長文・形式整合度バイアスの増幅</text>
    <text x="882" y="411" fill="#E85757" font-size="13">Nature・Science採択率は不明</text>
    <text x="882" y="431" fill="#444" font-size="12">Lean 4検証型と異なり独立確認困難</text>
    <text x="882" y="449" fill="#888" font-size="11">出典: arXiv 2605.02335（SJTU, 2026-05-04）</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="860" y="468" width="360" height="148" fill="white" rx="10" stroke="#1A1D24" stroke-width="2.5"/>
    <rect x="860" y="468" width="8" height="148" fill="#5CA46E" rx="4 0 0 4"/>
    <text x="882" y="498" fill="#1A1D24" font-size="15" font-weight="800">実用化への道筋</text>
    <text x="882" y="521" fill="#444" font-size="13">最大価値：ドライラボ（計算化学）</text>
    <text x="882" y="541" fill="#444" font-size="13">創薬仮説生成・材料設計</text>
    <text x="882" y="561" fill="#5CA46E" font-size="13">Novo×OpenAI提携に組み込み可能</text>
    <text x="882" y="581" fill="#444" font-size="12">ウェットラボ統合にはロボット実験装置</text>
    <text x="882" y="601" fill="#444" font-size="12">（Emerald Cloud Lab等）との接続が必要</text>
    <text x="882" y="612" fill="#888" font-size="11">数十億ドルの追加投資が前提条件</text>
  </g>

  <!-- Sticky notes -->
  <g transform="translate(80, 642) rotate(-1.5)" filter="url(#stickyShadow)">
    <rect width="195" height="100" fill="#FFF9C4" rx="4" stroke="#E8D84C" stroke-width="1.5"/>
    <text x="97" y="22" text-anchor="middle" fill="#5A5A00" font-size="13" font-weight="700">Bengio教授の批判</text>
    <text x="10" y="44" fill="#555" font-size="11">「現時点ではハイパー</text>
    <text x="10" y="62" fill="#555" font-size="11">パラメータ探索の自動化</text>
    <text x="10" y="80" fill="#555" font-size="11">にすぎない」</text>
    <text x="10" y="96" fill="#888" font-size="10">真の科学的発見には未到達</text>
  </g>
  <g transform="translate(298, 652) rotate(1.2)" filter="url(#stickyShadow)">
    <rect width="200" height="100" fill="#FFE0CC" rx="4" stroke="#E8906C" stroke-width="1.5"/>
    <text x="100" y="22" text-anchor="middle" fill="#7A2A00" font-size="13" font-weight="700">敵対的設計の課題</text>
    <text x="10" y="44" fill="#555" font-size="11">同一モデルが提案+批判</text>
    <text x="10" y="62" fill="#555" font-size="11">文体・視点が似てしまう</text>
    <text x="10" y="80" fill="#555" font-size="11">真の多様性確保が難しい</text>
    <text x="10" y="96" fill="#888" font-size="10">ピアレビューの独立性と別物</text>
  </g>
  <g transform="translate(520, 642) rotate(-0.8)" filter="url(#stickyShadow)">
    <rect width="195" height="100" fill="#E8F5EC" rx="4" stroke="#5CA46E" stroke-width="1.5"/>
    <text x="97" y="22" text-anchor="middle" fill="#1A5A30" font-size="13" font-weight="700">vs Aletheia（Google）</text>
    <text x="10" y="44" fill="#555" font-size="11">AletheiはLean 4形式証明</text>
    <text x="10" y="62" fill="#555" font-size="11">→独立検証可能</text>
    <text x="10" y="80" fill="#555" font-size="11">ARISはNeurIPSスコアのみ</text>
    <text x="10" y="96" fill="#888" font-size="10">信頼性の根拠が根本的に違う</text>
  </g>
  <g transform="translate(740, 648) rotate(1.8)" filter="url(#stickyShadow)">
    <rect width="195" height="100" fill="#EDE0FF" rx="4" stroke="#8B7DB8" stroke-width="1.5"/>
    <text x="97" y="22" text-anchor="middle" fill="#3A1A7A" font-size="13" font-weight="700">「問いを設定する能力」</text>
    <text x="10" y="44" fill="#555" font-size="11">真の科学的発見に必要な</text>
    <text x="10" y="62" fill="#555" font-size="11">パラダイム的問いの設定</text>
    <text x="10" y="80" fill="#555" font-size="11">現在のLLMでは未実現</text>
    <text x="10" y="96" fill="#888" font-size="10">Ineffable Intelligenceの狙い所</text>
  </g>

  <!-- Bottom summary -->
  <g filter="url(#softShadow)">
    <rect x="80" y="762" width="1240" height="76" fill="white" rx="8" stroke="#1A1D24" stroke-width="2"/>
    <text x="100" y="786" fill="#1A1D24" font-size="14" font-weight="800">📊 「AIが科学をする」の現在地</text>
    <text x="100" y="808" fill="#444" font-size="13">ARIS（上海交通大学）・Aletheia（Google）・AI Scientist（Sakana AI）等が「自律科学的発見」という同じ方向を目指している。</text>
    <text x="100" y="828" fill="#8B7DB8" font-size="13" font-weight="700">→ 独立検証可能な成果（Lean 4・実験再現性）を持つAletheia型が信頼性で優位。ARISはドライラボ創薬での実用が最初のリアルな貢献になりうる。</text>
  </g>

  <rect x="80" y="860" width="1240" height="2" fill="#E8E2D3"/>
  <text x="730" y="884" text-anchor="middle" fill="#999" font-size="13" font-style="italic">AI News · 2026-05-07 · ARIS Autonomous Research Harness for ML (SJTU arXiv 2605.02335)</text>
</svg>
