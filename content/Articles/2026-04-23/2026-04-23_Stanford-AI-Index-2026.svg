    <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5CA46E"/>
      <stop offset="100%" stop-color="#3D8050"/>
    </linearGradient>
    <linearGradient id="grayBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9BA8B5"/>
      <stop offset="100%" stop-color="#7A8A98"/>
