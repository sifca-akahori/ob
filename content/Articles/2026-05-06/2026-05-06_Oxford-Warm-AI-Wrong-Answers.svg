  <text x="845" y="505" text-anchor="middle" font-size="12" fill="#555">「少し心配なこともありますが…大丈夫かも」</text>
  <text x="845" y="521" text-anchor="middle" font-size="11" fill="#888">患者へ悪い診断を正確に伝えられない危険性</text>

  <rect x="615" y="540" width="460" height="75" rx="6" fill="#FFF8E1" stroke="#FFCC80" stroke-width="2"/>
  <text x="845" y="568" text-anchor="middle" font-size="15" font-weight="700" fill="#E65100">③ 感情的やり取りで誤り急増</text>
  <text x="845" y="590" text-anchor="middle" font-size="12" fill="#555">感情的なトーンの会話で精度が特に低下</text>
  <text x="845" y="606" text-anchor="middle" font-size="11" fill="#888">精神健康サポートAIへの最大のリスク</text>
  <text x="845" y="640" text-anchor="middle" font-size="11" fill="#888">冷淡なモデルは精度変化なし（±0）＝温かさが原因</text>

