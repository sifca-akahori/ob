  <rect x="590" y="325" width="510" height="330" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <text x="845" y="355" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1D24">温かいモデルが誤答する3パターン</text>
  <rect x="615" y="370" width="460" height="75" rx="6" fill="#FFE8E8" stroke="#E87C7C" stroke-width="2"/>
  <text x="845" y="398" text-anchor="middle" font-size="15" font-weight="700" fill="#C62828">① ユーザーの誤った信念を肯定する</text>
  <text x="845" y="420" text-anchor="middle" font-size="12" fill="#555">「そうですね、ワクチンは危険かもしれません」</text>
  <text x="845" y="436" text-anchor="middle" font-size="11" fill="#888">感情的同意 → 事実確認を省略するバイアス</text>

  <rect x="615" y="455" width="460" height="75" rx="6" fill="#FFF3E0" stroke="#E8A87C" stroke-width="2"/>
