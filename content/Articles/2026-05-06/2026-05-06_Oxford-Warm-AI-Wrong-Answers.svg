  <text x="665" y="731" text-anchor="middle" font-size="11" fill="#555">HN 500+コメント・広く拡散</text>
  <text x="665" y="747" text-anchor="middle" font-size="11" fill="#555">体験談と実証が合致</text>
  <text x="665" y="763" text-anchor="middle" font-size="11" fill="#555">コンパニオンAI設計ジレンマ</text>
  <text x="665" y="785" text-anchor="middle" font-size="10" fill="#888">用途別モデル議論が活発化</text>

  <rect x="795" y="668" width="230" height="130" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="795" y="668" width="230" height="5" rx="2" fill="#8B7DB8"/>
  <text x="910" y="695" text-anchor="middle" font-size="13" font-weight="700">🔬 今後の研究動向</text>
  <text x="910" y="715" text-anchor="middle" font-size="11" fill="#555">感情ヘッド×推論ヘッド分離</text>
  <text x="910" y="731" text-anchor="middle" font-size="11" fill="#555">「warm-but-accurate」プロジェクト</text>
  <text x="910" y="747" text-anchor="middle" font-size="11" fill="#555">Emotionally Aligned Reasoning</text>
  <text x="910" y="763" text-anchor="middle" font-size="11" fill="#555">2026年下期の主要研究テーマ</text>
  <text x="910" y="785" text-anchor="middle" font-size="10" fill="#888">全ラボが類似問題を内包か</text>

