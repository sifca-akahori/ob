  <text x="420" y="695" text-anchor="middle" font-size="13" font-weight="700">⚠️ 実務への警告</text>
  <text x="420" y="715" text-anchor="middle" font-size="11" fill="#555">医療AIは「親切設計」が危険</text>
  <text x="420" y="731" text-anchor="middle" font-size="11" fill="#555">法律AIも感情優先で誤る</text>
  <text x="420" y="747" text-anchor="middle" font-size="11" fill="#555">メンヘルサポートAIが最高リスク</text>
  <text x="420" y="763" text-anchor="middle" font-size="11" fill="#555">「共感=正確」ではない設計へ</text>
  <text x="420" y="785" text-anchor="middle" font-size="10" fill="#888">「用途別モデル分離」論浮上</text>

