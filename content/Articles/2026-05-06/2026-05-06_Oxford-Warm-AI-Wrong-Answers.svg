    <text x="610" y="845" text-anchor="middle" font-size="13" font-weight="700" fill="#1565C0">医療AI設計への波</text>
    <text x="610" y="862" text-anchor="middle" font-size="11" fill="#555">FDA・CE規制に</text>
    <text x="610" y="878" text-anchor="middle" font-size="11" fill="#555">「温かさ設計の開示」</text>
