<svg viewBox="0 0 1400 1050" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Hiragino Sans','Yu Gothic',sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="4" fill="#FBF8F1"/>
      <circle cx="1" cy="1" r="0.3" fill="#E8E2D3" opacity="0.6"/>
      <circle cx="3" cy="3" r="0.3" fill="#E8E2D3" opacity="0.4"/>
    </pattern>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#1A1D24" flood-opacity="0.15"/>
    </filter>
    <filter id="stickyShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#1A1D24" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>

  <!-- Binding -->
  <rect x="0" y="0" width="44" height="1050" fill="#F0EBE0" stroke="#E8E2D3" stroke-width="1"/>
  <circle cx="22" cy="120" r="12" fill="white" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="22" cy="120" r="7" fill="#E8E2D3"/>
  <circle cx="22" cy="280" r="12" fill="white" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="22" cy="280" r="7" fill="#E8E2D3"/>
  <circle cx="22" cy="440" r="12" fill="white" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="22" cy="440" r="7" fill="#E8E2D3"/>
  <circle cx="22" cy="600" r="12" fill="white" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="22" cy="600" r="7" fill="#E8E2D3"/>
  <circle cx="22" cy="760" r="12" fill="white" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="22" cy="760" r="7" fill="#E8E2D3"/>
  <circle cx="22" cy="920" r="12" fill="white" stroke="#E8E2D3" stroke-width="2"/>
  <circle cx="22" cy="920" r="7" fill="#E8E2D3"/>

  <!-- Category tape -->
  <g transform="rotate(-3, 1250, 60)">
    <rect x="1100" y="20" width="260" height="44" rx="4" fill="#5CA46E" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)"/>
    <text x="1230" y="48" text-anchor="middle" font-size="18" font-weight="700" fill="white">#ビジネス #規制</text>
  </g>

  <!-- Date badge -->
  <rect x="60" y="22" width="200" height="40" rx="6" fill="#2F3842" filter="url(#softShadow)"/>
  <text x="160" y="47" text-anchor="middle" font-size="18" font-weight="700" fill="white">2026-05-06</text>

  <!-- Impact stars -->
  <text x="1310" y="90" text-anchor="middle" font-size="28">⭐⭐</text>

  <!-- Title block -->
  <rect x="60" y="80" width="1040" height="110" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <line x1="60" y1="80" x2="60" y2="190" stroke="#5B8DEF" stroke-width="8" stroke-linecap="round"/>
  <text x="90" y="122" font-size="31" font-weight="900" fill="#1A1D24">🏛️ 米CAISI、Google・Microsoft・xAIと事前評価協定を締結</text>
  <text x="90" y="162" font-size="21" font-weight="500" fill="#555">ガードレール剥奪モデルで国安保リスクを審査——フロンティアラボほぼ全社が参加</text>
  <text x="90" y="190" font-size="15" fill="#888">CNBC / Washington Post · 2026-05-05 · #ビジネス #規制 #CAISI #政府 #安全性</text>

  <!-- Hero icon (government shield) -->
  <g transform="translate(1115, 80)">
    <rect x="0" y="0" width="220" height="220" rx="10" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
    <!-- Shield -->
    <path d="M 110 30 L 180 60 L 180 130 Q 180 180 110 200 Q 40 180 40 130 L 40 60 Z" fill="#EBF3FF" stroke="#5B8DEF" stroke-width="3"/>
    <!-- US Star or check -->
    <text x="110" y="125" text-anchor="middle" font-size="52">🛡️</text>
    <text x="110" y="185" text-anchor="middle" font-size="13" fill="#555">CAISI</text>
    <text x="110" y="200" text-anchor="middle" font-size="12" fill="#888">US Commerce Dept.</text>
    <text x="110" y="213" text-anchor="middle" font-size="11" fill="#888">40回以上の評価実績</text>
  </g>

  <!-- Key numbers -->
  <rect x="60" y="210" width="1040" height="100" rx="8" fill="#1A1D24" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <text x="155" y="250" text-anchor="middle" font-size="40" font-weight="900" fill="#5B8DEF">5社</text>
  <text x="155" y="282" text-anchor="middle" font-size="14" fill="#aaa">今回追加（Google/MS/xAI）+既存</text>
  <line x1="270" y1="220" x2="270" y2="300" stroke="#444" stroke-width="1.5"/>
  <text x="410" y="250" text-anchor="middle" font-size="40" font-weight="900" fill="#5CA46E">40+</text>
  <text x="410" y="282" text-anchor="middle" font-size="14" fill="#aaa">評価完了済みモデル数</text>
  <line x1="540" y1="220" x2="540" y2="300" stroke="#444" stroke-width="1.5"/>
  <text x="700" y="250" text-anchor="middle" font-size="36" font-weight="900" fill="#E8A87C">3分野</text>
  <text x="700" y="282" text-anchor="middle" font-size="14" fill="#aaa">サイバー / バイオ / 化学</text>
  <line x1="840" y1="220" x2="840" y2="300" stroke="#444" stroke-width="1.5"/>
  <text x="960" y="250" text-anchor="middle" font-size="36" font-weight="900" fill="#E87C7C">任意</text>
  <text x="960" y="282" text-anchor="middle" font-size="14" fill="#aaa">法的強制力なし・協定のみ</text>

  <!-- Coverage diagram -->
  <rect x="60" y="325" width="510" height="330" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <text x="315" y="355" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1D24">CAISI協定参加ラボ（2026-05時点）</text>
  <rect x="90" y="372" width="450" height="36" rx="6" fill="#E8F5EC" stroke="#5CA46E" stroke-width="2"/>
  <text x="315" y="395" text-anchor="middle" font-size="13" font-weight="700">✅ OpenAI（2024年〜）</text>
  <rect x="90" y="415" width="450" height="36" rx="6" fill="#E8F5EC" stroke="#5CA46E" stroke-width="2"/>
  <text x="315" y="438" text-anchor="middle" font-size="13" font-weight="700">✅ Anthropic（2024年〜）</text>
  <rect x="90" y="458" width="450" height="36" rx="6" fill="#E8F5EC" stroke="#5CA46E" stroke-width="2"/>
  <text x="315" y="481" text-anchor="middle" font-size="13" font-weight="700">✅ Meta（参加済み）</text>
  <rect x="90" y="501" width="450" height="36" rx="6" fill="#BBDEFB" stroke="#5B8DEF" stroke-width="2"/>
  <text x="315" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#1565C0">🆕 Google DeepMind（今回追加）</text>
  <rect x="90" y="544" width="450" height="36" rx="6" fill="#BBDEFB" stroke="#5B8DEF" stroke-width="2"/>
  <text x="315" y="567" text-anchor="middle" font-size="13" font-weight="700" fill="#1565C0">🆕 Microsoft（今回追加）</text>
  <rect x="90" y="587" width="450" height="36" rx="6" fill="#BBDEFB" stroke="#5B8DEF" stroke-width="2"/>
  <text x="315" y="610" text-anchor="middle" font-size="13" font-weight="700" fill="#1565C0">🆕 xAI（今回追加）</text>
  <text x="315" y="643" text-anchor="middle" font-size="12" fill="#888">主要フロンティアラボをほぼ網羅</text>

  <!-- Evaluation process -->
  <rect x="590" y="325" width="510" height="330" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <text x="845" y="355" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1D24">評価プロセス：CAISIの手法</text>
  <!-- Steps -->
  <rect x="615" y="372" width="460" height="50" rx="6" fill="#FFF3CD" stroke="#E8A87C" stroke-width="2"/>
  <text x="845" y="395" text-anchor="middle" font-size="13" font-weight="700">Step 1：安全ガードレール剥奪</text>
  <text x="845" y="413" text-anchor="middle" font-size="11" fill="#555">「uncensored」状態でレッドチームが攻撃</text>
  <text x="845" y="435" text-anchor="middle" font-size="20">↓</text>
  <rect x="615" y="445" width="460" height="50" rx="6" fill="#FFE0B2" stroke="#E8A87C" stroke-width="2"/>
  <text x="845" y="468" text-anchor="middle" font-size="13" font-weight="700">Step 2：国安保リスク評価</text>
  <text x="845" y="486" text-anchor="middle" font-size="11" fill="#555">サイバー攻撃コード生成能力・生物兵器合成能力等</text>
  <text x="845" y="508" text-anchor="middle" font-size="20">↓</text>
  <rect x="615" y="518" width="460" height="50" rx="6" fill="#E8F5EC" stroke="#5CA46E" stroke-width="2"/>
  <text x="845" y="541" text-anchor="middle" font-size="13" font-weight="700">Step 3：外部公開（非開示）</text>
  <text x="845" y="559" text-anchor="middle" font-size="11" fill="#555">結果の大部分は非公開・限定的な透明性</text>
  <text x="845" y="590" text-anchor="middle" font-size="12" fill="#888">EU EASI：デプロイ後振る舞い重視</text>
  <text x="845" y="608" text-anchor="middle" font-size="12" fill="#5B8DEF">CAISI：能力上限重視（方法論の違い）</text>
  <text x="845" y="635" text-anchor="middle" font-size="11" fill="#888">「評価タイミングをラボが選べる」批判あり</text>

  <!-- Feature cards -->
  <rect x="60" y="668" width="235" height="130" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="60" y="668" width="235" height="5" rx="2" fill="#5B8DEF"/>
  <text x="178" y="695" text-anchor="middle" font-size="13" font-weight="700">🇺🇸 Trump政権の文脈</text>
  <text x="178" y="715" text-anchor="middle" font-size="11" fill="#555">Biden大統領令廃止後も生存</text>
  <text x="178" y="731" text-anchor="middle" font-size="11" fill="#555">「国安保のみ規制」の合意点</text>
  <text x="178" y="747" text-anchor="middle" font-size="11" fill="#555">政治的左右を問わない安全線</text>
  <text x="178" y="763" text-anchor="middle" font-size="11" fill="#555">AI Action Planへの整合化</text>
  <text x="178" y="785" text-anchor="middle" font-size="10" fill="#888">「規制ゼロ」ではなく「絞り込み」</text>

  <rect x="310" y="668" width="235" height="130" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="310" y="668" width="235" height="5" rx="2" fill="#E8A87C"/>
  <text x="428" y="695" text-anchor="middle" font-size="13" font-weight="700">⚡ xAI参加の思惑</text>
  <text x="428" y="715" text-anchor="middle" font-size="11" fill="#555">Musk裁判継続中での参加</text>
  <text x="428" y="731" text-anchor="middle" font-size="11" fill="#555">政府案件獲得へのロビー的側面</text>
  <text x="428" y="747" text-anchor="middle" font-size="11" fill="#555">Pentagon契約でReflection勝利</text>
  <text x="428" y="763" text-anchor="middle" font-size="11" fill="#555">Colossus×政府案件で挽回狙い</text>
  <text x="428" y="785" text-anchor="middle" font-size="10" fill="#888">協定≠政府認定に注意</text>

  <rect x="560" y="668" width="235" height="130" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="560" y="668" width="235" height="5" rx="2" fill="#5CA46E"/>
  <text x="678" y="695" text-anchor="middle" font-size="13" font-weight="700">🌍 国際的波及</text>
  <text x="678" y="715" text-anchor="middle" font-size="11" fill="#555">日・EU・英との相互承認検討</text>
  <text x="678" y="731" text-anchor="middle" font-size="11" fill="#555">NIST AI RMFとの統合進行</text>
  <text x="678" y="747" text-anchor="middle" font-size="11" fill="#555">「AI安全基準のISO化」への布石</text>
  <text x="678" y="763" text-anchor="middle" font-size="11" fill="#555">各国評価機関との方法論比較</text>
  <text x="678" y="785" text-anchor="middle" font-size="10" fill="#888">G7 AI行動規範との整合性</text>

  <rect x="810" y="668" width="235" height="130" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="810" y="668" width="235" height="5" rx="2" fill="#E87C7C"/>
  <text x="928" y="695" text-anchor="middle" font-size="13" font-weight="700">⚠️ 実効性の限界</text>
  <text x="928" y="715" text-anchor="middle" font-size="11" fill="#555">任意協定・法的拘束力なし</text>
  <text x="928" y="731" text-anchor="middle" font-size="11" fill="#555">ラボが評価タイミングを選択可</text>
  <text x="928" y="747" text-anchor="middle" font-size="11" fill="#555">結果の大部分が非公開</text>
  <text x="928" y="763" text-anchor="middle" font-size="11" fill="#555">「透明性確保のふり」批判</text>
  <text x="928" y="785" text-anchor="middle" font-size="10" fill="#888">EU AI Actとの比較で明確な差</text>

  <!-- Sticky notes -->
  <g transform="rotate(-1.5, 160, 855)">
    <rect x="60" y="820" width="200" height="95" rx="4" fill="#FFF9C4" stroke="#E8D44D" stroke-width="1.5" filter="url(#stickyShadow)"/>
    <text x="160" y="845" text-anchor="middle" font-size="13" font-weight="700" fill="#555">40回の評価実績</text>
    <text x="160" y="862" text-anchor="middle" font-size="11" fill="#777">まだ非公開モデルも含む</text>
    <text x="160" y="878" text-anchor="middle" font-size="11" fill="#777">設立2年で急速に整備</text>
    <text x="160" y="894" text-anchor="middle" font-size="11" fill="#777">民間安全評価機関のロール</text>
    <text x="160" y="910" text-anchor="middle" font-size="10" fill="#bbb">📋 実績の積み上げ</text>
  </g>
  <g transform="rotate(1.2, 390, 855)">
    <rect x="285" y="820" width="200" height="95" rx="4" fill="#C8E6C9" stroke="#5CA46E" stroke-width="1.5" filter="url(#stickyShadow)"/>
    <text x="385" y="845" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D32">規制の温度差</text>
    <text x="385" y="862" text-anchor="middle" font-size="11" fill="#555">EU: 法的義務・包括的</text>
    <text x="385" y="878" text-anchor="middle" font-size="11" fill="#555">US: 自主規制・絞り込み</text>
    <text x="385" y="894" text-anchor="middle" font-size="11" fill="#555">日本: 規制の方向性検討中</text>
    <text x="385" y="910" text-anchor="middle" font-size="10" fill="#bbb">🌐 グローバルの分断</text>
  </g>
  <g transform="rotate(-0.8, 615, 855)">
    <rect x="510" y="820" width="200" height="95" rx="4" fill="#BBDEFB" stroke="#5B8DEF" stroke-width="1.5" filter="url(#stickyShadow)"/>
    <text x="610" y="845" text-anchor="middle" font-size="13" font-weight="700" fill="#1565C0">生物兵器リスク</text>
    <text x="610" y="862" text-anchor="middle" font-size="11" fill="#555">AI支援の合成生物学が</text>
    <text x="610" y="878" text-anchor="middle" font-size="11" fill="#555">最も深刻な懸念として</text>
    <text x="610" y="894" text-anchor="middle" font-size="11" fill="#555">評価の中心に据えられる</text>
    <text x="610" y="910" text-anchor="middle" font-size="10" fill="#bbb">🧬 バイオセキュリティ</text>
  </g>
  <g transform="rotate(1.5, 840, 855)">
    <rect x="730" y="820" width="200" height="95" rx="4" fill="#FFE0B2" stroke="#E8A87C" stroke-width="1.5" filter="url(#stickyShadow)"/>
    <text x="830" y="845" text-anchor="middle" font-size="13" font-weight="700" fill="#BF360C">NSA・CISAの役割</text>
    <text x="830" y="862" text-anchor="middle" font-size="11" fill="#555">CAISI単独では実行力不足</text>
    <text x="830" y="878" text-anchor="middle" font-size="11" fill="#555">実際の国安保執行は別機関</text>
    <text x="830" y="894" text-anchor="middle" font-size="11" fill="#555">権限委譲の整理が課題</text>
    <text x="830" y="910" text-anchor="middle" font-size="10" fill="#bbb">🔑 実施体制の問題</text>
  </g>

  <!-- Footer -->
  <line x1="60" y1="942" x2="1340" y2="942" stroke="#E8E2D3" stroke-width="1.5"/>
  <text x="700" y="967" text-anchor="middle" font-size="13" font-style="italic" fill="#aaa">AI News · 2026-05-06 · CAISI Signs Pre-Deployment AI Testing Agreements with Google DeepMind, Microsoft, and xAI</text>
  <text x="700" y="990" text-anchor="middle" font-size="11" fill="#ccc">Sources: CNBC, Washington Post, CNN, Al Jazeera, SiliconAngle</text>
</svg>
