  <rect x="88" y="405" width="740" height="110" rx="6" fill="#F8F4FF" stroke="#8B7DB8" stroke-width="2"/>
  <text x="458" y="430" text-anchor="middle" font-size="18" font-weight="900" fill="#1A1D24">"Transformers are Inherently Succinct"</text>
  <text x="458" y="453" text-anchor="middle" font-size="13" fill="#666">Pascal Bergsträßer · Ryan Cotterell · Anthony Widjaja Lin</text>
  <text x="98" y="480" font-size="13" fill="#333">• Transformerがなぜ強いかを <tspan font-weight="700">情報理論的に証明</tspan></text>
  <text x="98" y="498" font-size="13" fill="#333">• 概念の <tspan font-weight="700">符号化効率</tspan> においてTransformerがRNNより本質的に優れることを数学的に示す</text>
  <text x="98" y="516" font-size="13" fill="#333">• Quantized Johnson-Lindenstrauss変換・Succinct Circuit理論を活用</text>

  <text x="88" y="545" font-size="15" font-weight="700" fill="#8B7DB8">🏅 Honorable Mention</text>
  <rect x="88" y="552" width="740" height="55" rx="6" fill="#F5F0FF" stroke="#8B7DB8" stroke-width="1.5"/>
  <text x="458" y="576" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">BIRD-INTERACT: Re-Imagining Text-to-SQL via Dynamic Interactions</text>
  <text x="458" y="596" text-anchor="middle" font-size="12" fill="#666">Nan Huo et al. — 動的対話ベースのSQL評価パラダイム転換</text>

  <text x="88" y="637" font-size="12" fill="#999">* 全採択論文はOpenReview / ICLR公式で公開。Oral・Poster含め約2,000本。</text>

