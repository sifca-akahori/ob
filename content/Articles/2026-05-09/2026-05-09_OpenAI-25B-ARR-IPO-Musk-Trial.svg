  <line x1="840" y1="173" x2="840" y2="265" stroke="#E8E2D3" stroke-width="1"/>
  <text x="870" y="195" font-size="13" fill="#5C6370">MAU</text>
  <text x="870" y="240" font-size="48" font-weight="900" fill="#1A1D24">7億+</text>
  <text x="870" y="262" font-size="12" fill="#9AA0AB">ChatGPT（GPT-5.5 Instant）</text>

