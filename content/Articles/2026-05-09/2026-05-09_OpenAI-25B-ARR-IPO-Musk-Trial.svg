  <text x="200" y="745" text-anchor="middle" font-size="10" fill="#9AA0AB">PBC転換完了</text>
  <circle cx="420" cy="700" r="8" fill="#5B8DEF" stroke="#1A1D24" stroke-width="1.5"/>
  <text x="420" y="730" text-anchor="middle" font-size="11" fill="#5C6370">2026Q3</text>
  <text x="420" y="745" text-anchor="middle" font-size="10" fill="#9AA0AB">Musk裁判終結</text>
  <circle cx="650" cy="700" r="10" fill="#F5A623" stroke="#1A1D24" stroke-width="2"/>
  <text x="650" y="730" text-anchor="middle" font-size="11" font-weight="700" fill="#F5A623">2026Q4</text>
  <text x="650" y="745" text-anchor="middle" font-size="10" fill="#9AA0AB">Altman目標IPO</text>
  <circle cx="870" cy="700" r="8" fill="#9AA0AB" stroke="#1A1D24" stroke-width="1.5"/>
  <text x="870" y="730" text-anchor="middle" font-size="11" fill="#9AA0AB">2027</text>
  <text x="870" y="745" text-anchor="middle" font-size="10" fill="#9AA0AB">Friar推奨延期</text>

  <!-- Sticky notes -->
