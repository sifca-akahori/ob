    <text x="75" y="798" font-size="12" font-weight="700" fill="#5C4D00">⚖️ 裁判で財務開示</text>
    <text x="75" y="816" font-size="11" fill="#7A6800">Musk訴訟という公開の場で</text>
    <text x="75" y="833" font-size="11" fill="#7A6800">ARR・IPO計画が漏れるのは</text>
    <text x="75" y="850" font-size="11" fill="#7A6800">意図的PR戦略の可能性も</text>
  </g>
  <g transform="rotate(1.2, 420, 820)" filter="url(#stickyShadow)">
    <rect x="310" y="775" width="235" height="105" rx="3" fill="#C8F0FF" stroke="#4DC0E8" stroke-width="1"/>
    <text x="330" y="798" font-size="12" font-weight="700" fill="#003D5C">📊 Salesforce 25年の壁</text>
    <text x="330" y="816" font-size="11" fill="#005C85">SalesforceがARR $10Bに</text>
    <text x="330" y="833" font-size="11" fill="#005C85">25年かけた一方、OpenAIは</text>
    <text x="330" y="850" font-size="11" fill="#005C85">3年未満で$25Bを達成</text>
  </g>
  <g transform="rotate(-1.0, 680, 820)" filter="url(#stickyShadow)">
    <rect x="575" y="775" width="235" height="105" rx="3" fill="#D4F5D4" stroke="#5CA46E" stroke-width="1"/>
    <text x="595" y="798" font-size="12" font-weight="700" fill="#1A4D28">🎯 Altman vs Friar</text>
    <text x="595" y="816" font-size="11" fill="#1F6033">創業者は熱狂に乗りたい</text>
    <text x="595" y="833" font-size="11" fill="#1F6033">CFOは開示・SOX対応の</text>
    <text x="595" y="850" font-size="11" fill="#1F6033">現実を見ている定番対立</text>
  </g>
  <g transform="rotate(1.0, 930, 820)" filter="url(#stickyShadow)">
    <rect x="830" y="775" width="235" height="105" rx="3" fill="#FFE8CC" stroke="#E8A040" stroke-width="1"/>
    <text x="850" y="798" font-size="12" font-weight="700" fill="#5C3000">🚨 2030年まで赤字</text>
    <text x="850" y="816" font-size="11" fill="#7A4500">$250億収益でも$140億赤字</text>
    <text x="850" y="833" font-size="11" fill="#7A4500">EPS説明がIPO最大の難問</text>
    <text x="850" y="850" font-size="11" fill="#7A4500">機関投資家の様子見シナリオ</text>
  </g>

  <line x1="55" y1="1020" x2="1350" y2="1020" stroke="#D0C9B8" stroke-width="1"/>
  <text x="700" y="1040" text-anchor="middle" font-size="12" fill="#9AA0AB" font-style="italic">AI News · 2026-05-09 · OpenAI $25B ARR Crosses, IPO Plans Surface at Musk Trial</text>
</svg>
