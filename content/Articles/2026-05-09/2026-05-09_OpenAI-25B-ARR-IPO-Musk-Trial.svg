  <text x="85" y="240" font-size="48" font-weight="900" fill="#5B8DEF">$250億</text>
  <text x="85" y="262" font-size="12" fill="#9AA0AB">Greg Brockman Musk裁判証言</text>
  <line x1="310" y1="173" x2="310" y2="265" stroke="#E8E2D3" stroke-width="1"/>
