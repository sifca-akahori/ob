    <text x="1270" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="white">#ビジネス</text>
  </g>
  <rect x="55" y="18" width="165" height="34" rx="4" fill="#2F3842" stroke="#1A1D24" stroke-width="1.5"/>
  <text x="138" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="white">2026-05-09</text>
  <text x="260" y="42" font-size="20" fill="#F5A623">⭐⭐⭐</text>

  <text x="55" y="95" font-size="36" font-weight="900" fill="#1A1D24">📈 OpenAI ARR $250億突破・IPO計画がMusk裁判で露呈</text>
  <text x="55" y="128" font-size="17" fill="#5C6370">The Information / WSJ｜2026-05-09｜#ビジネス #IPO #ARR #OpenAI</text>
  <line x1="55" y1="140" x2="1350" y2="140" stroke="#1A1D24" stroke-width="2"/>

