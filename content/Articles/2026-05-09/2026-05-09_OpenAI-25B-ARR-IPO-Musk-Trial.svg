  <text x="340" y="240" font-size="48" font-weight="900" fill="#E05C5C">-$140億</text>
  <text x="340" y="262" font-size="12" fill="#9AA0AB">Stargate依存コスト継続</text>
  <line x1="580" y1="173" x2="580" y2="265" stroke="#E8E2D3" stroke-width="1"/>
  <text x="610" y="195" font-size="13" fill="#5C6370">IPO目標時期</text>
  <text x="610" y="240" font-size="48" font-weight="900" fill="#1A1D24">2026Q4</text>
