    <text x="220" y="178" text-anchor="middle" font-size="11" fill="#888">Starlink エッジ推論 + Colossus 訓練</text>
    <text x="220" y="194" text-anchor="middle" font-size="11" fill="#888">AWS/GCP 依存ゼロを目指す</text>

