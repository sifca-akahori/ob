    <text x="726" y="74" text-anchor="middle" font-size="11" fill="#5CA46E">→ 大型調達可能性も</text>

    <rect x="888" y="0" width="272" height="80" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" rx="8" filter="url(#softShadow)"/>
