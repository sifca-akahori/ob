    <rect x="300" y="165" width="130" height="45" fill="#FFF8F0" stroke="#E8A87C" stroke-width="1.5" rx="5"/>
    <text x="365" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2416">🔌 APIs</text>
