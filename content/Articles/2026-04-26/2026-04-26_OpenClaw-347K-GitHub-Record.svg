    <text x="1024" y="58" text-anchor="middle" font-size="11" fill="#555">非公開でバズ≠採用の懸念</text>
    <text x="1024" y="74" text-anchor="middle" font-size="11" fill="#888">→ 半年後に真価が判明</text>
