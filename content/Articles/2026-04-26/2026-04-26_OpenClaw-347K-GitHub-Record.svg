    <text x="134" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2416">🚀 爆発要因</text>
    <text x="134" y="42" text-anchor="middle" font-size="11" fill="#555">「実際に動く」デモ動画が</text>
