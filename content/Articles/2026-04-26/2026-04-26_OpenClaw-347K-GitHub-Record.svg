  </g>
  <g transform="translate(355 233)">
    <rect x="0" y="0" width="155" height="65" fill="#FFF8F0" stroke="#E8A87C" stroke-width="1.5" rx="6"/>
    <text x="77" y="20" text-anchor="middle" font-size="10" fill="#E8A87C" font-weight="bold">ピーク速度</text>
    <text x="77" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#1A1D24">12K/日</text>
  </g>
