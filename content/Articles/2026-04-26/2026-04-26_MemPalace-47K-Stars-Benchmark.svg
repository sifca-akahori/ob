    <text x="77" y="20" text-anchor="middle" font-size="10" fill="#E8A87C" font-weight="bold">LongMemEval R@5</text>
    <text x="77" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#1A1D24">96.6%</text>
  </g>
