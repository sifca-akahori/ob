    <circle cx="50" cy="280" r="12"/>
    <circle cx="50" cy="460" r="12"/>
    <circle cx="50" cy="640" r="12"/>
    <circle cx="50" cy="820" r="12"/>
    <circle cx="50" cy="960" r="12"/>
  </g>
  <g fill="#FBF8F1">
