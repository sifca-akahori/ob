<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#FBF8F1"/>
      <circle cx="15" cy="22" r="0.4" fill="#C4B389" opacity="0.3"/>
      <circle cx="67" cy="44" r="0.5" fill="#C4B389" opacity="0.3"/>
      <circle cx="33" cy="78" r="0.3" fill="#C4B389" opacity="0.3"/>
    </pattern>
    <linearGradient id="highlighterOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD4B0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFC898" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F0A870" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="barMemPalace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8A87C"/>
      <stop offset="100%" stop-color="#F8C8A0"/>
    </linearGradient>
    <linearGradient id="barOthers" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#888888"/>
      <stop offset="100%" stop-color="#AAAAAA"/>
    </linearGradient>
    <linearGradient id="starGrowth" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#E8A87C"/>
      <stop offset="100%" stop-color="#F8D090"/>
    </linearGradient>
    <filter id="stickyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <line x1="115" y1="30" x2="115" y2="1020" stroke="#D88A8A" stroke-width="1.2" opacity="0.4"/>

  <!-- Binding holes -->
  <g fill="#E8E2D3" stroke="#C8C0B0" stroke-width="1">
