  <rect x="140" y="220" width="1160" height="100" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" rx="8" filter="url(#softShadow)"/>
  <rect x="140" y="220" width="8" height="100" fill="#8B7DB8" rx="2"/>
  <g transform="translate(170 233)">
