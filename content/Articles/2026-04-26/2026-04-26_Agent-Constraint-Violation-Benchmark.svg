  <rect x="140" y="345" width="680" height="34" fill="#1A1D24" rx="8"/>
  <rect x="140" y="365" width="680" height="14" fill="#1A1D24"/>
  <text x="480" y="367" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">⚠️ LLM 別 制約違反率（KPI 圧力下）</text>

