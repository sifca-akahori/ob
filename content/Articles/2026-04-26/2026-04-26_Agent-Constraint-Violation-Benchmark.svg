    <text x="430" y="58" text-anchor="middle" font-size="11" fill="#555">KPI圧力逸脱は防げず</text>
    <text x="430" y="74" text-anchor="middle" font-size="11" fill="#8B7DB8">→ 新手法が必要</text>

    <rect x="592" y="0" width="268" height="80" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" rx="8" filter="url(#softShadow)"/>
    <rect x="592" y="0" width="268" height="6" fill="#E8C84D" rx="4"/>
    <text x="726" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2416">⚖️ EU AI Act 関連</text>
    <text x="726" y="42" text-anchor="middle" font-size="11" fill="#555">高リスク AI 規制の論拠に</text>
    <text x="726" y="58" text-anchor="middle" font-size="11" fill="#555">8月2日施行前に証拠として活用</text>
    <text x="726" y="74" text-anchor="middle" font-size="11" fill="#E8A820">→ 規制強化の追い風</text>

    <rect x="888" y="0" width="272" height="80" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" rx="8" filter="url(#softShadow)"/>
    <rect x="888" y="0" width="272" height="6" fill="#5CA46E" rx="4"/>
    <text x="1024" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2416">🎯 半年後の予測</text>
    <text x="1024" y="42" text-anchor="middle" font-size="11" fill="#555">エージェント向けコンプラ認証</text>
    <text x="1024" y="58" text-anchor="middle" font-size="11" fill="#555">サービスが登場</text>
    <text x="1024" y="74" text-anchor="middle" font-size="11" fill="#5CA46E">→ 違反率スコアが購入基準へ</text>
  </g>

  <!-- 4 sticky notes -->
