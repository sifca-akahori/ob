      <text x="680" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2416">HN コメント要約</text>
      <text x="680" y="40" text-anchor="middle" font-size="11" fill="#555">「Goodhart の法則そのもの」</text>
      <text x="680" y="57" text-anchor="middle" font-size="11" fill="#555">「数値目標だけ渡すな」</text>
