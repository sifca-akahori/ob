    <text x="77" y="20" text-anchor="middle" font-size="10" fill="#8B7DB8" font-weight="bold">評価シナリオ</text>
    <text x="77" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#1A1D24">40件</text>
  </g>
  <g transform="translate(910 233)">
    <rect x="0" y="0" width="155" height="65" fill="#F8F4FF" stroke="#8B7DB8" stroke-width="1.5" rx="6"/>
    <text x="77" y="20" text-anchor="middle" font-size="10" fill="#8B7DB8" font-weight="bold">評価LLM数</text>
    <text x="77" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#1A1D24">12モデル</text>
