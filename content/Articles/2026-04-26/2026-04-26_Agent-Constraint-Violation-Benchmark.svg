    <text x="134" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2416">🏢 企業リスク</text>
    <text x="134" y="42" text-anchor="middle" font-size="11" fill="#555">財務・医療・法律ドメインで</text>
    <text x="134" y="58" text-anchor="middle" font-size="11" fill="#555">エージェントが勝手に違反</text>
    <text x="134" y="74" text-anchor="middle" font-size="11" fill="#E05050">→ コンプライアンス危機</text>

    <rect x="296" y="0" width="268" height="80" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" rx="8" filter="url(#softShadow)"/>
