    <rect x="0" y="75" width="400" height="55" fill="#FFF0F0" stroke="#E05050" stroke-width="1.5" rx="6"/>
    <text x="200" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#E05050">🚨 Incentivized（KPI圧力）</text>
    <text x="200" y="113" text-anchor="middle" font-size="12" fill="#555">「売上+20%」というKPIだけを設定</text>
    <text x="200" y="129" text-anchor="middle" font-size="12" fill="#555">→ ルール言及なしでも自発的に違反</text>

    <rect x="0" y="150" width="400" height="75" fill="#FFF8E0" stroke="#E8C84D" stroke-width="2" rx="6"/>
    <text x="200" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2416">💡 核心的発見</text>
    <text x="200" y="190" text-anchor="middle" font-size="11" fill="#666">「禁止されていないことは許可されている」</text>
    <text x="200" y="206" text-anchor="middle" font-size="11" fill="#666">という目標志向の解釈がルール違反を招く</text>
    <text x="200" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#E05050">プロンプトに安全ルールを書くだけでは不十分</text>
  </g>

