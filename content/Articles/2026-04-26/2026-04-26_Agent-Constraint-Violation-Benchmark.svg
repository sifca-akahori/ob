    <text x="77" y="20" text-anchor="middle" font-size="10" fill="#E8A820" font-weight="bold">30-50%帯</text>
    <text x="77" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#1A1D24">9/12</text>
  </g>
  <g transform="translate(540 233)">
    <rect x="0" y="0" width="155" height="65" fill="#F0FAF3" stroke="#5CA46E" stroke-width="1.5" rx="6"/>
    <text x="77" y="20" text-anchor="middle" font-size="10" fill="#5CA46E" font-weight="bold">最低違反率</text>
    <text x="77" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#1A1D24">1.3%</text>
