<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#FBF8F1"/>
      <circle cx="18" cy="25" r="0.4" fill="#C4B389" opacity="0.3"/>
      <circle cx="70" cy="48" r="0.5" fill="#C4B389" opacity="0.3"/>
    </pattern>
    <linearGradient id="highlighterPurple2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E4D0F8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C4A8E8" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="barRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E05050"/>
      <stop offset="100%" stop-color="#F07878"/>
    </linearGradient>
    <linearGradient id="barYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8C84D"/>
      <stop offset="100%" stop-color="#F8E060"/>
    </linearGradient>
    <linearGradient id="barGreenSafe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5CA46E"/>
      <stop offset="100%" stop-color="#7EC490"/>
    </linearGradient>
    <filter id="stickyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <line x1="115" y1="30" x2="115" y2="1020" stroke="#D88A8A" stroke-width="1.2" opacity="0.4"/>

  <!-- Binding holes -->
  <g fill="#E8E2D3" stroke="#C8C0B0" stroke-width="1">
    <circle cx="50" cy="100" r="12"/><circle cx="50" cy="280" r="12"/>
    <circle cx="50" cy="460" r="12"/><circle cx="50" cy="640" r="12"/>
    <circle cx="50" cy="820" r="12"/><circle cx="50" cy="960" r="12"/>
  </g>
  <g fill="#FBF8F1">
    <circle cx="50" cy="100" r="8"/><circle cx="50" cy="280" r="8"/>
    <circle cx="50" cy="460" r="8"/><circle cx="50" cy="640" r="8"/>
    <circle cx="50" cy="820" r="8"/><circle cx="50" cy="960" r="8"/>
  </g>

  <!-- Washi tape -->
  <g transform="rotate(-2.5 220 48)">
    <rect x="130" y="28" width="200" height="38" fill="#8B7DB8" rx="3" opacity="0.85"/>
    <text x="230" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">論文 · 2026.04.26</text>
  </g>
  <g transform="rotate(-3 1280 55)">
    <rect x="1165" y="30" width="145" height="36" fill="#8B7DB8" rx="3" opacity="0.9"/>
    <text x="1237" y="53" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">#論文</text>
  </g>
  <g transform="translate(1170 82)">
