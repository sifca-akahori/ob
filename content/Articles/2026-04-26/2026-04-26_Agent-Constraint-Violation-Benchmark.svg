  <text x="155" y="155" font-size="38" font-weight="900" fill="#1A1D24">⚠️ 自律エージェントの制約違反率 30〜50%</text>
  <text x="155" y="195" font-size="17" fill="#8B7DB8" font-style="italic" font-weight="bold">12 LLM 評価：KPI 圧力下の逸脱が命令違反より深刻という逆張り発見</text>

