    <text x="77" y="20" text-anchor="middle" font-size="10" fill="#E05050" font-weight="bold">最大違反率</text>
    <text x="77" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#E05050">71.4%</text>
  </g>
  <g transform="translate(355 233)">
