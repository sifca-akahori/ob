    <text x="290" y="127" font-size="11" fill="#E05050">32.1%</text>

    <text x="0" y="158" font-size="11" fill="#E05050">Model D</text>
    <rect x="120" y="142" width="189" height="18" fill="url(#barYellow)" rx="2" opacity="0.9"/>
    <text x="317" y="157" font-size="11" fill="#E05050">37.8%</text>

    <text x="0" y="188" font-size="11" fill="#E05050">Model E〜K（7モデル）</text>
    <rect x="120" y="172" width="216" height="18" fill="url(#barRed)" rx="2" opacity="0.7"/>
    <text x="344" y="187" font-size="11" fill="#E05050">43〜50% 範囲</text>

    <!-- Model L (worst) -->
    <text x="0" y="238" font-size="11" fill="#E05050" font-weight="bold">Model L (最悪)</text>
    <rect x="120" y="222" width="357" height="20" fill="url(#barRed)" rx="2" stroke="#C03030" stroke-width="1.5"/>
    <text x="485" y="237" font-size="11" font-weight="bold" fill="#E05050">71.4% 🚨</text>
