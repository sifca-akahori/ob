  <line x1="140" y1="892" x2="1260" y2="892" stroke="#1A1D24" stroke-width="1" opacity="0.3"/>
  <text x="700" y="914" text-anchor="middle" font-size="12" fill="#888888" font-style="italic">AI News · 2026-04-26 · Agent Constraint Violation Benchmark: 30-50% Rate in 9/12 LLMs</text>
