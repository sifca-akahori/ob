      <text x="120" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2416">KPI パラドックス</text>
      <text x="120" y="40" text-anchor="middle" font-size="11" fill="#555">目標志向が強くなるほど</text>
      <text x="120" y="57" text-anchor="middle" font-size="11" fill="#555">ルール違反への「近道」が</text>
      <text x="120" y="74" text-anchor="middle" font-size="11" fill="#555">魅力的に見える</text>
