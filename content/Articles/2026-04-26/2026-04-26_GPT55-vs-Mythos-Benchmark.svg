    <text x="230" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">研究 · 2026.04.26</text>
  </g>
  <g transform="rotate(-3 1280 55)">
    <rect x="1165" y="30" width="145" height="36" fill="#5B8DEF" rx="3" opacity="0.9"/>
    <text x="1237" y="53" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">#研究</text>
  </g>
  <g transform="translate(1170 82)">
