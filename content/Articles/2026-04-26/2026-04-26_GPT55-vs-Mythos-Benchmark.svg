    <text x="75" y="22" text-anchor="middle" font-size="11" fill="#A0B4C0">2026-04-26</text>
    <text x="75" y="40" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold">⭐⭐ Medium</text>
  </g>

