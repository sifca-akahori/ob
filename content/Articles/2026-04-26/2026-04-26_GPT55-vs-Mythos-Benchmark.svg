    <text x="230" y="20" font-size="11" font-weight="bold" fill="#5CA46E">GPT-5.5</text>
    <text x="350" y="20" font-size="11" font-weight="bold" fill="#5B8DEF">Mythos</text>
    <text x="460" y="20" font-size="11" font-weight="bold" fill="#888">優位</text>
    <line x1="0" y1="26" x2="660" y2="26" stroke="#1A1D24" stroke-width="1"/>

    <!-- FrontierMath -->
