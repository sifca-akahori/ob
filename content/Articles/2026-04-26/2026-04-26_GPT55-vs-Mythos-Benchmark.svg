  <text x="155" y="155" font-size="38" font-weight="900" fill="#1A1D24">📊 GPT-5.5 vs Claude Mythos ベンチ頂上決戦</text>
  <text x="155" y="195" font-size="17" fill="#5B8DEF" font-style="italic" font-weight="bold">数学・コーディングは GPT-5.5、デスクトップは Mythos — 「全勝」なし</text>

  <!-- Key numbers -->
  <rect x="140" y="220" width="1160" height="100" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" rx="8" filter="url(#softShadow)"/>
  <rect x="140" y="220" width="8" height="100" fill="#5B8DEF" rx="2"/>
  <g transform="translate(170 233)">
    <rect x="0" y="0" width="150" height="65" fill="#F0FAF3" stroke="#5CA46E" stroke-width="1.5" rx="6"/>
    <text x="75" y="18" text-anchor="middle" font-size="9" fill="#5CA46E" font-weight="bold">GPT-5.5 FrontierMath</text>
    <text x="75" y="47" text-anchor="middle" font-size="28" font-weight="bold" fill="#1A1D24">39.6%</text>
  </g>
  <g transform="translate(350 233)">
    <rect x="0" y="0" width="150" height="65" fill="#F0FAF3" stroke="#5CA46E" stroke-width="1.5" rx="6"/>
    <text x="75" y="18" text-anchor="middle" font-size="9" fill="#5CA46E" font-weight="bold">GPT-5.5 SWE-Bench Pro</text>
    <text x="75" y="47" text-anchor="middle" font-size="28" font-weight="bold" fill="#1A1D24">58.6%</text>
  </g>
  <g transform="translate(530 233)">
    <rect x="0" y="0" width="155" height="65" fill="#F0F5FF" stroke="#5B8DEF" stroke-width="1.5" rx="6"/>
    <text x="77" y="18" text-anchor="middle" font-size="9" fill="#5B8DEF" font-weight="bold">Mythos OSWorld-V</text>
    <text x="77" y="47" text-anchor="middle" font-size="28" font-weight="bold" fill="#1A1D24">79.6%</text>
  </g>
  <g transform="translate(715 233)">
    <rect x="0" y="0" width="155" height="65" fill="#F0F5FF" stroke="#5B8DEF" stroke-width="1.5" rx="6"/>
    <text x="77" y="18" text-anchor="middle" font-size="9" fill="#5B8DEF" font-weight="bold">Mythos HLE</text>
    <text x="77" y="47" text-anchor="middle" font-size="28" font-weight="bold" fill="#1A1D24">41.2%</text>
  </g>
  <g transform="translate(900 233)">
    <rect x="0" y="0" width="155" height="65" fill="#FFF8F0" stroke="#E8A87C" stroke-width="1.5" rx="6"/>
    <text x="77" y="18" text-anchor="middle" font-size="9" fill="#E8A87C" font-weight="bold">GPT-5.5 API 価格（出力）</text>
    <text x="77" y="47" text-anchor="middle" font-size="25" font-weight="bold" fill="#1A1D24">$30/1M</text>
  </g>
  <g transform="translate(1085 233)">
    <rect x="0" y="0" width="185" height="65" fill="#FFF0F0" stroke="#E05050" stroke-width="1.5" rx="6"/>
    <text x="92" y="18" text-anchor="middle" font-size="9" fill="#E05050" font-weight="bold">Mythos 公開状況</text>
    <text x="92" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#E05050">限定公開</text>
    <text x="92" y="60" text-anchor="middle" font-size="12" fill="#888">Glasswingのみ</text>
  </g>

  <!-- Multi-benchmark comparison radar-like -->
  <rect x="140" y="345" width="720" height="300" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" rx="8" filter="url(#softShadow)"/>
  <rect x="140" y="345" width="720" height="34" fill="#1A1D24" rx="8"/>
  <rect x="140" y="365" width="720" height="14" fill="#1A1D24"/>
