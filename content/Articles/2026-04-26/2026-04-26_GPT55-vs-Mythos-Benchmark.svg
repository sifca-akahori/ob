    <text x="0" y="109" font-size="12" fill="#2C2416">HLE (Humanity's Last)</text>
    <text x="230" y="109" font-size="12" fill="#5CA46E">40.8%</text>
    <text x="350" y="109" font-size="12" font-weight="bold" fill="#5B8DEF">41.2%</text>
    <rect x="440" y="94" width="65" height="18" fill="#5B8DEF" rx="3" opacity="0.2"/>
    <text x="472" y="107" text-anchor="middle" font-size="11" font-weight="bold" fill="#5B8DEF">Mythos</text>

    <!-- OSWorld-Verified -->
    <text x="0" y="144" font-size="12" fill="#2C2416">OSWorld-Verified</text>
    <text x="230" y="144" font-size="12" fill="#5CA46E">78.7%</text>
    <text x="350" y="144" font-size="12" font-weight="bold" fill="#5B8DEF">79.6%</text>
    <rect x="440" y="129" width="65" height="18" fill="#5B8DEF" rx="3" opacity="0.2"/>
    <text x="472" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#5B8DEF">Mythos</text>

    <!-- Terminal-Bench -->
    <rect x="0" y="150" width="660" height="28" fill="#F0FAF3" rx="3"/>
    <text x="0" y="169" font-size="12" fill="#2C2416">Terminal-Bench 2.0</text>
    <text x="230" y="169" font-size="12" font-weight="bold" fill="#5CA46E">82.7%</text>
    <text x="350" y="169" font-size="12" fill="#888">N/A</text>
    <rect x="440" y="154" width="65" height="18" fill="#5CA46E" rx="3" opacity="0.2"/>
    <text x="472" y="167" text-anchor="middle" font-size="11" font-weight="bold" fill="#5CA46E">GPT-5.5</text>

    <!-- MMLU -->
    <text x="0" y="204" font-size="12" fill="#2C2416">MMLU</text>
    <text x="230" y="204" font-size="12" fill="#5CA46E">~90%</text>
    <text x="350" y="204" font-size="12" fill="#5B8DEF">~91%</text>
    <rect x="440" y="189" width="65" height="18" fill="#888" rx="3" opacity="0.2"/>
    <text x="472" y="202" text-anchor="middle" font-size="11" fill="#888">飽和域</text>

    <text x="0" y="230" font-size="10" fill="#888" font-style="italic">* Mythos SWE-Bench Pro は推定値 / N/A は未公表</text>
  </g>

  <!-- Cost comparison -->
  <rect x="890" y="345" width="410" height="300" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" rx="8" filter="url(#softShadow)"/>
  <rect x="890" y="345" width="410" height="34" fill="#1A1D24" rx="8"/>
  <rect x="890" y="365" width="410" height="14" fill="#1A1D24"/>
  <text x="1095" y="367" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">💰 API コスト比較</text>

  <g transform="translate(915 400)">
    <!-- Headers -->
    <text x="0" y="20" font-size="11" font-weight="bold" fill="#2C2416">モデル</text>
    <text x="165" y="20" font-size="11" font-weight="bold" fill="#2C2416">入力/1M</text>
    <text x="260" y="20" font-size="11" font-weight="bold" fill="#2C2416">出力/1M</text>
    <line x1="0" y1="26" x2="360" y2="26" stroke="#1A1D24" stroke-width="1"/>

    <!-- GPT-5.5 -->
    <rect x="0" y="30" width="360" height="28" fill="#F0FAF3" rx="3"/>
    <text x="0" y="49" font-size="12" font-weight="bold" fill="#5CA46E">GPT-5.5</text>
    <text x="165" y="49" font-size="12" fill="#5CA46E">$5</text>
    <text x="260" y="49" font-size="12" font-weight="bold" fill="#E05050">$30 💸</text>

    <!-- GPT-5.5 Pro -->
    <text x="0" y="84" font-size="12" fill="#5CA46E">GPT-5.5 Pro</text>
    <text x="165" y="84" font-size="12" fill="#E05050">$30</text>
    <text x="260" y="84" font-size="12" fill="#E05050">$180 💸💸</text>

    <!-- Claude Opus 4.7 -->
    <rect x="0" y="90" width="360" height="28" fill="#F0F5FF" rx="3"/>
    <text x="0" y="109" font-size="12" fill="#5B8DEF">Claude Opus 4.7</text>
    <text x="165" y="109" font-size="12" fill="#5B8DEF">$2.5</text>
    <text x="260" y="109" font-size="12" fill="#5B8DEF">$15</text>

    <!-- Mythos Preview -->
    <text x="0" y="144" font-size="12" fill="#8B7DB8">Claude Mythos</text>
    <text x="165" y="144" font-size="12" fill="#888">限定</text>
    <text x="260" y="144" font-size="12" fill="#888">非公開</text>

    <!-- DeepSeek V4 Pro -->
    <rect x="0" y="150" width="360" height="28" fill="#FFF8F0" rx="3"/>
    <text x="0" y="169" font-size="12" fill="#E8A87C">DeepSeek V4-Pro</text>
    <text x="165" y="169" font-size="12" fill="#E8A87C">$0.58</text>
    <text x="260" y="169" font-size="12" font-weight="bold" fill="#5CA46E">$3.48 ✅</text>

    <!-- Summary box -->
    <rect x="0" y="195" width="360" height="55" fill="#FFF9E6" stroke="#E8C84D" stroke-width="1.5" rx="5"/>
    <text x="180" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2416">GPT-5.5 出力は DeepSeek の 8.6 倍</text>
    <text x="180" y="233" text-anchor="middle" font-size="11" fill="#666">SWE-Bench 差 3.2pt のために払うコスト</text>
    <text x="180" y="249" text-anchor="middle" font-size="11" fill="#888">コスト感応度が高い開発者には難しい選択</text>
  </g>

  <!-- 4 cards -->
  <g transform="translate(140 670)">
    <rect x="0" y="0" width="268" height="80" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" rx="8" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="268" height="6" fill="#5CA46E" rx="4"/>
    <text x="134" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2416">数学は GPT-5.5 の圧勝</text>
    <text x="134" y="42" text-anchor="middle" font-size="11" fill="#555">FrontierMath 39.6%</text>
    <text x="134" y="58" text-anchor="middle" font-size="11" fill="#555">vs Opus 4.7の23.2%（1.7倍）</text>
    <text x="134" y="74" text-anchor="middle" font-size="11" fill="#5CA46E">→ 研究・数値計算用途に</text>

    <rect x="296" y="0" width="268" height="80" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" rx="8" filter="url(#softShadow)"/>
    <rect x="296" y="0" width="268" height="6" fill="#5B8DEF" rx="4"/>
    <text x="430" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2416">操作は Mythos が首位</text>
    <text x="430" y="42" text-anchor="middle" font-size="11" fill="#555">OSWorld 79.6% vs 78.7%</text>
    <text x="430" y="58" text-anchor="middle" font-size="11" fill="#555">0.9pt 差だが評価一貫</text>
    <text x="430" y="74" text-anchor="middle" font-size="11" fill="#5B8DEF">→ デスクトップ自動化に</text>

    <rect x="592" y="0" width="268" height="80" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" rx="8" filter="url(#softShadow)"/>
    <rect x="592" y="0" width="268" height="6" fill="#E8A87C" rx="4"/>
    <text x="726" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2416">Mythos の不公平な評価</text>
    <text x="726" y="42" text-anchor="middle" font-size="11" fill="#555">限定公開 → 独立再現不可</text>
    <text x="726" y="58" text-anchor="middle" font-size="11" fill="#555">Anthropic 自己報告が中心</text>
    <text x="726" y="74" text-anchor="middle" font-size="11" fill="#E8A87C">→ スコアに割引が必要</text>

    <rect x="888" y="0" width="272" height="80" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" rx="8" filter="url(#softShadow)"/>
    <rect x="888" y="0" width="272" height="6" fill="#888" rx="4"/>
    <text x="1024" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2416">次の対決</text>
    <text x="1024" y="42" text-anchor="middle" font-size="11" fill="#555">Grok 5 / Claude 5 / Gemini 3.2</text>
    <text x="1024" y="58" text-anchor="middle" font-size="11" fill="#555">H2 2026 以降に登場予定</text>
    <text x="1024" y="74" text-anchor="middle" font-size="11" fill="#888">→ TTC効率が次の戦場</text>
  </g>

  <!-- 4 sticky notes -->
  <g transform="translate(140 778)">
    <g transform="rotate(-1.5 120 80)" filter="url(#stickyShadow)">
      <rect x="0" y="0" width="240" height="90" fill="#FFF9C4" stroke="#E8C84D" stroke-width="1.5" rx="4"/>
      <text x="120" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2416">FrontierMath のリーク疑惑</text>
      <text x="120" y="40" text-anchor="middle" font-size="11" fill="#555">問題セットに訓練データが</text>
      <text x="120" y="57" text-anchor="middle" font-size="11" fill="#555">含まれているかは未検証</text>
      <text x="120" y="74" text-anchor="middle" font-size="11" fill="#555">スコアの独立検証が必要</text>
    </g>
    <g transform="rotate(1.2 400 80)" filter="url(#stickyShadow)">
      <rect x="280" y="0" width="240" height="90" fill="#C8F0D8" stroke="#5CA46E" stroke-width="1.5" rx="4"/>
      <text x="400" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2416">コスト最適解</text>
      <text x="400" y="40" text-anchor="middle" font-size="11" fill="#555">性能：GPT-5.5 / Mythos</text>
      <text x="400" y="57" text-anchor="middle" font-size="11" fill="#555">コスト：DeepSeek V4-Flash</text>
      <text x="400" y="74" text-anchor="middle" font-size="11" fill="#555">バランス：Claude Opus 4.7</text>
    </g>
    <g transform="rotate(-0.8 680 80)" filter="url(#stickyShadow)">
      <rect x="560" y="0" width="240" height="90" fill="#FFE0CC" stroke="#E8A87C" stroke-width="1.5" rx="4"/>
      <text x="680" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2416">「全部勝てる」は幻想</text>
      <text x="680" y="40" text-anchor="middle" font-size="11" fill="#555">ユースケース特化選択が</text>
      <text x="680" y="57" text-anchor="middle" font-size="11" fill="#555">2026年デプロイの現実</text>
      <text x="680" y="74" text-anchor="middle" font-size="11" fill="#555">「万能モデル」を求めない</text>
    </g>
    <g transform="rotate(1.5 960 80)" filter="url(#stickyShadow)">
      <rect x="840" y="0" width="240" height="90" fill="#E0E8FF" stroke="#5B8DEF" stroke-width="1.5" rx="4"/>
      <text x="960" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2416">12ヶ月後のランキング</text>
      <text x="960" y="40" text-anchor="middle" font-size="11" fill="#555">Grok 5 / Claude 5 登場で</text>
      <text x="960" y="57" text-anchor="middle" font-size="11" fill="#555">現ランキングは過去の遺物</text>
      <text x="960" y="74" text-anchor="middle" font-size="11" fill="#555">TTC効率が次の差別化軸</text>
    </g>
