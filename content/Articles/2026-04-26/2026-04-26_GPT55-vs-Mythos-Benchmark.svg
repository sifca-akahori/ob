    <text x="0" y="49" font-size="12" fill="#2C2416">FrontierMath</text>
    <text x="230" y="49" font-size="12" font-weight="bold" fill="#5CA46E">39.6%</text>
    <text x="350" y="49" font-size="12" fill="#888">N/A</text>
    <rect x="440" y="34" width="65" height="18" fill="#5CA46E" rx="3" opacity="0.2"/>
