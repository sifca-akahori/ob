    <text x="230" y="84" font-size="12" font-weight="bold" fill="#5CA46E">58.6%</text>
    <text x="350" y="84" font-size="12" fill="#888">~60%*</text>
    <rect x="440" y="69" width="65" height="18" fill="#5CA46E" rx="3" opacity="0.2"/>
    <text x="472" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#5CA46E">拮抗</text>

    <!-- HLE -->
