  <text x="379" y="666" font-size="13" fill="#444">AIアクセラレータで</text>
  <text x="379" y="684" font-size="13" fill="#444">エージェントAI向けCPU</text>
  <text x="379" y="702" font-size="13" fill="#444">市場でAMDに対抗。</text>
  <text x="379" y="720" font-size="12" fill="#888">Foundry+チップレット戦略で差別化</text>

  <rect x="672" y="592" width="295" height="148" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="672" y="592" width="295" height="8" rx="4" fill="#5B8DEF"/>
  <text x="819" y="626" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">💡 省電力効果</text>
  <text x="690" y="648" font-size="13" fill="#444">CPU処理はGPU比で</text>
  <text x="690" y="666" font-size="13" fill="#444">大幅に省電力。AIデータ</text>
  <text x="690" y="684" font-size="13" fill="#444">センターの電力問題解決と</text>
  <text x="690" y="702" font-size="13" fill="#444">AI拡大の両立に貢献。</text>
  <text x="690" y="720" font-size="12" fill="#888">「環境×AIインフラ」の両立解に</text>

  <rect x="983" y="592" width="375" height="148" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
