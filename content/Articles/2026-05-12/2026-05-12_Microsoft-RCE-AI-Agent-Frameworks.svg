<svg viewBox="0 0 1400 1050" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#FBF8F1"/>
      <circle cx="1" cy="1" r="0.4" fill="#E8E2D3" opacity="0.5"/>
      <circle cx="3" cy="3" r="0.3" fill="#E8E2D3" opacity="0.4"/>
    </pattern>
    <filter id="softShadow"><feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#1A1D24" flood-opacity="0.12"/></filter>
    <filter id="stickyShadow"><feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#1A1D24" flood-opacity="0.18"/></filter>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#E87070"/></marker>
  </defs>
  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <rect x="0" y="0" width="36" height="1050" fill="#F0EBE2" stroke="#E8E2D3" stroke-width="1"/>
  <circle cx="18" cy="120" r="10" fill="#FBF8F1" stroke="#D0C9BC" stroke-width="2"/>
  <circle cx="18" cy="260" r="10" fill="#FBF8F1" stroke="#D0C9BC" stroke-width="2"/>
  <circle cx="18" cy="400" r="10" fill="#FBF8F1" stroke="#D0C9BC" stroke-width="2"/>
  <circle cx="18" cy="540" r="10" fill="#FBF8F1" stroke="#D0C9BC" stroke-width="2"/>
  <circle cx="18" cy="680" r="10" fill="#FBF8F1" stroke="#D0C9BC" stroke-width="2"/>
  <circle cx="18" cy="820" r="10" fill="#FBF8F1" stroke="#D0C9BC" stroke-width="2"/>
  <g transform="translate(1260, -8) rotate(3)">
    <rect x="0" y="0" width="180" height="44" fill="#8B7DB8" stroke="#1A1D24" stroke-width="2" rx="3"/>
    <text x="90" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="white">#論文</text>
  </g>
  <rect x="50" y="22" width="190" height="38" rx="4" fill="#2F3842" filter="url(#softShadow)"/>
  <text x="145" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="white">2026-05-07 → 5/12</text>
  <text x="260" y="50" font-size="22" fill="#F5A623">⭐⭐</text>

  <text x="56" y="102" font-size="36" font-weight="900" fill="#1A1D24">🔐 Microsoft：「プロンプトがシェルになる」</text>
  <text x="56" y="146" font-size="19" font-weight="400" fill="#555">主要AIエージェントフレームワーク（LangChain・AutoGen・CrewAI）にRCE脆弱性クラスを発見</text>
  <line x1="50" y1="160" x2="1360" y2="160" stroke="#1A1D24" stroke-width="2.5"/>

  <!-- HERO: Lock with broken chain -->
  <g transform="translate(1152, 180)" filter="url(#softShadow)">
    <!-- Broken lock body -->
    <rect x="25" y="65" width="110" height="90" rx="10" fill="#2F3842" stroke="#1A1D24" stroke-width="2.5"/>
    <!-- Shackle (broken) -->
    <path d="M55,65 Q55,20 80,20 Q105,20 105,65" stroke="#8B7DB8" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Broken part indicator -->
    <line x1="55" y1="48" x2="67" y2="44" stroke="#E87070" stroke-width="4"/>
    <text x="48" y="40" font-size="14" fill="#E87070">💥</text>
    <!-- Keyhole -->
    <circle cx="80" cy="102" r="12" fill="#888" stroke="#1A1D24" stroke-width="1.5"/>
    <rect x="74" y="102" width="12" height="18" rx="2" fill="#888" stroke="#1A1D24" stroke-width="1.5"/>
    <!-- RCE text -->
    <text x="80" y="145" text-anchor="middle" font-size="14" font-weight="900" fill="#E87070">RCE!</text>
    <!-- Exclamation -->
    <text x="145" y="90" font-size="32" fill="#E87070">⚠</text>
  </g>

  <!-- KEY NUMBERS -->
  <rect x="50" y="178" width="580" height="128" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
  <rect x="50" y="178" width="8" height="128" rx="4" fill="#8B7DB8"/>
  <text x="80" y="210" font-size="14" font-weight="700" fill="#555">AFFECTED FRAMEWORKS</text>
  <text x="80" y="260" font-size="54" font-weight="900" fill="#8B7DB8">3+</text>
  <text x="160" y="260" font-size="20" font-weight="700" fill="#1A1D24">主要フレームワーク影響</text>
  <text x="80" y="296" font-size="13" fill="#888">LangChain · AutoGen · CrewAI + OpenAI Agent SDK</text>
  <line x1="380" y1="192" x2="380" y2="298" stroke="#E8E2D3" stroke-width="1.5"/>
  <text x="410" y="228" font-size="13" font-weight="700" fill="#555">脆弱性タイプ</text>
  <text x="410" y="266" font-size="36" font-weight="900" fill="#E87070">PI→RCE</text>
  <text x="410" y="296" font-size="13" fill="#888">Prompt Injection → Remote Code Execution</text>

  <!-- MAIN VISUAL: Attack flow -->
  <rect x="50" y="328" width="900" height="220" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <text x="70" y="360" font-size="16" font-weight="700" fill="#1A1D24">▌ プロンプトインジェクション→RCE 攻撃チェーン</text>
  <line x1="70" y1="370" x2="930" y2="370" stroke="#E8E2D3" stroke-width="1"/>

  <!-- Step 1 -->
  <rect x="74" y="386" width="140" height="64" rx="8" fill="#FFF0F0" stroke="#E87070" stroke-width="2"/>
  <text x="144" y="414" text-anchor="middle" font-size="12" font-weight="700" fill="#C02020">① 悪意ある</text>
  <text x="144" y="432" text-anchor="middle" font-size="12" fill="#444">入力テキスト</text>
  <text x="144" y="448" text-anchor="middle" font-size="11" fill="#888">（Web, ドキュメント等）</text>
  <line x1="214" y1="418" x2="248" y2="418" stroke="#E87070" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Step 2 -->
  <rect x="252" y="386" width="140" height="64" rx="8" fill="#FFF8F0" stroke="#E87070" stroke-width="2"/>
  <text x="322" y="414" text-anchor="middle" font-size="12" font-weight="700" fill="#C02020">② LLMが</text>
  <text x="322" y="432" text-anchor="middle" font-size="12" fill="#444">指示として解釈</text>
  <text x="322" y="448" text-anchor="middle" font-size="11" fill="#888">（サニタイズ不十分）</text>
  <line x1="392" y1="418" x2="426" y2="418" stroke="#E87070" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Step 3 -->
  <rect x="430" y="386" width="140" height="64" rx="8" fill="#FFF0F0" stroke="#C02020" stroke-width="2.5"/>
  <text x="500" y="414" text-anchor="middle" font-size="12" font-weight="700" fill="#C02020">③ ツール呼び出し</text>
  <text x="500" y="432" text-anchor="middle" font-size="12" fill="#C02020">exec/bash 実行</text>
  <text x="500" y="448" text-anchor="middle" font-size="11" fill="#888">（フレームワークが正規処理）</text>
  <line x1="570" y1="418" x2="604" y2="418" stroke="#C02020" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <!-- Step 4: RCE -->
  <rect x="608" y="376" width="150" height="84" rx="8" fill="#C02020" stroke="#1A1D24" stroke-width="3"/>
  <text x="683" y="413" text-anchor="middle" font-size="20" font-weight="900" fill="white">RCE</text>
  <text x="683" y="436" text-anchor="middle" font-size="12" fill="#FFD0D0">任意コード実行</text>
  <text x="683" y="452" text-anchor="middle" font-size="11" fill="#FFD0D0">OS権限取得</text>

  <!-- Mitigation row -->
  <rect x="70" y="468" width="820" height="60" rx="6" fill="#F0F9F2" stroke="#5CA46E" stroke-width="1.5"/>
  <text x="90" y="492" font-size="14" font-weight="700" fill="#5CA46E">✅ 対策：</text>
  <text x="155" y="492" font-size="13" fill="#444">インプットサニタイズ（セマンティック判定）</text>
  <text x="500" y="492" font-size="13" fill="#444">+ ツール実行の権限最小化</text>
  <text x="750" y="492" font-size="13" fill="#444">+ Sandboxランタイム</text>
  <text x="90" y="516" font-size="12" fill="#888">* 自然言語サニタイズには別途LLM（ガードレールモデル）が必要→コスト・複雑性が2倍に</text>

  <!-- Right: Framework status -->
  <rect x="966" y="328" width="392" height="220" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <text x="986" y="358" font-size="15" font-weight="700" fill="#1A1D24">▌ 主要フレームワーク対応状況</text>
  <line x1="986" y1="368" x2="1340" y2="368" stroke="#E8E2D3" stroke-width="1"/>
  <!-- Table -->
  <text x="1000" y="398" font-size="13" font-weight="700" fill="#555">フレームワーク</text>
  <text x="1220" y="398" font-size="13" font-weight="700" fill="#555">対応状況</text>
  <line x1="986" y1="406" x2="1340" y2="406" stroke="#E8E2D3" stroke-width="1"/>
  <rect x="986" y="410" width="366" height="34" rx="3" fill="#FFF0F0"/>
  <text x="1000" y="432" font-size="13" fill="#1A1D24" font-weight="600">LangChain</text>
  <text x="1220" y="432" font-size="12" fill="#E87070">部分対策のみ (v0.3.25)</text>
  <rect x="986" y="448" width="366" height="34" rx="3" fill="#F0F9F2"/>
  <text x="1000" y="470" font-size="13" fill="#1A1D24" font-weight="600">AutoGen (MS傘下)</text>
  <text x="1220" y="470" font-size="12" fill="#5CA46E">Mitigation PR提出中</text>
  <rect x="986" y="486" width="366" height="34" rx="3" fill="#FFF0F0"/>
  <text x="1000" y="508" font-size="13" fill="#1A1D24" font-weight="600">CrewAI</text>
  <text x="1220" y="508" font-size="12" fill="#E87070">CVE記録が相次ぐ</text>
  <rect x="986" y="524" width="366" height="34" rx="3" fill="#FFF8F0"/>
  <text x="1000" y="546" font-size="13" fill="#1A1D24" font-weight="600">OpenAI Agent SDK</text>
  <text x="1220" y="546" font-size="12" fill="#888">同種脆弱性を確認中</text>

  <!-- CARDS -->
  <rect x="50" y="568" width="320" height="148" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="50" y="568" width="320" height="8" rx="4" fill="#8B7DB8"/>
  <text x="210" y="602" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">⚡ なぜ今問題に</text>
  <text x="68" y="624" font-size="13" fill="#444">「コード生成→即実行」</text>
  <text x="68" y="642" font-size="13" fill="#444">「シェル実行→結果フィード」</text>
  <text x="68" y="660" font-size="13" fill="#444">パターンが本番で急増中。</text>
  <text x="68" y="678" font-size="13" fill="#444">攻撃者のリターンが</text>
  <text x="68" y="696" font-size="13" fill="#888">格段に上がった。</text>

  <rect x="386" y="568" width="320" height="148" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="386" y="568" width="320" height="8" rx="4" fill="#8B7DB8"/>
  <text x="546" y="602" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">💰 サニタイズのコスト</text>
  <text x="404" y="624" font-size="13" fill="#444">自然言語のブラックリストは</text>
  <text x="404" y="642" font-size="13" fill="#444">容易に迂回される。</text>
  <text x="404" y="660" font-size="13" fill="#444">意味的判定にはガードレール</text>
  <text x="404" y="678" font-size="13" fill="#444">LLMが必要→「AIがAIを</text>
  <text x="404" y="696" font-size="13" fill="#888">監視」でコスト2倍に。</text>

  <rect x="722" y="568" width="320" height="148" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="722" y="568" width="320" height="8" rx="4" fill="#8B7DB8"/>
  <text x="882" y="602" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">🏛️ CISA・DoD連動</text>
  <text x="740" y="624" font-size="13" fill="#444">4/30 CISA・DoDが「エージェント</text>
  <text x="740" y="642" font-size="13" fill="#444">AIの慎重な採用」ガイダンスを</text>
  <text x="740" y="660" font-size="13" fill="#444">公開。今回の発見がその</text>
  <text x="740" y="678" font-size="13" fill="#444">技術的根拠として機能。</text>
  <text x="740" y="696" font-size="13" fill="#888">政府調達に追加審査の可能性。</text>

  <rect x="1058" y="568" width="300" height="148" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="1058" y="568" width="300" height="8" rx="4" fill="#8B7DB8"/>
  <text x="1208" y="602" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">🔮 Sandboxランタイム</text>
  <text x="1076" y="624" font-size="13" fill="#444">解決策はDocker/WASMでの</text>
  <text x="1076" y="642" font-size="13" fill="#444">ツール実行隔離。2027年に</text>
  <text x="1076" y="660" font-size="13" fill="#444">NIST/OSIが「安全な</text>
  <text x="1076" y="678" font-size="13" fill="#444">AIエージェントランタイム</text>
  <text x="1076" y="696" font-size="13" fill="#888">標準」を策定へ。</text>

  <!-- STICKY NOTES -->
  <g transform="translate(58, 735) rotate(-1.4)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="175" height="108" rx="3" fill="#FFF8C0" stroke="#E8D840" stroke-width="1.5"/>
    <line x1="0" y1="26" x2="175" y2="26" stroke="#E8D840" stroke-width="1"/>
    <text x="87" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#7A6800">🔍 SQLiとの類比</text>
    <text x="10" y="44" font-size="11" fill="#444">SQLiはパラメタライズで</text>
    <text x="10" y="60" font-size="11" fill="#444">標準化されたが、自然言語</text>
    <text x="10" y="76" font-size="11" fill="#444">サニタイズに固定的手法は</text>
    <text x="10" y="92" font-size="11" fill="#444">なく難易度が高い。</text>
  </g>

  <g transform="translate(256, 748) rotate(1.1)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="175" height="108" rx="3" fill="#D4F1FF" stroke="#7EC8E3" stroke-width="1.5"/>
    <line x1="0" y1="26" x2="175" y2="26" stroke="#7EC8E3" stroke-width="1"/>
    <text x="87" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#004A6E">⚡ ACI参照点</text>
    <text x="10" y="44" font-size="11" fill="#444">Google DeepMind ACI・</text>
    <text x="10" y="60" font-size="11" fill="#444">Anthropicのコンピューター</text>
    <text x="10" y="76" font-size="11" fill="#444">ユース設計が安全な</text>
    <text x="10" y="92" font-size="11" fill="#444">フレームワーク設計の参照点に。</text>
  </g>

  <g transform="translate(456, 735) rotate(-1.0)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="175" height="108" rx="3" fill="#FFE8D5" stroke="#FFB07C" stroke-width="1.5"/>
    <line x1="0" y1="26" x2="175" y2="26" stroke="#FFB07C" stroke-width="1"/>
    <text x="87" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#7A3800">🏢 企業採用の影響</text>
    <text x="10" y="44" font-size="11" fill="#444">SAP・Claude for Legal等の</text>
    <text x="10" y="60" font-size="11" fill="#444">大規模展開でフレームワーク</text>
    <text x="10" y="76" font-size="11" fill="#444">選定時に「セキュリティ</text>
    <text x="10" y="92" font-size="11" fill="#444">メンテナンス体制」を評価必須。</text>
  </g>

  <g transform="translate(656, 748) rotate(1.3)" filter="url(#stickyShadow)">
    <rect x="0" y="0" width="175" height="108" rx="3" fill="#E8DEFF" stroke="#B09EE8" stroke-width="1.5"/>
    <line x1="0" y1="26" x2="175" y2="26" stroke="#B09EE8" stroke-width="1"/>
    <text x="87" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#3A1A7A">🔬 OpenClaw調査</text>
    <text x="10" y="44" font-size="11" fill="#444">IBM X-Force/OpenClawが</text>
    <text x="10" y="60" font-size="11" fill="#444">agentic AI security</text>
    <text x="10" y="76" font-size="11" fill="#444">breachesを系統的に</text>
    <text x="10" y="92" font-size="11" fill="#444">文書化中。実例急増。</text>
  </g>

  <line x1="50" y1="864" x2="1350" y2="864" stroke="#D0C9BC" stroke-width="1"/>
  <text x="700" y="884" text-anchor="middle" font-size="13" font-style="italic" fill="#888">AI News · 2026-05-12 · Microsoft Security — Prompts Become Shells: RCE in AI Agent Frameworks</text>
</svg>
