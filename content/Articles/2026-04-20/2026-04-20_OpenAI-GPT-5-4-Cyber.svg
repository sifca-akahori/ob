      <rect x="0" y="0" width="300" height="28" fill="#F2E4A8"/>
      <text x="150" y="19" font-size="13" font-weight="800" fill="#3A3D44" text-anchor="middle">📣 意図的なタイミング</text>
      <text x="15" y="50" font-size="12" fill="#3A3D44">Mythos発表から</text>
      <text x="15" y="68" font-size="12" fill="#3A3D44">わずか数日後のリリース。</text>
      <text x="15" y="94" font-size="12" fill="#3A3D44">Anthropicの「非公開」に対し</text>
      <text x="15" y="112" font-size="12" fill="#3A3D44">OpenAIは「防御特化で公開」。</text>
      <text x="15" y="138" font-size="11" font-weight="700" fill="#1A1D24">PR戦略と製品性の</text>
      <text x="15" y="155" font-size="11" font-weight="700" fill="#1A1D24">両立を狙う巧みな手口。</text>
