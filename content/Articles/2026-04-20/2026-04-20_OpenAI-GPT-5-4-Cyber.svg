      <text x="0" y="5" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">CYBER</text>
    </g>
  </g>

  <!-- KEY STAT: 3,000+ vulnerability fixes -->
  <g transform="translate(90, 290)">
    <rect x="0" y="0" width="560" height="200" rx="8" fill="#FFFFFF" stroke="#1A1D24" stroke-width="3" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="560" height="38" rx="8" fill="#1A1D24"/>
    <rect x="0" y="30" width="560" height="8" fill="#1A1D24"/>
    <text x="20" y="25" font-size="17" font-weight="800" fill="#FFFFFF" letter-spacing="1">📊 OpenAI Codex Security 実績</text>

    <!-- Big number -->
    <text x="40" y="115" font-size="80" font-weight="900" fill="#5B8DEF" letter-spacing="-2">3,000</text>
    <text x="270" y="95" font-size="30" font-weight="800" fill="#1A1D24">+ 件</text>
    <text x="270" y="125" font-size="16" font-weight="600" fill="#5C6371">重大脆弱性の</text>
    <text x="270" y="148" font-size="16" font-weight="600" fill="#5C6371">修正に貢献</text>

    <!-- Annotation -->
    <text x="40" y="150" font-size="13" font-weight="600" fill="#5C6371">Critical Vulnerabilities</text>
    <text x="40" y="170" font-size="12" fill="#8D9199">AppSec領域での実運用定着を示す象徴的数値</text>
    <text x="40" y="188" font-size="11" fill="#A8ACB4" font-style="italic">※「修正に貢献」の定義は各社で標準化が必要</text>

    <!-- Small bars showing severity -->
    <g transform="translate(400, 70)">
      <text x="0" y="0" font-size="11" font-weight="700" fill="#5C6371">重要度別分布 (概念図)</text>
      <rect x="0" y="10" width="120" height="14" fill="#1A1D24"/>
      <text x="0" y="36" font-size="10" fill="#5C6371">Critical</text>
      <rect x="0" y="44" width="90" height="14" fill="#5B8DEF"/>
      <text x="0" y="70" font-size="10" fill="#5C6371">High</text>
      <rect x="0" y="78" width="60" height="14" fill="#8FB3F0"/>
      <text x="0" y="104" font-size="10" fill="#5C6371">Medium</text>
      <rect x="0" y="112" width="30" height="14" fill="#C5D6F5"/>
      <text x="0" y="138" font-size="10" fill="#5C6371">Low</text>
    </g>
  </g>

  <!-- 4 USE CASE CARDS -->
  <g transform="translate(680, 290)">
    <text x="0" y="0" font-size="20" font-weight="800" fill="#1A1D24">🎯 主なユースケース</text>
    <line x1="0" y1="8" x2="240" y2="8" stroke="#1A1D24" stroke-width="2"/>

    <!-- Card 1: SOC業務 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="300" height="82" rx="6" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
      <rect x="0" y="0" width="6" height="82" fill="#5B8DEF"/>
      <circle cx="35" cy="41" r="18" fill="#EEF3FD" stroke="#5B8DEF" stroke-width="2"/>
      <text x="35" y="48" font-size="18" text-anchor="middle">👁️</text>
      <text x="65" y="30" font-size="16" font-weight="800" fill="#1A1D24">SOC業務支援</text>
      <text x="65" y="52" font-size="12" fill="#5C6371">アラートトリアージの自動化</text>
      <text x="65" y="68" font-size="12" fill="#5C6371">24/7 監視オペレーション</text>
    </g>

    <!-- Card 2: 脆弱性分析 -->
    <g transform="translate(320, 20)">
      <rect x="0" y="0" width="300" height="82" rx="6" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
      <rect x="0" y="0" width="6" height="82" fill="#5B8DEF"/>
      <circle cx="35" cy="41" r="18" fill="#EEF3FD" stroke="#5B8DEF" stroke-width="2"/>
      <text x="35" y="48" font-size="18" text-anchor="middle">🔍</text>
      <text x="65" y="30" font-size="16" font-weight="800" fill="#1A1D24">脆弱性分析</text>
      <text x="65" y="52" font-size="12" fill="#5C6371">コードレビュー / 静的解析</text>
      <text x="65" y="68" font-size="12" fill="#5C6371">CVE影響範囲の特定</text>
    </g>

    <!-- Card 3: インシデント対応 -->
    <g transform="translate(0, 112)">
      <rect x="0" y="0" width="300" height="82" rx="6" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
      <rect x="0" y="0" width="6" height="82" fill="#5B8DEF"/>
      <circle cx="35" cy="41" r="18" fill="#EEF3FD" stroke="#5B8DEF" stroke-width="2"/>
      <text x="35" y="48" font-size="18" text-anchor="middle">🚨</text>
      <text x="65" y="30" font-size="16" font-weight="800" fill="#1A1D24">インシデント対応</text>
      <text x="65" y="52" font-size="12" fill="#5C6371">フォレンジック支援</text>
      <text x="65" y="68" font-size="12" fill="#5C6371">タイムライン再構成・報告書</text>
    </g>

    <!-- Card 4: 誤検知削減 -->
    <g transform="translate(320, 112)">
      <rect x="0" y="0" width="300" height="82" rx="6" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
      <rect x="0" y="0" width="6" height="82" fill="#5B8DEF"/>
      <circle cx="35" cy="41" r="18" fill="#EEF3FD" stroke="#5B8DEF" stroke-width="2"/>
      <text x="35" y="48" font-size="18" text-anchor="middle">🎯</text>
      <text x="65" y="30" font-size="16" font-weight="800" fill="#1A1D24">誤検知削減</text>
      <text x="65" y="52" font-size="12" fill="#5C6371">優先度の高い警告に集中</text>
      <text x="65" y="68" font-size="12" fill="#5C6371">アラート疲労の解消</text>
    </g>
  </g>

  <!-- STRATEGY COMPARISON: Anthropic vs OpenAI -->
  <g transform="translate(90, 530)">
    <text x="0" y="0" font-size="20" font-weight="800" fill="#1A1D24">⚔️ AIセキュリティ戦略の対比</text>
    <line x1="0" y1="8" x2="340" y2="8" stroke="#1A1D24" stroke-width="2"/>

    <!-- Anthropic card -->
    <g transform="translate(0, 20)" filter="url(#softShadow)">
      <rect x="0" y="0" width="290" height="180" rx="6" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2"/>
      <rect x="0" y="0" width="290" height="42" rx="6" fill="#4A4F5A"/>
      <rect x="0" y="36" width="290" height="6" fill="#4A4F5A"/>
      <text x="145" y="28" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ANTHROPIC · Mythos</text>

      <text x="20" y="70" font-size="14" font-weight="800" fill="#1A1D24">🔒 限定パートナー提供</text>
      <text x="20" y="92" font-size="12" fill="#5C6371">Project Glasswing 経由</text>
      <text x="20" y="110" font-size="12" fill="#5C6371">政府・大企業・CVD組織</text>

      <line x1="20" y1="122" x2="270" y2="122" stroke="#D9DBE0" stroke-width="1" stroke-dasharray="3 3"/>

      <text x="20" y="142" font-size="13" font-weight="700" fill="#1A1D24">メッセージング</text>
      <text x="20" y="160" font-size="11" fill="#5C6371">「危険すぎて一般公開しない」</text>
      <text x="20" y="174" font-size="11" fill="#5C6371">"慎重さ" を打ち出す戦略</text>
    </g>

    <!-- VS divider -->
    <g transform="translate(300, 110)">
      <circle cx="0" cy="0" r="22" fill="#1A1D24"/>
      <text x="0" y="6" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">VS</text>
    </g>

    <!-- OpenAI card -->
    <g transform="translate(330, 20)" filter="url(#softShadow)">
      <rect x="0" y="0" width="290" height="180" rx="6" fill="#FFFFFF" stroke="#1A1D24" stroke-width="2"/>
      <rect x="0" y="0" width="290" height="42" rx="6" fill="#5B8DEF"/>
      <rect x="0" y="36" width="290" height="6" fill="#5B8DEF"/>
      <text x="145" y="28" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">OPENAI · GPT-5.4-Cyber</text>

      <text x="20" y="70" font-size="14" font-weight="800" fill="#1A1D24">🌐 広範なアクセス拡張</text>
      <text x="20" y="92" font-size="12" fill="#5C6371">セキュリティチーム向け公開</text>
      <text x="20" y="110" font-size="12" fill="#5C6371">事例を作って影響力を獲得</text>

      <line x1="20" y1="122" x2="270" y2="122" stroke="#D9DBE0" stroke-width="1" stroke-dasharray="3 3"/>

      <text x="20" y="142" font-size="13" font-weight="700" fill="#1A1D24">メッセージング</text>
      <text x="20" y="160" font-size="11" fill="#5C6371">「防御特化で公開可能にする」</text>
      <text x="20" y="174" font-size="11" fill="#5C6371">"実用性" を取りに行く戦略</text>
    </g>

    <!-- Bottom note -->
    <rect x="0" y="212" width="620" height="30" rx="4" fill="#F4F5F7"/>
    <text x="310" y="231" font-size="12" font-weight="600" fill="#3A3D44" text-anchor="middle" letter-spacing="1">どちらが業界規範を作るかは、今後1〜2年の実績次第 →  RSP型 vs 開放型 の明暗</text>
  </g>

  <!-- VERTICAL SKU TIMELINE -->
  <g transform="translate(740, 530)">
    <text x="0" y="0" font-size="20" font-weight="800" fill="#1A1D24">📈 垂直特化SKUの時代へ</text>
    <line x1="0" y1="8" x2="280" y2="8" stroke="#1A1D24" stroke-width="2"/>

