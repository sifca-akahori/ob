      <rect x="0" y="0" width="140" height="100" rx="6" fill="#F4F5F7" stroke="#A8ACB4" stroke-width="1.5"/>
      <text x="70" y="25" font-size="13" font-weight="800" fill="#5C6371" text-anchor="middle">2024〜2025</text>
      <line x1="10" y1="34" x2="130" y2="34" stroke="#A8ACB4" stroke-width="1"/>
      <text x="70" y="55" font-size="14" font-weight="700" fill="#3A3D44" text-anchor="middle">汎用フラッグシップ</text>
      <text x="70" y="75" font-size="11" fill="#6A6E77" text-anchor="middle">GPT-4 / Claude / Gemini</text>
      <text x="70" y="90" font-size="11" fill="#6A6E77" text-anchor="middle">性能競争</text>
    </g>

    <!-- Present (2026) -->
    <g transform="translate(210, 50)">
      <rect x="0" y="0" width="140" height="100" rx="6" fill="#EEF3FD" stroke="#5B8DEF" stroke-width="2"/>
      <text x="70" y="25" font-size="13" font-weight="800" fill="#5B8DEF" text-anchor="middle">2026（いま）</text>
      <line x1="10" y1="34" x2="130" y2="34" stroke="#5B8DEF" stroke-width="1"/>
      <text x="70" y="55" font-size="14" font-weight="700" fill="#1A1D24" text-anchor="middle">Cyber 特化登場</text>
      <text x="70" y="75" font-size="11" fill="#3A3D44" text-anchor="middle">GPT-5.4-Cyber</text>
      <text x="70" y="90" font-size="11" fill="#3A3D44" text-anchor="middle">Mythos (Anthropic)</text>
    </g>

    <!-- Future (2026 H2) -->
