      <line x1="10" y1="34" x2="130" y2="34" stroke="#1A1D24" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="70" y="55" font-size="14" font-weight="700" fill="#1A1D24" text-anchor="middle">他業種へ拡大</text>
      <text x="70" y="75" font-size="11" fill="#3A3D44" text-anchor="middle">-Health / -Legal</text>
      <text x="70" y="90" font-size="11" fill="#3A3D44" text-anchor="middle">-Finance / -Retail</text>
