<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#FBF8F1"/>
      <circle cx="12" cy="18" r="0.5" fill="#E8E2D3" opacity="0.6"/>
      <circle cx="43" cy="7" r="0.4" fill="#E8E2D3" opacity="0.5"/>
      <circle cx="72" cy="34" r="0.5" fill="#E8E2D3" opacity="0.6"/>
      <circle cx="88" cy="62" r="0.4" fill="#E8E2D3" opacity="0.5"/>
      <circle cx="28" cy="77" r="0.5" fill="#E8E2D3" opacity="0.6"/>
      <circle cx="55" cy="92" r="0.4" fill="#E8E2D3" opacity="0.5"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="stickyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background: paper -->
  <rect x="0" y="0" width="1400" height="1050" fill="url(#paperTexture)"/>

  <!-- Binding holes -->
  <circle cx="40" cy="120" r="8" fill="#E8E2D3"/>
  <circle cx="40" cy="280" r="8" fill="#E8E2D3"/>
  <circle cx="40" cy="440" r="8" fill="#E8E2D3"/>
  <circle cx="40" cy="600" r="8" fill="#E8E2D3"/>
  <circle cx="40" cy="760" r="8" fill="#E8E2D3"/>
  <circle cx="40" cy="920" r="8" fill="#E8E2D3"/>

  <!-- Category tape (ビジネス - blue/green) -->
  <g transform="translate(1150, 40) rotate(-3)">
    <rect x="0" y="0" width="200" height="40" fill="#5B8DEF" opacity="0.8"/>
    <text x="100" y="27" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">#ビジネス</text>
  </g>

  <!-- Date badge -->
  <g transform="translate(90, 50)">
    <rect x="0" y="0" width="170" height="38" rx="4" fill="#2F3842"/>
    <text x="85" y="25" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">2026 · 04 · 20</text>
  </g>

  <!-- Title -->
  <text x="90" y="130" font-size="40" font-weight="900" fill="#1A1D24" letter-spacing="1">🛡️ OpenAI、防御特化モデル</text>
  <text x="90" y="178" font-size="40" font-weight="900" fill="#1A1D24" letter-spacing="1">「GPT-5.4-Cyber」発表</text>
  <line x1="90" y1="198" x2="720" y2="198" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="208" x2="380" y2="208" stroke="#5B8DEF" stroke-width="2" stroke-linecap="round"/>
  <text x="90" y="240" font-size="18" font-weight="500" fill="#5C6371" letter-spacing="1">The Hacker News · 2026-04 · GPT-5.4 派生モデル</text>

  <!-- HERO: Shield mascot + CYBER badge -->
  <g transform="translate(1000, 130)" filter="url(#softShadow)">
    <!-- Shield body -->
    <path d="M 150 20 L 250 55 L 250 170 Q 250 235 150 280 Q 50 235 50 170 L 50 55 Z" fill="#FFFFFF" stroke="#1A1D24" stroke-width="4"/>
    <!-- Inner shield gradient lines -->
    <path d="M 150 40 L 232 72 L 232 170 Q 232 220 150 258 Q 68 220 68 170 L 68 72 Z" fill="none" stroke="#5B8DEF" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- Lock icon in center -->
    <rect x="125" y="135" width="50" height="48" rx="4" fill="#1A1D24"/>
    <path d="M 135 135 L 135 120 Q 135 100 150 100 Q 165 100 165 120 L 165 135" fill="none" stroke="#1A1D24" stroke-width="4" stroke-linecap="round"/>
    <circle cx="150" cy="155" r="5" fill="#5B8DEF"/>
    <rect x="148" y="158" width="4" height="14" fill="#5B8DEF"/>
    <!-- CYBER badge -->
    <g transform="translate(150, 220)">
