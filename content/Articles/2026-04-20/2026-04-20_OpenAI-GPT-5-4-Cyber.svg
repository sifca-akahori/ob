      <text x="15" y="94" font-size="12" fill="#3A3D44">象徴的な数値。</text>
      <text x="15" y="120" font-size="11" font-style="italic" fill="#5C6371">ただし「発見」か「修正」か</text>
      <text x="15" y="136" font-size="11" font-style="italic" fill="#5C6371">定義の曖昧さは残り、</text>
      <text x="15" y="155" font-size="11" font-weight="700" fill="#1A1D24">業界標準化が今後の課題。</text>
    </g>

    <!-- Note 3 -->
    <g transform="translate(640, 0) rotate(-0.8)" filter="url(#stickyShadow)">
