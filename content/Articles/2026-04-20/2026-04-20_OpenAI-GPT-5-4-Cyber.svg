      <rect x="0" y="0" width="300" height="28" fill="#B8DFB4"/>
      <text x="150" y="19" font-size="13" font-weight="800" fill="#3A3D44" text-anchor="middle">🧭 垂直SKUの時代</text>
      <text x="15" y="50" font-size="12" fill="#3A3D44">2024〜2025の「汎用競争」は</text>
