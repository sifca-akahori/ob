      <text x="15" y="74" font-size="11.5" fill="#2C2416">　防御特化派生で応答</text>
      <text x="15" y="97" font-size="11.5" fill="#2C2416">• 「公開できる形」を</text>
      <text x="15" y="113" font-size="11.5" fill="#2C2416">　模索するラボが増加</text>
      <text x="15" y="136" font-size="11.5" fill="#2C2416">• 規制当局の注目も高まる</text>
