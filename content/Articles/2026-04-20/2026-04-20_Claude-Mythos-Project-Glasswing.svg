      <path d="M 220 42 l 2 -4 l 2 4 l 4 1 l -3 3 l 1 4 l -4 -2 l -4 2 l 1 -4 l -3 -3 z"/>
      <path d="M 270 38 l 3 -5 l 3 5 l 5 1 l -4 3 l 1 5 l -5 -2 l -5 2 l 1 -5 l -4 -3 z"/>
