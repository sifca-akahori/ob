      <text x="15" y="113" font-size="11.5" fill="#2C2416">　の限定パートナー向け</text>
      <text x="15" y="136" font-size="11.5" fill="#2C2416">• 責任ある脆弱性開示</text>
      <text x="15" y="152" font-size="11.5" fill="#2C2416">　プロセスと連動</text>
    </g>

    <g transform="translate(290 15) rotate(1.5)" filter="url(#stickyShadow)">
      <rect x="0" y="0" width="275" height="175" fill="#F8C5D4" stroke="#E89AA9" stroke-width="1"/>
      <rect x="100" y="-7" width="75" height="18" fill="#EDAEBD" opacity="0.85" transform="rotate(2 137 2)"/>
      <text x="15" y="28" font-size="14" font-weight="bold" fill="#2C2416">⚠️ 脅威の新しさ</text>
      <line x1="15" y1="35" x2="140" y2="35" stroke="#B85070" stroke-width="1.5"/>
