        <rect x="0" y="0" width="155" height="68" fill="#FDF0F2" stroke="#D87986" stroke-width="1.5" rx="6"/>
        <text x="77" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#B85070">攻撃側 (Offensive)</text>
        <text x="10" y="36" font-size="11" fill="#2C2416">• 未発見の脆弱性発見</text>
        <text x="10" y="51" font-size="11" fill="#2C2416">• exploit 武器化</text>
        <text x="10" y="63" font-size="10.5" fill="#8B4A5A" font-style="italic">→ 単独実行可能水準</text>
      </g>

      <!-- Defense side -->
