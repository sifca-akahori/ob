      <text x="45" y="100" text-anchor="middle" font-size="11" fill="#2C2416" font-weight="bold">GLASSWING</text>
    </g>

    <!-- Dual capability axis -->
    <g transform="translate(165 20)">
      <text x="0" y="18" font-size="15" fill="#2C2416" font-weight="bold">⚔️ Mythos = 二面性を持つモデル</text>

      <!-- Attack side -->
