      <text x="15" y="97" font-size="11.5" fill="#2C2416">• 公開瞬間に能力ギャップ</text>
      <text x="15" y="113" font-size="11.5" fill="#2C2416">　が消える"非対称性"</text>
      <text x="15" y="136" font-size="11.5" fill="#2C2416">• 他社モデルも類似水準に</text>
      <text x="15" y="152" font-size="11.5" fill="#2C2416">　達しつつある可能性大</text>
