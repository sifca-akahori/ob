<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="'Comic Sans MS', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#F5EAD2"/>
      <circle cx="15" cy="22" r="0.4" fill="#C4B389" opacity="0.3"/>
      <circle cx="67" cy="44" r="0.5" fill="#C4B389" opacity="0.3"/>
      <circle cx="33" cy="78" r="0.3" fill="#C4B389" opacity="0.3"/>
      <circle cx="88" cy="88" r="0.4" fill="#C4B389" opacity="0.3"/>
      <circle cx="50" cy="10" r="0.3" fill="#C4B389" opacity="0.25"/>
    </pattern>
    <linearGradient id="highlighterPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B8E6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#D193CC" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="washiPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B894D0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9B7EC9" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="washiRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E89AA9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D87986" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="stickyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="shieldGrad" cx="0.5" cy="0.4">
      <stop offset="0%" stop-color="#C5A8DA"/>
      <stop offset="100%" stop-color="#9B7EC9"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>

  <g opacity="0.12" stroke="#8B7A5A" stroke-width="0.6">
