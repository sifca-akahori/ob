    <text x="25" y="32" text-anchor="middle" font-size="24" font-weight="bold" fill="#2C2416">!</text>
  </g>

  <!-- HERO ZONE: Shield + Dual capability -->
  <g transform="translate(140 240)">
    <rect x="0" y="0" width="1140" height="130" fill="#FFFFFF" stroke="#2C2416" stroke-width="2" rx="8" filter="url(#softShadow)" opacity="0.95"/>
