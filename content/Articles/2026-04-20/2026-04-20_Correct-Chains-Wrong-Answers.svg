<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="'Comic Sans MS', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#F5EAD2"/>
      <circle cx="15" cy="22" r="0.4" fill="#C4B389" opacity="0.3"/>
      <circle cx="67" cy="44" r="0.5" fill="#C4B389" opacity="0.3"/>
      <circle cx="33" cy="78" r="0.3" fill="#C4B389" opacity="0.3"/>
      <circle cx="88" cy="88" r="0.4" fill="#C4B389" opacity="0.3"/>
    </pattern>
    <linearGradient id="highlighterPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4C5EA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#B89FD4" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="washiPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C5A8DA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9B7EC9" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="stickyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>

  <g opacity="0.12" stroke="#8B7A5A" stroke-width="0.6">
    <line x1="80" y1="180" x2="1320" y2="180"/>
    <line x1="80" y1="220" x2="1320" y2="220"/>
  </g>
  <line x1="110" y1="30" x2="110" y2="1020" stroke="#D88A8A" stroke-width="1.2" opacity="0.45"/>
  <g fill="#D4C494" opacity="0.55">
    <circle cx="50" cy="100" r="11"/>
    <circle cx="50" cy="340" r="11"/>
    <circle cx="50" cy="580" r="11"/>
    <circle cx="50" cy="820" r="11"/>
  </g>
  <g fill="#F5EAD2">
    <circle cx="50" cy="100" r="8"/>
    <circle cx="50" cy="340" r="8"/>
    <circle cx="50" cy="580" r="8"/>
    <circle cx="50" cy="820" r="8"/>
  </g>

  <g transform="rotate(-4 200 45)">
    <rect x="130" y="25" width="180" height="40" fill="url(#washiPurple)"/>
    <g opacity="0.4" fill="#FFFFFF">
      <text x="150" y="50" font-size="18">∑</text>
      <text x="180" y="50" font-size="18">π</text>
      <text x="210" y="50" font-size="18">∞</text>
      <text x="240" y="50" font-size="18">λ</text>
      <text x="270" y="50" font-size="18">∂</text>
    </g>
  </g>

  <g transform="translate(1180 90)">
    <rect x="0" y="0" width="140" height="48" fill="#FFFFFF" stroke="#2C2416" stroke-width="1.5" rx="4" opacity="0.9"/>
    <rect x="6" y="6" width="128" height="36" fill="none" stroke="#2C2416" stroke-width="1" stroke-dasharray="3,2" rx="2"/>
    <text x="70" y="22" text-anchor="middle" font-size="11" fill="#8B6F47" font-weight="bold">— ICLR 2026 —</text>
    <text x="70" y="37" text-anchor="middle" font-size="13" fill="#2C2416" font-weight="bold">#論文</text>
  </g>

  <path d="M 150 118 Q 230 113, 350 115 Q 520 118, 700 114 Q 870 112, 1000 116 L 1000 168 Q 870 164, 700 168 Q 520 172, 345 168 Q 230 166, 150 168 Z"
        fill="url(#highlighterPaper)" opacity="0.75"/>
  <text x="165" y="158" font-size="42" font-weight="bold" fill="#2C2416">Correct Chains, Wrong Answers</text>
  <text x="165" y="198" font-size="18" fill="#6B5D3F" font-style="italic">推論過程と出力の乖離 — CoT評価の前提が揺らぐ</text>

  <!-- Brain icon -->
  <g transform="translate(1040 125) rotate(-10)">
    <path d="M 30 5 Q 15 5, 10 20 Q 5 35, 20 45 Q 10 60, 25 70 Q 40 80, 55 70 Q 70 80, 85 70 Q 100 60, 90 45 Q 105 35, 100 20 Q 95 5, 80 5 Q 65 0, 55 10 Q 45 0, 30 5 Z" fill="#D4C5EA" stroke="#2C2416" stroke-width="2"/>
    <path d="M 55 10 Q 55 40, 55 70" stroke="#9B7EC9" stroke-width="1.5" fill="none"/>
    <path d="M 30 20 Q 40 30, 35 40" stroke="#9B7EC9" stroke-width="1" fill="none"/>
    <path d="M 75 20 Q 65 30, 72 40" stroke="#9B7EC9" stroke-width="1" fill="none"/>
    <path d="M 25 50 Q 35 55, 40 60" stroke="#9B7EC9" stroke-width="1" fill="none"/>
    <path d="M 85 50 Q 75 55, 70 60" stroke="#9B7EC9" stroke-width="1" fill="none"/>
  </g>

  <!-- HERO ZONE: dissociation diagram -->
  <g transform="translate(140 240)">
    <rect x="0" y="0" width="1140" height="140" fill="#FFFFFF" stroke="#2C2416" stroke-width="2" rx="8" filter="url(#softShadow)" opacity="0.95"/>
    <rect x="0" y="0" width="8" height="140" fill="#9B7EC9"/>

    <text x="30" y="30" font-size="16" font-weight="bold" fill="#2C2416">🧩 「dissociation」の核心イメージ</text>

    <!-- Input -->
    <g transform="translate(50 55)">
      <rect x="0" y="0" width="130" height="60" fill="#F0E8D0" stroke="#2C2416" stroke-width="1.5" rx="6"/>
      <text x="65" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#6B5D3F">Input 問題</text>
      <text x="65" y="38" text-anchor="middle" font-size="13" fill="#2C2416" font-weight="bold">"13 × 7 は?"</text>
      <text x="65" y="53" text-anchor="middle" font-size="10" fill="#8B6F47">算数・論理・読解…</text>
    </g>

    <!-- Arrow -->
    <path d="M 190 85 L 225 85" stroke="#2C2416" stroke-width="2" marker-end="url(#blackarrow)"/>
    <path d="M 215 78 L 230 85 L 215 92" fill="none" stroke="#2C2416" stroke-width="2"/>

    <!-- CoT correct -->
    <g transform="translate(240 55)">
      <rect x="0" y="0" width="240" height="60" fill="#EEF5EE" stroke="#6FAE75" stroke-width="2" rx="6"/>
      <text x="120" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#4A8553">✓ CoT (思考の連鎖) — 正しい</text>
      <text x="15" y="38" font-size="11" fill="#2C2416">"13×7 = 13×(7) = 91 …"</text>
      <text x="15" y="53" font-size="10.5" fill="#3B6943" font-style="italic">推論プロセスは論理的</text>
    </g>

    <!-- Arrow DOWN from CoT -->
    <path d="M 360 125 L 360 145" stroke="#2C2416" stroke-width="2"/>
    <path d="M 353 138 L 360 148 L 367 138" fill="none" stroke="#2C2416" stroke-width="2"/>

    <!-- Decision point -->
    <g transform="translate(490 55)">
      <polygon points="50,0 100,40 50,80 0,40" fill="#FFF2A8" stroke="#D4C268" stroke-width="2"/>
      <text x="50" y="36" text-anchor="middle" font-size="11" font-weight="bold" fill="#2C2416">Output</text>
      <text x="50" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#2C2416">段階</text>
    </g>

    <!-- Arrow to wrong output -->
    <path d="M 600 95 L 650 95" stroke="#D87986" stroke-width="2.5"/>
    <path d="M 640 88 L 655 95 L 640 102" fill="none" stroke="#D87986" stroke-width="2.5"/>

    <!-- Wrong output -->
    <g transform="translate(670 55)">
      <rect x="0" y="0" width="200" height="60" fill="#FDF0F2" stroke="#D87986" stroke-width="2" rx="6"/>
      <text x="100" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#B85070">✗ 最終出力 — 間違い</text>
      <text x="15" y="38" font-size="13" fill="#2C2416" font-weight="bold">"答え: 81"</text>
      <text x="15" y="53" font-size="10.5" fill="#8B4A5A" font-style="italic">CoT と矛盾した出力</text>
    </g>

    <!-- Dissociation label -->
    <g transform="translate(890 65)">
      <rect x="0" y="0" width="220" height="60" fill="#9B7EC9" stroke="#2C2416" stroke-width="2" rx="8"/>
      <text x="110" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">= dissociation</text>
      <text x="110" y="46" text-anchor="middle" font-size="11" fill="#F0E8F5" font-style="italic">= 乖離現象（新命名）</text>
    </g>
  </g>

  <!-- DOMAIN SUMMARY -->
  <g transform="translate(140 410)">
    <rect x="0" y="0" width="560" height="38" fill="#2C2416" rx="4"/>
    <text x="15" y="25" font-size="18" font-weight="bold" fill="#F5EAD2">📚 3領域で観測される dissociation</text>

    <rect x="0" y="45" width="560" height="295" fill="#FFFFFF" stroke="#2C2416" stroke-width="2" rx="6" filter="url(#softShadow)"/>

    <g transform="translate(20 60)">
      <!-- Math -->
      <rect x="0" y="0" width="520" height="80" fill="#FAF5E8" stroke="#E8C84D" stroke-width="1.5" rx="6"/>
      <g transform="translate(10 15)">
        <circle cx="20" cy="20" r="20" fill="#F5D061" stroke="#2C2416" stroke-width="1.5"/>
        <text x="20" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2C2416">➗</text>
      </g>
      <text x="60" y="25" font-size="14" font-weight="bold" fill="#2C2416">数学 (Arithmetic / MATH)</text>
      <text x="60" y="48" font-size="11" fill="#6B5D3F">中間計算は正しい → 最終答えで桁を間違える、計算順序をずらす</text>
      <text x="60" y="64" font-size="11" fill="#8B6F47" font-style="italic">例: CoT "91" → 出力 "81"</text>

      <!-- Logic -->
      <rect x="0" y="95" width="520" height="80" fill="#F0F4FA" stroke="#5B8DEF" stroke-width="1.5" rx="6"/>
      <g transform="translate(10 110)">
        <circle cx="20" cy="20" r="20" fill="#5B8DEF" stroke="#2C2416" stroke-width="1.5"/>
        <text x="20" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">∴</text>
      </g>
      <text x="60" y="120" font-size="14" font-weight="bold" fill="#2C2416">論理 (演繹推論)</text>
      <text x="60" y="143" font-size="11" fill="#6B5D3F">推論ステップは妥当 → 最終結論で量化子や否定を誤る</text>
      <text x="60" y="159" font-size="11" fill="#8B6F47" font-style="italic">例: "すべての A は B" → 出力 "いくつかの A は B"</text>

      <!-- Language -->
      <rect x="0" y="190" width="520" height="80" fill="#F5F0F8" stroke="#9B7EC9" stroke-width="1.5" rx="6"/>
      <g transform="translate(10 205)">
        <circle cx="20" cy="20" r="20" fill="#9B7EC9" stroke="#2C2416" stroke-width="1.5"/>
        <text x="20" y="27" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">A</text>
      </g>
      <text x="60" y="215" font-size="14" font-weight="bold" fill="#2C2416">自然言語 (読解・推論)</text>
      <text x="60" y="238" font-size="11" fill="#6B5D3F">要約や論旨整理は正しい → 最終判断で対象人物・事実を混同</text>
      <text x="60" y="254" font-size="11" fill="#8B6F47" font-style="italic">例: 記事の要点は把握 → 著者と主人公を取り違える</text>
    </g>
  </g>

  <!-- IMPACT MATRIX -->
  <g transform="translate(740 410)">
    <rect x="0" y="0" width="540" height="38" fill="#2C2416" rx="4"/>
    <text x="15" y="25" font-size="18" font-weight="bold" fill="#F5EAD2">⚠️ 影響を受ける技術・評価</text>

    <rect x="0" y="45" width="540" height="295" fill="#FFFFFF" stroke="#2C2416" stroke-width="2" rx="6" filter="url(#softShadow)"/>

    <!-- Affected items -->
    <g transform="translate(15 60)">
      <g transform="translate(0 10)">
        <rect x="0" y="0" width="510" height="50" fill="#FDF0F2" stroke="#D87986" stroke-width="1" rx="4"/>
        <text x="12" y="22" font-size="13" font-weight="bold" fill="#2C2416">🧠 推論モデル（Extended Thinking / o1 系）</text>
        <text x="12" y="42" font-size="11" fill="#6B5D3F">"思考時間を増やす" アプローチの前提が崩れる可能性</text>
      </g>

      <g transform="translate(0 70)">
        <rect x="0" y="0" width="510" height="50" fill="#FFF8EB" stroke="#E8A87C" stroke-width="1" rx="4"/>
        <text x="12" y="22" font-size="13" font-weight="bold" fill="#2C2416">📊 ベンチマーク設計（GSM8K, MATH, BIG-Bench）</text>
        <text x="12" y="42" font-size="11" fill="#6B5D3F">最終答えのみで採点する設計の限界が露呈</text>
      </g>

      <g transform="translate(0 130)">
        <rect x="0" y="0" width="510" height="50" fill="#F5F0F8" stroke="#9B7EC9" stroke-width="1" rx="4"/>
        <text x="12" y="22" font-size="13" font-weight="bold" fill="#2C2416">🤖 LLMエージェント（プランニング型）</text>
        <text x="12" y="42" font-size="11" fill="#6B5D3F">中間観察→行動の乖離が構造的に起きることを裏付け</text>
      </g>

      <g transform="translate(0 190)">
        <rect x="0" y="0" width="510" height="50" fill="#EEF5EE" stroke="#6FAE75" stroke-width="1" rx="4"/>
        <text x="12" y="22" font-size="13" font-weight="bold" fill="#2C2416">🔧 実務運用（プロダクション）</text>
        <text x="12" y="42" font-size="11" fill="#6B5D3F">出力の別レイヤー検証（critic / self-consistency）が必須に</text>
      </g>
    </g>
  </g>

  <!-- STICKY NOTES -->
  <g transform="translate(140 790)">
    <text x="0" y="-8" font-size="15" font-weight="bold" fill="#6B5D3F">💭 分析メモ</text>
    <line x1="0" y1="-3" x2="100" y2="-3" stroke="#9B7EC9" stroke-width="3" stroke-linecap="round"/>

    <g transform="translate(0 10) rotate(-2)" filter="url(#stickyShadow)">
      <rect x="0" y="0" width="275" height="175" fill="#FFF2A8" stroke="#D4C268" stroke-width="1"/>
      <rect x="100" y="-7" width="75" height="18" fill="#F8DB99" opacity="0.85" transform="rotate(-3 137 2)"/>
      <text x="15" y="28" font-size="14" font-weight="bold" fill="#2C2416">💡 研究の意義</text>
      <line x1="15" y1="35" x2="125" y2="35" stroke="#D4A147" stroke-width="1.5"/>
      <text x="15" y="58" font-size="11.5" fill="#2C2416">• "CoTが正しい=答え</text>
      <text x="15" y="74" font-size="11.5" fill="#2C2416">　も正しい"を定量反証</text>
      <text x="15" y="97" font-size="11.5" fill="#2C2416">• 命名が普及すれば</text>
      <text x="15" y="113" font-size="11.5" fill="#2C2416">　評価論の共通語彙に</text>
      <text x="15" y="136" font-size="11.5" fill="#2C2416">• ベンチマーク設計</text>
      <text x="15" y="152" font-size="11.5" fill="#2C2416">　再考の起点になる</text>
    </g>

    <g transform="translate(290 15) rotate(1.5)" filter="url(#stickyShadow)">
      <rect x="0" y="0" width="275" height="175" fill="#F8C5D4" stroke="#E89AA9" stroke-width="1"/>
      <rect x="100" y="-7" width="75" height="18" fill="#EDAEBD" opacity="0.85" transform="rotate(2 137 2)"/>
      <text x="15" y="28" font-size="14" font-weight="bold" fill="#2C2416">⚠️ 推論モデルへの影響</text>
      <line x1="15" y1="35" x2="170" y2="35" stroke="#B85070" stroke-width="1.5"/>
      <text x="15" y="58" font-size="11.5" fill="#2C2416">• test-time compute</text>
      <text x="15" y="74" font-size="11.5" fill="#2C2416">　増量の効果に上限？</text>
      <text x="15" y="97" font-size="11.5" fill="#2C2416">• o1 / Extended Thinking</text>
      <text x="15" y="113" font-size="11.5" fill="#2C2416">　の評価指標を再設計</text>
      <text x="15" y="136" font-size="11.5" fill="#2C2416">• "思考プロセス公開"</br></text>
      <text x="15" y="152" font-size="11.5" fill="#2C2416">　の価値を問い直す</text>
    </g>

    <g transform="translate(580 12) rotate(-1)" filter="url(#stickyShadow)">
      <rect x="0" y="0" width="275" height="175" fill="#C5D9F1" stroke="#8FAFE0" stroke-width="1"/>
      <rect x="100" y="-7" width="75" height="18" fill="#A5C0E5" opacity="0.85" transform="rotate(-2 137 2)"/>
      <text x="15" y="28" font-size="14" font-weight="bold" fill="#2C2416">🎯 エージェント運用</text>
      <line x1="15" y1="35" x2="150" y2="35" stroke="#3E6BB8" stroke-width="1.5"/>
      <text x="15" y="58" font-size="11.5" fill="#2C2416">• 出力を鵜呑みにせず</text>
      <text x="15" y="74" font-size="11.5" fill="#2C2416">　別レイヤーで検証</text>
      <text x="15" y="97" font-size="11.5" fill="#2C2416">• アクター・クリティック</text>
      <text x="15" y="113" font-size="11.5" fill="#2C2416">　型の設計が有効</text>
      <text x="15" y="136" font-size="11.5" fill="#2C2416">• Cowork/Codeの</text>
      <text x="15" y="152" font-size="11.5" fill="#2C2416">　品質設計に直接関係</text>
    </g>

    <g transform="translate(870 15) rotate(2)" filter="url(#stickyShadow)">
      <rect x="0" y="0" width="275" height="175" fill="#B8E4C2" stroke="#6FAE75" stroke-width="1"/>
      <rect x="100" y="-7" width="75" height="18" fill="#9FD1AC" opacity="0.85" transform="rotate(3 137 2)"/>
      <text x="15" y="28" font-size="14" font-weight="bold" fill="#2C2416">🧭 今後の展開</text>
      <line x1="15" y1="35" x2="125" y2="35" stroke="#4A8553" stroke-width="1.5"/>
      <text x="15" y="58" font-size="11.5" fill="#2C2416">• ICML/NeurIPS 2026</text>
      <text x="15" y="74" font-size="11.5" fill="#2C2416">　で追実験が加速</text>
      <text x="15" y="97" font-size="11.5" fill="#2C2416">• dissociation専用</text>
      <text x="15" y="113" font-size="11.5" fill="#2C2416">　ベンチマーク登場？</text>
      <text x="15" y="136" font-size="11.5" fill="#2C2416">• CoT整合性の独立</text>
      <text x="15" y="152" font-size="11.5" fill="#2C2416">　評価メトリクス化</text>
    </g>
  </g>

  <g transform="translate(140 1005)">
    <line x1="0" y1="0" x2="1140" y2="0" stroke="#2C2416" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.5"/>
    <text x="0" y="20" font-size="11" fill="#6B5D3F" font-style="italic">Source: arXiv cs.CL / ICLR 2026 Workshop · 分析: AI News Daily</text>
    <text x="1140" y="20" text-anchor="end" font-size="11" fill="#6B5D3F" font-style="italic">🧠 ノート風スライド v2</text>
  </g>

  <g opacity="0.5" fill="#9B7EC9">
    <path d="M 1300 180 l 3 8 l 8 1 l -6 6 l 2 9 l -7 -4 l -7 4 l 2 -9 l -6 -6 l 8 -1 z"/>
    <circle cx="1310" cy="780" r="3"/>
  </g>
</svg>
