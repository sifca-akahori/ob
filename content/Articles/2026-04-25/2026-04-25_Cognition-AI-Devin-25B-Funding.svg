  <text x="68" y="108" font-size="36" font-weight="900" fill="#1A1D24">Cognition AI（Devin）$25B調達交渉</text>
  <text x="68" y="150" font-size="24" font-weight="700" fill="#5CA46E">18ヶ月で評価額6.25倍——AIコーディング狂乱の象徴</text>
  <text x="68" y="183" font-size="15" fill="#666">Bloomberg · 2026-04-23 · #Cognition #Devin #AIコーディング</text>
