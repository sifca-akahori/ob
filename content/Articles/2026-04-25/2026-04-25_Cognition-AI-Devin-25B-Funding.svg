  <text x="813" y="553" text-anchor="middle" font-size="18" font-weight="700" fill="#5CA46E">30-50x</text>
  <rect x="888" y="510" width="110" height="55" rx="4" fill="#E3F2FD" stroke="#5B8DEF" stroke-width="1.5"/>
  <text x="943" y="532" text-anchor="middle" font-size="11" fill="#555">AI SaaS</text>
  <text x="943" y="553" text-anchor="middle" font-size="18" font-weight="700" fill="#5B8DEF">80-150x</text>
  <rect x="1018" y="510" width="130" height="55" rx="4" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5"/>
  <text x="1083" y="532" text-anchor="middle" font-size="11" fill="#555">Cognition現在</text>
  <text x="1083" y="553" text-anchor="middle" font-size="20" font-weight="700" fill="#FF9800">342x</text>
  <text x="758" y="590" font-size="12" fill="#888">※ $25B ÷ 直近ARR $73M で試算。2026年ARR不明のため実態は異なる可能性あり</text>

  <!-- Comparable deal -->
  <rect x="758" y="608" width="550" height="30" rx="4" fill="#FFF9C4" stroke="#F5C518" stroke-width="1.5"/>
  <text x="1033" y="629" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">参照: SpaceX Cursor $60B買収オプション (4/23) がAIコーディングバリュ全体を押上げ</text>

  <!-- Sticky notes -->
  <g transform="translate(68,668) rotate(-1.5)">
