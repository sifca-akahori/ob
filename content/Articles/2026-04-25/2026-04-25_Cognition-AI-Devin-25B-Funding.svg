  <text x="508" y="290" text-anchor="middle" font-size="13" fill="#666">18ヶ月での評価膨張倍率</text>
  <text x="508" y="310" text-anchor="middle" font-size="11" fill="#999">$4B(Mar25)→$25B(Apr26)</text>

  <rect x="668" y="215" width="280" height="105" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
