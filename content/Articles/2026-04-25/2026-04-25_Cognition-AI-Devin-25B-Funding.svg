  <text x="208" y="310" text-anchor="middle" font-size="11" fill="#999">Bloomberg情報源（条件流動的）</text>

  <rect x="368" y="215" width="280" height="105" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
