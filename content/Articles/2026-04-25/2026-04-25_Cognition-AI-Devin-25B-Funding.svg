    <text x="130" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">💭 競合構図</text>
    <text x="14" y="50" font-size="12" fill="#333">OpenAI Codex Enterprise</text>
    <text x="14" y="68" font-size="12" fill="#333">GitHub Copilot / Cursor</text>
    <text x="14" y="86" font-size="12" fill="#333">のどれかに買収される？</text>
  </g>
  <g transform="translate(628,668) rotate(-0.5)">
    <rect width="260" height="105" rx="4" fill="#FCE4EC" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)"/>
    <text x="130" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">🚀 出口戦略予測</text>
    <text x="14" y="50" font-size="12" fill="#333">IPO（2027年以降）or</text>
    <text x="14" y="68" font-size="12" fill="#333">Microsoft買収($25B)が</text>
    <text x="14" y="86" font-size="12" fill="#333">最有力シナリオ</text>
  </g>
  <g transform="translate(908,668) rotate(1.2)">
    <rect width="260" height="105" rx="4" fill="#E3F2FD" stroke="#1A1D24" stroke-width="2" filter="url(#stickyShadow)"/>
    <text x="130" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">⚡ バブルリスク</text>
    <text x="14" y="50" font-size="12" fill="#333">実証できないビジョン倍率。</text>
    <text x="14" y="68" font-size="12" fill="#333">ARRが2026年も続伸しなければ</text>
    <text x="14" y="86" font-size="12" fill="#333">valuationは急落する可能性</text>
  </g>

  <text x="700" y="1038" text-anchor="middle" font-size="13" fill="#999" font-style="italic">AI News · 2026-04-25 · Cognition AI Devin $25B Funding — AI Coding Valuation Frenzy</text>
