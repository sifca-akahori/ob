  <line x1="160" y1="630" x2="680" y2="630" stroke="#1A1D24" stroke-width="1"/>
  <!-- Data points -->
  <circle cx="200" cy="620" r="8" fill="#5CA46E" stroke="#1A1D24" stroke-width="2"/>
  <text x="200" y="648" text-anchor="middle" font-size="11" fill="#555">Mar'25</text>
  <text x="200" y="660" text-anchor="middle" font-size="10" fill="#888">$4B</text>
  <circle cx="340" cy="594" r="8" fill="#5CA46E" stroke="#1A1D24" stroke-width="2"/>
  <text x="340" y="648" text-anchor="middle" font-size="11" fill="#555">Sep'25</text>
  <text x="340" y="660" text-anchor="middle" font-size="10" fill="#888">$10.2B</text>
  <circle cx="560" cy="400" r="10" fill="#F5C518" stroke="#1A1D24" stroke-width="2.5"/>
  <text x="560" y="648" text-anchor="middle" font-size="11" fill="#555">Apr'26</text>
  <text x="560" y="660" text-anchor="middle" font-size="10" fill="#888">$25B(交渉中)</text>
  <!-- Line connecting -->
  <polyline points="200,620 340,594 560,400" fill="none" stroke="#5CA46E" stroke-width="3"/>

