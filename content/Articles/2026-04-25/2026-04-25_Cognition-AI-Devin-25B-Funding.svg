  <text x="808" y="310" text-anchor="middle" font-size="11" fill="#999">$1M(Sep24)から73倍増</text>

  <rect x="968" y="215" width="280" height="105" rx="8" fill="white" stroke="#1A1D24" stroke-width="2.5" filter="url(#softShadow)"/>
