<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="'-apple-system', 'Hiragino Sans', 'Yu Gothic', 'Segoe UI', sans-serif">
  <defs>
    <pattern id="paperTex" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#F5EAD2"/>
      <circle cx="12" cy="18" r="0.4" fill="#C4B389" opacity="0.3"/>
      <circle cx="64" cy="42" r="0.5" fill="#C4B389" opacity="0.3"/>
      <circle cx="31" cy="75" r="0.3" fill="#C4B389" opacity="0.3"/>
      <circle cx="85" cy="85" r="0.4" fill="#C4B389" opacity="0.3"/>
      <circle cx="49" cy="9"  r="0.3" fill="#C4B389" opacity="0.25"/>
      <circle cx="78" cy="57" r="0.35" fill="#C4B389" opacity="0.28"/>
    </pattern>
    <filter id="stickyShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3" result="ob"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="ob"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="washiBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6FAEDF" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#5B8DEF" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#6FAEDF" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="100%" stop-color="#7BA7F5"/>
    </linearGradient>
    <linearGradient id="barGray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9BA8B5"/>
      <stop offset="100%" stop-color="#B8C4D0"/>
    </linearGradient>
  </defs>

