    <text x="35" y="114" font-size="13" font-weight="700" fill="#1A1D24">個人 vs チームの格差が縮小</text>
    <text x="35" y="130" font-size="11" fill="#6B7280">エージェント活用で個人参加者が上位に</text>

    <circle cx="15" cy="168" r="12" fill="#E8A87C" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="15" y="173" text-anchor="middle" font-size="12" font-weight="700" fill="white">4</text>
    <text x="35" y="164" font-size="13" font-weight="700" fill="#1A1D24">エッジAI技術の知見が急増</text>
    <text x="35" y="180" font-size="11" fill="#6B7280">小型化・量子化・スパース化の技術蓄積</text>

    <circle cx="15" cy="218" r="12" fill="#E8A87C" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="15" y="223" text-anchor="middle" font-size="12" font-weight="700" fill="white">5</text>
    <text x="35" y="214" font-size="13" font-weight="700" fill="#1A1D24">「誰の成果か」問題が噴出</text>
    <text x="35" y="230" font-size="11" fill="#6B7280">AIが書いたコードを人間が提出する倫理論争</text>
