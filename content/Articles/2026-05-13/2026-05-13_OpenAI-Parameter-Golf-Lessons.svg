  <text x="560" y="730" text-anchor="middle" font-size="12" fill="#6B7280">16MB以下LLMが</text>
  <text x="560" y="748" text-anchor="middle" font-size="12" fill="#6B7280">IoT・車載に現実射程</text>

  <rect x="715" y="665" width="280" height="105" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
