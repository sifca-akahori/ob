    <text x="35" y="80" font-size="11" fill="#6B7280">仮説検証サイクルが人間単独の3〜5倍速</text>

    <circle cx="15" cy="118" r="12" fill="#E8A87C" stroke="#1A1D24" stroke-width="1.5"/>
