  <text x="855" y="730" text-anchor="middle" font-size="12" fill="#6B7280">有料モデルへのアクセスが</text>
  <text x="855" y="748" text-anchor="middle" font-size="12" fill="#6B7280">競技の公平性を歪める</text>

  <rect x="1010" y="665" width="355" height="105" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <rect x="1010" y="665" width="355" height="4" fill="#5CA46E" rx="2"/>
  <text x="1187" y="692" text-anchor="middle" font-size="18">🔬</text>
  <text x="1187" y="712" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">次のフロンティア</text>
  <text x="1187" y="730" text-anchor="middle" font-size="12" fill="#6B7280">NeurIPS・ICML等でも</text>
  <text x="1187" y="748" text-anchor="middle" font-size="12" fill="#6B7280">エージェント使用ルール整備が急務</text>

