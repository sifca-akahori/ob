  <text x="247" y="305" text-anchor="middle" font-size="11" fill="#9CA3AF">（1,000人超参加）</text>

  <text x="492" y="258" text-anchor="middle" font-size="38" font-weight="900" fill="#1A1D24">8週</text>
  <text x="492" y="278" text-anchor="middle" font-size="14" fill="#6B7280">コンペ期間</text>
  <text x="492" y="298" text-anchor="middle" font-size="14" fill="#E8A87C" font-weight="700">大多数がエージェント使用</text>
  <text x="492" y="316" text-anchor="middle" font-size="11" fill="#9CA3AF">（初めて公式に確認）</text>

  <text x="737" y="258" text-anchor="middle" font-size="38" font-weight="900" fill="#1A1D24">16MB</text>
