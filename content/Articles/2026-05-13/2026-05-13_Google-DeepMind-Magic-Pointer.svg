<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#FBF8F1"/>
      <circle cx="15" cy="22" r="0.4" fill="#C4B389" opacity="0.3"/>
      <circle cx="67" cy="44" r="0.5" fill="#C4B389" opacity="0.3"/>
      <circle cx="33" cy="78" r="0.3" fill="#C4B389" opacity="0.25"/>
    </pattern>
    <filter id="stickyShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="magicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5B8DEF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="1050" fill="url(#paperTexture)"/>
  <line x1="110" y1="30" x2="110" y2="1020" stroke="#D88A8A" stroke-width="1.2" opacity="0.45"/>
  <g fill="#E8E2D3"><circle cx="50" cy="100" r="11"/><circle cx="50" cy="340" r="11"/><circle cx="50" cy="580" r="11"/><circle cx="50" cy="820" r="11"/></g>
  <g fill="#FBF8F1"><circle cx="50" cy="100" r="8"/><circle cx="50" cy="340" r="8"/><circle cx="50" cy="580" r="8"/><circle cx="50" cy="820" r="8"/></g>

  <!-- Category tape -->
  <g transform="rotate(-3, 1200, 55)">
    <rect x="1080" y="30" width="250" height="46" fill="#5B8DEF" stroke="#1A1D24" stroke-width="1.5"/>
    <text x="1205" y="59" text-anchor="middle" font-size="18" font-weight="700" fill="white">#研究 / UX</text>
  </g>

  <rect x="125" y="28" width="200" height="38" fill="#2F3842" rx="4"/>
  <text x="225" y="52" text-anchor="middle" font-size="16" font-weight="600" fill="white">2026-05-13</text>
  <text x="350" y="55" font-size="22" fill="#F5A623">⭐⭐</text>

  <text x="125" y="108" font-size="36" font-weight="900" fill="#1A1D24">🖱️ Google DeepMind「Magic Pointer」</text>
  <text x="125" y="152" font-size="23" font-weight="700" fill="#5B8DEF">Geminiが"何を指しているか"を理解——ウィグルで文脈依存の提案が出現するAIカーソル</text>
  <text x="125" y="185" font-size="14" fill="#6B7280">Google DeepMind · MarkTechPost · Winbuzzer · 2026-05-13 · #Gemini #UX #OS統合</text>
  <line x1="125" y1="200" x2="1360" y2="200" stroke="#1A1D24" stroke-width="2"/>

  <!-- HERO - Animated cursor demo -->
  <g transform="translate(1185, 300)">
    <circle cx="0" cy="0" r="95" fill="url(#magicGlow)"/>
    <!-- Screen mockup -->
    <rect x="-80" y="-70" width="160" height="100" fill="white" stroke="#1A1D24" stroke-width="2" rx="4"/>
    <!-- Email content mockup -->
    <line x1="-65" y1="-50" x2="65" y2="-50" stroke="#E5E7EB" stroke-width="6" stroke-linecap="round"/>
    <line x1="-65" y1="-32" x2="30" y2="-32" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
    <!-- Highlighted date -->
    <rect x="-15" y="-20" width="55" height="16" fill="#DBEAFE" stroke="#5B8DEF" stroke-width="1" rx="2"/>
    <text x="-13" y="-8" font-size="9" fill="#1E40AF">May 21, 2026</text>
    <!-- Magic pointer cursor -->
    <g transform="translate(25, -12)">
      <polygon points="0,0 8,22 12,14 20,18" fill="#5B8DEF" stroke="#1A1D24" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="12" fill="#5B8DEF" opacity="0.2"/>
    </g>
    <!-- Popup suggestion -->
    <rect x="-75" y="40" width="150" height="32" fill="#EFF6FF" stroke="#5B8DEF" stroke-width="1.5" rx="4"/>
    <text x="-68" y="56" font-size="9" fill="#1E40AF" font-weight="700">📅 会議を設定しますか？</text>
    <text x="-68" y="66" font-size="8" fill="#374151">May 21 で Google Calendar に追加</text>
    <text x="0" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#5B8DEF">Magic Pointer デモ</text>
  </g>

  <!-- KEY NUMBERS -->
  <rect x="125" y="215" width="980" height="120" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <line x1="370" y1="225" x2="370" y2="325" stroke="#E5E7EB" stroke-width="1.5"/>
  <line x1="615" y1="225" x2="615" y2="325" stroke="#E5E7EB" stroke-width="1.5"/>
  <line x1="860" y1="225" x2="860" y2="325" stroke="#E5E7EB" stroke-width="1.5"/>

  <text x="247" y="262" text-anchor="middle" font-size="38" font-weight="900" fill="#5B8DEF">ウィグル</text>
  <text x="247" y="285" text-anchor="middle" font-size="13" fill="#6B7280">AIトリガーのジェスチャー</text>
  <text x="247" y="303" text-anchor="middle" font-size="11" fill="#9CA3AF">（カーソルを振るだけ）</text>

  <text x="492" y="258" text-anchor="middle" font-size="32" font-weight="900" fill="#1A1D24">視覚＋意味</text>
  <text x="492" y="282" text-anchor="middle" font-size="13" fill="#6B7280">カーソルが捉えるコンテキスト</text>
  <text x="492" y="300" text-anchor="middle" font-size="13" fill="#5B8DEF" font-weight="700">要素の種類を意味的に理解</text>
  <text x="492" y="317" text-anchor="middle" font-size="11" fill="#9CA3AF">（Geminiがリアルタイム処理）</text>

  <text x="737" y="255" text-anchor="middle" font-size="30" font-weight="900" fill="#1A1D24">I/O 2026</text>
  <text x="737" y="278" text-anchor="middle" font-size="13" fill="#6B7280">正式発表の可能性</text>
  <text x="737" y="296" text-anchor="middle" font-size="14" fill="#5B8DEF" font-weight="700">5月19日（6日後）</text>
  <text x="737" y="314" text-anchor="middle" font-size="11" fill="#9CA3AF">Google I/O 2026 での展開期待</text>

  <text x="990" y="258" text-anchor="middle" font-size="30" font-weight="900" fill="#1A1D24">Googlebook</text>
  <text x="990" y="278" text-anchor="middle" font-size="13" fill="#6B7280">搭載候補ハードウェア</text>
  <text x="990" y="296" text-anchor="middle" font-size="13" fill="#5B8DEF" font-weight="700">2026年秋発売予定</text>
  <text x="990" y="314" text-anchor="middle" font-size="11" fill="#9CA3AF">Aluminium OS 上で動作</text>

  <!-- USE CASE FLOW -->
  <rect x="125" y="355" width="660" height="290" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <rect x="125" y="355" width="660" height="36" fill="#1A1D24" rx="4"/>
  <text x="455" y="379" text-anchor="middle" font-size="15" font-weight="700" fill="white">🖱️ Magic Pointer ユースケース</text>

  <g transform="translate(145, 400)">
    <!-- Use case 1 -->
    <rect x="0" y="0" width="290" height="90" fill="#EFF6FF" stroke="#5B8DEF" stroke-width="1.5" rx="4"/>
    <text x="145" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">📧 メールの日付をウィグル</text>
    <text x="145" y="42" text-anchor="middle" font-size="12" fill="#374151">→ 会議設定のワンタップリンクが出現</text>
    <text x="145" y="60" text-anchor="middle" font-size="11" fill="#6B7280">Google Calendar と連携し</text>
    <text x="145" y="76" text-anchor="middle" font-size="11" fill="#6B7280">その場で予定追加が完結</text>

    <!-- Arrow -->
    <text x="315" y="50" font-size="24" fill="#5B8DEF">→</text>

    <!-- Use case 2 -->
    <rect x="330" y="0" width="290" height="90" fill="#EFF6FF" stroke="#5B8DEF" stroke-width="1.5" rx="4"/>
    <text x="475" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">🖼️ 2枚の画像を選択してウィグル</text>
    <text x="475" y="42" text-anchor="middle" font-size="12" fill="#374151">→ 比較・合成・説明の提案が出現</text>
    <text x="475" y="60" text-anchor="middle" font-size="11" fill="#6B7280">複数要素の同時選択で</text>
    <text x="475" y="76" text-anchor="middle" font-size="11" fill="#6B7280">関係性を自動推論</text>

    <!-- Use case 3 -->
    <rect x="0" y="110" width="290" height="90" fill="#EFF6FF" stroke="#5B8DEF" stroke-width="1.5" rx="4"/>
    <text x="145" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">🛒 商品にポイントしてウィグル</text>
    <text x="145" y="152" text-anchor="middle" font-size="12" fill="#374151">→ 価格比較・在庫・レビュー即提示</text>
    <text x="145" y="170" text-anchor="middle" font-size="11" fill="#6B7280">Webコンテンツを横断して</text>
    <text x="145" y="186" text-anchor="middle" font-size="11" fill="#6B7280">関連情報を集約</text>

    <!-- Arrow -->
    <text x="315" y="160" font-size="24" fill="#5B8DEF">→</text>

    <!-- Use case 4 -->
    <rect x="330" y="110" width="290" height="90" fill="#EFF6FF" stroke="#5B8DEF" stroke-width="1.5" rx="4"/>
    <text x="475" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">📝 未知の語・略語にウィグル</text>
    <text x="475" y="152" text-anchor="middle" font-size="12" fill="#374151">→ 文脈を踏まえた説明がポップアップ</text>
    <text x="475" y="170" text-anchor="middle" font-size="11" fill="#6B7280">辞書的定義でなく</text>
    <text x="475" y="186" text-anchor="middle" font-size="11" fill="#6B7280">文脈内での意味を提示</text>
  </g>

  <!-- COMPARISON -->
  <rect x="805" y="355" width="560" height="290" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <rect x="805" y="355" width="560" height="36" fill="#2F3842" rx="4"/>
  <text x="1085" y="379" text-anchor="middle" font-size="15" font-weight="700" fill="white">⚖️ Recall（Microsoft）との設計思想比較</text>

  <g transform="translate(820, 405)">
    <rect x="0" y="0" width="240" height="36" fill="#FEE2E2" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="240" y="0" width="280" height="36" fill="#DBEAFE" stroke="#E5E7EB" stroke-width="1"/>
    <text x="120" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">Microsoft Recall</text>
    <text x="380" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">Magic Pointer</text>

    <rect x="0" y="36" width="240" height="50" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="240" y="36" width="280" height="50" fill="white" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="120" y="56" text-anchor="middle" font-size="11" fill="#DC2626">常時スクリーンキャプチャ</text>
    <text x="120" y="72" text-anchor="middle" font-size="11" fill="#9CA3AF">（ユーザー同意なし）</text>
    <text x="380" y="56" text-anchor="middle" font-size="11" fill="#1E40AF">ウィグル時のみAI起動</text>
    <text x="380" y="72" text-anchor="middle" font-size="11" fill="#5CA46E">（ユーザー主導アクティベーション）</text>

    <rect x="0" y="86" width="240" height="50" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="240" y="86" width="280" height="50" fill="white" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="120" y="106" text-anchor="middle" font-size="11" fill="#DC2626">過去履歴の全件記録</text>
    <text x="120" y="122" text-anchor="middle" font-size="11" fill="#9CA3AF">（プライバシー批判を受け遅延）</text>
    <text x="380" y="106" text-anchor="middle" font-size="11" fill="#1E40AF">現在のカーソル周辺のみ</text>
    <text x="380" y="122" text-anchor="middle" font-size="11" fill="#6B7280">（範囲限定）</text>

    <rect x="0" y="136" width="240" height="50" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="240" y="136" width="280" height="50" fill="white" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="120" y="156" text-anchor="middle" font-size="11" fill="#DC2626">デスクトップ限定</text>
    <text x="120" y="172" text-anchor="middle" font-size="11" fill="#9CA3AF">（Copilot+PC のみ）</text>
    <text x="380" y="156" text-anchor="middle" font-size="11" fill="#1E40AF">Android / ChromeOS / Googlebook</text>
    <text x="380" y="172" text-anchor="middle" font-size="11" fill="#6B7280">（マルチプラットフォーム計画）</text>

    <rect x="0" y="186" width="240" height="50" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="240" y="186" width="280" height="50" fill="white" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="120" y="206" text-anchor="middle" font-size="11" fill="#DC2626">段階的ロールアウト（批判で遅延）</text>
    <text x="120" y="222" text-anchor="middle" font-size="11" fill="#9CA3AF"></text>
    <text x="380" y="206" text-anchor="middle" font-size="11" fill="#F59E0B">実験的デモ段階</text>
    <text x="380" y="222" text-anchor="middle" font-size="11" fill="#6B7280">（製品化は未定）</text>
  </g>

  <!-- STICKY NOTES -->
  <g transform="rotate(-1.5, 170, 820)" filter="url(#stickyShadow)">
    <rect x="125" y="795" width="250" height="110" fill="#FEF9C3" stroke="#1A1D24" stroke-width="1.5" rx="2"/>
    <text x="250" y="818" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">セマンティックSEO</text>
    <text x="145" y="838" font-size="11" fill="#374151">Magic Pointerが普及すれば</text>
    <text x="145" y="854" font-size="11" fill="#374151">Webコンテンツへの意味付け</text>
    <text x="145" y="870" font-size="11" fill="#374151">（aria属性・構造化データ）が</text>
    <text x="145" y="886" font-size="11" fill="#374151">新たなUX最適化に。</text>
  </g>

  <g transform="rotate(1.2, 440, 820)" filter="url(#stickyShadow)">
    <rect x="405" y="795" width="250" height="110" fill="#D1FAE5" stroke="#1A1D24" stroke-width="1.5" rx="2"/>
    <text x="530" y="818" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">I/O 2026 への布石</text>
    <text x="425" y="838" font-size="11" fill="#374151">5月13日の発表は</text>
    <text x="425" y="854" font-size="11" fill="#374151">5月19日I/O前の</text>
    <text x="425" y="870" font-size="11" fill="#374151">期待値醸成。Gemini 4</text>
    <text x="425" y="886" font-size="11" fill="#374151">との統合が焦点。</text>
  </g>

  <g transform="rotate(-0.8, 710, 820)" filter="url(#stickyShadow)">
    <rect x="685" y="795" width="250" height="110" fill="#FDE8D8" stroke="#1A1D24" stroke-width="1.5" rx="2"/>
    <text x="810" y="818" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">プライバシー懸念</text>
    <text x="705" y="838" font-size="11" fill="#374151">カーソルが触れた要素を</text>
    <text x="705" y="854" font-size="11" fill="#374151">Geminiが処理する場合、</text>
    <text x="705" y="870" font-size="11" fill="#374151">未公開情報への</text>
    <text x="705" y="886" font-size="11" fill="#374151">アクセスリスクが残る。</text>
  </g>

  <g transform="rotate(1.5, 990, 820)" filter="url(#stickyShadow)">
    <rect x="965" y="795" width="250" height="110" fill="#EDE9FE" stroke="#1A1D24" stroke-width="1.5" rx="2"/>
    <text x="1090" y="818" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">アクセシビリティ</text>
    <text x="985" y="838" font-size="11" fill="#374151">視覚障害・認知障害ユーザー</text>
    <text x="985" y="854" font-size="11" fill="#374151">向けの補助機能として</text>
    <text x="985" y="870" font-size="11" fill="#374151">Magic Pointerは高い</text>
    <text x="985" y="886" font-size="11" fill="#374151">インパクトを持つ可能性。</text>
  </g>

  <line x1="125" y1="932" x2="1360" y2="932" stroke="#1A1D24" stroke-width="1" opacity="0.3"/>
  <text x="742" y="954" text-anchor="middle" font-size="12" font-style="italic" fill="#9CA3AF">AI News · 2026-05-13 · Google DeepMind Magic Pointer: Gemini-Powered Contextual Cursor</text>
  <text x="742" y="972" text-anchor="middle" font-size="11" fill="#9CA3AF">Sources: MarkTechPost / Winbuzzer / Gadget Pilipinas / Tom's Guide</text>
</svg>
