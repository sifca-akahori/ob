  <text x="125" y="108" font-size="36" font-weight="900" fill="#1A1D24">🔢 SubQ：世界初フル・サブ二乗LLM</text>
  <text x="125" y="152" font-size="24" font-weight="700" fill="#8B7DB8">12Mトークン文脈窓・計算量O(n)・Claude Opus比300倍低コストで同精度</text>
  <text x="125" y="185" font-size="14" fill="#6B7280">SiliconANGLE · The New Stack · DataCamp · 2026-05-05 〜 05-13 · #SubQ #サブ二乗 #長文脈</text>
  <line x1="125" y1="200" x2="1360" y2="200" stroke="#1A1D24" stroke-width="2"/>

  <!-- HERO - O(n²) vs O(n) mascot -->
