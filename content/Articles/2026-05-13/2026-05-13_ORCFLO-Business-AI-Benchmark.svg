    <text x="530" y="818" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">SWE-benchとの共存</text>
    <text x="425" y="838" font-size="11" fill="#374151">開発者向けSWE-bench ×</text>
    <text x="425" y="854" font-size="11" fill="#374151">ビジネス向けORCFLO の</text>
    <text x="425" y="870" font-size="11" fill="#374151">二軸評価がAI調達の</text>
    <text x="425" y="886" font-size="11" fill="#374151">新スタンダードになる可能性。</text>
  </g>

  <g transform="rotate(-0.8, 710, 820)" filter="url(#stickyShadow)">
    <rect x="685" y="795" width="250" height="110" fill="#FDE8D8" stroke="#1A1D24" stroke-width="1.5" rx="2"/>
    <text x="810" y="818" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">独立性への疑念</text>
    <text x="705" y="838" font-size="11" fill="#374151">評価機関とモデル提供社の</text>
    <text x="705" y="854" font-size="11" fill="#374151">利益相反リスク。「品質」の</text>
    <text x="705" y="870" font-size="11" fill="#374151">定義方法の透明性開示が</text>
    <text x="705" y="886" font-size="11" fill="#374151">信頼性の鍵。</text>
  </g>

  <g transform="rotate(1.5, 990, 820)" filter="url(#stickyShadow)">
