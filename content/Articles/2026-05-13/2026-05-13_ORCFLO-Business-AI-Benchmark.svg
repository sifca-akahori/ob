    <text x="1090" y="818" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">調達プロセスの変化</text>
    <text x="985" y="838" font-size="11" fill="#374151">企業RFPに「ORCFLOスコア」</text>
    <text x="985" y="854" font-size="11" fill="#374151">記載要件が追加される</text>
    <text x="985" y="870" font-size="11" fill="#374151">シナリオ。SWE-benchの</text>
    <text x="985" y="886" font-size="11" fill="#374151">ビジネス版として定着か。</text>
  </g>

  <line x1="125" y1="932" x2="1360" y2="932" stroke="#1A1D24" stroke-width="1" opacity="0.3"/>
  <text x="742" y="954" text-anchor="middle" font-size="12" font-style="italic" fill="#9CA3AF">AI News · 2026-05-13 · ORCFLO Index: The First Business-Centric AI Benchmark for Knowledge Workers</text>
