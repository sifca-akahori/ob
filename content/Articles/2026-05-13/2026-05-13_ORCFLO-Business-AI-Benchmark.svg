    <rect x="0" y="0" width="135" height="32" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="135" y="0" width="100" height="32" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="235" y="0" width="120" height="32" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="355" y="0" width="280" height="32" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <text x="67" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">ベンチマーク</text>
    <text x="185" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">対象者</text>
    <text x="295" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">測定対象</text>
    <text x="495" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">限界</text>

    <!-- Rows -->
    <rect x="0" y="32" width="135" height="42" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="135" y="32" width="100" height="42" fill="white" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="235" y="32" width="120" height="42" fill="white" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="355" y="32" width="280" height="42" fill="white" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="67" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">MMLU</text>
    <text x="185" y="53" text-anchor="middle" font-size="11" fill="#374151">研究者</text>
    <text x="295" y="53" text-anchor="middle" font-size="11" fill="#374151">知識・推論</text>
    <text x="495" y="53" text-anchor="middle" font-size="11" fill="#9CA3AF">多肢選択のみ、実務≠</text>

    <rect x="0" y="74" width="135" height="42" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="135" y="74" width="100" height="42" fill="white" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="235" y="74" width="120" height="42" fill="white" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="355" y="74" width="280" height="42" fill="white" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="67" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">SWE-bench</text>
    <text x="185" y="95" text-anchor="middle" font-size="11" fill="#374151">開発者</text>
    <text x="295" y="95" text-anchor="middle" font-size="11" fill="#374151">コード修正</text>
    <text x="495" y="95" text-anchor="middle" font-size="11" fill="#9CA3AF">エンジニア職限定、汎業種×</text>

    <rect x="0" y="116" width="135" height="42" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="135" y="116" width="100" height="42" fill="white" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="235" y="116" width="120" height="42" fill="white" stroke="#E5E7EB" stroke-width="0.5"/>
    <rect x="355" y="116" width="280" height="42" fill="white" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="67" y="137" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">LMArena</text>
    <text x="185" y="137" text-anchor="middle" font-size="11" fill="#374151">一般ユーザー</text>
    <text x="295" y="137" text-anchor="middle" font-size="11" fill="#374151">好み（ELO）</text>
    <text x="495" y="137" text-anchor="middle" font-size="11" fill="#9CA3AF">主観的・コスト非考慮</text>

    <rect x="0" y="158" width="135" height="42" fill="#DBEAFE" stroke="#5B8DEF" stroke-width="1.5"/>
    <rect x="135" y="158" width="100" height="42" fill="#DBEAFE" stroke="#5B8DEF" stroke-width="1.5"/>
    <rect x="235" y="158" width="120" height="42" fill="#DBEAFE" stroke="#5B8DEF" stroke-width="1.5"/>
    <rect x="355" y="158" width="280" height="42" fill="#DBEAFE" stroke="#5B8DEF" stroke-width="1.5"/>
    <text x="67" y="179" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">ORCFLO Index</text>
    <text x="185" y="179" text-anchor="middle" font-size="11" fill="#1E40AF" font-weight="700">企業・ビジネス</text>
    <text x="295" y="179" text-anchor="middle" font-size="11" fill="#1E40AF">コスト×時間×品質</text>
    <text x="495" y="179" text-anchor="middle" font-size="11" fill="#1E40AF">独立性・品質定義の検証が必要</text>

    <text x="330" y="225" text-anchor="middle" font-size="11" fill="#5B8DEF" font-weight="700">→ ORCFLO Indexは「実務ROI」を初めて定量化する試み</text>
  </g>

  <!-- ROI EXAMPLE -->
  <rect x="805" y="355" width="560" height="290" fill="white" stroke="#1A1D24" stroke-width="2" rx="6" filter="url(#softShadow)"/>
  <rect x="805" y="355" width="560" height="36" fill="#2F3842" rx="4"/>
  <text x="1085" y="379" text-anchor="middle" font-size="15" font-weight="700" fill="white">💡 ROI計算の例：文書要約タスク</text>

  <g transform="translate(825, 408)">
    <text x="240" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">月間100件の法律文書要約（各50,000字）</text>

    <!-- Model A -->
    <rect x="0" y="35" width="240" height="140" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" rx="4"/>
    <text x="120" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">モデルA（フラッグシップ）</text>
    <text x="20" y="80" font-size="12" fill="#374151">品質スコア: 95/100</text>
    <text x="20" y="100" font-size="12" fill="#374151">APIコスト: $1,200/月</text>
    <text x="20" y="120" font-size="12" fill="#374151">処理時間: 45秒/件</text>
    <text x="20" y="140" font-size="12" fill="#374151">総スコア: 業務コスト高い</text>
    <text x="20" y="162" font-size="11" fill="#DC2626" font-weight="700">ORCFLO ROI: 中程度</text>

    <!-- VS -->
    <text x="250" y="115" text-anchor="middle" font-size="22" fill="#1A1D24">VS</text>

    <!-- Model B -->
    <rect x="270" y="35" width="240" height="140" fill="#F0FFF4" stroke="#5CA46E" stroke-width="1.5" rx="4"/>
    <text x="390" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">モデルB（中堅モデル）</text>
    <text x="290" y="80" font-size="12" fill="#374151">品質スコア: 88/100</text>
    <text x="290" y="100" font-size="12" fill="#374151">APIコスト: $180/月</text>
    <text x="290" y="120" font-size="12" fill="#374151">処理時間: 12秒/件</text>
    <text x="290" y="140" font-size="12" fill="#374151">総スコア: コスト大幅節約</text>
    <text x="290" y="162" font-size="11" fill="#5CA46E" font-weight="700">ORCFLO ROI: 高い</text>

    <!-- Conclusion -->
    <rect x="0" y="190" width="510" height="40" fill="#EFF6FF" stroke="#5B8DEF" stroke-width="1.5" rx="4"/>
    <text x="255" y="215" text-anchor="middle" font-size="12" fill="#1E40AF" font-weight="700">→ 品質7%差でコストが7倍違う。ROI視点ではモデルBが最適解</text>
  </g>

  <!-- STICKY NOTES -->
  <g transform="rotate(-1.5, 170, 820)" filter="url(#stickyShadow)">
    <rect x="125" y="795" width="250" height="110" fill="#FEF9C3" stroke="#1A1D24" stroke-width="1.5" rx="2"/>
    <text x="250" y="818" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1D24">業種別スコアの期待</text>
    <text x="145" y="838" font-size="11" fill="#374151">法律・医療・金融等で</text>
    <text x="145" y="854" font-size="11" fill="#374151">業種別ランキングが公開</text>
    <text x="145" y="870" font-size="11" fill="#374151">されれば「最適モデルは</text>
    <text x="145" y="886" font-size="11" fill="#374151">業種によって違う」を証明。</text>
  </g>

  <g transform="rotate(1.2, 440, 820)" filter="url(#stickyShadow)">
