      <text x="452" y="116" text-anchor="middle" fill="#5B8DEF" font-weight="700">推論時（動的）</text>

      <rect x="0" y="128" width="130" height="32" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="0.5"/>
