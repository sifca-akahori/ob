      <rect x="260" y="96" width="130" height="32" fill="white" stroke="#E5E7EB" stroke-width="0.5"/>
      <rect x="390" y="96" width="125" height="32" fill="white" stroke="#E5E7EB" stroke-width="0.5"/>
