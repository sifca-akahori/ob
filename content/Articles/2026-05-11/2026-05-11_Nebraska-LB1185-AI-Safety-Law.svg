  <rect x="860" y="615" width="480" height="115" rx="8" fill="#FFF8E1" stroke="#F9A825" stroke-width="2" filter="url(#softShadow)"/>
  <text x="1100" y="645" text-anchor="middle" font-size="15" font-weight="800" fill="#E65100">🏢 主な適用対象企業（推定）</text>
  <text x="1100" y="668" text-anchor="middle" font-size="13" fill="#333">Character.AI · Replika · Snap My AI</text>
  <text x="1100" y="688" text-anchor="middle" font-size="13" fill="#333">Meta AI（WhatsApp/Messenger）</text>
  <text x="1100" y="708" text-anchor="middle" font-size="13" fill="#333">Claude / ChatGPT / Gemini（チャット機能）</text>
  <text x="1100" y="724" text-anchor="middle" font-size="12" fill="#888">→ 全国展開事業者はNE法への対応コスト発生</text>

  <!-- Sticky notes -->
  <rect x="140" y="760" width="265" height="115" rx="6" fill="#FFF9C4" stroke="#E0C840" stroke-width="1.5" transform="rotate(-1.5, 272, 817)" filter="url(#shadow)"/>
  <text x="215" y="786" text-anchor="middle" font-size="12" font-weight="800" fill="#5A4A00" transform="rotate(-1.5, 272, 817)">🌊 チャットボット安全法ドミノ</text>
  <text x="215" y="803" text-anchor="middle" font-size="11" fill="#5A4A00" transform="rotate(-1.5, 272, 817)">NE法がテンプレートになり</text>
  <text x="215" y="819" text-anchor="middle" font-size="11" fill="#5A4A00" transform="rotate(-1.5, 272, 817)">複数州が同様の法律を模倣</text>
  <text x="215" y="835" text-anchor="middle" font-size="11" fill="#5A4A00" transform="rotate(-1.5, 272, 817)">年内に10州超が追随か</text>
  <text x="215" y="855" text-anchor="middle" font-size="11" fill="#5A4A00" transform="rotate(-1.5, 272, 817)">「狭い法律」の国際標準化へ</text>

  <rect x="430" y="760" width="265" height="115" rx="6" fill="#FFCCBC" stroke="#FF7043" stroke-width="1.5" transform="rotate(1.0, 562, 817)" filter="url(#shadow)"/>
  <text x="507" y="786" text-anchor="middle" font-size="12" font-weight="800" fill="#3D0D00" transform="rotate(1.0, 562, 817)">⚖️ PA v. Character.AI との連動</text>
  <text x="507" y="803" text-anchor="middle" font-size="11" fill="#3D0D00" transform="rotate(1.0, 562, 817)">「精神科医エミリー」免許番号捏造</text>
  <text x="507" y="819" text-anchor="middle" font-size="11" fill="#3D0D00" transform="rotate(1.0, 562, 817)">がNE法の最悪ケース実例に</text>
  <text x="507" y="835" text-anchor="middle" font-size="11" fill="#3D0D00" transform="rotate(1.0, 562, 817)">Character.AI等が最初の試練台に</text>
  <text x="507" y="855" text-anchor="middle" font-size="11" fill="#3D0D00" transform="rotate(1.0, 562, 817)">刑事責任まで問われる可能性</text>

  <rect x="720" y="760" width="265" height="115" rx="6" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5" transform="rotate(-0.7, 852, 817)" filter="url(#shadow)"/>
  <text x="797" y="786" text-anchor="middle" font-size="12" font-weight="800" fill="#1A3D1A" transform="rotate(-0.7, 852, 817)">🇪🇺 EU AI Act との比較</text>
  <text x="797" y="803" text-anchor="middle" font-size="11" fill="#1A3D1A" transform="rotate(-0.7, 852, 817)">EU：高リスクAI義務が2027末まで延期</text>
  <text x="797" y="819" text-anchor="middle" font-size="11" fill="#1A3D1A" transform="rotate(-0.7, 852, 817)">米国州法：先行展開で実質的義務化</text>
  <text x="797" y="835" text-anchor="middle" font-size="11" fill="#1A3D1A" transform="rotate(-0.7, 852, 817)">「EU遅く・米国州法が速い」逆転現象</text>
  <text x="797" y="855" text-anchor="middle" font-size="11" fill="#1A3D1A" transform="rotate(-0.7, 852, 817)">日本の金融庁・総務省も参照へ</text>

  <rect x="1010" y="760" width="320" height="115" rx="6" fill="#E1BEE7" stroke="#9C27B0" stroke-width="1.5" transform="rotate(1.2, 1170, 817)" filter="url(#shadow)"/>
  <text x="1087" y="786" text-anchor="middle" font-size="12" font-weight="800" fill="#2D003D" transform="rotate(1.2, 1170, 817)">📅 下半期予測</text>
