<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paper" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#F6F4F0"/>
      <circle cx="40" cy="25" r="0.4" fill="#B8A878" opacity="0.3"/>
      <circle cx="65" cy="72" r="0.5" fill="#B8A878" opacity="0.25"/>
    </pattern>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="goldBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F9A825"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="1050" fill="url(#paper)"/>
  <line x1="115" y1="20" x2="115" y2="1030" stroke="#D08080" stroke-width="1.2" opacity="0.4"/>
  <g fill="#D4C494" opacity="0.5">
    <circle cx="55" cy="100" r="12"/><circle cx="55" cy="350" r="12"/>
    <circle cx="55" cy="600" r="12"/><circle cx="55" cy="850" r="12"/><circle cx="55" cy="980" r="12"/>
  </g>
  <g fill="#F6F4F0" opacity="0.9">
    <circle cx="55" cy="100" r="7"/><circle cx="55" cy="350" r="7"/>
    <circle cx="55" cy="600" r="7"/><circle cx="55" cy="850" r="7"/><circle cx="55" cy="980" r="7"/>
  </g>

  <rect x="130" y="22" width="200" height="36" rx="6" fill="#2F3842"/>
  <text x="230" y="46" text-anchor="middle" fill="#F0E8D0" font-size="16" font-weight="700">2026-05-11</text>

  <rect x="1060" y="5" width="240" height="42" rx="5" fill="#5CA46E" transform="rotate(-3, 1180, 26)" filter="url(#softShadow)"/>
  <text x="1180" y="32" text-anchor="middle" fill="white" font-size="18" font-weight="800" transform="rotate(-3, 1180, 26)">#ビジネス / 規制</text>
  <text x="1340" y="50" text-anchor="end" font-size="22">⭐⭐</text>

  <!-- Title -->
  <text x="140" y="100" font-size="32" font-weight="900" fill="#1A1D24">⚖️ ネブラスカ州「対話型AI安全法」LB 1185 成立</text>
  <text x="140" y="143" font-size="24" font-weight="700" fill="#2E7D32">——49-0 全会一致でチャットボット安全プロトコルを義務化</text>
  <rect x="140" y="158" width="900" height="2" fill="#5CA46E" rx="1"/>
  <text x="140" y="180" font-size="16" fill="#666">Gunderson Dettmer / AI Legislative Update  ·  2026-05-11  ·  #規制 #州法 #チャットボット</text>

