  <text x="1087" y="819" text-anchor="middle" font-size="11" fill="#2D003D" transform="rotate(1.2, 1170, 817)">AI法コンプライアンス自動化ツール市場急拡大</text>
  <text x="1087" y="835" text-anchor="middle" font-size="11" fill="#2D003D" transform="rotate(1.2, 1170, 817)">企業の法務にAI法専門家採用が急増</text>
  <text x="1087" y="855" text-anchor="middle" font-size="11" fill="#2D003D" transform="rotate(1.2, 1170, 817)">LegalTech AIコンプライアンス市場が開花</text>

  <line x1="140" y1="905" x2="1340" y2="905" stroke="#C8BFA0" stroke-width="1"/>
  <text x="740" y="925" text-anchor="middle" font-size="13" fill="#888" font-style="italic">AI News · 2026-05-11 · Nebraska LB 1185 Conversational AI Safety Act Signed — 49-0 Unanimous</text>
