  <rect x="140" y="365" width="700" height="35" rx="6" fill="#2F3842"/>
  <text x="490" y="388" text-anchor="middle" fill="white" font-size="14" font-weight="700">Conversational Artificial Intelligence Safety Act（LB 1185）</text>

  <g>
    <rect x="155" y="405" width="670" height="32" fill="#F0F8F0"/>
    <text x="175" y="425" font-size="13" fill="#1A1D24">✅ AIチャットボット事業者に安全プロトコルの実装を義務付け</text>
    <text x="175" y="458" font-size="13" fill="#1A1D24">✅ 未成年者保護（年齢確認・コンテンツフィルタリング）</text>
    <rect x="155" y="467" width="670" height="32" fill="#F0F8F0"/>
    <text x="175" y="487" font-size="13" fill="#1A1D24">✅ 自傷・自殺関連コンテンツの防止プロトコル</text>
    <text x="175" y="520" font-size="13" fill="#1A1D24">✅ 医療行為の禁止・免許番号等の捏造禁止</text>
    <rect x="155" y="529" width="670" height="32" fill="#F0F8F0"/>
    <text x="175" y="549" font-size="13" fill="#1A1D24">📌 農業データプライバシー法に添付される形で可決</text>
  </g>

