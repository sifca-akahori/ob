  <g transform="translate(1230, 130)">
    <rect x="-70" y="-65" width="140" height="130" rx="10" fill="#E8F5E9" stroke="#5CA46E" stroke-width="3"/>
    <text x="0" y="10" text-anchor="middle" font-size="55">⚖️</text>
    <text x="0" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D32">LB 1185</text>
    <text x="0" y="62" text-anchor="middle" font-size="12" fill="#666">Nebraska Law</text>
  </g>

  <!-- Key numbers -->
  <rect x="140" y="198" width="1180" height="115" rx="10" fill="#E8F5E9" stroke="#5CA46E" stroke-width="2.5" filter="url(#softShadow)"/>
  <line x1="430" y1="213" x2="430" y2="298" stroke="#5CA46E" stroke-width="1" opacity="0.3"/>
  <line x1="730" y1="213" x2="730" y2="298" stroke="#5CA46E" stroke-width="1" opacity="0.3"/>
  <line x1="1030" y1="213" x2="1030" y2="298" stroke="#5CA46E" stroke-width="1" opacity="0.3"/>

  <text x="285" y="268" text-anchor="middle" font-size="58" font-weight="900" fill="#2E7D32">49-0</text>
  <text x="285" y="295" text-anchor="middle" font-size="13" fill="#555">全会一致可決（超党派コンセンサス）</text>

  <text x="580" y="268" text-anchor="middle" font-size="46" font-weight="900" fill="#5CA46E">45州</text>
  <text x="580" y="295" text-anchor="middle" font-size="13" fill="#555">AI法案提出済み（2026-03時点）</text>

  <text x="880" y="268" text-anchor="middle" font-size="46" font-weight="900" fill="#2F3842">1,561件</text>
  <text x="880" y="295" text-anchor="middle" font-size="13" fill="#555">AI関連法案（2024年全体を既に超過）</text>

  <text x="1190" y="268" text-anchor="middle" font-size="46" font-weight="900" fill="#5CA46E">成立</text>
  <text x="1190" y="295" text-anchor="middle" font-size="13" fill="#555">知事Pillen署名（4月17日）</text>

  <!-- Law details -->
  <text x="140" y="348" font-size="20" font-weight="800" fill="#1A1D24">📋 LB 1185 の主要要件</text>
  <line x1="140" y1="355" x2="700" y2="355" stroke="#5CA46E" stroke-width="2.5"/>

  <rect x="140" y="365" width="700" height="200" rx="8" fill="white" stroke="#5CA46E" stroke-width="2" filter="url(#softShadow)"/>
