  <rect x="960" y="416" width="320" height="22" rx="3" fill="#E0E0E0"/>
  <rect x="960" y="416" width="320" height="22" rx="3" fill="#BDBDBD"/>
  <text x="1295" y="432" text-anchor="end" font-size="13" fill="#666">全体</text>

  <text x="880" y="465" font-size="13" fill="#555">2026年3月時点</text>
  <rect x="960" y="451" width="380" height="22" rx="3" fill="#E8F5E9"/>
  <rect x="960" y="451" width="380" height="22" rx="3" fill="url(#goldBar)"/>
  <text x="1295" y="467" text-anchor="end" font-size="13" font-weight="700" fill="#E65100">1,561件（45州）</text>
  <text x="1295" y="483" text-anchor="end" font-size="11" fill="#5CA46E">↑ 2024年全体を超過</text>

  <text x="880" y="510" font-size="14" fill="#333">主な成立・施行州（2026年）</text>
  <text x="880" y="530" font-size="13" fill="#1A1D24">🏛 Nebraska（LB 1185）· Maryland（AI価格法）</text>
  <text x="880" y="550" font-size="13" fill="#555">⏸ Colorado AI Act（連邦地裁で施行停止中）</text>
  <text x="880" y="567" font-size="13" fill="#555">📋 California / New York（包括法検討中）</text>

  <!-- Impact matrix -->
  <text x="140" y="598" font-size="20" font-weight="800" fill="#1A1D24">🎯 「狭い法律」戦略の優位性</text>
  <line x1="140" y1="605" x2="760" y2="605" stroke="#5CA46E" stroke-width="2.5"/>

  <rect x="140" y="615" width="700" height="115" rx="8" fill="#F9FBF9" stroke="#5CA46E" stroke-width="2" filter="url(#softShadow)"/>

  <rect x="160" y="628" width="200" height="88" rx="6" fill="#E8F5E9" stroke="#5CA46E" stroke-width="1.5"/>
