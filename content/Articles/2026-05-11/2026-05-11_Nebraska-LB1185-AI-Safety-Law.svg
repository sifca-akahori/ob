  <rect x="380" y="628" width="200" height="88" rx="6" fill="#E8F5E9" stroke="#5CA46E" stroke-width="1.5"/>
  <text x="480" y="653" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D32">合憲性リスク低</text>
  <text x="480" y="671" text-anchor="middle" font-size="11" fill="#555">Colorado包括法が訴訟で</text>
  <text x="480" y="687" text-anchor="middle" font-size="11" fill="#555">停止→狭い範囲は回避</text>
  <text x="480" y="703" text-anchor="middle" font-size="11" fill="#555">→ 連邦プリエンプション受けにくい</text>

  <rect x="600" y="628" width="220" height="88" rx="6" fill="#E8F5E9" stroke="#5CA46E" stroke-width="1.5"/>
  <text x="710" y="653" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D32">超党派合意形成</text>
  <text x="710" y="671" text-anchor="middle" font-size="11" fill="#555">「子供の安全」は</text>
  <text x="710" y="687" text-anchor="middle" font-size="11" fill="#555">左右を問わない合意軸</text>
  <text x="710" y="703" text-anchor="middle" font-size="11" fill="#555">→ 49-0 という圧倒的支持</text>

