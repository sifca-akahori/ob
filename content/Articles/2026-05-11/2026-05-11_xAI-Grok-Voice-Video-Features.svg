  <rect x="140" y="572" width="960" height="35" rx="6" fill="#2F3842"/>
  <text x="300" y="595" text-anchor="middle" fill="white" font-size="14" font-weight="700">機能</text>
  <text x="520" y="595" text-anchor="middle" fill="white" font-size="14" font-weight="700">Grok（xAI）</text>
  <text x="740" y="595" text-anchor="middle" fill="white" font-size="14" font-weight="700">GPT-4o（OpenAI）</text>
  <text x="980" y="595" text-anchor="middle" fill="white" font-size="14" font-weight="700">Gemini 3.1</text>
  <line x1="400" y1="572" x2="400" y2="752" stroke="#E0D8C8" stroke-width="1"/>
  <line x1="640" y1="572" x2="640" y2="752" stroke="#E0D8C8" stroke-width="1"/>
  <line x1="860" y1="572" x2="860" y2="752" stroke="#E0D8C8" stroke-width="1"/>

  <rect x="140" y="607" width="960" height="32" fill="#F5F3EE"/>
  <text x="300" y="627" text-anchor="middle" font-size="13" fill="#333">音声画像生成</text>
  <text x="520" y="627" text-anchor="middle" font-size="13" fill="#E65100" font-weight="700">✅ 新追加（2026-05）</text>
  <text x="740" y="627" text-anchor="middle" font-size="13" fill="#2E7D32">✅ 2024年春から</text>
  <text x="980" y="627" text-anchor="middle" font-size="13" fill="#2E7D32">✅ 対応済み</text>

  <text x="300" y="660" text-anchor="middle" font-size="13" fill="#333">動画Extend/Upscale</text>
  <text x="520" y="660" text-anchor="middle" font-size="13" fill="#E65100" font-weight="700">✅ 新追加（2026-05）</text>
  <text x="740" y="660" text-anchor="middle" font-size="13" fill="#5B8DEF">Sora（別製品）</text>
  <text x="980" y="660" text-anchor="middle" font-size="13" fill="#5CA46E">Veo 4（I/O予定）</text>

  <rect x="140" y="671" width="960" height="32" fill="#F5F3EE"/>
  <text x="300" y="691" text-anchor="middle" font-size="13" fill="#333">差別化ポイント</text>
  <text x="520" y="691" text-anchor="middle" font-size="14" font-weight="800" fill="#1A1D24">🔴 X リアルタイムデータ</text>
  <text x="740" y="691" text-anchor="middle" font-size="13" fill="#555">ChatGPT 7億MAU</text>
  <text x="980" y="691" text-anchor="middle" font-size="13" fill="#555">Google OS統合</text>

  <text x="300" y="726" text-anchor="middle" font-size="13" fill="#333">戦略</text>
  <text x="520" y="726" text-anchor="middle" font-size="13" fill="#555">後追い+Xネイティブ統合</text>
  <text x="740" y="726" text-anchor="middle" font-size="13" fill="#555">機能先行・API公開</text>
  <text x="980" y="726" text-anchor="middle" font-size="13" fill="#555">OS/Search統合</text>

  <!-- Sticky notes -->
  <rect x="140" y="780" width="270" height="115" rx="6" fill="#FFF9C4" stroke="#E0C840" stroke-width="1.5" transform="rotate(-1.5, 275, 837)" filter="url(#shadow)"/>
  <text x="215" y="806" text-anchor="middle" font-size="12" font-weight="800" fill="#5A4A00" transform="rotate(-1.5, 275, 837)">🔑 Grokの競争優位の本質</text>
  <text x="215" y="823" text-anchor="middle" font-size="11" fill="#5A4A00" transform="rotate(-1.5, 275, 837)">機能の新しさではなく</text>
  <text x="215" y="839" text-anchor="middle" font-size="11" fill="#5A4A00" transform="rotate(-1.5, 275, 837)">「どこから使えるか」（X）が</text>
  <text x="215" y="855" text-anchor="middle" font-size="11" fill="#5A4A00" transform="rotate(-1.5, 275, 837)">真の差別化</text>
  <text x="215" y="875" text-anchor="middle" font-size="11" fill="#5A4A00" transform="rotate(-1.5, 275, 837)">14億ユーザーへの直接展開</text>

  <rect x="440" y="780" width="270" height="115" rx="6" fill="#FFCCBC" stroke="#FF7043" stroke-width="1.5" transform="rotate(1.0, 575, 837)" filter="url(#shadow)"/>
  <text x="515" y="806" text-anchor="middle" font-size="12" font-weight="800" fill="#3D0D00" transform="rotate(1.0, 575, 837)">⚠️ Following AI ソートの問題</text>
  <text x="515" y="823" text-anchor="middle" font-size="11" fill="#3D0D00" transform="rotate(1.0, 575, 837)">ユーザーの明示的な選択を</text>
  <text x="515" y="839" text-anchor="middle" font-size="11" fill="#3D0D00" transform="rotate(1.0, 575, 837)">アルゴリズムで上書き</text>
  <text x="515" y="855" text-anchor="middle" font-size="11" fill="#3D0D00" transform="rotate(1.0, 575, 837)">フィルターバブル強化の批判再燃</text>
  <text x="515" y="875" text-anchor="middle" font-size="11" fill="#3D0D00" transform="rotate(1.0, 575, 837)">DSA下でオプトアウト必須か</text>

  <rect x="740" y="780" width="270" height="115" rx="6" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5" transform="rotate(-0.7, 875, 837)" filter="url(#shadow)"/>
  <text x="815" y="806" text-anchor="middle" font-size="12" font-weight="800" fill="#1A3D1A" transform="rotate(-0.7, 875, 837)">🎬 動画AI市場の構図</text>
  <text x="815" y="823" text-anchor="middle" font-size="11" fill="#1A3D1A" transform="rotate(-0.7, 875, 837)">Google Veo 4（I/O 5/19）</text>
  <text x="815" y="839" text-anchor="middle" font-size="11" fill="#1A3D1A" transform="rotate(-0.7, 875, 837)">OpenAI Sora / Sora 2</text>
  <text x="815" y="855" text-anchor="middle" font-size="11" fill="#1A3D1A" transform="rotate(-0.7, 875, 837)">Grokは「編集」のみ（生成なし）</text>
  <text x="815" y="875" text-anchor="middle" font-size="11" fill="#1A3D1A" transform="rotate(-0.7, 875, 837)">SNS投稿向けのニッチ狙い</text>

  <rect x="1040" y="780" width="300" height="115" rx="6" fill="#E1BEE7" stroke="#9C27B0" stroke-width="1.5" transform="rotate(1.2, 1190, 837)" filter="url(#shadow)"/>
  <text x="1117" y="806" text-anchor="middle" font-size="12" font-weight="800" fill="#2D003D" transform="rotate(1.2, 1190, 837)">📅 Grok 下半期の予測</text>
  <text x="1117" y="823" text-anchor="middle" font-size="11" fill="#2D003D" transform="rotate(1.2, 1190, 837)">Grok 3.5でXデータ活用を本格化</text>
  <text x="1117" y="839" text-anchor="middle" font-size="11" fill="#2D003D" transform="rotate(1.2, 1190, 837)">EU域内はデータ同意が障壁に</text>
  <text x="1117" y="855" text-anchor="middle" font-size="11" fill="#2D003D" transform="rotate(1.2, 1190, 837)">Grok Connectorsとの組み合わせで</text>
  <text x="1117" y="875" text-anchor="middle" font-size="11" fill="#2D003D" transform="rotate(1.2, 1190, 837)">「音声指示のBizアシスタント」へ</text>

  <line x1="140" y1="930" x2="1340" y2="930" stroke="#C8BFA0" stroke-width="1"/>
  <text x="740" y="950" text-anchor="middle" font-size="13" fill="#888" font-style="italic">AI News · 2026-05-11 · xAI Grok Adds Voice Image Generation, Video Extend/Upscale, and AI Following Sort</text>
</svg>
