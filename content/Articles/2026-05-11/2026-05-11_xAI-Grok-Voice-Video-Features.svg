<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <pattern id="paper" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#F8F5F0"/>
      <circle cx="35" cy="55" r="0.4" fill="#B0A890" opacity="0.3"/>
      <circle cx="75" cy="18" r="0.5" fill="#B0A890" opacity="0.25"/>
    </pattern>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1050" fill="url(#paper)"/>
  <line x1="115" y1="20" x2="115" y2="1030" stroke="#D08080" stroke-width="1.2" opacity="0.4"/>
  <g fill="#D4C494" opacity="0.5">
    <circle cx="55" cy="100" r="12"/><circle cx="55" cy="350" r="12"/>
    <circle cx="55" cy="600" r="12"/><circle cx="55" cy="850" r="12"/><circle cx="55" cy="980" r="12"/>
  </g>
  <g fill="#F8F5F0" opacity="0.9">
    <circle cx="55" cy="100" r="7"/><circle cx="55" cy="350" r="7"/>
    <circle cx="55" cy="600" r="7"/><circle cx="55" cy="850" r="7"/><circle cx="55" cy="980" r="7"/>
  </g>

  <rect x="130" y="22" width="200" height="36" rx="6" fill="#2F3842"/>
  <text x="230" y="46" text-anchor="middle" fill="#F0E8D0" font-size="16" font-weight="700">2026-05-11</text>

  <rect x="1080" y="5" width="220" height="42" rx="5" fill="#E8A87C" transform="rotate(-3, 1190, 26)" filter="url(#softShadow)"/>
  <text x="1190" y="32" text-anchor="middle" fill="white" font-size="18" font-weight="800" transform="rotate(-3, 1190, 26)">#SNS / xAI</text>
  <text x="1340" y="50" text-anchor="end" font-size="22">⭐</text>

  <!-- Title -->
  <text x="140" y="100" font-size="32" font-weight="900" fill="#1A1D24">🎤 xAI Grok：音声で画像生成＋動画「Extend」「Upscale」</text>
  <text x="140" y="143" font-size="23" font-weight="700" fill="#795548">——2年遅れの後追い機能追加・X リアルタイムデータが唯一の差別化</text>
  <rect x="140" y="158" width="900" height="2" fill="#E8A87C" rx="1"/>
  <text x="140" y="180" font-size="16" fill="#666">SocialBee / Engadget  ·  2026-05-11  ·  #xAI #Grok #マルチモーダル #動画AI</text>

  <!-- Hero: Grok icon -->
  <g transform="translate(1230, 130)">
    <circle cx="0" cy="0" r="65" fill="#1A1D24" opacity="0.08" stroke="#1A1D24" stroke-width="2"/>
    <text x="0" y="15" text-anchor="middle" font-size="58">𝕏</text>
    <text x="0" y="45" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1D24">Grok AI</text>
  </g>

  <!-- Feature cards -->
  <text x="140" y="228" font-size="20" font-weight="800" fill="#1A1D24">✨ 新機能一覧（2026-05-11）</text>
  <line x1="140" y1="235" x2="1000" y2="235" stroke="#E8A87C" stroke-width="2.5"/>

  <!-- Feature 1: Voice image gen -->
  <rect x="140" y="245" width="360" height="130" rx="10" fill="#FFF8F0" stroke="#E8A87C" stroke-width="2" filter="url(#softShadow)"/>
  <text x="320" y="278" text-anchor="middle" font-size="36">🎤</text>
  <text x="320" y="315" text-anchor="middle" font-size="16" font-weight="800" fill="#1A1D24">音声メッセージで画像生成</text>
  <text x="320" y="337" text-anchor="middle" font-size="13" fill="#555">テキスト入力不要</text>
  <text x="320" y="355" text-anchor="middle" font-size="13" fill="#555">「話しかけるだけ」の画像生成体験</text>
  <text x="320" y="370" text-anchor="middle" font-size="11" fill="#888">iOS アプリで展開</text>

  <!-- Feature 2: Video Extend -->
  <rect x="520" y="245" width="360" height="130" rx="10" fill="#F8F5FF" stroke="#9C27B0" stroke-width="2" filter="url(#softShadow)"/>
  <text x="700" y="278" text-anchor="middle" font-size="36">🎬</text>
  <text x="700" y="315" text-anchor="middle" font-size="16" font-weight="800" fill="#1A1D24">動画「Extend」（尺延長）</text>
  <text x="700" y="337" text-anchor="middle" font-size="13" fill="#555">既存動画の尺を延長</text>
  <text x="700" y="355" text-anchor="middle" font-size="13" fill="#555">Pika / Runway が先行して提供</text>
  <text x="700" y="370" text-anchor="middle" font-size="11" fill="#888">SNS投稿動画の「尺合わせ」用途</text>

  <!-- Feature 3: AI Following sort -->
  <rect x="900" y="245" width="360" height="130" rx="10" fill="#F0F8FF" stroke="#5B8DEF" stroke-width="2" filter="url(#softShadow)"/>
  <text x="1080" y="278" text-anchor="middle" font-size="36">📊</text>
  <text x="1080" y="315" text-anchor="middle" font-size="16" font-weight="800" fill="#1A1D24">Following フィードのAIソート</text>
  <text x="1080" y="337" text-anchor="middle" font-size="13" fill="#555">フォロー者の投稿をAIが優先順位付け</text>
  <text x="1080" y="355" text-anchor="middle" font-size="13" fill="#555">ユーザーの関心度に基づく最適化</text>
  <text x="1080" y="370" text-anchor="middle" font-size="11" fill="#888">EUでオプトアウト必須になる可能性</text>

  <!-- Video Upscale -->
  <rect x="330" y="395" width="360" height="120" rx="10" fill="#F5F0FF" stroke="#673AB7" stroke-width="2" filter="url(#softShadow)"/>
  <text x="510" y="428" text-anchor="middle" font-size="36">🔍</text>
  <text x="510" y="463" text-anchor="middle" font-size="16" font-weight="800" fill="#1A1D24">動画「Upscale」（解像度向上）</text>
  <text x="510" y="483" text-anchor="middle" font-size="13" fill="#555">低解像度動画を高品質に改善</text>
  <text x="510" y="500" text-anchor="middle" font-size="11" fill="#888">スマホ撮影動画の品質改善に最適</text>

  <!-- Competitive positioning -->
  <text x="140" y="555" font-size="20" font-weight="800" fill="#1A1D24">📊 競合比較：何が遅れていて何が強いか</text>
  <line x1="140" y1="562" x2="1100" y2="562" stroke="#E8A87C" stroke-width="2.5"/>

  <rect x="140" y="572" width="960" height="180" rx="8" fill="white" stroke="#1A1D24" stroke-width="2" filter="url(#softShadow)"/>
